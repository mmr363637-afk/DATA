/* ---------- 1. توکن‌های پایه ---------- */
:root {
  color-scheme: light;

  /* رنگ درس — با JS یا درون‌خطی per-subject بازنویسی می‌شود */
  --h: 224;
  --c: 72;

  /* مقیاس رنگ سازنده از HSL */
  --brand-50:  hsl(var(--h) var(--c) 97%);
  --brand-100: hsl(var(--h) var(--c) 94%);
  --brand-200: hsl(var(--h) var(--c) 88%);
  --brand-300: hsl(var(--h) var(--c) 78%);
  --brand-400: hsl(var(--h) var(--c) 66%);
  --brand-500: hsl(var(--h) var(--c) 55%);
  --brand-600: hsl(var(--h) var(--c) 46%);
  --brand-700: hsl(var(--h) var(--c) 38%);
  --brand-800: hsl(var(--h) var(--c) 30%);
  --brand-900: hsl(var(--h) var(--c) 22%);
  --brand: var(--brand-600);
  --brand-ink: hsl(var(--h) calc(var(--c) * 0.9) 26%);

  /* معنایی — ثابت در همهٔ درس‌ها، فقط کمی هم‌رنگ درس می‌شوند */
  --ok: hsl(158 62% 38%);
  --ok-bg: hsl(158 62% 96%);
  --warn: hsl(32 88% 42%);
  --warn-bg: hsl(38 92% 95%);
  --danger: hsl(354 68% 48%);
  --danger-bg: hsl(354 78% 96%);
  --info: hsl(211 78% 46%);
  --info-bg: hsl(211 80% 96%);
  --gold: hsl(41 88% 40%);
  --gold-bg: hsl(43 95% 95%);

  /* سطح‌ها و متن */
  --bg: #f5f6f9;
  --bg-soft: #ffffff;
  --surface: #ffffff;
  --surface-2: #fafbfd;
  --surface-3: #f1f3f8;
  --line: #e4e8f0;
  --line-soft: #eef1f6;
  --ink: #131a2a;
  --ink-2: #3c4660;
  --ink-3: #6b7590;
  --ink-4: #97a0b5;
  --on-brand: #ffffff;

  /* شکل و سایه */
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-full: 999px;
  --sh-1: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
  --sh-2: 0 4px 12px rgba(16, 24, 40, .07), 0 2px 4px rgba(16, 24, 40, .04);
  --sh-3: 0 12px 32px rgba(16, 24, 40, .10), 0 4px 8px rgba(16, 24, 40, .04);
  --sh-brand: 0 10px 28px hsl(var(--h) var(--c) 45% / .22);

  /* تایپوگرافی */
  --font: "Vazirmatn", "IRANSans", "Segoe UI", system-ui, -apple-system, Tahoma, sans-serif;
  --font-num: "Vazirmatn", ui-sans-serif, system-ui;
  --fs-xs: .78rem;
  --fs-sm: .875rem;
  --fs-base: 1rem;
  --fs-md: 1.06rem;
  --fs-lg: 1.2rem;
  --fs-xl: 1.45rem;
  --fs-2xl: 1.85rem;
  --fs-3xl: 2.4rem;
  --lh: 2.05;
  --maxw: 1180px;

  /* اندازه‌های layout */
  --header-h: 60px;
  --gutter: clamp(14px, 3.2vw, 34px);
  --focus: 0 0 0 3px hsl(var(--h) var(--c) 55% / .35);
}

@media (prefers-reduced-motion: no-preference) {
  :root { scroll-behavior: smooth; }
}

/* ---------- 2. ریست ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: var(--lh);
  color: var(--ink);
  background: var(--bg);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
img, svg, video { max-width: 100%; height: auto; display: block; }
a { color: var(--brand-600); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-xs); }
::selection { background: var(--brand-200); color: var(--brand-900); }
hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
sub, sup { font-size: .72em; line-height: 0; }

/* اسکرول‌بار نازک */
* { scrollbar-width: thin; scrollbar-color: var(--brand-300) transparent; }
*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-thumb { background: var(--brand-200); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--brand-300); background-clip: content-box; }

/* ---------- 3. کمکی‌های عمومی ---------- */
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
.ltr, .en, [dir="ltr"] { direction: ltr; unicode-bidi: isolate; text-align: left; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--ink-3); }
.strong { font-weight: 700; }
.num, .hn, .hyd-num, .highyield-num, .hy-num, .num-gold, .stat-number, .stat-num {
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.hide { display: none !important; }

/* ---------- 4. هدر جادویی ---------- */
.site-header {
  position: sticky; top: 0; z-index: 60;
  background: hsl(0 0% 100% / .82);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.site-header__bar {
  min-height: var(--header-h);
  display: flex !important; align-items: center; gap: 12px;
  padding-block: 8px;
}
.crumbs {
  display: flex; align-items: center; gap: 8px;
  min-width: 0; flex: 1;
  font-size: var(--fs-sm); color: var(--ink-3);
}
.crumbs a { color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.crumbs a:hover { color: var(--brand-600); text-decoration: none; }
.crumbs .sep { color: var(--ink-4); flex: none; }
.crumbs .crumb-now {
  color: var(--ink); font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}
.subj-chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 5px 12px; border-radius: var(--r-full);
  background: var(--brand-50); color: var(--brand-700);
  border: 1px solid var(--brand-200);
  font-size: var(--fs-xs); font-weight: 700;
}
/* نوار پیشرفت مطالعه */
.read-progress {
  position: absolute; inset-inline: 0; bottom: -1px; height: 3px;
  background: transparent; overflow: hidden;
}
.read-progress > i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
  border-radius: 0 3px 3px 0;
  transition: width .12s linear;
}

/* دکمه‌های آیکونی هدر */
.icon-btn {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s, transform .15s;
}
.icon-btn:hover { background: var(--brand-50); color: var(--brand-700); border-color: var(--brand-200); }
.icon-btn:active { transform: scale(.96); }
.icon-btn[aria-expanded="true"] { background: var(--brand-600); color: #fff; border-color: transparent; }

/* ---------- 5. هیرو ---------- */
.hero {
  position: relative; overflow: hidden;
  padding-top: clamp(30px, 5vw, 52px) !important;
  background:
    radial-gradient(1200px 380px at 92% -10%, hsl(var(--h) var(--c) 92%) 0%, transparent 62%),
    radial-gradient(900px 320px at 4% 0%, hsl(calc(var(--h) + 34) calc(var(--c) * .7) 94%) 0%, transparent 55%),
    linear-gradient(180deg, var(--brand-50), var(--bg) 92%);
  border-bottom: 1px solid var(--line);
  padding-block: clamp(22px, 4vw, 44px);
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(hsl(var(--h) var(--c) 45% / .07) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: linear-gradient(180deg, #000 0%, transparent 78%);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 78%);
}
.hero > .wrap { position: relative; z-index: 1; }
.hero__top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px; border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: 700;
  background: var(--surface); color: var(--brand-700);
  border: 1px solid var(--brand-200); box-shadow: var(--sh-1);
}
.pill--ghost { background: hsl(0 0% 100% / .6); border-color: var(--line); color: var(--ink-3); font-weight: 600; }
.pill--icon { font-size: .95rem; padding: 4px 10px; }
.hero h1 {
  margin: 0 0 8px;
  font-size: clamp(1.5rem, 4.4vw, var(--fs-3xl));
  font-weight: 800; line-height: 1.42;
  letter-spacing: -.01em;
  color: var(--brand-ink);
  text-wrap: balance;
}
.hero__lede {
  margin: 0; max-width: 72ch;
  color: var(--ink-2); font-size: var(--fs-md);
}
.hero__meta {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px;
}
.meta-item {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px; border-radius: var(--r-sm);
  background: hsl(0 0% 100% / .75); border: 1px solid var(--line);
  font-size: var(--fs-sm); color: var(--ink-2); font-weight: 600;
  box-shadow: var(--sh-1);
}
.meta-item b { color: var(--brand-700); font-weight: 800; }

/* تصویر/کاور درس در هیرو */
.hero__layout { display: grid; gap: clamp(16px, 3vw, 28px); }
@media (min-width: 880px) {
  .hero__layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
}
.hero__cover { display: none; }
@media (min-width: 880px) {
  .hero__cover {
    display: block; border-radius: var(--r-lg); overflow: hidden;
    border: 1px solid var(--brand-200); box-shadow: var(--sh-3);
  }
  .hero__cover img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
}

/* ---------- 6. ناوبری چسبان بخش‌ها (TOC) ---------- */
.subnav {
  position: sticky; top: var(--header-h); z-index: 50;
  background: hsl(0 0% 100% / .9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.subnav__scroll {
  display: flex; gap: 6px; align-items: center;
  overflow-x: auto; scrollbar-width: none;
  padding-block: 9px;
}
.subnav__scroll::-webkit-scrollbar { display: none; }
.subnav a {
  flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: var(--r-full);
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2);
  border: 1px solid transparent; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.subnav a:hover { background: var(--brand-50); color: var(--brand-700); text-decoration: none; }
.subnav a.is-active {
  background: var(--brand-600); color: #fff; border-color: var(--brand-600);
  box-shadow: var(--sh-brand);
}
.subnav .n { font-size: .72rem; opacity: .65; font-variant-numeric: tabular-nums; }

/* ---------- 7. بدنهٔ درس + سایدبار ---------- */
.layout {
  display: grid; gap: clamp(18px, 2.4vw, 30px);
  padding-block: clamp(20px, 3.4vw, 40px) 72px;
  align-items: start;
}
@media (min-width: 1060px) {
  .layout { grid-template-columns: minmax(0, 1fr) 274px; }
}
.main-col { min-width: 0; }

.rail { display: none; }
@media (min-width: 1060px) {
  .rail {
    display: block; position: sticky; top: calc(var(--header-h) + 58px);
    display: grid; gap: 14px;
    max-height: calc(100vh - var(--header-h) - 78px);
    overflow-y: auto; padding-bottom: 8px;
  }
}
.rail-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 14px; box-shadow: var(--sh-1);
}
.rail-card h3 {
  margin: 0 0 10px; font-size: var(--fs-xs); font-weight: 800;
  color: var(--ink-3); letter-spacing: .02em;
}
.rail-nav { display: grid; gap: 2px; }
.rail-nav a {
  display: flex; gap: 8px; align-items: baseline;
  padding: 6px 9px; border-radius: var(--r-xs);
  font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.7;
  border-inline-start: 2px solid transparent;
}
.rail-nav a:hover { background: var(--surface-3); color: var(--brand-700); text-decoration: none; }
.rail-nav a.is-active {
  background: var(--brand-50); color: var(--brand-700);
  border-inline-start-color: var(--brand-500); font-weight: 700;
}
.rail-nav .n { color: var(--ink-4); font-size: .74rem; font-variant-numeric: tabular-nums; }
.rail-ring { display: grid; place-items: center; gap: 8px; }
.ring { width: 96px; height: 96px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.ring .trk { stroke: var(--surface-3); }
.ring .val { stroke: var(--brand-500); transition: stroke-dashoffset .2s linear; }
.rail-ring small { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 700; }

/* ---------- 8. کارت و بخش ---------- */
.section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  margin-bottom: clamp(16px, 2.4vw, 26px);
  scroll-margin-top: calc(var(--header-h) + 64px);
  overflow: clip;
}
.section__head {
  display: flex; gap: 13px; align-items: flex-start;
  padding: clamp(14px, 2.2vw, 20px) clamp(14px, 2.4vw, 24px);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border-bottom: 1px solid var(--line-soft);
}
.section__ico {
  flex: none; width: 42px; height: 42px; display: grid; place-items: center;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--brand-50); color: var(--brand-600);
  border: 1px solid var(--brand-200);
  font-size: 1.15rem; line-height: 1;
}
.section__no {
  flex: none; display: grid; place-items: center;
  width: 42px; height: 42px; border-radius: var(--r-sm);
  background: var(--brand-600); color: #fff;
  font-weight: 800; font-size: 1rem;
  box-shadow: var(--sh-brand);
  font-variant-numeric: tabular-nums;
}
.section__titles { min-width: 0; flex: 1; }
.section__title {
  margin: 0; font-size: var(--fs-lg); font-weight: 800; line-height: 1.55;
  color: var(--ink); text-wrap: balance;
}
.section__sub { margin: 3px 0 0; font-size: var(--fs-sm); color: var(--ink-3); }
.section__body { padding: clamp(15px, 2.4vw, 26px) clamp(14px, 2.4vw, 24px); }
.section__body > *:first-child { margin-top: 0; }
.section__body > *:last-child { margin-bottom: 0; }

/* ریتم متن */
.section__body h3 {
  margin: 1.9em 0 .6em; font-size: var(--fs-md); font-weight: 800;
  color: var(--brand-ink);
  padding-inline-start: 11px;
  border-inline-start: 4px solid var(--brand-400);
  line-height: 1.6;
}
.section__body h3:first-child, .section__body h4:first-child { margin-top: 0; }
.section__body h4 {
  margin: 1.5em 0 .5em; font-size: var(--fs-base); font-weight: 800; color: var(--ink);
}
.section__body p { margin: 0 0 1.05em; }
.section__body ul, .section__body ol { margin: 0 0 1.15em; padding-inline-start: 1.35em; }
.section__body li { margin-bottom: .45em; }
.section__body li::marker { color: var(--brand-400); font-weight: 700; }
.section__body strong, .section__body b { font-weight: 800; color: var(--ink); }
.section__body em { font-style: normal; color: var(--brand-700); font-weight: 600; }
.section__body blockquote {
  margin: 1.2em 0; padding: 12px 16px;
  border-inline-start: 4px solid var(--brand-300);
  background: var(--brand-50); border-radius: 0 var(--r-sm) var(--r-sm) 0;
  color: var(--ink-2);
}

/* هایلایت‌های درون‌متنی */
.hl, .highlight, mark, .hl-box {
  background: linear-gradient(180deg, transparent 52%, hsl(var(--h) var(--c) 84%) 52%);
  color: inherit; padding: 0 2px; border-radius: 2px;
}
.hl-red, .hl--red { background: linear-gradient(180deg, transparent 52%, hsl(354 80% 88%) 52%); }
.hl-green, .hl--green { background: linear-gradient(180deg, transparent 52%, hsl(158 60% 85%) 52%); }
.hl-gold, .hl--gold { background: linear-gradient(180deg, transparent 52%, hsl(43 92% 82%) 52%); }
.keyword, .key { color: var(--brand-700); font-weight: 800; }

/* ---------- 9. جعبه‌های هشدار/نکته ---------- */
.callout {
  --_c: var(--brand-500);
  --_bg: var(--brand-50);
  --_bd: var(--brand-200);
  margin: 1.15em 0;
  padding: 14px 16px;
  border-radius: var(--r-md);
  background: var(--_bg);
  border: 1px solid var(--_bd);
  border-inline-start: 4px solid var(--_c);
  color: var(--ink);
}
.callout > :first-child { margin-top: 0; }
.callout > :last-child { margin-bottom: 0; }
.callout__title, .box-title, .vm-box-title, .callout-title {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; font-size: var(--fs-sm);
  color: var(--_c); margin-bottom: 6px;
}
.callout--ok, .box-success, .gold-standard, .box-gold, .gold-box, .success {
  --_c: var(--gold); --_bg: var(--gold-bg); --_bd: hsl(43 90% 84%);
}
.callout--danger, .box-redflag, .redflag-box, .trap-box, .exam-trap-box, .box-trap, .danger, .critical {
  --_c: var(--danger); --_bg: var(--danger-bg); --_bd: hsl(354 78% 90%);
}
.callout--warn, .box-warning, .warning, .important {
  --_c: var(--warn); --_bg: var(--warn-bg); --_bd: hsl(38 90% 84%);
}
.callout--info, .box-important, .box-clinical, .alert-box, .alert, .info-card, .review-box, .edu-box, .exam-tip {
  --_c: var(--info); --_bg: var(--info-bg); --_bd: hsl(211 78% 88%);
}
.callout--yield, .box-yield, .high-yield, .highyield {
  --_c: var(--brand-600); --_bg: var(--brand-50); --_bd: var(--brand-200);
}

/* جعبهٔ کارتی (callout با ظاهر کارت) */
.callout--card {
  background: var(--_bg);
  box-shadow: var(--sh-1);
}
.callout--card.callout--danger { background: linear-gradient(180deg, var(--danger-bg), #fff 140%); }
.callout--card.callout--ok { background: linear-gradient(180deg, var(--gold-bg), #fff 140%); }
.callout--card.callout--yield { background: linear-gradient(180deg, var(--brand-50), #fff 140%); }
.callout--card.callout--info { background: linear-gradient(180deg, var(--info-bg), #fff 140%); }
.callout--card h3, .callout--card h4 {
  margin: 0 0 .5em; padding: 0; border: 0;
  font-size: var(--fs-base); color: var(--_c);
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
}
.section__body [class^="tag-"], .section__body [class*=" tag-"] {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .7rem; font-weight: 800; padding: 1px 8px; border-radius: var(--r-full);
  background: var(--surface-3); color: var(--ink-3); border: 1px solid var(--line);
  vertical-align: middle;
}
.deco-emoji { font-size: 1.05rem; }
.tag-hy, .tag--danger, .tag--gold, .tag--ok {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .68rem; font-weight: 800; padding: 2px 8px; border-radius: var(--r-full);
  background: hsl(0 0% 100% / .75); border: 1px solid currentColor;
  color: inherit; opacity: .85;
}

/* ---------- 10. گرید و کارت‌های محتوایی ---------- */
.grid, .grid-2, .grid-3, .grid-4, .grid-8, .dashboard-grid, .objectives-grid {
  display: grid; gap: 12px; margin: 1.15em 0;
  align-items: start;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
}
/* شبکهٔ اعداد/آمار: ستون‌های باریک‌تر */
.grid-stats, .grid-8:has(> .stat-card), .grid-8 {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 158px), 1fr));
}
@media (min-width: 1580px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.grid > *, .grid-2 > *, .grid-3 > *, .grid-4 > *, .grid-8 > * { min-width: 0; }

/* کارت‌های آمار / اعداد حیاتی */
.stat-card, .number-card, .num-card, .hy-num, .highyield-num, .hn, .dashboard-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 13px 14px;
  box-shadow: var(--sh-1);
  transition: transform .16s, box-shadow .16s, border-color .16s;
  overflow: hidden;
}
.stat-card::before, .number-card::before, .dashboard-card::before {
  content: ""; position: absolute; inset-block-start: 0; inset-inline: 0; height: 3px;
  background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
}
.stat-card:hover, .number-card:hover {
  transform: translateY(-2px); box-shadow: var(--sh-2); border-color: var(--brand-200);
}
.stat-number, .stat-num, .num-gold {
  display: block;
  font-size: clamp(1.25rem, 2.6vw, 1.6rem);
  font-weight: 900; line-height: 1.4;
  color: var(--brand-700);
}
.stat-label, .stat-desc {
  display: block; font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; line-height: 1.75;
}
.dashboard-card-title { font-weight: 800; font-size: var(--fs-sm); color: var(--brand-700); margin-bottom: 4px; }

/* کارت‌های عمومی درون متن */
.mini-card, .info-card, .section-card, .v-card, .card-gold, .v-box, .timeline-card, .rapid-card,
:where(div, section, article).card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 13px 15px;
  box-shadow: var(--sh-1);
}
.card-title, .mini-card-title, .vm-title, .card-header, .v-box-title,
.info-card-header, .box-header, .vm-header {
  font-weight: 800; font-size: var(--fs-sm); color: var(--brand-700);
  margin-bottom: 5px;
}
.card-title.align-start, .mini-card-title.align-start, .vm-title.align-start { margin-bottom: 7px; }
.card-body, .mini-card-body, .card-content { font-size: var(--fs-sm); color: var(--ink-2); }
.mini-card-badge {
  font-size: .7rem; font-weight: 800; padding: 2px 8px; border-radius: var(--r-full);
  background: var(--brand-100); color: var(--brand-700);
}
.card-icon, .icon, .section-icon {
  display: inline-grid; place-items: center;
  width: 30px; height: 30px; border-radius: var(--r-xs);
  background: var(--brand-50); color: var(--brand-600);
  font-size: .95rem; flex: none;
}

/* کارت متنی هم‌تراز (عنوان + متن) */
.align-start { display: flex; align-items: flex-start; gap: 9px; }
.align-start > .txt { flex: 1; min-width: 0; }
.align-start > .ic {
  flex: none; display: grid; place-items: center;
  width: 30px; height: 30px; border-radius: var(--r-xs);
  background: var(--brand-50); border: 1px solid var(--brand-100);
  font-size: .95rem;
}
.deco-emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; line-height: 1; }

/* ---------- 11. جدول ---------- */
.table-wrap, .table-container, .table-responsive {
  margin: 1.15em 0; overflow-x: auto;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); box-shadow: var(--sh-1);
  -webkit-overflow-scrolling: touch;
}
.table-wrap table, .table-container table, .table-responsive table,
.section__body > table {
  width: 100%; border-collapse: collapse; font-size: var(--fs-sm);
  min-width: 100%;
}
@media (max-width: 620px) {
  .table-wrap table, .table-container table, .table-responsive table { min-width: 460px; }
}
.section__body > table { min-width: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.section__body th, .table-wrap th, .table-container th {
  background: var(--brand-50);
  color: var(--brand-800);
  font-weight: 800; font-size: var(--fs-xs);
  text-align: right; padding: 10px 12px;
  border-bottom: 1px solid var(--brand-200);
  position: sticky; top: 0; z-index: 1;
  white-space: nowrap;
}
.section__body td, .table-wrap td, .table-container td {
  padding: 9px 12px; border-bottom: 1px solid var(--line-soft);
  vertical-align: top; line-height: 1.85;
  overflow-wrap: break-word; word-break: normal;
}
.section__body th, .table-wrap th, .table-container th { overflow-wrap: break-word; }
.section__body tbody tr:last-child td { border-bottom: 0; }
.section__body tbody tr:nth-child(even), .table-wrap tbody tr:nth-child(even) { background: var(--surface-2); }
.section__body tbody tr:hover, .table-wrap tbody tr:hover { background: var(--brand-50); }
td .num, td .hn { color: var(--brand-700); font-weight: 800; }

/* ---------- 12. فلش‌کارت / آکاردئون ---------- */
details {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin: 0 0 9px;
  box-shadow: var(--sh-1);
  overflow: hidden;
  transition: border-color .16s, box-shadow .16s;
}
details[open] { border-color: var(--brand-200); box-shadow: var(--sh-2); }
details > summary {
  cursor: pointer; list-style: none;
  padding: 12px 15px;
  font-weight: 700; font-size: var(--fs-sm);
  color: var(--ink); background: var(--surface-2);
  display: flex; align-items: center; gap: 10px;
  transition: background .15s, color .15s;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before {
  content: ""; flex: none;
  width: 8px; height: 8px;
  border-inline-start: 2px solid var(--brand-500);
  border-bottom: 2px solid var(--brand-500);
  transform: rotate(-45deg); transition: transform .18s;
  margin-inline-start: 2px;
}
details[open] > summary::before { transform: rotate(45deg); }
details > summary:hover { background: var(--brand-50); color: var(--brand-800); }
details[open] > summary { border-bottom: 1px solid var(--line-soft); color: var(--brand-800); }
.details-content, .flashcard-content, .flashcard-answer, .flash-answer, .accordion-content, .explanation-content, .mcq-explanation-content {
  padding: 13px 15px; font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.95;
}
.details-content > *:last-child, .flashcard-content > *:last-child { margin-bottom: 0; }
/* فلش‌کارت‌ها با رنگ درس */
.flashcard { border-color: var(--brand-200); }
.flashcard > summary { background: var(--brand-50); color: var(--brand-800); }
.flashcard-answer { background: linear-gradient(180deg, var(--surface), var(--surface-2)); }

/* ---------- 13. مکعب سؤال (MCQ) ---------- */
.mcq-container { display: grid; gap: 14px; margin: 1.2em 0; }
.mcq-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-1);
}
.mcq-header {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 15px; background: var(--surface-2);
  border-bottom: 1px solid var(--line-soft);
}
.mcq-number, .mcq-badge {
  flex: none; display: inline-grid; place-items: center;
  min-width: 26px; height: 26px; padding: 0 8px;
  border-radius: var(--r-full);
  background: var(--brand-600); color: #fff;
  font-size: .76rem; font-weight: 800; font-variant-numeric: tabular-nums;
}
.mcq-title { font-weight: 800; font-size: var(--fs-sm); color: var(--brand-800); }
.mcq-vignette, .mcq-question, .mcq-text {
  padding: 13px 15px 4px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink);
}
.mcq-options { display: grid; gap: 7px; padding: 10px 15px 13px; }
.mcq-option, .mcq-option-item, .mcq-opt, .option-item {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 9px 12px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface);
  font-size: var(--fs-sm); line-height: 1.85;
  transition: background .14s, border-color .14s;
}
.mcq-option:hover, .option-item:hover { background: var(--brand-50); border-color: var(--brand-200); }
.mcq-option-letter, .option-circle {
  flex: none; display: inline-grid; place-items: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-3); color: var(--ink-2);
  font-size: .72rem; font-weight: 800; margin-top: 2px;
}
.correct-answer-banner, .answer, .correct {
  display: flex; gap: 9px; align-items: center;
  margin: 0 15px 12px; padding: 9px 13px;
  border-radius: var(--r-sm);
  background: var(--ok-bg); border: 1px solid hsl(158 55% 82%);
  color: hsl(158 65% 26%); font-weight: 800; font-size: var(--fs-sm);
}
.mcq-explanation, .mcq-solution, .explanation-section {
  margin: 0 15px 14px; padding: 12px 14px;
  border-radius: var(--r-sm);
  background: var(--info-bg); border: 1px solid hsl(211 70% 88%);
  font-size: var(--fs-sm); color: var(--ink-2);
}
.mcq-explanation-details, .mcq-explanation-trigger { margin: 0 15px 14px; }
.mcq-explanation-details > summary { border-radius: var(--r-sm); background: var(--info-bg); color: var(--info); }

/* ---------- 14. الگوریتم/فلوچارت ---------- */
.algo-box, .flow, .flowchart { display: grid; gap: 8px; margin: 1.15em 0; }
.algo-node, .flow-node, .flow-step, .step {
  position: relative;
  padding: 10px 14px; border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line);
  border-inline-start: 3px solid var(--brand-400);
  font-size: var(--fs-sm); box-shadow: var(--sh-1);
}
.algo-node.decision, .flow-node.decision, .decision {
  background: var(--gold-bg); border-color: hsl(43 90% 84%); border-inline-start-color: var(--gold);
  font-weight: 700;
}
.algo-node.action, .action { background: var(--info-bg); border-color: hsl(211 78% 88%); border-inline-start-color: var(--info); }
.algo-node.danger-node, .danger-node { background: var(--danger-bg); border-color: hsl(354 78% 90%); border-inline-start-color: var(--danger); }
.algo-node.success-node, .success-node { background: var(--ok-bg); border-color: hsl(158 55% 84%); border-inline-start-color: var(--ok); }
.algo-arrow, .flow-arrow {
  display: grid; place-items: center;
  color: var(--brand-400); font-size: 1rem; line-height: 1;
}
.algo-branch-path, .algo-branches { display: grid; gap: 8px; }
.branch-label, .label, .tag, .badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: var(--r-full);
  font-size: .74rem; font-weight: 800;
  background: var(--brand-50); color: var(--brand-700);
  border: 1px solid var(--brand-200);
}
.tag-gold, .badge-warning { background: var(--gold-bg); color: var(--gold); border-color: hsl(43 90% 84%); }
.tag-red, .badge-danger { background: var(--danger-bg); color: var(--danger); border-color: hsl(354 78% 90%); }
.badge-success { background: var(--ok-bg); color: var(--ok); border-color: hsl(158 55% 84%); }
.badge-purple { background: var(--brand-100); color: var(--brand-700); border-color: var(--brand-200); }

/* ---------- 15. تایم‌لاین / لیست‌های ویژه ---------- */
.timeline { display: grid; gap: 0; margin: 1.15em 0; position: relative; }
.timeline-item {
  position: relative; padding: 0 22px 16px 0;
  border-inline-start: 2px solid var(--brand-200);
  margin-inline-start: 6px;
}
.timeline-item::before {
  content: ""; position: absolute; inset-inline-start: -6px; top: 8px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--brand-500);
}
.timeline-time { font-size: var(--fs-xs); font-weight: 800; color: var(--brand-600); }
.timeline-title { font-weight: 800; font-size: var(--fs-sm); }
.timeline-content { font-size: var(--fs-sm); color: var(--ink-2); }
.custom-bullets, .custom-list, .styled-list { list-style: none; padding-inline-start: 0; }
.custom-bullets > li, .custom-list > li, .styled-list > li {
  position: relative; padding-inline-start: 1.5em;
}
.custom-bullets > li::before, .custom-list > li::before, .styled-list > li::before {
  content: ""; position: absolute; inset-inline-start: .35em; top: .78em;
  width: 7px; height: 7px; border-radius: 2px;
  background: var(--brand-400); transform: rotate(45deg);
}

/* نوار پیشرفت/برجستگی */
.bar, .progress-bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > i, .progress-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-400), var(--brand-600)); }

/* ---------- 16. دکمه‌های بالای صفحه / FAB ---------- */
.to-top {
  position: fixed; inset-inline-end: 18px; inset-block-end: 18px; z-index: 70;
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--brand-600); color: #fff; border: 0;
  box-shadow: var(--sh-brand); cursor: pointer;
  opacity: 0; transform: translateY(12px) scale(.9); pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.to-top.is-on { opacity: 1; transform: none; pointer-events: auto; }

/* ---------- 17. فوتر ---------- */
.site-footer {
  border-top: 1px solid var(--line); background: var(--surface);
  padding-block: 22px; font-size: var(--fs-sm); color: var(--ink-3);
}
.site-footer .wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.site-footer a { color: var(--ink-2); }

/* ---------- 18. لایهٔ تطبیق برای مارک‌آپ قدیمی ---------- */
/* این کلاس‌ها در فایل‌های قدیمی زیاد استفاده شده‌اند و اینجا خنثی/هم‌شکل می‌شوند */
.container { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
.section-wrapper { margin: 0; }
.sidebar-widget, .widget-item { font-size: var(--fs-sm); }
.sidebar-item, .sidebar-link { color: var(--ink-2); }
.mnemonic, .mnemonic-item {
  border-radius: var(--r-md); background: var(--brand-50);
  border: 1px dashed var(--brand-300); padding: 12px 14px; margin: 1em 0;
}
.mnemonic-letter-box {
  display: inline-grid; place-items: center; width: 26px; height: 26px;
  border-radius: var(--r-xs); background: var(--brand-600); color: #fff;
  font-weight: 900; font-size: .78rem; margin-inline-end: 6px;
}
.g-cell, .wg-cell, .g-header {
  border: 1px solid var(--line); padding: 8px 10px; font-size: var(--fs-sm);
  background: var(--surface);
}
.g-header { background: var(--brand-50); font-weight: 800; color: var(--brand-800); }
.hero-badge, .header-tag, .header-meta, .hero-meta-item { font-size: var(--fs-xs); }
.bold, .bold-point, .key-point { font-weight: 800; }
.drug { color: var(--brand-700); font-weight: 700; }
.ltr, .en { font-family: var(--font-num); }
.mb-4 { margin-bottom: 1.4rem; }
.col-2, .col-4 { min-width: 0; }

/* آیکون‌های درون‌خطی */
.sicon { flex: none; vertical-align: -.18em; }
.section__ico .sicon, .pill .sicon, .subj-chip .sicon, .lesson-card__icon .sicon,
.subject-card__icon .sicon, .brand__mark .sicon { display: block; }
@media print {
  .site-header, .subnav, .rail, .to-top { display: none !important; }
  .hero { padding-top: 0 !important; }
  .section { break-inside: avoid-page; box-shadow: none; }
  body { background: #fff; }
}

/* کتابخانه — صفحهٔ خانه و صفحهٔ درس‌ها */
.lib-page { background: var(--bg); }

/* هدر */
.brand { display: flex !important; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; flex: none; }
.brand:hover { text-decoration: none; }
.brand__mark {
  width: 36px; height: 36px; border-radius: var(--r-sm);
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, hsl(222 60% 52%), hsl(258 55% 48%));
  box-shadow: 0 6px 16px hsl(222 60% 45% / .3);
}
.brand__text { display: grid; line-height: 1.25; }
.brand__text b { font-size: .95rem; font-weight: 800; }
.brand__text small { font-size: .7rem; color: var(--ink-3); font-weight: 600; }
.hdr-search { flex: 1; max-width: 420px; margin-inline-start: auto; }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 700; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  transition: all .15s; text-decoration: none; flex: none;
}
.btn:hover { border-color: var(--brand-300); color: var(--brand-700); text-decoration: none; }

/* هیرو */
.lib-hero {
  position: relative; overflow: hidden;
  padding-block: clamp(26px, 5vw, 58px) clamp(22px, 4vw, 44px);
  background:
    radial-gradient(900px 320px at 88% -20%, hsl(258 60% 90%) 0%, transparent 60%),
    radial-gradient(700px 280px at 6% 0%, hsl(200 70% 92%) 0%, transparent 58%),
    linear-gradient(180deg, #fbfbff, var(--bg));
  border-bottom: 1px solid var(--line);
}
.lib-hero--subject {
  background:
    radial-gradient(900px 320px at 88% -20%, hsl(var(--h) var(--c) 90%) 0%, transparent 60%),
    radial-gradient(700px 280px at 6% 0%, hsl(calc(var(--h) + 30) calc(var(--c) * .7) 93%) 0%, transparent 58%),
    linear-gradient(180deg, var(--brand-50), var(--bg));
}
.lib-hero__top { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.lib-hero h1 {
  margin: 0 0 12px; font-size: clamp(1.5rem, 4.6vw, 2.5rem);
  font-weight: 900; line-height: 1.45; letter-spacing: -.015em; text-wrap: balance;
  color: var(--ink);
}
.lib-hero--subject h1 { color: var(--brand-ink); }
.lib-hero__lede { margin: 0; max-width: 68ch; color: var(--ink-2); font-size: var(--fs-md); }
.lib-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.lib-stat {
  background: hsl(0 0% 100% / .8); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 10px 16px; min-width: 92px;
  box-shadow: var(--sh-1);
}
.lib-stat b { display: block; font-size: 1.35rem; font-weight: 900; color: var(--brand-700); line-height: 1.3; }
.lib-stat span { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 700; }

/* بدنه */
.lib-main { padding-block: clamp(22px, 3.4vw, 40px) 70px; }
.lib-block { margin-bottom: clamp(26px, 4vw, 44px); }
.lib-block__head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.lib-block__head h2 {
  margin: 0; font-size: var(--fs-lg); font-weight: 900;
  display: flex; align-items: center; gap: 9px;
}
.lib-block__head h2::before {
  content: ""; width: 5px; height: 20px; border-radius: 3px;
  background: linear-gradient(180deg, var(--brand-400), var(--brand-600));
}
.lib-block__head .muted { font-size: var(--fs-xs); }

/* کارت درس */
.subject-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
.subject-card {
  position: relative; display: flex !important; flex-direction: column; gap: 5px;
  padding: 15px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--sh-1); text-decoration: none; color: inherit;
  overflow: hidden; transition: transform .18s, box-shadow .18s, border-color .18s;
}
.subject-card::after {
  content: ""; position: absolute; inset-block-end: 0; inset-inline: 0; height: 3px;
  background: linear-gradient(90deg, hsl(var(--h) var(--c) 62%), hsl(var(--h) var(--c) 44%));
  transform: scaleX(.25); transform-origin: right; transition: transform .22s;
}
.subject-card:hover { transform: translateY(-3px); box-shadow: var(--sh-3); border-color: hsl(var(--h) var(--c) 84%); text-decoration: none; }
.subject-card:hover::after { transform: scaleX(1); }
.subject-card__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.subject-card__icon {
  width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center;
  font-size: 1.15rem;
  background: hsl(var(--h) var(--c) 95%); border: 1px solid hsl(var(--h) var(--c) 88%);
}
.subject-card__count {
  font-size: .7rem; font-weight: 800; color: var(--ink-3);
  background: var(--surface-3); padding: 3px 9px; border-radius: var(--r-full);
  border: 1px solid var(--line-soft);
}
.subject-card__name { font-size: 1.02rem; font-weight: 800; color: var(--ink); }
.subject-card__en { font-size: .72rem; color: var(--ink-4); font-weight: 600; }
.subject-card__meta { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; margin-top: 4px; }

/* کارت درسنامه */
.lesson-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
@media (min-width: 1000px) { .lesson-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lesson-grid { grid-template-columns: 1fr; } }
.lesson-card {
  display: flex !important; flex-direction: row !important; align-items: center; gap: 12px;
  padding: 13px 14px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--sh-1); text-decoration: none; color: inherit;
  transition: transform .16s, box-shadow .16s, border-color .16s, background .16s;
}
.lesson-card:hover {
  transform: translateY(-2px); text-decoration: none;
  border-color: hsl(var(--h) var(--c) 84%);
  box-shadow: var(--sh-2);
  background: linear-gradient(180deg, var(--surface), hsl(var(--h) var(--c) 98%));
}
.lesson-card__icon {
  flex: none; width: 40px; height: 40px; border-radius: var(--r-sm);
  display: grid; place-items: center; font-size: 1.1rem;
  background: hsl(var(--h) var(--c) 95%); border: 1px solid hsl(var(--h) var(--c) 88%);
}
.lesson-card__body { display: grid; gap: 2px; min-width: 0; flex: 1; }
.lesson-card__sub { font-size: .68rem; font-weight: 800; color: hsl(var(--h) var(--c) 40%); }
.lesson-card__title { font-size: .92rem; font-weight: 700; color: var(--ink); line-height: 1.65; }
.lesson-card__meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: .7rem; color: var(--ink-3); font-weight: 600; }
.lc-badge {
  background: var(--surface-3); border: 1px solid var(--line-soft);
  padding: 1px 7px; border-radius: var(--r-full);
}
.lesson-card__go { flex: none; color: var(--ink-4); font-size: 1rem; transition: transform .16s, color .16s; }

: "در بیمار با GERD مقاوم به PPI که با pH-متری اثبات شده، ازوفاژیت داکیومنت شده و مانومتری نرمال دارد، فوندوپلیکاسیون Nissen (۳۶۰ درجه) درمان انتخابی است. موفقیت بلندمدت > ۹۰٪ است.", "whyWrong": {"0": "PPI بیشتر در بیمار واقعاً مقاوم که اثبات شده کافی نیست.", "2": "دیلاتاسیون برای تنگی مری است، نه GERD بدون عارضه.", "3": "گاسترکتومی برای چاقی مفرط یا کانسر است."}, "pearl": "قبل از فوندوپلیکاسیون: آندوسکوپی + مانومتری + pH-متری الزامی است.", "trap": "دیسفاژی پس از Nissen در ۱۰-۱۵٪ - معمولاً خودمحدود. اگر پایدار → ارزیابی مجدد.", "highYield": "Nissen (360°) برای پریستالسیس نرمال. Toupet (270° posterior) برای پریستالسیس ضعیف.", "id": "sur-2-011"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 12, "chapterTitle": "Stomach and Duodenum", "topic": "Gastric Cancer", "subtopic": "Diagnosis and Staging", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۶۵ ساله با کاهش وزن ۱۰ کیلویی، بی‌اشتهایی و زودسیری مراجعه کرده. آندوسکوپی: زخم بدشکل در آنتر معده. بیوپسی: آدنوکارسینوم معده، Signet ring cell type. CT: ضخیم شدن دیواره معده بدون متاستاز دور. EUS: تومور T3 با ۳ غده لنفاوی مشکوک. بهترین رویکرد درمانی چیست؟", "options": ["گاسترکتومی توتال فوری با D2 لنفادنکتومی", "شیمی‌درمانی نئوادجوانت سپس جراحی", "رادیوتراپی به تنهایی", "درمان تسکینی با استنت"], "correct": 1, "explanation": "در سرطان معده locally advanced (T3/T4 یا N+) بدون متاستاز دور، شیمی‌درمانی نئوادجوانت (FLOT regimen ترجیحاً) قبل از جراحی توصیه می‌شود. این رویکرد بقا را نسبت به جراحی اول بهبود می‌دهد.", "whyWrong": {"0": "جراحی اول بدون نئوادجوانت در T3N+ دیگر استاندارد نیست.", "2": "رادیوتراپی به تنهایی برای سرطان معده مؤثر نیست.", "3": "درمان تسکینی فقط در Stage IV با عوارض."}, "pearl": "Signet ring cell: نوع منتشر (Lauren classification) - پیش‌آگهی بدتر.", "trap": "Linitis plastica (leather bottle stomach) = diffuse type - اغلب Signet ring.", "highYield": "D2 lymphadenectomy: استاندارد در ژاپن. در غرب حداقل D1+ توصیه می‌شود.", "id": "sur-2-012"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 13, "chapterTitle": "Small Intestine and Appendix", "topic": "Small Bowel Obstruction", "subtopic": "Etiology", "difficulty": "آسان", "bloom": "", "stem": "شایع‌ترین علت انسداد روده کوچک در بالغین با سابقه جراحی شکم قبلی چیست؟", "options": ["فتق اینگوینال", "چسبندگی‌های پس از جراحی", "تومور روده کوچک", "ولولوس"], "correct": 1, "explanation": "چسبندگی‌های پس از جراحی (Adhesions) شایع‌ترین علت انسداد روده کوچک (SBO) در بالغین با سابقه جراحی قبلی هستند و حدود ۶۵-۷۵٪ موارد را تشکیل می‌دهند.", "whyWrong": {"0": "فتق دومین علت شایع SBO است (۱۵-۲۰٪).", "2": "تومور روده کوچک نادر است و علت نادر SBO.", "3": "ولولوس روده کوچک در بالغین نادر است."}, "pearl": "Virgin abdomen (بدون جراحی قبلی) + SBO → همیشه فتق را رد کنید.", "trap": "در کشورهای در حال توسعه، فتق شایع‌ترین علت SBO است (نه چسبندگی).", "highYield": "علل SBO: Adhesions > Hernia > Crohn's > Tumor > Intussusception.", "id": "sur-2-013"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 14, "chapterTitle": "Colon, Rectum, and Anus", "topic": "Diverticular Disease", "subtopic": "Complications", "difficulty": "خیلی دشوار", "bloom": "", "stem": "زن ۷۰ ساله با سابقه دیورتیکولوز، با درد شدید ربع تحتانی چپ، تب ۳۹ و لکوسیتوز ۲۲۰۰۰ مراجعه کرده. CT: دیورتیکولیت با آبسه ۶ سانتی‌متری پری‌کولیک. بیمار همودینامیک پایدار است. بهترین اقدام اولیه چیست؟", "options": ["کولکتومی اورژانسی با کولوستومی (Hartmann)", "آنتی‌بیوتیک وریدی + درناژ پرکوتانئوس آبسه", "آنتی‌بیوتیک وریدی به تنهایی", "کولونوسکوپی فوری"], "correct": 1, "explanation": "در دیورتیکولیت عارضه‌دار با آبسه > ۴-۵ سانتی‌متر (Hinchey I-II)، در بیمار پایدار، درمان اولیه آنتی‌بیوتیک وریدی + درناژ پرکوتانئوس آبسه تحت گایدنس CT است. این رویکرد امکان جراحی یک‌مرحله‌ای بعدی (بدون کولوستومی) را افزایش می‌دهد.", "whyWrong": {"0": "جراحی Hartmann در پریتونیت منتشر (Hinchey III-IV) یا شکست درمان غیرجراحی.", "2": "آنتی‌بیوتیک به تنهایی برای آبسه > ۴ cm معمولاً کافی ی‌متری در ربع فوقانی خارجی پستان چپ، ER/PR مثبت و HER2 منفی، مراجعه کرده. غدد لنفاوی آگزیلاری بالینی و سونوگرافیک نرمال هستند. MRI متاستاز یا مولتی‌فوکالیتی نشان نمی‌دهد. بهترین گزینه جراحی چیست؟", "options": ["ماستکتومی رادیکال مودیفیه", "لامپکتومی + بیوپسی غده لنفاوی نگهبان + رادیوتراپی", "لامپکتومی بدون ارزیابی آگزیلا", "ماستکتومی ساده بدون ارزیابی آگزیلا"], "correct": 1, "explanation": "در کانسر پستان T1-T2 بدون درگیری بالینی آگزیلا که کاندید Breast Conservation است، استاندارد درمان: لامپکتومی با مارژین منفی + بیوپسی غده لنفاوی نگهبان (SLNB) + رادیوتراپی کل پستان است. این رویکرد بقای معادل ماستکتومی دارد.", "whyWrong": {"0": "ماستکتومی رادیکال برای تومورهای کوچک مناسب Breast Conservation ضروری نیست.", "2": "لامپکتومی بدون ارزیابی آگزیلا ناقص است - SLNB برای staging ضروری است.", "3": "ماستکتومی ساده بدون ارزیابی آگزیلا نیز staging ناقص دارد."}, "pearl": "NSABP B-06: BCS + RT = Mastectomy در بقای کلی برای تومورهای کوچک.", "trap": "SLNB مثبت ≠ لزوماً ALND. در ۱-۲ غده مثبت می‌توان از ALND صرف‌نظر کرد (ACOSOG Z0011).", "highYield": "Contraindications for BCS: Multicentric, Prior RT, Pregnancy (relative), Large tumor/small breast.", "id": "sur-2-019"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 20, "chapterTitle": "Skin and Soft Tissue", "topic": "Soft Tissue Tumors", "subtopic": "Sarcoma", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۵۰ ساله با توده ۸ سانتی‌متری بدون درد در عضله چهارسر ران از ۳ ماه قبل مراجعه کرده. MRI: توده داخل عضلانی با سیگنال ناهمگن. Core biopsy: High-grade undifferentiated pleomorphic sarcoma. CT قفسه سینه نرمال. بهترین درمان چیست؟", "options": ["رزکسیون وسیع با مارژین منفی + رادیوتراپی ادجوانت", "آمپوتاسیون بالای زانو", "شیمی‌درمانی نئوادجوانت به تنهایی", "رزکسیون مارژینال"], "correct": 0, "explanation": "در سارکوم بافت نرم اندام، درمان استاندارد رزکسیون وسیع (Wide resection) با مارژین میکروسکوپیک منفی (R0) + رادیوتراپی ادجوانت (یا نئوادجوانت) است. این رویکرد Limb-sparing با بقا معادل آمپوتاسیون دارد.", "whyWrong": {"1": "آمپوتاسیون فقط زمانی که Limb salvage غیرممکن است (درگیری عصب-عروق ماژور).", "2": "شیمی‌درمانی در سارکوم بافت نرم نقش محدودی دارد و به تنهایی کافی نیست.", "3": "رزکسیون مارژینال (Shelling out) ریسک عود موضعی > ۵۰٪ دارد."}, "pearl": "Wide resection: حداقل ۱-۲ cm مارژین در بافت نرمال یا یک لایه فاشیال سالم.", "trap": "بیوپسی سارکوم باید در مسیر جراحی قطعی باشد تا tract آلوده با specimen خارج شود.", "highYield": "High-grade + > 5 cm + Deep = High risk. نیاز به بررسی متاستاز ریه و مشاوره چند تخصصی.", "id": "sur-2-020"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 11, "chapterTitle": "Esophagus", "topic": "Esophageal Cancer", "subtopic": "Staging and Treatment", "difficulty": "خیلی دشوار", "bloom": "", "stem": "مرد ۶۰ ساله با دیسفاژی پیشرونده و کاهش وزن ۱۲ کیلویی مراجعه کرده. آندوسکوپی: توده در مری میانی. بیوپسی: SCC. EUS: T3N1. PET-CT: متاستاز دور ندارد. Performance status خوب است. بهترین رویکرد درمانی چیست؟", "options": ["ازوفاژکتومی فوری", "شیمی‌رادیوتراپی نئوادجوانت سپس ازوفاژکتومی", "رادیوتراپی قطعی به تنهایی", "درمان تسکینی با استنت"], "correct": 1, "explanation": "در SCC مری locally advanced (T3 یا N+) با performance status خوب، استاندارد درمان شیمی‌رادیوتراپی نئوادجوانت (Trimodality therapy) سپس ازوفاژکتومی است. این رویکرد بقا را نسبت به جراحی تنها بهبود می‌دهد (CROSS trial).", "whyWrong": {"0": "جراحی اول در T3N1 بدون نئوادجوانت نتایج بدتری دارد.", "2": "رادیوتراپی قطعی به تنهایی در بیمار مناسب جراحی استاندارد نیست.", "3": "درمان تسکینی فقط در Stage IV یا Unfit for surgery."}, "pearl": "CROSS trial: Carboplatin/Paclitaxel + 41.4 Gy RT → Surgery = بهبود بقا.", "trap": "پاسخ کامل پاتولوژیک (pCR) به نئوادجوانت در ۲۰-۳۰٪ دیده می‌شود.", "highYield": "SCC مری: اغلب proximal/mid. آدنوکارسینوم: distal/GEJ (اغلب زمینه Barrett).", "id": "sur-2-021"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 12, "chapterTitle": "Stomach and Duodenu اه است.", "3": "IBD معمولاً با علائم سیستمیک و التهابی همراه است."}, "pearl": "Rule of 2s: 2% population, 2 feet from ileocecal valve, 2 inches long, 2 types of ectopic tissue, 2 years most symptomatic.", "trap": "Meckel's scan حساسیت ۸۵٪ در کودکان ولی کمتر در بالغین دارد.", "highYield": "بافت معده اکتوپیک در ۵۰٪ دیورتیکول‌های علامت‌دار وجود دارد.", "id": "sur-2-023"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 14, "chapterTitle": "Colon, Rectum, and Anus", "topic": "Hemorrhoids", "subtopic": "Treatment", "difficulty": "آسان", "bloom": "", "stem": "مرد ۴۵ ساله با هموروئید داخلی درجه II (پرولاپس هنگام زور زدن که خودبخود برمی‌گردد) و خونریزی متناوب مراجعه کرده. بهترین درمان اولیه چیست؟", "options": ["هموروئیدکتومی جراحی", "Rubber band ligation", "اسکلروتراپی", "درمان محافظه‌کارانه: فیبر + Sitz bath"], "correct": 3, "explanation": "برای هموروئید درجه I و II علامت‌دار خفیف، درمان اولیه محافظه‌کارانه شامل افزایش فیبر غذایی، مایعات کافی، اجتناب از زور زدن و Sitz bath است. در صورت عدم پاسخ، Rubber band ligation انجام می‌شود.", "whyWrong": {"0": "هموروئیدکتومی برای درجه III-IV یا شکست درمان‌های کم‌تهاجمی.", "1": "Rubber band ligation در صورت شکست درمان محافظه‌کارانه."}, "pearl": "درجه‌بندی هموروئید داخلی: I-No prolapse. II-Prolapse, spontaneous return. III-Manual return. IV-Irreducible.", "trap": "هر خونریزی رکتال را به هموروئید نسبت ندهید - کولونوسکوپی در > ۴۵ سال یا علائم Alarm.", "highYield": "هموروئید خارجی ترومبوزه < ۷۲ ساعت → اکسیزیون در مطب.", "id": "sur-2-024"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 15, "chapterTitle": "Liver and Biliary Tract", "topic": "Biliary Disease", "subtopic": "Choledocholithiasis", "difficulty": "دشوار", "bloom": "", "stem": "زن ۵۰ ساله با کوله‌سیستیت حاد و سنگ کیسه صفرا تحت بررسی قرار گرفته. بیلی‌روبین توتال ۳.۵ mg/dL و ALP ۳ برابر نرمال است. سونوگرافی دیلاتاسیون مجرای صفراوی مشترک (CBD=۱۰ mm) نشان می‌دهد ولی سنگ CBD دیده نمی‌شود. بهترین اقدام چیست؟", "options": ["کوله‌سیستکتومی لاپاراسکوپیک بدون بررسی بیشتر", "MRCP قبل از جراحی", "ERCP قبل از جراحی", "کوله‌سیستکتومی با کولانژیوگرافی حین عمل (IOC)"], "correct": 2, "explanation": "این بیمار با افزایش بیلی‌روبین، ALP بالا و CBD دیلاته، احتمال بالای سنگ CBD (Choledocholithiasis) دارد. طبق American Society for Gastrointestinal Endoscopy، این پرازانتسیون High probability است و ERCP قبل از جراحی توصیه می‌شود.", "whyWrong": {"0": "بدون بررسی CBD در بیمار با High probability خطرناک است.", "1": "MRCP برای Intermediate probability مناسب‌تر است.", "3": "IOC یک گزینه است ولی در High probability ERCP ترجیح دارد."}, "pearl": "High probability CBD stone: Clinical cholangitis, CBD stone on imaging, Bilirubin > 4, Dilated CBD + elevated LFTs.", "trap": "سنگ CBD در ۱۰-۱۵٪ بیماران کوله‌سیستیت وجود دارد.", "highYield": "Intermediate probability → MRCP یا EUS. High probability → ERCP directly.", "id": "sur-2-025"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 16, "chapterTitle": "Pancreas", "topic": "Pancreatic Cystic Lesions", "subtopic": "IPMN", "difficulty": "خیلی دشوار", "bloom": "", "stem": "زن ۶۵ ساله با کشف اتفاقی ضایعه کیستیک ۲.۸ سانتی‌متری در مجرای پانکراتیک اصلی (Main duct IPMN) در CT مراجعه کرده. MRI: اتساع مجرای اصلی به ۸ میلی‌متر بدون ندول جداری. CA 19-9 نرمال. بهترین توصیه چیست؟", "options": ["پیگیری با MRI هر ۶ ماه", "رزکسیون جراحی", "آسپیراسیون کیست تحت EUS", "شیمی‌درمانی"], "correct": 1, "explanation": "Main duct IPMN (MD-IPMN) با اتساع MPD ≥ ۵ mm ریسک بالای بدخیمی (۴۰-۶۰٪) دارد و طبق گایدلاین‌های بین‌المللی (Fukuoka/AGA) رزکسیون جراحی توصیه می‌شود، حتی بدون علائم یا high-risk stigmata.", "whyWrong": {"0": "پیگیری برای Branch duct IPMN بدون high-risk features مناسب است، نه MD-IPMN.", "2": "آسپیراسیون در MD-IPMN نقش تشخیصی محدودی دارد و درمان را تغییر نمی‌دهد.", "3": "شیمی‌درمانی برای کیست خوش‌خیم یا premalignant نقشی ندارد."}, "pearl": "High-risk stigmata: Enhancing mural nodule, MPD ≥ 10 mm, Obstructive jaundice → Surgery.", "trap": "سروز سیستادنوم (SCN) بنیگن است و نیاز به رزکسیون ندارد مگر علامت‌دار باشد.", "highYield": "BD-IPMN با worrisome features: Cyst ≥ 3 cm, MPD 5-9 mm, Non-enhancing mural nodule → EUS.", "id": "sur-2-026"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 17, "chapterTitle": "Spleen", "topic": "Splenic Abscess", "subtopic": "Diagnosis and Treatment", "difficulty": "متوسط", "bloom": "", "stem": "مرد ۵۰ ساله دیابتی با اندوکاردیت عفونی تحت درمان، دچار تب مداوم و درد ربع فوقانی چپ شده. CT شکم آبسه ۵ سانتی‌متری در طحال نشان می‌دهد. بهترین اقدام چیست؟", "options": ["ادامه آنتی‌بیوتیک وریدی به تنهایی", "درناژ پرکوتانئوس تحت گایدنس CT", "اسپلنکتومی", "آنتی‌بیوتیک خوراکی و پیگیری سرپایی"], "correct": 2, "explanation": "آبسه طحال معمولاً ثانویه به سپتی‌امبولی (مثل اندوکاردیت) است. درمان انتخابی اسپلنکتومی است زیرا: ۱) پارانشیم طحال بازسازی نمی‌شود ۲) درناژ پرکوتانئوس موفقیت کمتری دارد ۳) ریسک عود با درناژ بالاست.", "whyWrong": {"0": "آنتی‌بیوتیک به تنهایی برای آبسه بزرگ ناکافی است.", "1": "درناژ پرکوتانئوس در آبسه طحال موفقیت کمتری از سایر آبسه‌های شکمی دارد.", "3": "درمان سرپایی خطرناک است."}, "pearl": "آبسه طحال: شایع‌ترین پاتوژن = Staphylococcus و Streptococcus (در زمینه اندوکاردیت).", "trap": "آبسه‌های متعدد یا کوچک ممکن است به آنتی‌بیوتیک طولانی‌مدت پاسخ دهند.", "highYield": "Splenic abscess از Salmonella در بیماری سلول داسی‌شکل شایع است.", "id": "sur-2-027"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 18, "chapterTitle": "Hernia", "topic": "Incisional Hernia", "subtopic": "Risk Factors", "difficulty": "متوسط", "bloom": "", "stem": "کدام عامل بیشترین ریسک را برای ایجاد فتق انسیزیونال پس از لاپاراتومی خط وسط دارد؟", "options": ["سن بالای ۷۰ سال", "عفونت زخم جراحی", "جنس مرد", "برش عرضی"], "correct": 1, "explanation": "عفونت محل جراحی (SSI) مهم‌ترین عامل خطر برای فتق انسیزیونال است و ریسک را ۴-۵ برابر افزایش می‌دهد. سایر عوامل: چاقی، دیابت، سیگار، استروئید، بدتغذیه‌ای و جراحی اورژانسی.", "whyWrong": {"0": "سن بالا عامل خطر است ولی SSI مهم‌تر است.", "2": "جنس تأثیر زیادی ندارد.", "3": "برش خط وسط ریسک بیشتری از عرضی دارد، نه کمتر."}, "pearl": "شانس فتق انسیزیونال بدون SSI ≈ ۱۰٪. با SSI ≈ ۲۵-۴۰٪.", "trap": "Mass closure با suture:wound ratio ≥ 4:1 ریسک فتق را کاهش می‌دهد.", "highYield": "بیشترین فتق‌های انسیزیونال در ۱-۳ سال اول پس از جراحی ظاهر می‌شوند.", "id": "sur-2-028"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 19, "chapterTitle": "Breast", "topic": "Benign Breast Disease", "subtopic": "Fibroadenoma", "difficulty": "آسان", "bloom": "", "stem": "زن ۲۵ ساله با توده ۲ سانتی‌متری متحرک، گرد و لاستیکی در پستان چپ مراجعه کرده. سونوگرافی: توده جامد با مارژین‌های صاف و بدون ویژگی مشکوک. محتمل‌ترین تشخیص چیست؟", "options": ["فیبروآدنوم", "کیست پستان", "کارسینوم داکتال", "تومور فیلودس"], "correct": 0, "explanation": "فیبروآدنوم شایع‌ترین توده جامد خوش‌خیم پستان در زنان جوان است. مشخصات: متحرک (\"breast mouse\")، گرد، صاف، لاستیکی (rubbery)، بدون درد. در سونوگرافی: توده جامد با مارژین‌های صاف.", "whyWrong": {"1": "کیست در سونوگرافی آنکویک (سیاه) است، نه جامد.", "2": "کارسینوم معمولاً سفت، نامنظم و در سنین بالاتر شایع‌تر است.", "3": "فیلودس معمولاً بزرگ‌تر و رشد سریع‌تری دارد."}, "pearl": "Giant fibroadenoma: > 5 cm یا > 500 g. ممکن است نیاز به اکسیزیون داشته باشد.", "trap": "تومور فیلودس از فیبروآدنوم قابل تمایز نیست با تصویربرداری - بیوپسی لازم است.", "highYield": "فیبروآدنوم در حاملگی ممکن است بزرگ شود (Lactational adenoma).", "id": "sur-2-029"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 20, "chapterTitle": "Skin and Soft Tissue", "topic": "Skin Cancer", "subtopic": "Basal Cell Carcinoma", "difficulty": "آسان", "bloom": "", "stem": "مرد ۷۰ ساله با ضایعه مرواریدی با تلانژکتازی در بینی مراجعه کرده. ضایعه آهسته رشد می‌کند. محتمل‌ترین تشخیص چیست؟", "options": ["ملانوم", "کارسینوم سلول سنگفرشی (SCC)", "کارسینوم سلول بازال (BCC)", "کراتوز سبورئیک"], "correct": 2, "explanation": "BCC شایع‌ترین سرطان پوست است. تظاهر کلاسیک: ندول مرواریدی (Pearly) با تلانژکتازی، رشد آهسته، در نواحی در معرض آفتاب (۸۰٪ سر و گردن). ممکن است زخم مرکزی (Rodent ulcer) داشته باشد.", "whyWrong": {"0": "ملانوم معمولاً پیگمانته با حاشیه نامنظم است.", "1": "SCC معمولاً خشن، اسکواموس و ممکن است زخم شده باشد.", "3": "کراتوز سبورئیک \"stuck on\" appearance دارد و خوش‌خیم است."}, "pearl": "BCC متاستاز نمی‌دهد (بسیار نادر) ولی تهاجم موضعی می‌تواند تخریبی باشد.", "trap": "Morpheaform BCC حاشیه‌های نامشخص دارد - ریسک عود بالا با مارژین ناکافی.", "highYield": "انواع BCC: Nodular (شایع‌ترین) > Superficial > Morpheaform (تهاجمی‌ترین).", "id": "sur-2-030"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 11, "chapterTitle": "Esophagus", "topic": "Esophageal Perforation", "subtopic": "Management", "difficulty": "خیلی دشوار", "bloom": "", "stem": "مرد ۵۵ ساله ۲ ساعت پس از دیلاتاسیون آندوسکوپیک برای تنگی مری دچار درد شدید قفسه سینه و تنگی نفس شده. CT: پنوموتوراکس چپ و پنومومدیاستن. بهترین اقدام چیست؟", "options": ["آنتی‌بیوتیک وریدی و مشاهده", "گذاشتن chest tube و ادامه NPO", "ترمیم جراحی اولیه مری + درناژ", "گذاشتن استنت مری"], "correct": 2, "explanation": "پرفوراسیون مری یک اورژانس جراحی است. در پرفوراسیون زودرس (< ۲۴ ساعت) با آلودگی محدود، ترمیم جراحی اولیه (Primary repair) + درناژ مدیاستن و پلور استاندارد درمان است.", "whyWrong": {"0": "مشاهده به تنهایی خطرناک است - مدیاستینیت کشنده است.", "1": "Chest tube به تنهایی کافی نیست - منبع آلودگی ادامه دارد.", "3": "استنت برای موارد انتخابی یا تأخیری ممکن است، ولی در پرفوراسیون حاد با آلودگی پلور جراحی ترجیح دارد."}, "pearl": "Boerhaave syndrome: پرفوراسیون خودبخودی مری (استفراغ شدید) - مری دیستال چپ.", "trap": "Contained perforation با CT و Gastrografin swallow ممکن است non-operative manage شود.", "highYield": "مورتالیته پرفوراسیون مری: < ۲۴ ساعت ≈ ۱۰-۱۵٪. > ۲۴ ساعت ≈ ۴۰-۶۰٪.", "id": "sur-2-031"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 12, "chapterTitle": "Stomach and Duodenum", "topic": "Gastric Physiology", "subtopic": "Acid Secretion", "difficulty": "متوسط", "bloom": "", "stem": "کدام سلول در معده مسئول ترشح اسید هیدروکلریک است و کدام گیرنده اصلی ترین هدف داروهای PPI است؟", "options": ["سلول‌های G - گیرنده گاسترین", "سلول‌های پاریتال - پمپ H+/K+-ATPase", "سلول‌های Chief - گیرنده هیستامین", "سلول‌های ECL - گیرنده استیل‌کولین"], "correct": 1, "explanation": "سلول‌های پاریتال (Oxyntic cells) در معده مسئول ترشح اسید هیدروکلریک هستند. PPIها (Proton Pump Inhibitors) پمپ H+/K+-ATPase را در سطح لومینال سلول پاریتال مهار می‌کنند که مرحله نهایی ترشح اسید است.", "whyWrong": {"0": "سلول‌های G گاسترین ترشح می‌کنند، نه اسید. گاسترین سلول‌های پاریتال را تحریک می‌کند.", "2": "سلول‌های Chief پپسینوژن ترشح می‌کنند.", "3": "سلول‌های ECL هیستامین ترشح می‌کنند که سلول‌های پاریتال را تحریک می‌کند."}, "pearl": "سه محرک اصلی ترشح اسید: Acetylcholine (M3), Histamine (H2), Gastrin (CCK-B receptor).", "trap": "PPIها باید قبل از غذا مصرف شوند زیرا فقط پمپ‌های فعال را مهار می‌کنند.", "highYield": "PPIها مؤثرترین داروهای ضد ترشح اسید هستند - مهار ۹۰٪ ترشح.", "id": "sur-2-032"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 13, "chapterTitle": "Small Intestine and Appendix", "topic": "Crohn's Disease", "subtopic": "Surgical Complications", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۳۵ ساله مبتلا به کرون ایلئال با درد کولیکی شکم، نفخ و استفراغ مراجعه کرده. CT: تنگی فیبروتیک در ایلئوم ترمینال با انسداد نسبی و اتساع روده پروگزیمال. بدون فیستول یا آبسه. درمان طبی ناموفق بوده. بهترین جراحی چیست؟", "options": ["رزکسیون گسترده ایلئوم + آناستوموز", "رزکسیون محدود با حفظ حداکثری روده + آناستوموز", "استریکچرپلاستی", "ایلئوستومی loop"], "correct": 2, "explanation": "در تنگی فیبروتیک کرون بدون سپسیس یا فیستول، استریکچرپلاستی (Strictureplasty) روش انتخابی است زیرا روده را حفظ می‌کند و از Short ار", "bloom": "", "stem": "مرد ۲۵ ساله پس از تروما با Hb=۱۰ g/dL و BP=۹۵/۶۰ پس از ۲ لیتر کریستالوئید مراجعه کرده. CT: لاسراسیون کبدی درجه III با هماتوم ساب‌کپسولار بدون خونریزی فعال. همودینامیک نسبتاً پایدار می‌ماند. بهترین اقدام چیست؟", "options": ["لاپاراتومی اورژانسی", "مانیتورینگ در ICU با پیگیری سریال Hb و CT", "آنژیوگرافی و امبولیزاسیون پروفیلاکتیک", "ERCP فوری"], "correct": 1, "explanation": "در آسیب کبدی بلانت درجه I-III در بیمار همودینامیک پایدار یا پاسخ‌دهنده به مایعات بدون Contrast blush، Non-operative management (NOM) با مانیتورینگ در ICU، پیگیری Hb و بررسی مجدد تصویربرداری استاندارد است. موفقیت NOM > ۸۵٪.", "whyWrong": {"0": "لاپاراتومی در بیمار پایدار بدون خونریزی فعال ضروری نیست.", "2": "آنژیوامبولیزاسیون در صورت وجود Contrast blush یا Pseudoaneurysm.", "3": "ERCP برای آسیب بیلیاری (Bile leak) است، نه آسیب پارانشیمی حاد."}, "pearl": "AAST Liver Injury Scale: I-VI. Grade IV-V ممکن است به intervention نیاز داشته باشند.", "trap": "Contrast blush = خونریزی فعال → انژیوامبولیزاسیون در بیمار پایدار.", "highYield": "خونریزی تأخیری ممکن است ۵-۱۴ روز بعد رخ دهد - آموزش بیمار مهم است.", "id": "sur-2-035"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 16, "chapterTitle": "Pancreas", "topic": "Chronic Pancreatitis", "subtopic": "Complications", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۴۵ ساله الکلی با پانکراتیت مزمن و کیست ۸ سانتی‌متری در دم پانکراس که ۸ هفته از شروع آن گذشته، مراجعه کرده. درد شکم مداوم دارد. EUS: دیواره ضخیم و محتوای دبری. بدون ارتباط با مجرای اصلی. بهترین درمان چیست؟", "options": ["درناژ آندوسکوپیک ترانس‌گاستریک", "درناژ پرکوتانئوس", "دیستال پانکراتکتومی", "مشاهده و پیگیری"], "correct": 0, "explanation": "سودوکیست پانکراس > ۶ cm یا علامت‌دار که > ۶ هفته از تشکیل آن گذشته (Mature: دیواره ضخیم) کاندید درناژ است. درناژ آندوسکوپیک (EUS-guided transmural drainage یا Cystogastrostomy) روش ارجح است زیرا کم‌تهاجمی‌تر از جراحی است.", "whyWrong": {"1": "درناژ پرکوتانئوس خطر فیستول خارجی دارد و ب 41"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 12, "chapterTitle": "Stomach and Duodenum", "topic": "Bariatric Surgery", "subtopic": "Complications", "difficulty": "خیلی دشوار", "bloom": "", "stem": "زن ۳۵ ساله ۱۰ روز پس از Roux-en-Y gastric bypass با تاکی‌کاردی مداوم (۱۲۰/دقیقه)، تب خفیف ۳۷.۸ و درد شکم مبهم مراجعه کرده. WBC=۱۴۰۰۰. CT با کنتراست خوراکی: مقدار کمی مایع آزاد پری‌آناستوموتیک. محتمل‌ترین تشخیص و اقدام چیست؟", "options": ["انسداد روده - مشاهده و NG tube", "لیک آناستوموز - لاپاراسکوپی/لاپاراتومی اورژانسی", "خونریزی داخلی - ترانسفوزیون", "پنومونی - آنتی‌بیوتیک"], "correct": 1, "explanation": "تاکی‌کاردی مداوم پس از جراحی باریاتریک مهم‌ترین علامت هشداردهنده Anastomotic leak است. حتی با CT غیرقطعی، تاکی‌کاردی + تب + مایع پری‌آناستوموتیک = لیک تا ثابت شدن خلاف. اکسپلوراسیون جراحی فوری ضروری است.", "whyWrong": {"0": "انسداد معمولاً با استفراغ و اتساع معده تظاهر می‌کند.", "2": "خونریزی با افت Hb تظاهر می‌کند.", "3": "پنومونی با علائم تنفسی و کانسالیداسیون در CXR."}, "pearl": "تاکی‌کاردی پایدار > ۱۲۰ پس از باریاتریک = لیک until proven otherwise.", "trap": "CT ممکن است لیک کوچک زودرس را نشان ندهد - تاکی‌کاردی حساس‌تر است.", "highYield": "لیک معمولاً در Gastrojejunostomy (GJ) رخ می‌دهد (شایع‌ترین محل).", "id": "sur-2-042"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 13, "chapterTitle": "Small Intestine and Appendix", "topic": "Small Bowel Obstruction", "subtopic": "Management", "difficulty": "دشوار", "bloom": "", "stem": "زن ۶۵ ساله با سابقه هیسترکتومی ۱۵ سال قبل، با درد کولیکی شکم، استفراغ و عدم دفع گاز از ۲۴ ساعت قبل مراجعه کرده. شکم متسع با صداهای روده‌ای فلزی. CT: انسداد روده کوچک با Transition point در ایلئوم و دکمپرشن دیستال، بدون علائم ایسکمی. بهترین اقدام اولیه چیست؟", "options": ["لاپاراتومی اورژانسی", "درمان محافظه‌کارانه: NG tube، مایعات وریدی و مشاهده با تست Gastrografin", "آنتی‌بیوتیک وریدی و مشاهده", "کولونوسکوپی"], "correct": 1, "explanation": "انسداد روده کوچک نسبی (Partial SBO) ناشی از چسبندگی در بیمار پایدار بدون علائم ایسکمی یا Strangulation، ابتدا با درمان محافظه‌کارانه: NPO، NG tube decompression، مایعات وریدی و مشاهده. تست Gastrografin (Water-soluble contrast) هم تشخیصی و هم درمانی است.", "whyWrong": {"0": "لاپاراتومی اورژانسی در انسداد کامل، Strangulation یا شکست درمان محافظه‌کارانه.", "2": "آنتی‌بیوتیک لازم نیست مگر علائم عفونت باشد.", "3": "کولونوسکوپی برای انسداد کولون است."}, "pearl": "Gastrografin: اگر در ۲۴ ساعت به کولون برسد = احتمال بهبود بالا. نرسیدن = احتمال جراحی.", "trap": "NG tube معده را decompress می‌کند، نه روده کوچک - Long tube ممکن است بهتر باشد.", "highYield": "علائم Strangulation: درد مداوم، تب، لکوسیتوز، اسیدوز، Thickened bowel wall, Mesenteric haze.", "id": "sur-2-043"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 14, "chapterTitle": "Colon, Rectum, and Anus", "topic": "Rectal Cancer", "subtopic": "Staging and Treatment", "difficulty": "خیلی دشوار", "bloom": "", "stem": "مرد ۵۵ ساله با سرطان رکتوم T3N1M0 در ۶ سانتی‌متری از لبه آنال مراجعه کرده. MRI: CRM (Circumferential Resection Margin) تهدید شده. بهترین رویکرد درمانی چیست؟", "options": ["رزکسیون آبدومینوپرینئال (APR) فوری", "شیمی‌رادیوتراپی نئوادجوانت سپس TME", "کموتراپی سیستمیک به تنهایی", "رادیوتراپی به تنهایی سپس جراحی"], "correct": 1, "explanation": "در سرطان رکتوم locally advanced (T3/T4 یا N+) با CRM تهدیدشده یا درگیر، شیمی‌رادیوتراپی نئوادجوانت (Long-course: 5-FU based + 50.4 Gy) استاندارد است. این Downstaging ایجاد می‌کند و امکان TME (Total Mesorectal Excision) با مارژین منفی را افزایش می‌دهد.", "whyWrong": {"0": "APR فوری بدون نئوادجوانت در T3N1 با CRM تهدیدشده استاندارد نیست.", "2": "کموتراپی سیستمیک به تنهایی برای رکتال کافی نیست.", "3": "رادیوتراپی به تنهایی (Short-course) برای CRM تهدیدشده کمتر مؤثر است."}, "pearl": "CRM تهدیدشده: تومور < ۱ mm از fascia mesorectalis → ریسک عود موضعی بالا.", "trap": "TME (Total Mesorectal Excision) برای کاهش عود موضعی حیاتی است.", "highYield": "تومور < ۵ cm از لبه آنال → APR اغلب لازم است. ≥ ۵ cm → Low anterior resection.", "id": "sur-2-044"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 15, "chapterTitle": "Liver and Biliary Tract", "topic": "Biliary Disease", "subtopic": "Primary Sclerosing Cholangitis", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۳۵ ساله با کولیت اولسراتیو با خارش، خستگی و افزایش ALP (۴ برابر نرمال) و بیلی‌روبین خفیف بالا مراجعه کرده. MRCP: تنگی‌ها و دیلاتاسیون‌های متناوب مجاری صفراوی داخل و خارج کبدی (Beaded appearance). محتمل‌ترین تشخیص چیست؟", "options": ["کوله‌سیستیت حاد", "کلانژیت اسکلروزان اولیه (PSC)", "سندرم میریتزی", "کلانژیوکارسینوم"], "correct": 1, "explanation": "PSC با ترکیب IBD (به‌خصوص UC در ۷۰-۸۰٪)، Cholestatic LFTs و یافته‌های کلاسیک MRCP (Beading = تنگی و دیلاتاسیون متناوب) تشخیص داده می‌شود. بیماری خودایمنی مجاری صفراوی است.", "whyWrong": {"0": "کوله‌سیستیت حاد با درد RUQ و علائم حاد تظاهر می‌کند.", "2": "میریتزی سنگ کیسه صفرا فشار بر CBD است - یافته MRCP متفاوت است.", "3": "کلانژیوکارسینوم ممکن است در PSC رخ دهد ولی تظاهر اولیه نیست."}, "pearl": "PSC + UC = ریسک بالای کلانژیوکارسینوم (۱۵-۲۰٪ طول عمر) و سرطان کولون.", "trap": "هر بدتر شدن ناگهانی در PSC → مشکوک به Dominant stricture یا کلانژیوکارسینوم.", "highYield": "p-ANCA در PSC مثبت است (نه AMA که در PBC مثبت است).", "id": "sur-2-045"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 16, "chapterTitle": "Pancreas", "topic": "Pancreatic Neuroendocrine Tumors", "subtopic": "Insulinoma", "difficulty": "دشوار", "bloom": "", "stem": "زن ۴۰ ساله با دوره‌های عرق ریزش، گیجی، تپش قلب و کاهش هوشیاری که با خوردن بهبود می‌یابد مراجعه کرده. در حین حمله: گلوکز ۳۵ mg/dL، انسولین ۲۵ µU/mL (نرمال < ۶ در هایپوگلیسمی)، C-peptide بالا. CT: ندول ۱.۵ سانتی‌متری در بدنه پانکراس. تشخیص و درمان چیست؟", "options": ["انسولینوما - رزکسیون جراحی (Enucleation)", "گاسترینوما - PPI دوز بالا", "گلوکاگونوما - اکترئوتاید", "سوءمصرف انسولین خارجی - مشاوره روانپزشکی"], "correct": 0, "explanation": "تریاد Whipple (هایپوگلیسمی + علائم نوروگلیکوپنیک + بهبود با گلوکز) + هایپرانسولینمی نامناسب + C-peptide بالا (نشان‌دهنده تولید اندوژن) = انسولینوما. درمان: رزکسیون جراحی (Enucleation برای تومور < ۲ cm کوچک و سطحی).", "whyWrong": {"1": "گاسترینوما با زخم پپتیک و اسهال تظاهر می‌کند، نه هایپوگلیسمی.", "2": "گلوکاگونوما با هایپرگلیسمی و راش (Necrolytic migratory erythema) تظاهر می‌کند.", "3": "در سوءمصرف انسولین خارجی C-peptide پایین است."}, "pearl": "۹۰٪ انسولینوما: خوش‌خیم، منفرد، < ۲ cm، داخل پانکراس.", "trap": "C-peptide پایین + انسولین بالا = انسولین خارجی. C-peptide بالا = تولید اندوژن.", "highYield": "اگر در CT دیده نشد → EUS (حساسیت > ۹۰٪).", "id": "sur-2-046"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 17, "chapterTitle": "Spleen", "topic": "Immune Thrombocytopenia", "subtopic": "Splenectomy", "difficulty": "متوسط", "bloom": "", "stem": "زن ۳۰ ساله مبتلا به ITP مقاوم به کورتیکواستروئید و IVIG با پلاکت مداوم < ۳۰,۰۰۰ و خونریزی‌های پوستی مکرر تحت اسپلنکتومی لاپاراسکوپیک قرار می‌گیرد. پاسخ به جراحی چگونه است؟", "options": ["بهبود در ۱۰-۲۰٪ بیماران", "بهبود در ۶۰-۷۵٪ بیماران", "بهبود در ۱۰۰٪ بیماران", "اسپلنکتومی در ITP بی‌اثر است"], "correct": 1, "explanation": "اسپلنکتومی در ITP مقاوم به درمان طبی (Steroid, IVIG) در ۶۰-۷۵٪ بیماران پاسخ پایدار (پلاکت > ۵۰,۰۰۰) ایجاد می‌کند. این به دلیل حذف محل اصلی تخریب پلاکت‌های آنتی‌بادی-پوشیده و منبعی از تولید آنتی‌بادی است.", "whyWrong": {"0": "موفقیت بیش از ۲۰٪ است.", "2": "۱۰۰٪ نیست - ۲۵-۴۰٪ پاسخ نمی‌دهند یا عود می‌کنند.", "3": "اسپلنکتومی یکی از مؤثرترین درمان‌های ITP مقاوم است."}, "pearl": "Accessory spleen در ۱۵-۳۰٪ وجود دارد - باید حین اسپلنکتومی بررسی و برداشته شود.", "trap": "عود ITP پس از اسپلنکتومی → بررسی برای Accessory spleen با Nuclear scan.", "highYield": "TPO-receptor agonists (Eltrombopag, Romiplostim) قبل از اسپلنکتومی امتحان شوند.", "id": "sur-2-047"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 18, "chapterTitle": "Hernia", "topic": "Inguinal Hernia", "subtopic": "Mesh Repair", "difficulty": "متوسط", "bloom": "", "stem": "در ترمیم بدون تنش (Tension-free repair) فتق اینگوینال با مش، کدام روش شایع‌ترین است؟", "options": ["Shouldice (بافت به بافت)", "Lichtenstein (Onlay mesh)", "Bassini (بافت به بافت)", "McVay (Cooper ligament repair)"], "correct": 1, "explanation": "روش Lichtenstein (Tension-free mesh repair) شایع‌ترین روش ترمیم فتق اینگوینال است. مش پلی‌پروپیلن روی کف کانال اینگوینال قرار داده می‌شود (Onlay). ریسک عود < ۱٪ و ریسک درد مزمن کمتر از روش‌های بافت به بافت است.", "whyWrong": {"0": "Shouldice بافت به بافت است با عود ۱-۴٪ - فقط در مراکز تخصصی.", "2": "Bassini روش کلاسیک بافت به بافت با عود بالاتر (۵-۱۰٪).", "3": "McVay برای فتق فمورال هم استفاده می‌شود ولی تنش بیشتری دارد."}, "pearl": "Mesh کانتراندیکه: Strangulated hernia with bowel necrosis, Contaminated field.", "trap": "درد مزمن اینگوینال در ۱۰-۱۵٪ بیماران پس از mesh repair رخ می‌دهد.", "highYield": "TAPP و TEP روش‌های لاپاراسکوپیک هستند - برای فتق دوطرفه یا عودکننده.", "id": "sur-2-048"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 19, "chapterTitle": "Breast", "topic": "Breast Cancer", "subtopic": "Hormonal Therapy", "difficulty": "متوسط", "bloom": "", "stem": "زن ۶۰ ساله یائسه با کانسر پستان ER+/PR+/HER2- تحت لامپکتومی و رادیوتراپی قرار گرفته. بهترین درمان ادجوانت هورمونی چیست؟", "options": ["تاموکسیفن ۵ سال", "آروماتاز اینهیبیتور (Letrozole یا Anastrozole) ۵ سال", "LHRH agonist به تنهایی", "ترکیب تاموکسیفن و آروماتاز اینهیبیتور همزمان"], "correct": 1, "explanation": "در زنان یائسه با کانسر پستان ER+، آروماتاز اینهیبیتور (AI) مثل Letrozole یا Anastrozole خط اول درمان ادجوانت هورمونی است. AI نسبت به تاموکسیفن در این گروه اثربخشی بهتری دارد.", "whyWrong": {"0": "تاموکسیفن در زنان پره‌منوپوز خط اول است. در یائسگی AI بهتر است.", "2": "LHRH agonist به تنهایی در زنان یائسه بی‌معنی است (تخمدان‌ها غیرفعال هستند).", "3": "ترکیب همزمان توصیه نمی‌شود - یا Sequence می‌شود یا یکی استفاده می‌شود."}, "pearl": "AI در پره‌منوپوز ممنوع است (تحریک تخمدان) - فقط با Ovarian suppression استفاده شود.", "trap": "عوارض AI: استئوپوروز، آرترالژی. عوارض تاموکسیفن: ترومبوآمبولی، سرطان آندومتر.", "highYield": "درمان Extended (۱۰ سال) در بیماران پرخطر در نظر گرفته می‌شود.", "id": "sur-2-049"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 20, "chapterTitle": "Skin and Soft Tissue", "topic": "Melanoma", "subtopic": "Prognostic Factors", "difficulty": "آسان", "bloom": "", "stem": "مهم‌ترین فاکتور پروگنوستیک در ملانوم بدون متاستاز بالینی کدام است؟", "options": ["محل آناتومیک تومور", "ضخامت Breslow", "تیپ هیستولوژیک", "سن بیمار"], "correct": 1, "explanation": "ضخامت Breslow (عمق تهاجم تومور به میلی‌متر از لایه گرانولار اپیدرم) مهم‌ترین فاکتور پروگنوستیک در ملانوم بدون متاستاز است. هرچه ضخامت بیشتر، ریسک متاستاز و مورتالیته بالاتر.", "whyWrong": {"0": "محل تأثیر کمتری دارد.", "2": "تیپ هیستولوژیک تأثیر محدودی دارد.", "3": "سن تأثیر محدودی دارد."}, "pearl": "Breslow < ۱ mm: بقای ۵ ساله > ۹۵٪. > ۴ mm: بقای ۵ ساله < ۵۰٪.", "trap": "Clark level (سطح تهاجم آناتومیک) کمتر از Breslow استفاده می‌شود.", "highYield": "سایر فاکتورها: Ulceration, Mitotic rate, SLN status.", "id": "sur-2-050"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 11, "chapterTitle": "Esophagus", "topic": "Hiatal Hernia", "subtopic": "Types", "difficulty": "آسان", "bloom": "", "stem": "در کدام نوع هرنی هیاتال، کاردیای معده در موقعیت طبیعی زیر دیافراگمی قرار دارد ولی فوندوس به قفسه سینه هرنیه شده؟", "options": ["نوع I (Sliding)", "نوع II (Paraesophageal)", "نوع III (Mixed)", "نوع IV (Complex)"], "correct": 1, "explanation": "هرنی هیاتال نوع II (Paraesophageal) مشخصه‌اش این است که GE junction در موقعیت طبیعی زیر دیافراگم است ولی فوندوس معده از کنار مری به قفسه سینه هرنیه شده. برخلاف نوع I که GE junction به بالا می‌رود.", "whyWrong": {"0": "نوع I (Sliding): GE junction به قفسه سینه می‌رود - شایع‌ترین نوع (۹۵٪).", "2": "نوع III: ترکیب I و II - هم GE junction و هم فوندوس بالا رفته.", "3": "نوع IV: علاوه بر معده، ارگان‌های دیگر (کولون، طحال) هم هرنیه شده."}, "pearl": "نوع II خطرناک‌تر از نوع I است - ریسک Volvulus، Strangulation و Incarceration.", "trap": "نوع I معمولاً با GERD همراه است ولی نوع II لزوماً GERD ندارد.", "highYield": "نوع II-IV همیشه اندیکاسیون جراحی دارند حتی بدون علامت.", "id": "sur-2-051"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 12, "chapterTitle": "Stomach and Duodenum", "topic": "Gastric Ulcer", "subtopic": "Location Classification", "difficulty": "متوسط", "bloom": "", "stem": "زخم معده در کدام ناحیه بیشترین ارتباط با H. pylori را دارد و کمترین ارتباط با سرطان معده را دارد؟", "options": ["Type I - Lesser curve/Body", "Type II - Body + Duodenal ulcer", "Type III - Prepyloric", "Type IV - High lesser curve/Cardia"], "correct": 1, "explanation": "طبقه‌بندی Johnson: Type II (زخم معده + زخم دئودنوم همزمان) و Type III (پره‌پیلوریک) با هایپراسیدیتی و H. pylori ارتباط قوی دارند و ریسک سرطان پایینی دارند. Type I (قوس کوچک/بدنه) شایع‌ترین است و Type IV (نزدیک کاردیا) باید از نظر بدخیمی بررسی شود.", "whyWrong": {"0": "Type I با H. pylori و NSAIDs - ریسک متوسط بدخیمی.", "2": "Type III با اسید بالا ولی سوال H. pylori پرسیده.", "3": "Type IV ریسک بالای بدخیمی دارد."}, "pearl": "هر زخم معده باید بیوپسی شود (برخلاف زخم دئودنوم) برای رد بدخیمی.", "trap": "Type I اسید نرمال یا پایین دارد. Type II و III اسید بالا دارند.", "highYield": "Type IV و زخم‌های Giant (> ۳ cm) ریسک بالای بدخیمی دارند.", "id": "sur-2-052"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 13, "chapterTitle": "Small Intestine and Appendix", "topic": "Carcinoid Tumor", "subtopic": "Small Bowel Carcinoid", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۵۵ ساله با فلاشینگ، اسهال آبکی، ویزینگ و نارسایی قلب راست مراجعه کرده. CT شکم: توده در ایلئوم با متاستاز کبدی متعدد. 5-HIAA ادرار ۲۴ ساعته بالاست. بهترین درمان علامتی چیست؟", "options": ["رزکسیون کامل توده و متاستازها", "اکترئوتاید (Somatostatin analog)", "شیمی‌درمانی سیستمیک تهاجمی", "رادیوتراپی"], "correct": 1, "explanation": "این بیمار سندرم کارسینوئید دارد (فلاشینگ، اسهال، برونکواسپاسم، بیماری قلبی راست) ناشی از ترشح سروتونین از متاستازهای کبدی. اکترئوتاید (Octreotide) مهار کننده سوماتواستاتین است که ترشح هورمونی را کاهش داده و علائم را کنترل می‌کند.", "whyWrong": {"0": "رزکسیون در متاستاز منتشر معمولاً ممکن نیست - Debulking ممکن است کمکی باشد.", "2": "شیمی‌درمانی در کارسینوئید well-differentiated کم‌اثر است.", "3": "رادیوتراپی نقش محدودی دارد."}, "pearl": "سندرم کارسینوئید فقط با متاستاز کبدی رخ می‌دهد (سروتونین از First-pass کبد عبور می‌کند).", "trap": "قبل از جراحی در بیمار با سندرم کارسینوئید: اکترئوتاید برای جلوگیری از Carcinoid crisis.", "highYield": "Carcinoid heart disease: فیبروز دریچه تریکوسپید و پولمونر.", "id": "sur-2-053"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 14, "chapterTitle": "Colon, Rectum, and Anus", "topic": "Ulcerative Colitis", "subtopic": "Surgical Indications", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۲۵ ساله مبتلا به کولیت اولسراتیو با کولون سمی (Toxic megacolon) که به ۷۲ ساعت درمان طبی aggressive (کورتیکواستروئید IV، آنتی‌بیوتیک) پاسخ نداده مراجعه کرده. بهترین جراحی چیست؟", "options": ["کولکتومی توتال با آناستوموز ایلئوآنال فوری (IPAA)", "کولکتومی ساب‌توتال با ایلئوستومی end و Hartmann", "پروکتوکولکتومی توتال با ایلئوستومی دائم", "کولکتومی سگمانتال"], "correct": 1, "explanation": "در Toxic megacolon مقاوم به درمان طبی، جراحی اورژانسی لازم است. در شرایط حاد، کولکتومی ساب‌توتال با ایلئوستومی end و بستن رکتوم (Hartmann) یا ایجاد Mucous fistula انجام می‌شود. IPAA (Pouch) در مرحله بعد (۳-۶ ماه) پس از بهبود بیمار انجام می‌شود.", "whyWrong": {"0": "IPAA فوری در بیمار سمی پرخطر است - طولانی‌تر، ریسک Leak بالا.", "2": "
