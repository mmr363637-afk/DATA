ed implant"], "correct": 1, "explanation": "TRAM (Transverse Rectus Abdominis Myocutaneous) flap یک روش بازسازی کاملاً اتولوگ است که از پوست و چربی شکم استفاده می‌کند. گزینه‌های دیگر مثل DIEP flap نیز اتولوگ هستند. Implant-based روش‌ها از پروتز استفاده می‌کنند.", "whyWrong": {"0": "Tissue expander و Implant = Prosthetic reconstruction.", "2": "Latissimus + Implant = Hybrid (نیاز به implant هم دارد).", "3": "Mesh + Implant = Prosthetic."}, "pearl": "DIEP (Deep Inferior Epigastric Perforator): Free flap، عضله حفظ می‌شود - کمتر هرنی.", "trap": "Implant-based reconstruction ممکن است در صورت نیاز به رادیوتراپی مشکل‌ساز باشد.", "highYield": "مزیت Autologous: نتیجه طبیعی‌تر، نیاز کمتر به Revision. معایب: جراحی طولانی‌تر.", "id": "sur-2-059"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 20, "chapterTitle": "Skin and Soft Tissue", "topic": "Necrotizing Soft Tissue Infections", "subtopic": "Fournier's Gangrene", "difficulty": "خیلی دشوار", "bloom": "", "stem": "مرد ۵۵ ساله دیابتی با تب ۴۰ درجه، درد شدید پرینه، اریتم و تورم اسکروتوم، و کرپیتوس مراجعه کرده. BP=۸۰/۵۰، HR=۱۳۰. بهترین اقدام فوری چیست؟", "options": ["CT scan برای تأیید تشخیص", "آنتی‌بیوتیک وریدی و مشاهده ۲۴ ساعته", "دبریدمان جراحی فوری و وسیع + آنتی‌بیوتیک وسیع‌الطیف + Resuscitation", "کشت و انتظار برای نتیجه قبل از جراحی"], "correct": 2, "explanation": "گانگرن فورنیه (Necrotizing fasciitis پرینه) یک اورژانس جراحی با مورتالیته ۴۰-۶۰٪ است. درمان: ۱) Resuscitation aggressive ۲) آنتی‌بیوتیک وسیع‌الطیف فوری (Cover gram+, gram-, anaerobes) ۳) دبریدمان جراحی فوری و وسیع - معمولاً چندین دبریدمان لازم است.", "whyWrong": {"0": "CT باعث تأخیر می‌شود - تشخیص بالینی است.", "1": "مشاهده ۲۴ ساعته کشنده است.", "3": "انتظار برای کشت خطرناک است - درمان تجربی فوری شروع شود."}, "pearl": "پاتوژن‌ها: Mixed - E. coli, Bacteroides, Clostridium, Streptococcus, Staphylococcus.", "trap": "تستیکول‌ها معمولاً سالم می‌مانند (خون‌رسانی جداگانه از شریان تستیکولار).", "highYield": "LRINEC Score برای تشخیص NF کمک می‌کند ولی بالینی مهم‌تر است.", "id": "sur-2-060"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 11, "chapterTitle": "Esophagus", "topic": "Barrett's Esophagus", "subtopic": "Surveillance", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۵۵ ساله با مری بارت بدون دیسپلازی در بیوپسی مراجعه کرده. توصیه پیگیری چیست؟", "options": ["آندوسکوپی و بیوپسی هر ۳ ماه", "آندوسکوپی و بیوپسی هر ۳-۵ سال", "آبلیشن فوری با RFA", "ازوفاژکتومی پروفیلاکتیک"], "correct": 1, "explanation": "مری بارت بدون دیسپلازی (Non-dysplastic Barrett's) نیاز به پیگیری با آندوسکوپی و بیوپسی ۴ کوادرانت هر ۳-۵ سال دارد. Low-grade dysplasia هر ۶-۱۲ ماه، و High-grade dysplasia نیاز به درمان (RFA یا EMR) دارد.", "whyWrong": {"0": "هر ۳ ماه برای Barrett بدون دیسپلازی بیش از حد است.", "2": "آبلیشن برای High-grade dysplasia یا Early cancer اندیکاسیون دارد.", "3": "ازوفاژکتومی پروفیلاکتیک توصیه نمی‌شود."}, "pearl": "مری بارت: متاپلازی از Squamous به Columnar intestinal - ریسک آدنوکارسینوم.", "trap": "Irregular Z-line به تنهایی Barrett نیست - باید بیوپسی Intestinal metaplasia تأیید کند.", "highYield": "ریسک آدنوکارسینوم در Barrett بدون دیسپلازی: ۰.۵٪ در سال.", "id": "sur-2-061"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 12, "chapterTitle": "Stomach and Duodenum", "topic": "Dumping Syndrome", "subtopic": "Pathophysiology", "difficulty": "متوسط", "bloom": "", "stem": "بیمار ۶ ماه پس از گاسترکتومی پارشیال دچار تعریق، تاکی‌کاردی، گیجی و ضعف ۲ ساعت پس از غذا می‌شود. کدام نوع دامپینگ و مکانیسم آن صحیح است؟", "options": ["دامپینگ زودرس - هایپرگلیسمی", "دامپینگ دیررس - هایپوگلیسمی واکنشی", "دامپینگ زودرس - هایپوگلیسمی", "دامپینگ دیررس - هایپراسمولاریتی روده"], "correct": 1, "explanation": "دامپینگ دیررس (Late dumping) ۱-۳ ساعت پس از غذا رخ می‌دهد. مکانیسم: ورود سریع کربوهیدرات به روده → جذب سریع گلوکز → ترشح بیش از حد انسولین → هایپوگلیسمی واکنشی. علائم: ضعف، تعریق، گیجی، تاکی‌کاردی (علائم هایپوگلیسمی).", "whyWrong": {"0": "دامپینگ زودرس با هایپوگلیسمی یا هایپرگلیسمی نیست - با Fluid shift است.", "2": "دامپینگ زودرس ۱۵-۳۰ دقیقه پس از غذا رخ می‌دهد.", "3": "هایپراسمولاریتی روده مکانیسم دامپینگ زودرس است."}, "pearl": "Early dumping: GI symptoms (Nausea, diarrhea) + Vasomotor (Flushing, palpitation) - از Fluid shift.", "trap": "اکترئوتاید برای موارد مقاوم به درمان غذایی استفاده می‌شود.", "highYield": "درمان: وعده‌های کوچک، کم‌کربوهیدرات، پرپروتئین، جدا کردن مایعات از غذا.", "id": "sur-2-062"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 13, "chapterTitle": "Small Intestine and Appendix", "topic": "Appendicitis", "subtopic": "Special Populations", "difficulty": "متوسط", "bloom": "", "stem": "زن ۲۵ ساله باردار ۲۴ هفته با درد شکمی و لکوسیتوز مراجعه کرده. شک به آپاندیسیت است. بهترین تست تصویربرداری چیست؟", "options": ["CT شکم با کنتراست", "رادیوگرافی شکم", "MRI شکم بدون کنتراست گادولینیوم", "سونوگرافی شکم"], "correct": 3, "explanation": "در حاملگی، سونوگرافی خط اول تصویربرداری برای آپاندیسیت است (بدون Radiation). اگر Inconclusive باشد، MRI بدون گادولینیوم خط دوم است. CT فقط در صورت عدم دسترسی به MRI و شک بالینی قوی.", "whyWrong": {"0": "CT radiation دارد و در حاملگی خط اول نیست.", "1": "رادیوگرافی ساده برای آپاندیسیت تشخیصی نیست.", "2": "MRI خط دوم پس از سونوگرافی است."}, "pearl": "در حاملگی آپاندیس به سمت بالا و خارج جابجا می‌شود - درد ممکن است در RUQ باشد.", "trap": "لکوسیتوز خفیف در حاملگی نرمال است - تفسیر با احتیاط.", "highYield": "آپاندیسیت درمان نشده در حاملگی: ریسک پرفوراسیون و از دست دادن جنین بالا.", "id": "sur-2-063"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 14, "chapterTitle": "Colon, Rectum, and Anus", "topic": "Pilonidal Disease", "subtopic": "Treatment", "difficulty": "آسان", "bloom": "", "stem": "مرد ۲۲ ساله با آبسه پیلونیدال حاد در چین گلوتئال مراجعه کرده. بهترین درمان فوری چیست؟", "options": ["آنتی‌بیوتیک خوراکی به تنهایی", "انسیزیون و درناژ", "اکسیزیون وسیع و بستن اولیه", "کرایوتراپی"], "correct": 1, "explanation": "آبسه پیلونیدال حاد نیاز به انسیزیون و درناژ ساده دارد. این را می‌توان با بی‌حسی موضعی در مطب یا اورژانس انجام داد. درمان قطعی بیماری پیلونیدال (اکسیزیون) پس از فروکش کردن التهاب حاد انجام می‌شود.", "whyWrong": {"0": "آنتی‌بیوتیک به تنهایی برای آبسه کافی نیست.", "2": "اکسیزیون وسیع در فاز حاد توصیه نمی‌شود.", "3": "کرایوتراپی برای آبسه استفاده نمی‌شود."}, "pearl": "پس از درناژ، ۵۰٪ بیماران بهبود می‌یابند و نیازی به جراحی قطعی ندارند.", "trap": "Midline closure ریسک عود بالاتری از Off-midline closure دارد.", "highYield": "Karydakis flap و Limberg flap برای موارد مزمن/عودکننده استفاده می‌شوند.", "id": "sur-2-064"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 15, "chapterTitle": "Liver and Biliary Tract", "topic": "Bile Duct Injury", "subtopic": "Classification", "difficulty": "دشوار", "bloom": "", "stem": "حین کوله‌سیستکتومی لاپاراسکوپیک، جراح متوجه نشت صفرا می‌شود. کولانژیوگرافی حین عمل نشان می‌دهد که مجرای کبدی مشترک (CHD) کاملاً قطع شده ولی دئودنوم سالم است. این آسیب طبق طبقه‌بندی Strasberg کدام است؟", "options": ["Type A - نشت از مجرای سیستیک یا Duct of Luschka", "Type D - آسیب جانبی به مجرای صفراوی خارج کبدی", "Type E - آسیب کامل به مجرای صفراوی خارج کبدی", "Type B - انسداد بخشی از درخت صفراوی"], "correct": 2, "explanation": "طبقه‌بندی Strasberg: Type E شامل آسیب‌های Transection یا قطع کامل مجرای صفراوی اصلی (CHD یا CBD) است. Type E1-E5 بر اساس سطح قطع و درگیری duct‌های کبدی تقسیم می‌شود.", "whyWrong": {"0": "Type A: نشت از Cystic duct stump یا Duct of Luschka - مجرای اصلی سالم است.", "1": "Type D: Lateral injury به مجرای صفراوی - نه Transection کامل.", "3": "Type B: انسداد (معمولاً کلیپ) یک Sectoral duct."}, "pearl": "آسیب مجرای صفراوی در ۰.۳-۰.۵٪ کوله‌سیستکتومی‌های لاپاراسکوپیک رخ می‌دهد.", "trap": "آسیب‌های Type E نیاز به Hepaticojejunostomy Roux-en-Y دارند - نه ترمیم End-to-end.", "highYield": "اگر آسیب حین عمل شناخته شد: فوراً کمک جراح هپاتوبیلیاری بخواهید.", "id": "sur-2-065"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 16, "chapterTitle": "Pancreas", "topic": "Chronic Pancreatitis", "subtopic": "Pain Management", "difficulty": "متوسط", "bloom": "", "stem": "مرد ۴۵ ساله الکلی با پانکراتیت مزمن و درد شکمی مداوم مقاوم به اوپیوئیدها مراجعه کرده. CT: اتساع مجرای پانکراتیک (> ۷ mm) با کلسیفیکاسیون. بهترین جراحی برای تسکین درد چیست؟", "options": ["پانکراتکتومی توتال", "Puestow procedure (Lateral Pancreaticojejunostomy)", "Whipple procedure", "اسفنکتروتومی پانکراتیک آندوسکوپیک"], "correct": 1, "explanation": "در پانکراتیت مزمن با Large duct disease (MPD > ۷ mm)، Puestow procedure (Lateral Pancreaticojejunostomy) درمان انتخابی است. مجرای پانکراتیک باز شده و به ژژونوم Roux-en-Y آناستوموز می‌شود برای درناژ.", "whyWrong": {"0": "پانکراتکتومی توتال باعث دیابت و نارسایی برون‌ریز کامل می‌شود.", "2": "Whipple برای Small duct disease یا توده در Head پانکراس.", "3": "اسفنکتروتومی آندوسکوپیک برای تنگی محدود مجرا است."}, "pearl": "Frey procedure: Puestow + coring out of pancreatic head - برای بیماری Head غالب.", "trap": "Abstinence از الکل قبل از جراحی بسیار مهم است.", "highYield": "بعد از جراحی، ۷۰-۸۰٪ بیماران تسکین درد می‌یابند.", "id": "sur-2-066"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 17, "chapterTitle": "Spleen", "topic": "Wandering Spleen", "subtopic": "Diagnosis", "difficulty": "دشوار", "bloom": "", "stem": "زن ۲۵ ساله با درد شکمی متناوب و توده متحرک شکمی مراجعه کرده. CT با کنتراست: طحال در موقعیت غیرطبیعی در لگن با Whirl sign در پدیکل عروقی. محتمل‌ترین تشخیص چیست؟", "options": ["اسپلنومگالی با هماتوم", "طحال سرگردان (Wandering spleen) با تورشن", "تومور طحال", "لنفوم"], "correct": 1, "explanation": "Wandering spleen (طحال سرگردان) به دلیل فقدان یا شل بودن لیگامان‌های نگهدارنده رخ می‌دهد. طحال می‌تواند در شکم یا لگن قرار گیرد. Whirl sign نشان‌دهنده تورشن پدیکل عروقی است که می‌تواند منجر به ایسکمی و انفارکتوس شود.", "whyWrong": {"0": "هماتوم طحال با تورشن و موقعیت غیرطبیعی همراه نیست.", "2": "تومور طحال با توده متحرک همراه نیست.", "3": "لنفوم طحال با Whirl sign و جابجایی همراه نیست."}, "pearl": "Wandering spleen در زنان جوان و بعد از حاملگی شایع‌تر است.", "trap": "تورشن حاد یک اورژانس است و ممکن است نیاز به اسپلنکتومی اورژانسی داشته باشد.", "highYield": "درمان: Splenopexy در بیمار پایدار بدون انفارکتوس. Splenectomy در تورشن با انفارکتوس.", "id": "sur-2-067"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 18, "chapterTitle": "Hernia", "topic": "Obturator Hernia", "subtopic": "Clinical Features", "difficulty": "خیلی دشوار", "bloom": "", "stem": "زن ۷۵ ساله لاغر با درد متناوب ران داخلی که با چرخش داخلی ران تشدید می‌شود (Howship-Romberg sign) و انسداد روده کوچک مراجعه کرده. CT: فتق اوبتوراتور با روده incarcerated. بهترین اقدام چیست؟", "options": ["ریداکشن دستی و مشاهده", "لاپاراتومی/لاپاراسکوپی و ترمیم فوری", "آنتی‌بیوتیک و پیگیری", "کولونوسکوپی"], "correct": 1, "explanation": "فتق اوبتوراتور نادر ولی خطرناک است و معمولاً در زنان مسن لاغر رخ می‌دهد (Obturator canal باریک‌تر در مردان). Howship-Romberg sign (درد ران داخلی با چرخش) پاتوگنومونیک است. با Incarceration و SBO، جراحی اورژانسی لازم است.", "whyWrong": {"0": "ریداکشن دستی غیرممکن است - فتق عمیق و غیرقابل دسترسی است.", "2": "آنتی‌بیوتیک به تنهایی برای فتق Incarcerated کافی نیست.", "3": "کولونوسکوپی اندیکاسیون ندارد."}, "pearl": "فتق اوبتوراتور از کانال اوبتوراتور (زیر عضله پکتینئوس) عبور می‌کند.", "trap": "تشخیص اغلب دیر انجام می‌شود - ریسک Strangulation بالا.", "highYield": "\"Little old lady hernia\" - زنان مسن، لاغر، مولتی‌پار.", "id": "sur-2-068"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 19, "chapterTitle": "Breast", "topic": "Paget's Disease of Nipple", "subtopic": "Pathology", "difficulty": "متوسط", "bloom": "", "stem": "زن ۵۵ ساله با تغییرات اگزمایی نوک پستان (قرمزی، پوسته‌ریزی، خارش) به مدت ۳ ماه که به درمان موضعی پاسخ نداده مراجعه کرده. ماموگرافی نرمال است. بهترین اقدام چیست؟", "options": ["ادامه درمان موضعی با استروئید", "بیوپسی از نوک پستان", "آنتی‌بیوتیک خوراکی", "پیگیری ۶ ماهه"], "correct": 1, "explanation": "تغییرات اگزمایی نوک پستان که به درمان محافظه‌کارانه پاسخ نمی‌دهد مشکوک به Paget's disease نوک پستان است. این یک DCIS یا کانسر مهاجم است که به نوک پستان گسترش یافته. بیوپسی Punch از نوک پستان تشخیصی است.", "whyWrong": {"0": "ادامه درمان موضعی تأخیر تشخیصی ایجاد می‌کند.", "2": "آنتی‌بیوتیک برای Paget's بی‌اثر است.", "3": "پیگیری بدون بیوپسی خطرناک است."}, "pearl": "در ۵۰٪ موارد Paget's، توده زیرین در ماموگرافی دیده نمی‌شود ولی کانسر وجود دارد.", "trap": "اگزمای نوک پستان یک‌طرفه که بهبود نمی‌یابد = Paget تا ثابت شدن خلاف.", "highYield": "Paget cells: سلول‌های بزرگ با سیتوپلاسم روشن و هسته برجسته در اپیدرم.", "id": "sur-2-069"}, {"subject": "surgery", "src": "جراحی عمومی — لارنس (فصول ۱۱ تا ۲۰)", "part": "sur-2", "chapter": 20, "chapterTitle": "Skin and Soft Tissue", "topic": "Skin Cancer", "subtopic": "SCC", "difficulty": "متوسط", "bloom": "", "stem": "مرد ۷۰ ساله با سابقه کار طولانی در آفتاب، با ضایعه زخم‌شده، خشن و ندولار روی لب تحتانی مراجعه کرده. کدام نوع سرطان پوست محتمل‌ترین است و کدام ریسک را دارد که BCC ندارد؟", "options": ["BCC - ریسک عود موضعی", "SCC - ریسک متاستاز", "ملانوم - ریسک ضایعات ستلایت", "کراتوآکانتوما - خودبخود بهبود می‌یابد"], "correct": 1, "explanation": "SCC (Squamous Cell Carcinoma) در نواحی در معرض آفتاب، به‌خصوص لب تحتانی (Vermilion border) شایع است. SCC برخلاف BCC ریسک متاستاز دارد (۲-۵٪ کلی، بیشتر در لب و گوش - تا ۱۰-۱۵٪).", "whyWrong": {"0": "BCC متاستاز بسیار نادر دارد.", "2": "ملانوم تظاهر متفاوتی دارد (پیگمانته).", "3": "کراتوآکانتوما ممکن است خودبخود رفع شود ولی اکثر آنها SCC in situ یا well-diff SCC هستند."}, "pearl": "High-risk SCC: > 2 cm, > 2 mm depth, Perineural invasion, Lip/Ear, Immunosuppressed.", "trap": "SCC در زمینه سوختگی قدیمی (Marjolin ulcer) بسیار تهاجمی است.", "highYield": "SCC لب: ریسک متاستاز بالاتر از SCC پوست - نیاز به بررسی غدد لنفاوی.", "id": "sur-2-070"}];</script>
<script>
/* ==========================================================================
   MediLibrary — موتور آزمون (vanilla, بدون هیچ وابستگی)
   می‌خواند:  <body data-qb-part="sur-1" data-qb-data="sur-1.json">
   می‌سازد:   نوار پیشرفت، کارت سؤال، بازخورد گزینه‌ها، خلاصهٔ نتایج، ذخیرهٔ محلی
   ========================================================================== */
(function () {
  "use strict";

  var FA = "۰۱۲۳۴۵۶۷۸۹";
  function fa(n) {
    return String(n).replace(/\d/g, function (d) { return FA[+d]; });
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  var LETTERS = ["الف", "ب", "ج", "د"];

  var body = document.body;
  var PART = body.getAttribute("data-qb-part") || "";
  var DATA = body.getAttribute("data-qb-data") || PART + ".json";
  var STORE = "ml-qbank-" + PART;

  var root = document.getElementById("qb-app");
  if (!root) return;

  var state = {
    all: [],
    list: [],
    i: 0,
    picked: null,       // null = هنوز پاسخ نداده
    answers: {},        // id -> {picked, correct}
    filter: { ch: "all", diff: "all", mode: "all" },
    mode: "all",
    revealAll: false
  };

  /* ---------- ذخیرهٔ محلی ---------- */
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && d.answers) state.answers = d.answers;
    } catch (e) { /* localStorage خاموش */ }
  }
  function saveStore() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ answers: state.answers, at: Date.now() }));
    } catch (e) { /* پر شد یا خاموش */ }
  }

  /* ---------- آمار ---------- */
  function stats() {
    var ids = Object.keys(state.answers);
    var ok = ids.filter(function (k) { return state.answers[k].correct; }).length;
    return { done: ids.length, ok: ok, wrong: ids.length - ok, pct: ids.length ? Math.round((ok / ids.length) * 100) : 0 };
  }

  function paintProgress() {
    var s = stats();
    var total = state.all.length;
    var bar = document.querySelector("[data-qb-bar]");
    var head = document.querySelector("[data-qb-progress-text]");
    var statsBox = document.querySelector("[data-qb-stats]");
    if (bar) bar.style.width = (total ? Math.round((s.done / total) * 100) : 0) + "%";
    if (head) head.textContent = fa(s.done) + " از " + fa(total);
    if (statsBox) {
      statsBox.innerHTML =
        '<span class="qb-stat"><b>' + fa(s.ok) + '</b> درست</span>' +
        '<span class="qb-stat qb-stat--bad"><b>' + fa(s.wrong) + '</b> غلط</span>' +
        '<span class="qb-stat"><b>' + fa(s.pct) + '٪</b> درصد</span>';
    }
    var pill = document.querySelector("[data-qb-pill]");
    if (pill) pill.textContent = fa(state.list.length) + " سؤال در این نمای";
  }

  /* ---------- فیلتر ---------- */
  function applyFilter() {
    var f = state.filter;
    var list = state.all.filter(function (q) {
      if (f.ch !== "all" && String(q.chapter) !== String(f.ch)) return false;
      if (f.diff !== "all" && q.difficulty !== f.diff) return false;
      if (state.mode === "unseen" && state.answers[q.id + "|" + q.part]) return false;
      if (state.mode === "wrong") {
        var a = state.answers[q.id + "|" + q.part];
        if (!a || a.correct) return false;
      }
      if (state.mode === "marked" && !state.marked[q.id + "|" + q.part]) return false;
      return true;
    });
    state.list = list;
    if (state.i >= list.length) state.i = 0;
    paintProgress();
    render();
  }

  /* ---------- ساخت فهرست انتخاب‌ها ---------- */
  function buildControls() {
    var sel = document.getElementById("qb-chapter");
    if (sel) {
      var chapters = [];
      var seen = {};
      state.all.forEach(function (q) {
        var k = String(q.chapter);
        if (!seen[k]) { seen[k] = 1; chapters.push(q); }
      });
      chapters.sort(function (a, b) { return (a.chapter || 0) - (b.chapter || 0); });
      chapters.forEach(function (q) {
        var o = el("option");
        o.value = q.chapter;
        var n = state.all.filter(function (x) { return String(x.chapter) === String(q.chapter); }).length;
        o.textContent = "فصل " + fa(q.chapter) + " — " + q.chapterTitle + " (" + fa(n) + ")";
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () { state.filter.ch = sel.value; state.i = 0; applyFilter(); });
    }
    var dsel = document.getElementById("qb-diff");
    if (dsel) dsel.addEventListener("change", function () { state.filter.diff = dsel.value; state.i = 0; applyFilter(); });
    var modeSel = document.getElementById("qb-mode");
    if (modeSel) modeSel.addEventListener("change", function () { state.mode = modeSel.value; state.i = 0; applyFilter(); });
    var rev = document.getElementById("qb-reveal");
    if (rev) rev.addEventListener("click", function () {
      state.revealAll = !state.revealAll;
      rev.setAttribute("aria-pressed", state.revealAll ? "true" : "false");
      render();
    });
  }

  /* ---------- تصویر سؤال ---------- */
  /* دادهٔ تصویر در JSON بخش می‌تواند object باشد ({src, alt, credit, source, w, h})
     یا فقط یک رشتهٔ src. src می‌تواند data URI درون‌خطی باشد (آفلاین کار می‌کند). */
  function imageOf(im) {
    if (!im) return null;
    if (typeof im === "string") im = { src: im };
    if (!im || typeof im !== "object") return null;
    if (typeof im.src !== "string" || !im.src) return null;
    return im;
  }

  function figure(im) {
    im = imageOf(im);
    if (!im) return null;
    var fig = el("figure", "qb-figure");
    var img = document.createElement("img");
    img.src = im.src;
    img.alt = im.alt || "تصویر سؤال";
    img.setAttribute("loading", "lazy");
    img.setAttribute("decoding", "async");
    if (im.w > 0) img.width = im.w;
    if (im.h > 0) img.height = im.h;
    img.tabIndex = 0;
    img.setAttribute("role", "button");
    img.title = "برای بزرگ‌نمایی کلیک کن";
    img.addEventListener("click", function () { openZoom(im); });
    img.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openZoom(im); }
    });
    img.addEventListener("error", function () { fig.classList.add("qb-figure--broken"); });
    fig.appendChild(img);

    var cap = [];
    if (im.alt) cap.push(esc(im.alt));
    if (im.credit) cap.push('<span class="qb-figure__credit">' + esc(im.credit) + "</span>");
    if (cap.length) fig.appendChild(el("figcaption", null, cap.join(" — ")));
    if (im.source) {
      var a = el("a", "qb-figure__src", "منبع تصویر ↗");
      a.href = im.source;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      fig.appendChild(a);
    }
    return fig;
  }

  /* بزرگ‌نمایی: لایهٔ تمام‌صفحه که با کلیک یا Esc بسته می‌شود */
  var zoomLayer = null;
  function closeZoom() {
    if (!zoomLayer) return;
    zoomLayer.remove();
    zoomLayer = null;
    document.documentElement.classList.remove("qb-zoom-open");
  }
  function openZoom(im) {
    closeZoom();
    zoomLayer = el("div", "qb-zoom");
    zoomLayer.setAttribute("role", "dialog");
    zoomLayer.setAttribute("aria-modal", "true");
    zoomLayer.setAttribute("aria-label", im.alt || "تصویر سؤال");
    var big = document.createElement("img");
    big.src = im.src;
    big.alt = im.alt || "";
    zoomLayer.appendChild(big);
    if (im.credit) zoomLayer.appendChild(el("span", "qb-zoom__credit", esc(im.credit)));
    zoomLayer.appendChild(el("span", "qb-zoom__hint", "برای بستن کلیک کن یا Esc بزن"));
    zoomLayer.addEventListener("click", closeZoom);
    document.body.appendChild(zoomLayer);
    document.documentElement.classList.add("qb-zoom-open");
  }

  /* ---------- یک سؤال ---------- */
  function render() {
    root.innerHTML = "";
    if (!state.list.length) {
      root.appendChild(el("p", "qb-empty", "سؤالی با این فیلتر پیدا نشد. فیلترها را بازتر کن."));
      return;
    }
    var q = state.list[state.i];
    var key = q.id + "|" + q.part;
    var saved = state.answers[key];
    var revealed = state.revealAll || (saved && saved.picked != null);
    var picked = saved ? saved.picked : null;

    /* سربرگ */
    var head = el("div", "qb-head");
    head.appendChild(el("div", "qb-head__meta",
      '<span class="qb-badge">سؤال ' + fa(state.i + 1) + " از " + fa(state.list.length) + "</span>" +
      '<span class="qb-chip">فصل ' + fa(q.chapter) + "</span>" +
      '<span class="qb-chip qb-chip--alt">' + esc(q.difficulty) + "</span>" +
      (q.bloom ? '<span class="qb-chip qb-chip--alt">' + esc(q.bloom) + "</span>" : "")
    ));
    root.appendChild(head);

    root.appendChild(el("div", "qb-chapter-name", esc(q.chapterTitle)));

    /* صورت سؤال */
    var card = el("div", "qb-stem");
    card.appendChild(el("p", null, esc(q.stem)));
    root.appendChild(card);

    /* تصویر سؤال (بانک‌های تصویردار، مثل ارتوپدی) */
    var fig = figure(q.image);
    if (fig) root.appendChild(fig);

    /* گزینه‌ها */
    var wrap = el("div", "qb-options");
    q.options.forEach(function (opt, idx) {
      var isCorrect = idx === q.correct;
      var cls = "qb-opt";
      if (revealed) {
        if (isCorrect) cls += " is-correct";
        else if (idx === picked) cls += " is-wrong";
      }
      var b = el("button", cls);
      b.type = "button";
      b.setAttribute("data-idx", idx);
      if (revealed) b.disabled = true;
      b.innerHTML = '<span class="qb-opt__letter">' + LETTERS[idx] + "</span>" +
        '<span class="qb-opt__text">' + esc(opt) + "</span>";
      if (!revealed) {
        b.addEventListener("click", function () {
          state.answers[key] = { picked: idx, correct: idx === q.correct, at: Date.now() };
          saveStore();
          paintProgress();
          render();
        });
      }
      wrap.appendChild(b);
    });
    root.appendChild(wrap);

    /* بازخورد */
    if (revealed) {
      var fb = el("div", "qb-feedback");
      var judgement = picked == null
        ? '<div class="qb-verdict qb-verdict--skip">پاسخ درست: <b>' + LETTERS[q.correct] + "</b></div>"
        : (picked === q.correct
          ? '<div class="qb-verdict qb-verdict--ok">✔ پاسخ درست — گزینهٔ <b>' + LETTERS[q.correct] + '</b></div>'
          : '<div class="qb-verdict qb-verdict--bad">✘ پاسخ نادرست — گزینهٔ درست: <b>' + LETTERS[q.correct] + "</b></div>");
      fb.innerHTML = judgement;

      if (q.explanation) {
        fb.appendChild(el("div", "qb-block qb-block--why",
          '<h4>چرا؟</h4><p>' + esc(q.explanation) + "</p>"));
      }
      var wrongKeys = Object.keys(q.whyWrong || {});
      if (wrongKeys.length) {
        var items = wrongKeys.map(function (k) {
          return "<li><b>" + (LETTERS[+k] || k) + ":</b> " + esc(q.whyWrong[k]) + "</li>";
        }).join("");
        fb.appendChild(el("div", "qb-block qb-block--wrong", "<h4>چرا بقیه غلط‌اند</h4><ul>" + items + "</ul>"));
      }
      if (q.pearl) fb.appendChild(el("div", "qb-block qb-block--pearl", "<h4>نکتهٔ کلیدی</h4><p>" + esc(q.pearl) + "</p>"));
      if (q.trap) fb.appendChild(el("div", "qb-block qb-block--trap", "<h4>تلهٔ آزمون</h4><p>" + esc(q.trap) + "</p>"));
      if (q.highYield) fb.appendChild(el("div", "qb-block qb-block--hy", "<h4>پربازده</h4><p>" + esc(q.highYield) + "</p>"));
      root.appendChild(fb);
    }

    /* ناوبری */
    var nav = el("div", "qb-nav");
    var prev = el("button", "qb-btn qb-btn--ghost", "◀ قبلی");
    prev.type = "button";
    prev.disabled = state.i === 0;
    prev.addEventListener("click", function () { if (state.i > 0) { state.i--; render(); } });
    var next = el("button", "qb-btn qb-btn--primary", "بعدی ▶");
    next.type = "button";
    next.disabled = state.i >= state.list.length - 1;
    next.addEventListener("click", function () { if (state.i < state.list.length - 1) { state.i++; render(); } });
    var reset = el("button", "qb-btn qb-btn--ghost qb-btn--sm", "پاک‌کردن پاسخ این سؤال");
    reset.type = "button";
    reset.addEventListener("click", function () {
      delete state.answers[key]; saveStore(); paintProgress(); render();
    });
    nav.appendChild(prev); nav.appendChild(next); nav.appendChild(reset);
    root.appendChild(nav);

    /* خلاصهٔ نتایج */
    if (state.i === state.list.length - 1) root.appendChild(summary());
  }

  function summary() {
    var s = stats();
    var box = el("div", "qb-summary");
    box.innerHTML =
      "<h3>خلاصهٔ نتایج</h3>" +
      '<div class="qb-summary__grid">' +
      '<div class="qb-summary__cell"><b>' + fa(s.done) + "</b><span>پاسخ‌داده</span></div>" +
      '<div class="qb-summary__cell qb-summary__cell--ok"><b>' + fa(s.ok) + "</b><span>درست</span></div>" +
      '<div class="qb-summary__cell qb-summary__cell--bad"><b>' + fa(s.wrong) + "</b><span>غلط</span></div>" +
      '<div class="qb-summary__cell"><b>' + fa(s.pct) + "٪</b><span>درصد</span></div>" +
      "</div>";
    return box;
  }

  /* ---------- راه‌اندازی ---------- */
  loadStore();
  state.marked = {};
  Promise.resolve({ ok: true, json: function () { return window.__QB__; } })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      state.all = data;
      buildControls();
      applyFilter();
    })
    .catch(function (err) {
      root.innerHTML = '<div class="qb-error">دادهٔ این بخش بارگذاری نشد (' + esc(err.message) +
        "). اگر فایل را روی کامپیوتر باز کرده‌ای، یک سرور محلی لازم است — یا از نسخهٔ تک‌فایلی استفاده کن.</div>";
    });

  /* کلیدهای میان‌بر */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeZoom(); return; }
    if (zoomLayer) return;                 // وقتی لایهٔ بزرگ‌نمایی باز است، ناوبری قفل است
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft" && state.i < state.list.length - 1) { state.i++; render(); }
    if (e.key === "ArrowRight" && state.i > 0) { state.i--; render(); }
    if (/^[1-4]$/.test(e.key)) {
      var b = root.querySelector('.qb-opt[data-idx="' + (+e.key - 1) + '"]');
      if (b && !b.disabled) b.click();
    }
  });
})();

</script>
<footer class="qb-solo-foot">نویسنده: <strong>مهدی محمدرحیمی</strong></footer>

</body>
