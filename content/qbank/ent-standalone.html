/* ---------- 1. توکن‌های پایه ---------- */
:root {
  color-scheme: light;

  /* رنگ درس — با JS یا درون‌خطی per-subject بازنویسی می‌شود */
  --h: 224;
  --c: 72;

  /* مقیاس رنگ سازنده از HSL */
  --brand-50:  hsl(var(--h) var(--c) 97%);
  --brand-100: hsl(var(--h) var(--c) 94%);
  --brand-200: hsl(var(--h) var(--c) 88%);
  --brand-300: hsl(var(--h) var(--c) 78%);
  --brand-400: hsl(var(--h) var(--c) 66%);
  --brand-500: hsl(var(--h) var(--c) 55%);
  --brand-600: hsl(var(--h) var(--c) 46%);
  --brand-700: hsl(var(--h) var(--c) 38%);
  --brand-800: hsl(var(--h) var(--c) 30%);
  --brand-900: hsl(var(--h) var(--c) 22%);
  --brand: var(--brand-600);
  --brand-ink: hsl(var(--h) calc(var(--c) * 0.9) 26%);

  /* معنایی — ثابت در همهٔ درس‌ها، فقط کمی هم‌رنگ درس می‌شوند */
  --ok: hsl(158 62% 38%);
  --ok-bg: hsl(158 62% 96%);
  --warn: hsl(32 88% 42%);
  --warn-bg: hsl(38 92% 95%);
  --danger: hsl(354 68% 48%);
  --danger-bg: hsl(354 78% 96%);
  --info: hsl(211 78% 46%);
  --info-bg: hsl(211 80% 96%);
  --gold: hsl(41 88% 40%);
  --gold-bg: hsl(43 95% 95%);

  /* سطح‌ها و متن */
  --bg: #f5f6f9;
  --bg-soft: #ffffff;
  --surface: #ffffff;
  --surface-2: #fafbfd;
  --surface-3: #f1f3f8;
  --line: #e4e8f0;
  --line-soft: #eef1f6;
  --ink: #131a2a;
  --ink-2: #3c4660;
  --ink-3: #6b7590;
  --ink-4: #97a0b5;
  --on-brand: #ffffff;

  /* شکل و سایه */
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-full: 999px;
  --sh-1: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
  --sh-2: 0 4px 12px rgba(16, 24, 40, .07), 0 2px 4px rgba(16, 24, 40, .04);
  --sh-3: 0 12px 32px rgba(16, 24, 40, .10), 0 4px 8px rgba(16, 24, 40, .04);
  --sh-brand: 0 10px 28px hsl(var(--h) var(--c) 45% / .22);

  /* تایپوگرافی */
  --font: "Vazirmatn", "IRANSans", "Segoe UI", system-ui, -apple-system, Tahoma, sans-serif;
  --font-num: "Vazirmatn", ui-sans-serif, system-ui;
  --fs-xs: .78rem;
  --fs-sm: .875rem;
  --fs-base: 1rem;
  --fs-md: 1.06rem;
  --fs-lg: 1.2rem;
  --fs-xl: 1.45rem;
  --fs-2xl: 1.85rem;
  --fs-3xl: 2.4rem;
  --lh: 2.05;
  --maxw: 1180px;

  /* اندازه‌های layout */
  --header-h: 60px;
  --gutter: clamp(14px, 3.2vw, 34px);
  --focus: 0 0 0 3px hsl(var(--h) var(--c) 55% / .35);
}

@media (prefers-reduced-motion: no-preference) {
  :root { scroll-behavior: smooth; }
}

/* ---------- 2. ریست ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: var(--lh);
  color: var(--ink);
  background: var(--bg);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
img, svg, video { max-width: 100%; height: auto; display: block; }
a { color: var(--brand-600); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-xs); }
::selection { background: var(--brand-200); color: var(--brand-900); }
hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
sub, sup { font-size: .72em; line-height: 0; }

/* اسکرول‌بار نازک */
* { scrollbar-width: thin; scrollbar-color: var(--brand-300) transparent; }
*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-thumb { background: var(--brand-200); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--brand-300); background-clip: content-box; }

/* ---------- 3. کمکی‌های عمومی ---------- */
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
.ltr, .en, [dir="ltr"] { direction: ltr; unicode-bidi: isolate; text-align: left; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--ink-3); }
.strong { font-weight: 700; }
.num, .hn, .hyd-num, .highyield-num, .hy-num, .num-gold, .stat-number, .stat-num {
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.hide { display: none !important; }

/* ---------- 4. هدر جادویی ---------- */
.site-header {
  position: sticky; top: 0; z-index: 60;
  background: hsl(0 0% 100% / .82);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.site-header__bar {
  min-height: var(--header-h);
  display: flex !important; align-items: center; gap: 12px;
  padding-block: 8px;
}
.crumbs {
  display: flex; align-items: center; gap: 8px;
  min-width: 0; flex: 1;
  font-size: var(--fs-sm); color: var(--ink-3);
}
.crumbs a { color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.crumbs a:hover { color: var(--brand-600); text-decoration: none; }
.crumbs .sep { color: var(--ink-4); flex: none; }
.crumbs .crumb-now {
  color: var(--ink); font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}
.subj-chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 5px 12px; border-radius: var(--r-full);
  background: var(--brand-50); color: var(--brand-700);
  border: 1px solid var(--brand-200);
  font-size: var(--fs-xs); font-weight: 700;
}
/* نوار پیشرفت مطالعه */
.read-progress {
  position: absolute; inset-inline: 0; bottom: -1px; height: 3px;
  background: transparent; overflow: hidden;
}
.read-progress > i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
  border-radius: 0 3px 3px 0;
  transition: width .12s linear;
}

/* دکمه‌های آیکونی هدر */
.icon-btn {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s, transform .15s;
}
.icon-btn:hover { background: var(--brand-50); color: var(--brand-700); border-color: var(--brand-200); }
.icon-btn:active { transform: scale(.96); }
.icon-btn[aria-expanded="true"] { background: var(--brand-600); color: #fff; border-color: transparent; }

/* ---------- 5. هیرو ---------- */
.hero {
  position: relative; overflow: hidden;
  padding-top: clamp(30px, 5vw, 52px) !important;
  background:
    radial-gradient(1200px 380px at 92% -10%, hsl(var(--h) var(--c) 92%) 0%, transparent 62%),
    radial-gradient(900px 320px at 4% 0%, hsl(calc(var(--h) + 34) calc(var(--c) * .7) 94%) 0%, transparent 55%),
    linear-gradient(180deg, var(--brand-50), var(--bg) 92%);
  border-bottom: 1px solid var(--line);
  padding-block: clamp(22px, 4vw, 44px);
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(hsl(var(--h) var(--c) 45% / .07) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: linear-gradient(180deg, #000 0%, transparent 78%);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 78%);
}
.hero > .wrap { position: relative; z-index: 1; }
.hero__top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px; border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: 700;
  background: var(--surface); color: var(--brand-700);
  border: 1px solid var(--brand-200); box-shadow: var(--sh-1);
}
.pill--ghost { background: hsl(0 0% 100% / .6); border-color: var(--line); color: var(--ink-3); font-weight: 600; }
.pill--icon { font-size: .95rem; padding: 4px 10px; }
.hero h1 {
  margin: 0 0 8px;
  font-size: clamp(1.5rem, 4.4vw, var(--fs-3xl));
  font-weight: 800; line-height: 1.42;
  letter-spacing: -.01em;
  color: var(--brand-ink);
  text-wrap: balance;
}
.hero__lede {
  margin: 0; max-width: 72ch;
  color: var(--ink-2); font-size: var(--fs-md);
}
.hero__meta {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px;
}
.meta-item {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px; border-radius: var(--r-sm);
  background: hsl(0 0% 100% / .75); border: 1px solid var(--line);
  font-size: var(--fs-sm); color: var(--ink-2); font-weight: 600;
  box-shadow: var(--sh-1);
}
.meta-item b { color: var(--brand-700); font-weight: 800; }

/* تصویر/کاور درس در هیرو */
.hero__layout { display: grid; gap: clamp(16px, 3vw, 28px); }
@media (min-width: 880px) {
  .hero__layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
}
.hero__cover { display: none; }
@media (min-width: 880px) {
  .hero__cover {
    display: block; border-radius: var(--r-lg); overflow: hidden;
    border: 1px solid var(--brand-200); box-shadow: var(--sh-3);
  }
  .hero__cover img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
}

/* ---------- 6. ناوبری چسبان بخش‌ها (TOC) ---------- */
.subnav {
  position: sticky; top: var(--header-h); z-index: 50;
  background: hsl(0 0% 100% / .9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.subnav__scroll {
  display: flex; gap: 6px; align-items: center;
  overflow-x: auto; scrollbar-width: none;
  padding-block: 9px;
}
.subnav__scroll::-webkit-scrollbar { display: none; }
.subnav a {
  flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: var(--r-full);
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2);
  border: 1px solid transparent; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.subnav a:hover { background: var(--brand-50); color: var(--brand-700); text-decoration: none; }
.subnav a.is-active {
  background: var(--brand-600); color: #fff; border-color: var(--brand-600);
  box-shadow: var(--sh-brand);
}
.subnav .n { font-size: .72rem; opacity: .65; font-variant-numeric: tabular-nums; }

/* ---------- 7. بدنهٔ درس + سایدبار ---------- */
.layout {
  display: grid; gap: clamp(18px, 2.4vw, 30px);
  padding-block: clamp(20px, 3.4vw, 40px) 72px;
  align-items: start;
}
@media (min-width: 1060px) {
  .layout { grid-template-columns: minmax(0, 1fr) 274px; }
}
.main-col { min-width: 0; }

.rail { display: none; }
@media (min-width: 1060px) {
  .rail {
    display: block; position: sticky; top: calc(var(--header-h) + 58px);
    display: grid; gap: 14px;
    max-height: calc(100vh - var(--header-h) - 78px);
    overflow-y: auto; padding-bottom: 8px;
  }
}
.rail-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 14px; box-shadow: var(--sh-1);
}
.rail-card h3 {
  margin: 0 0 10px; font-size: var(--fs-xs); font-weight: 800;
  color: var(--ink-3); letter-spacing: .02em;
}
.rail-nav { display: grid; gap: 2px; }
.rail-nav a {
  display: flex; gap: 8px; align-items: baseline;
  padding: 6px 9px; border-radius: var(--r-xs);
  font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.7;
  border-inline-start: 2px solid transparent;
}
.rail-nav a:hover { background: var(--surface-3); color: var(--brand-700); text-decoration: none; }
.rail-nav a.is-active {
  background: var(--brand-50); color: var(--brand-700);
  border-inline-start-color: var(--brand-500); font-weight: 700;
}
.rail-nav .n { color: var(--ink-4); font-size: .74rem; font-variant-numeric: tabular-nums; }
.rail-ring { display: grid; place-items: center; gap: 8px; }
.ring { width: 96px; height: 96px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.ring .trk { stroke: var(--surface-3); }
.ring .val { stroke: var(--brand-500); transition: stroke-dashoffset .2s linear; }
.rail-ring small { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 700; }

/* ---------- 8. کارت و بخش ---------- */
.section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  margin-bottom: clamp(16px, 2.4vw, 26px);
  scroll-margin-top: calc(var(--header-h) + 64px);
  overflow: clip;
}
.section__head {
  display: flex; gap: 13px; align-items: flex-start;
  padding: clamp(14px, 2.2vw, 20px) clamp(14px, 2.4vw, 24px);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border-bottom: 1px solid var(--line-soft);
}
.section__ico {
  flex: none; width: 42px; height: 42px; display: grid; place-items: center;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--brand-50); color: var(--brand-600);
  border: 1px solid var(--brand-200);
  font-size: 1.15rem; line-height: 1;
}
.section__no {
  flex: none; display: grid; place-items: center;
  width: 42px; height: 42px; border-radius: var(--r-sm);
  background: var(--brand-600); color: #fff;
  font-weight: 800; font-size: 1rem;
  box-shadow: var(--sh-brand);
  font-variant-numeric: tabular-nums;
}
.section__titles { min-width: 0; flex: 1; }
.section__title {
  margin: 0; font-size: var(--fs-lg); font-weight: 800; line-height: 1.55;
  color: var(--ink); text-wrap: balance;
}
.section__sub { margin: 3px 0 0; font-size: var(--fs-sm); color: var(--ink-3); }
.section__body { padding: clamp(15px, 2.4vw, 26px) clamp(14px, 2.4vw, 24px); }
.section__body > *:first-child { margin-top: 0; }
.section__body > *:last-child { margin-bottom: 0; }

/* ریتم متن */
.section__body h3 {
  margin: 1.9em 0 .6em; font-size: var(--fs-md); font-weight: 800;
  color: var(--brand-ink);
  padding-inline-start: 11px;
  border-inline-start: 4px solid var(--brand-400);
  line-height: 1.6;
}
.section__body h3:first-child, .section__body h4:first-child { margin-top: 0; }
.section__body h4 {
  margin: 1.5em 0 .5em; font-size: var(--fs-base); font-weight: 800; color: var(--ink);
}
.section__body p { margin: 0 0 1.05em; }
.section__body ul, .section__body ol { margin: 0 0 1.15em; padding-inline-start: 1.35em; }
.section__body li { margin-bottom: .45em; }
.section__body li::marker { color: var(--brand-400); font-weight: 700; }
.section__body strong, .section__body b { font-weight: 800; color: var(--ink); }
.section__body em { font-style: normal; color: var(--brand-700); font-weight: 600; }
.section__body blockquote {
  margin: 1.2em 0; padding: 12px 16px;
  border-inline-start: 4px solid var(--brand-300);
  background: var(--brand-50); border-radius: 0 var(--r-sm) var(--r-sm) 0;
  color: var(--ink-2);
}

/* هایلایت‌های درون‌متنی */
.hl, .highlight, mark, .hl-box {
  background: linear-gradient(180deg, transparent 52%, hsl(var(--h) var(--c) 84%) 52%);
  color: inherit; padding: 0 2px; border-radius: 2px;
}
.hl-red, .hl--red { background: linear-gradient(180deg, transparent 52%, hsl(354 80% 88%) 52%); }
.hl-green, .hl--green { background: linear-gradient(180deg, transparent 52%, hsl(158 60% 85%) 52%); }
.hl-gold, .hl--gold { background: linear-gradient(180deg, transparent 52%, hsl(43 92% 82%) 52%); }
.keyword, .key { color: var(--brand-700); font-weight: 800; }

/* ---------- 9. جعبه‌های هشدار/نکته ---------- */
.callout {
  --_c: var(--brand-500);
  --_bg: var(--brand-50);
  --_bd: var(--brand-200);
  margin: 1.15em 0;
  padding: 14px 16px;
  border-radius: var(--r-md);
  background: var(--_bg);
  border: 1px solid var(--_bd);
  border-inline-start: 4px solid var(--_c);
  color: var(--ink);
}
.callout > :first-child { margin-top: 0; }
.callout > :last-child { margin-bottom: 0; }
.callout__title, .box-title, .vm-box-title, .callout-title {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; font-size: var(--fs-sm);
  color: var(--_c); margin-bottom: 6px;
}
.callout--ok, .box-success, .gold-standard, .box-gold, .gold-box, .success {
  --_c: var(--gold); --_bg: var(--gold-bg); --_bd: hsl(43 90% 84%);
}
.callout--danger, .box-redflag, .redflag-box, .trap-box, .exam-trap-box, .box-trap, .danger, .critical {
  --_c: var(--danger); --_bg: var(--danger-bg); --_bd: hsl(354 78% 90%);
}
.callout--warn, .box-warning, .warning, .important {
  --_c: var(--warn); --_bg: var(--warn-bg); --_bd: hsl(38 90% 84%);
}
.callout--info, .box-important, .box-clinical, .alert-box, .alert, .info-card, .review-box, .edu-box, .exam-tip {
  --_c: var(--info); --_bg: var(--info-bg); --_bd: hsl(211 78% 88%);
}
.callout--yield, .box-yield, .high-yield, .highyield {
  --_c: var(--brand-600); --_bg: var(--brand-50); --_bd: var(--brand-200);
}

/* جعبهٔ کارتی (callout با ظاهر کارت) */
.callout--card {
  background: var(--_bg);
  box-shadow: var(--sh-1);
}
.callout--card.callout--danger { background: linear-gradient(180deg, var(--danger-bg), #fff 140%); }
.callout--card.callout--ok { background: linear-gradient(180deg, var(--gold-bg), #fff 140%); }
.callout--card.callout--yield { background: linear-gradient(180deg, var(--brand-50), #fff 140%); }
.callout--card.callout--info { background: linear-gradient(180deg, var(--info-bg), #fff 140%); }
.callout--card h3, .callout--card h4 {
  margin: 0 0 .5em; padding: 0; border: 0;
  font-size: var(--fs-base); color: var(--_c);
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
}
.section__body [class^="tag-"], .section__body [class*=" tag-"] {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .7rem; font-weight: 800; padding: 1px 8px; border-radius: var(--r-full);
  background: var(--surface-3); color: var(--ink-3); border: 1px solid var(--line);
  vertical-align: middle;
}
.deco-emoji { font-size: 1.05rem; }
.tag-hy, .tag--danger, .tag--gold, .tag--ok {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .68rem; font-weight: 800; padding: 2px 8px; border-radius: var(--r-full);
  background: hsl(0 0% 100% / .75); border: 1px solid currentColor;
  color: inherit; opacity: .85;
}

/* ---------- 10. گرید و کارت‌های محتوایی ---------- */
.grid, .grid-2, .grid-3, .grid-4, .grid-8, .dashboard-grid, .objectives-grid {
  display: grid; gap: 12px; margin: 1.15em 0;
  align-items: start;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
}
/* شبکهٔ اعداد/آمار: ستون‌های باریک‌تر */
.grid-stats, .grid-8:has(> .stat-card), .grid-8 {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 158px), 1fr));
}
@media (min-width: 1580px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.grid > *, .grid-2 > *, .grid-3 > *, .grid-4 > *, .grid-8 > * { min-width: 0; }

/* کارت‌های آمار / اعداد حیاتی */
.stat-card, .number-card, .num-card, .hy-num, .highyield-num, .hn, .dashboard-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 13px 14px;
  box-shadow: var(--sh-1);
  transition: transform .16s, box-shadow .16s, border-color .16s;
  overflow: hidden;
}
.stat-card::before, .number-card::before, .dashboard-card::before {
  content: ""; position: absolute; inset-block-start: 0; inset-inline: 0; height: 3px;
  background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
}
.stat-card:hover, .number-card:hover {
  transform: translateY(-2px); box-shadow: var(--sh-2); border-color: var(--brand-200);
}
.stat-number, .stat-num, .num-gold {
  display: block;
  font-size: clamp(1.25rem, 2.6vw, 1.6rem);
  font-weight: 900; line-height: 1.4;
  color: var(--brand-700);
}
.stat-label, .stat-desc {
  display: block; font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; line-height: 1.75;
}
.dashboard-card-title { font-weight: 800; font-size: var(--fs-sm); color: var(--brand-700); margin-bottom: 4px; }

/* کارت‌های عمومی درون متن */
.mini-card, .info-card, .section-card, .v-card, .card-gold, .v-box, .timeline-card, .rapid-card,
:where(div, section, article).card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 13px 15px;
  box-shadow: var(--sh-1);
}
.card-title, .mini-card-title, .vm-title, .card-header, .v-box-title,
.info-card-header, .box-header, .vm-header {
  font-weight: 800; font-size: var(--fs-sm); color: var(--brand-700);
  margin-bottom: 5px;
}
.card-title.align-start, .mini-card-title.align-start, .vm-title.align-start { margin-bottom: 7px; }
.card-body, .mini-card-body, .card-content { font-size: var(--fs-sm); color: var(--ink-2); }
.mini-card-badge {
  font-size: .7rem; font-weight: 800; padding: 2px 8px; border-radius: var(--r-full);
  background: var(--brand-100); color: var(--brand-700);
}
.card-icon, .icon, .section-icon {
  display: inline-grid; place-items: center;
  width: 30px; height: 30px; border-radius: var(--r-xs);
  background: var(--brand-50); color: var(--brand-600);
  font-size: .95rem; flex: none;
}

/* کارت متنی هم‌تراز (عنوان + متن) */
.align-start { display: flex; align-items: flex-start; gap: 9px; }
.align-start > .txt { flex: 1; min-width: 0; }
.align-start > .ic {
  flex: none; display: grid; place-items: center;
  width: 30px; height: 30px; border-radius: var(--r-xs);
  background: var(--brand-50); border: 1px solid var(--brand-100);
  font-size: .95rem;
}
.deco-emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; line-height: 1; }

/* ---------- 11. جدول ---------- */
.table-wrap, .table-container, .table-responsive {
  margin: 1.15em 0; overflow-x: auto;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); box-shadow: var(--sh-1);
  -webkit-overflow-scrolling: touch;
}
.table-wrap table, .table-container table, .table-responsive table,
.section__body > table {
  width: 100%; border-collapse: collapse; font-size: var(--fs-sm);
  min-width: 100%;
}
@media (max-width: 620px) {
  .table-wrap table, .table-container table, .table-responsive table { min-width: 460px; }
}
.section__body > table { min-width: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.section__body th, .table-wrap th, .table-container th {
  background: var(--brand-50);
  color: var(--brand-800);
  font-weight: 800; font-size: var(--fs-xs);
  text-align: right; padding: 10px 12px;
  border-bottom: 1px solid var(--brand-200);
  position: sticky; top: 0; z-index: 1;
  white-space: nowrap;
}
.section__body td, .table-wrap td, .table-container td {
  padding: 9px 12px; border-bottom: 1px solid var(--line-soft);
  vertical-align: top; line-height: 1.85;
  overflow-wrap: break-word; word-break: normal;
}
.section__body th, .table-wrap th, .table-container th { overflow-wrap: break-word; }
.section__body tbody tr:last-child td { border-bottom: 0; }
.section__body tbody tr:nth-child(even), .table-wrap tbody tr:nth-child(even) { background: var(--surface-2); }
.section__body tbody tr:hover, .table-wrap tbody tr:hover { background: var(--brand-50); }
td .num, td .hn { color: var(--brand-700); font-weight: 800; }

/* ---------- 12. فلش‌کارت / آکاردئون ---------- */
details {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin: 0 0 9px;
  box-shadow: var(--sh-1);
  overflow: hidden;
  transition: border-color .16s, box-shadow .16s;
}
details[open] { border-color: var(--brand-200); box-shadow: var(--sh-2); }
details > summary {
  cursor: pointer; list-style: none;
  padding: 12px 15px;
  font-weight: 700; font-size: var(--fs-sm);
  color: var(--ink); background: var(--surface-2);
  display: flex; align-items: center; gap: 10px;
  transition: background .15s, color .15s;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before {
  content: ""; flex: none;
  width: 8px; height: 8px;
  border-inline-start: 2px solid var(--brand-500);
  border-bottom: 2px solid var(--brand-500);
  transform: rotate(-45deg); transition: transform .18s;
  margin-inline-start: 2px;
}
details[open] > summary::before { transform: rotate(45deg); }
details > summary:hover { background: var(--brand-50); color: var(--brand-800); }
details[open] > summary { border-bottom: 1px solid var(--line-soft); color: var(--brand-800); }
.details-content, .flashcard-content, .flashcard-answer, .flash-answer, .accordion-content, .explanation-content, .mcq-explanation-content {
  padding: 13px 15px; font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.95;
}
.details-content > *:last-child, .flashcard-content > *:last-child { margin-bottom: 0; }
/* فلش‌کارت‌ها با رنگ درس */
.flashcard { border-color: var(--brand-200); }
.flashcard > summary { background: var(--brand-50); color: var(--brand-800); }
.flashcard-answer { background: linear-gradient(180deg, var(--surface), var(--surface-2)); }

/* ---------- 13. مکعب سؤال (MCQ) ---------- */
.mcq-container { display: grid; gap: 14px; margin: 1.2em 0; }
.mcq-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-1);
}
.mcq-header {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 15px; background: var(--surface-2);
  border-bottom: 1px solid var(--line-soft);
}
.mcq-number, .mcq-badge {
  flex: none; display: inline-grid; place-items: center;
  min-width: 26px; height: 26px; padding: 0 8px;
  border-radius: var(--r-full);
  background: var(--brand-600); color: #fff;
  font-size: .76rem; font-weight: 800; font-variant-numeric: tabular-nums;
}
.mcq-title { font-weight: 800; font-size: var(--fs-sm); color: var(--brand-800); }
.mcq-vignette, .mcq-question, .mcq-text {
  padding: 13px 15px 4px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink);
}
.mcq-options { display: grid; gap: 7px; padding: 10px 15px 13px; }
.mcq-option, .mcq-option-item, .mcq-opt, .option-item {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 9px 12px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface);
  font-size: var(--fs-sm); line-height: 1.85;
  transition: background .14s, border-color .14s;
}
.mcq-option:hover, .option-item:hover { background: var(--brand-50); border-color: var(--brand-200); }
.mcq-option-letter, .option-circle {
  flex: none; display: inline-grid; place-items: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-3); color: var(--ink-2);
  font-size: .72rem; font-weight: 800; margin-top: 2px;
}
.correct-answer-banner, .answer, .correct {
  display: flex; gap: 9px; align-items: center;
  margin: 0 15px 12px; padding: 9px 13px;
  border-radius: var(--r-sm);
  background: var(--ok-bg); border: 1px solid hsl(158 55% 82%);
  color: hsl(158 65% 26%); font-weight: 800; font-size: var(--fs-sm);
}
.mcq-explanation, .mcq-solution, .explanation-section {
  margin: 0 15px 14px; padding: 12px 14px;
  border-radius: var(--r-sm);
  background: var(--info-bg); border: 1px solid hsl(211 70% 88%);
  font-size: var(--fs-sm); color: var(--ink-2);
}
.mcq-explanation-details, .mcq-explanation-trigger { margin: 0 15px 14px; }
.mcq-explanation-details > summary { border-radius: var(--r-sm); background: var(--info-bg); color: var(--info); }

/* ---------- 14. الگوریتم/فلوچارت ---------- */
.algo-box, .flow, .flowchart { display: grid; gap: 8px; margin: 1.15em 0; }
.algo-node, .flow-node, .flow-step, .step {
  position: relative;
  padding: 10px 14px; border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line);
  border-inline-start: 3px solid var(--brand-400);
  font-size: var(--fs-sm); box-shadow: var(--sh-1);
}
.algo-node.decision, .flow-node.decision, .decision {
  background: var(--gold-bg); border-color: hsl(43 90% 84%); border-inline-start-color: var(--gold);
  font-weight: 700;
}
.algo-node.action, .action { background: var(--info-bg); border-color: hsl(211 78% 88%); border-inline-start-color: var(--info); }
.algo-node.danger-node, .danger-node { background: var(--danger-bg); border-color: hsl(354 78% 90%); border-inline-start-color: var(--danger); }
.algo-node.success-node, .success-node { background: var(--ok-bg); border-color: hsl(158 55% 84%); border-inline-start-color: var(--ok); }
.algo-arrow, .flow-arrow {
  display: grid; place-items: center;
  color: var(--brand-400); font-size: 1rem; line-height: 1;
}
.algo-branch-path, .algo-branches { display: grid; gap: 8px; }
.branch-label, .label, .tag, .badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: var(--r-full);
  font-size: .74rem; font-weight: 800;
  background: var(--brand-50); color: var(--brand-700);
  border: 1px solid var(--brand-200);
}
.tag-gold, .badge-warning { background: var(--gold-bg); color: var(--gold); border-color: hsl(43 90% 84%); }
.tag-red, .badge-danger { background: var(--danger-bg); color: var(--danger); border-color: hsl(354 78% 90%); }
.badge-success { background: var(--ok-bg); color: var(--ok); border-color: hsl(158 55% 84%); }
.badge-purple { background: var(--brand-100); color: var(--brand-700); border-color: var(--brand-200); }

/* ---------- 15. تایم‌لاین / لیست‌های ویژه ---------- */
.timeline { display: grid; gap: 0; margin: 1.15em 0; position: relative; }
.timeline-item {
  position: relative; padding: 0 22px 16px 0;
  border-inline-start: 2px solid var(--brand-200);
  margin-inline-start: 6px;
}
.timeline-item::before {
  content: ""; position: absolute; inset-inline-start: -6px; top: 8px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--brand-500);
}
.timeline-time { font-size: var(--fs-xs); font-weight: 800; color: var(--brand-600); }
.timeline-title { font-weight: 800; font-size: var(--fs-sm); }
.timeline-content { font-size: var(--fs-sm); color: var(--ink-2); }
.custom-bullets, .custom-list, .styled-list { list-style: none; padding-inline-start: 0; }
.custom-bullets > li, .custom-list > li, .styled-list > li {
  position: relative; padding-inline-start: 1.5em;
}
.custom-bullets > li::before, .custom-list > li::before, .styled-list > li::before {
  content: ""; position: absolute; inset-inline-start: .35em; top: .78em;
  width: 7px; height: 7px; border-radius: 2px;
  background: var(--brand-400); transform: rotate(45deg);
}

/* نوار پیشرفت/برجستگی */
.bar, .progress-bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > i, .progress-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-400), var(--brand-600)); }

/* ---------- 16. دکمه‌های بالای صفحه / FAB ---------- */
.to-top {
  position: fixed; inset-inline-end: 18px; inset-block-end: 18px; z-index: 70;
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--brand-600); color: #fff; border: 0;
  box-shadow: var(--sh-brand); cursor: pointer;
  opacity: 0; transform: translateY(12px) scale(.9); pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.to-top.is-on { opacity: 1; transform: none; pointer-events: auto; }

/* ---------- 17. فوتر ---------- */
.site-footer {
  border-top: 1px solid var(--line); background: var(--surface);
  padding-block: 22px; font-size: var(--fs-sm); color: var(--ink-3);
}
.site-footer .wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.site-footer a { color: var(--ink-2); }

/* ---------- 18. لایهٔ تطبیق برای مارک‌آپ قدیمی ---------- */
/* این کلاس‌ها در فایل‌های قدیمی زیاد استفاده شده‌اند و اینجا خنثی/هم‌شکل می‌شوند */
.container { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
.section-wrapper { margin: 0; }
.sidebar-widget, .widget-item { font-size: var(--fs-sm); }
.sidebar-item, .sidebar-link { color: var(--ink-2); }
.mnemonic, .mnemonic-item {
  border-radius: var(--r-md); background: var(--brand-50);
  border: 1px dashed var(--brand-300); padding: 12px 14px; margin: 1em 0;
}
.mnemonic-letter-box {
  display: inline-grid; place-items: center; width: 26px; height: 26px;
  border-radius: var(--r-xs); background: var(--brand-600); color: #fff;
  font-weight: 900; font-size: .78rem; margin-inline-end: 6px;
}
.g-cell, .wg-cell, .g-header {
  border: 1px solid var(--line); padding: 8px 10px; font-size: var(--fs-sm);
  background: var(--surface);
}
.g-header { background: var(--brand-50); font-weight: 800; color: var(--brand-800); }
.hero-badge, .header-tag, .header-meta, .hero-meta-item { font-size: var(--fs-xs); }
.bold, .bold-point, .key-point { font-weight: 800; }
.drug { color: var(--brand-700); font-weight: 700; }
.ltr, .en { font-family: var(--font-num); }
.mb-4 { margin-bottom: 1.4rem; }
.col-2, .col-4 { min-width: 0; }

/* آیکون‌های درون‌خطی */
.sicon { flex: none; vertical-align: -.18em; }
.section__ico .sicon, .pill .sicon, .subj-chip .sicon, .lesson-card__icon .sicon,
.subject-card__icon .sicon, .brand__mark .sicon { display: block; }
@media print {
  .site-header, .subnav, .rail, .to-top { display: none !important; }
  .hero { padding-top: 0 !important; }
  .section { break-inside: avoid-page; box-shadow: none; }
  body { background: #fff; }
}

/* کتابخانه — صفحهٔ خانه و صفحهٔ درس‌ها */
.lib-page { background: var(--bg); }

/* هدر */
.brand { display: flex !important; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; flex: none; }
.brand:hover { text-decoration: none; }
.brand__mark {
  width: 36px; height: 36px; border-radius: var(--r-sm);
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, hsl(222 60% 52%), hsl(258 55% 48%));
  box-shadow: 0 6px 16px hsl(222 60% 45% / .3);
}
.brand__text { display: grid; line-height: 1.25; }
.brand__text b { font-size: .95rem; font-weight: 800; }
.brand__text small { font-size: .7rem; color: var(--ink-3); font-weight: 600; }
.hdr-search { flex: 1; max-width: 420px; margin-inline-start: auto; }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 700; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  transition: all .15s; text-decoration: none; flex: none;
}
.btn:hover { border-color: var(--brand-300); color: var(--brand-700); text-decoration: none; }

/* هیرو */
.lib-hero {
  position: relative; overflow: hidden;
  padding-block: clamp(26px, 5vw, 58px) clamp(22px, 4vw, 44px);
  background:
    radial-gradient(900px 320px at 88% -20%, hsl(258 60% 90%) 0%, transparent 60%),
    radial-gradient(700px 280px at 6% 0%, hsl(200 70% 92%) 0%, transparent 58%),
    linear-gradient(180deg, #fbfbff, var(--bg));
  border-bottom: 1px solid var(--line);
}
.lib-hero--subject {
  background:
    radial-gradient(900px 320px at 88% -20%, hsl(var(--h) var(--c) 90%) 0%, transparent 60%),
    radial-gradient(700px 280px at 6% 0%, hsl(calc(var(--h) + 30) calc(var(--c) * .7) 93%) 0%, transparent 58%),
    linear-gradient(180deg, var(--brand-50), var(--bg));
}
.lib-hero__top { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.lib-hero h1 {
  margin: 0 0 12px; font-size: clamp(1.5rem, 4.6vw, 2.5rem);
  font-weight: 900; line-height: 1.45; letter-spacing: -.015em; text-wrap: balance;
  color: var(--ink);
}
.lib-hero--subject h1 { color: var(--brand-ink); }
.lib-hero__lede { margin: 0; max-width: 68ch; color: var(--ink-2); font-size: var(--fs-md); }
.lib-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.lib-stat {
  background: hsl(0 0% 100% / .8); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 10px 16px; min-width: 92px;
  box-shadow: var(--sh-1);
}
.lib-stat b { display: block; font-size: 1.35rem; font-weight: 900; color: var(--brand-700); line-height: 1.3; }
.lib-stat span { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 700; }

/* بدنه */
.lib-main { padding-block: clamp(22px, 3.4vw, 40px) 70px; }
.lib-block { margin-bottom: clamp(26px, 4vw, 44px); }
.lib-block__head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.lib-block__head h2 {
  margin: 0; font-size: var(--fs-lg); font-weight: 900;
  display: flex; align-items: center; gap: 9px;
}
.lib-block__head h2::before {
  content: ""; width: 5px; height: 20px; border-radius: 3px;
  background: linear-gradient(180deg, var(--brand-400), var(--brand-600));
}
.lib-block__head .muted { font-size: var(--fs-xs); }

/* کارت درس */
.subject-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
.subject-card {
  position: relative; display: flex !important; flex-direction: column; gap: 5px;
  padding: 15px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--sh-1); text-decoration: none; color: inherit;
  overflow: hidden; transition: transform .18s, box-shadow .18s, border-color .18s;
}
.subject-card::after {
  content: ""; position: absolute; inset-block-end: 0; inset-inline: 0; height: 3px;
  background: linear-gradient(90deg, hsl(var(--h) var(--c) 62%), hsl(var(--h) var(--c) 44%));
  transform: scaleX(.25); transform-origin: right; transition: transform .22s;
}
.subject-card:hover { transform: translateY(-3px); box-shadow: var(--sh-3); border-color: hsl(var(--h) var(--c) 84%); text-decoration: none; }
.subject-card:hover::after { transform: scaleX(1); }
.subject-card__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.subject-card__icon {
  width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center;
  font-size: 1.15rem;
  background: hsl(var(--h) var(--c) 95%); border: 1px solid hsl(var(--h) var(--c) 88%);
}
.subject-card__count {
  font-size: .7rem; font-weight: 800; color: var(--ink-3);
  background: var(--surface-3); padding: 3px 9px; border-radius: var(--r-full);
  border: 1px solid var(--line-soft);
}
.subject-card__name { font-size: 1.02rem; font-weight: 800; color: var(--ink); }
.subject-card__en { font-size: .72rem; color: var(--ink-4); font-weight: 600; }
.subject-card__meta { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; margin-top: 4px; }

/* کارت درسنامه */
.lesson-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
@media (min-width: 1000px) { .lesson-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lesson-grid { grid-template-columns: 1fr; } }
.lesson-card {
  display: flex !important; flex-direction: row !important; align-items: center; gap: 12px;
  padding: 13px 14px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--sh-1); text-decoration: none; color: inherit;
  transition: transform .16s, box-shadow .16s, border-color .16s, background .16s;
}
.lesson-card:hover {
  transform: translateY(-2px); text-decoration: none;
  border-color: hsl(var(--h) var(--c) 84%);
  box-shadow: var(--sh-2);
  background: linear-gradient(180deg, var(--surface), hsl(var(--h) var(--c) 98%));
}
.lesson-card__icon {
  flex: none; width: 40px; height: 40px; border-radius: var(--r-sm);
  display: grid; place-items: center; font-size: 1.1rem;
  background: hsl(var(--h) var(--c) 95%); border: 1px solid hsl(var(--h) var(--c) 88%);
}
.lesson-card__body { display: grid; gap: 2px; min-width: 0; flex: 1; }
.lesson-card__sub { font-size: .68rem; font-weight: 800; color: hsl(var(--h) var(--c) 40%); }
.lesson-card__title { font-size: .92rem; font-weight: 700; color: var(--ink); line-height: 1.65; }
.lesson-card__meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: .7rem; color: var(--ink-3); font-weight: 600; }
.lc-badge {
  background: var(--surface-3); border: 1px solid var(--line-soft);
  padding: 1px 7px; border-radius: var(--r-full);
}
.lesson-card__go { flex: none; color: var(--ink-4); font-size: 1rem; transition: transform .16s, color .16s; }

    answers: {},        // id -> {picked, correct}
    filter: { ch: "all", diff: "all", mode: "all" },
    mode: "all",
    revealAll: false
  };

  /* ---------- ذخیرهٔ محلی ---------- */
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && d.answers) state.answers = d.answers;
    } catch (e) { /* localStorage خاموش */ }
  }
  function saveStore() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ answers: state.answers, at: Date.now() }));
    } catch (e) { /* پر شد یا خاموش */ }
  }

  /* ---------- آمار ---------- */
  function stats() {
    var ids = Object.keys(state.answers);
    var ok = ids.filter(function (k) { return state.answers[k].correct; }).length;
    return { done: ids.length, ok: ok, wrong: ids.length - ok, pct: ids.length ? Math.round((ok / ids.length) * 100) : 0 };
  }

  function paintProgress() {
    var s = stats();
    var total = state.all.length;
    var bar = document.querySelector("[data-qb-bar]");
    var head = document.querySelector("[data-qb-progress-text]");
    var statsBox = document.querySelector("[data-qb-stats]");
    if (bar) bar.style.width = (total ? Math.round((s.done / total) * 100) : 0) + "%";
    if (head) head.textContent = fa(s.done) + " از " + fa(total);
    if (statsBox) {
      statsBox.innerHTML =
        '<span class="qb-stat"><b>' + fa(s.ok) + '</b> درست</span>' +
        '<span class="qb-stat qb-stat--bad"><b>' + fa(s.wrong) + '</b> غلط</span>' +
        '<span class="qb-stat"><b>' + fa(s.pct) + '٪</b> درصد</span>';
    }
    var pill = document.querySelector("[data-qb-pill]");
    if (pill) pill.textContent = fa(state.list.length) + " سؤال در این نمای";
  }

  /* ---------- فیلتر ---------- */
  function applyFilter() {
    var f = state.filter;
    var list = state.all.filter(function (q) {
      if (f.ch !== "all" && String(q.chapter) !== String(f.ch)) return false;
      if (f.diff !== "all" && q.difficulty !== f.diff) return false;
      if (state.mode === "unseen" && state.answers[q.id + "|" + q.part]) return false;
      if (state.mode === "wrong") {
        var a = state.answers[q.id + "|" + q.part];
        if (!a || a.correct) return false;
      }
      if (state.mode === "marked" && !state.marked[q.id + "|" + q.part]) return false;
      return true;
    });
    state.list = list;
    if (state.i >= list.length) state.i = 0;
    paintProgress();
    render();
  }

  /* ---------- ساخت فهرست انتخاب‌ها ---------- */
  function buildControls() {
    var sel = document.getElementById("qb-chapter");
    if (sel) {
      var chapters = [];
      var seen = {};
      state.all.forEach(function (q) {
        var k = String(q.chapter);
        if (!seen[k]) { seen[k] = 1; chapters.push(q); }
      });
      chapters.sort(function (a, b) { return (a.chapter || 0) - (b.chapter || 0); });
      chapters.forEach(function (q) {
        var o = el("option");
        o.value = q.chapter;
        var n = state.all.filter(function (x) { return String(x.chapter) === String(q.chapter); }).length;
        o.textContent = "فصل " + fa(q.chapter) + " — " + q.chapterTitle + " (" + fa(n) + ")";
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () { state.filter.ch = sel.value; state.i = 0; applyFilter(); });
    }
    var dsel = document.getElementById("qb-diff");
    if (dsel) dsel.addEventListener("change", function () { state.filter.diff = dsel.value; state.i = 0; applyFilter(); });
    var modeSel = document.getElementById("qb-mode");
    if (modeSel) modeSel.addEventListener("change", function () { state.mode = modeSel.value; state.i = 0; applyFilter(); });
    var rev = document.getElementById("qb-reveal");
    if (rev) rev.addEventListener("click", function () {
      state.revealAll = !state.revealAll;
      rev.setAttribute("aria-pressed", state.revealAll ? "true" : "false");
      render();
    });
  }

  /* ---------- تصویر سؤال ---------- */
  /* دادهٔ تصویر در JSON بخش می‌تواند object باشد ({src, alt, credit, source, w, h})
     یا فقط یک رشتهٔ src. src می‌تواند data URI درون‌خطی باشد (آفلاین کار می‌کند). */
  function imageOf(im) {
    if (!im) return null;
    if (typeof im === "string") im = { src: im };
    if (!im || typeof im !== "object") return null;
    if (typeof im.src !== "string" || !im.src) return null;
    return im;
  }

  function figure(im) {
    im = imageOf(im);
    if (!im) return null;
    var fig = el("figure", "qb-figure");
    var img = document.createElement("img");
    img.src = im.src;
    img.alt = im.alt || "تصویر سؤال";
    img.setAttribute("loading", "lazy");
    img.setAttribute("decoding", "async");
    if (im.w > 0) img.width = im.w;
    if (im.h > 0) img.height = im.h;
    img.tabIndex = 0;
    img.setAttribute("role", "button");
    img.title = "برای بزرگ‌نمایی کلیک کن";
    img.addEventListener("click", function () { openZoom(im); });
    img.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openZoom(im); }
    });
    img.addEventListener("error", function () { fig.classList.add("qb-figure--broken"); });
    fig.appendChild(img);

    var cap = [];
    if (im.alt) cap.push(esc(im.alt));
    if (im.credit) cap.push('<span class="qb-figure__credit">' + esc(im.credit) + "</span>");
    if (cap.length) fig.appendChild(el("figcaption", null, cap.join(" — ")));
    if (im.source) {
      var a = el("a", "qb-figure__src", "منبع تصویر ↗");
      a.href = im.source;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      fig.appendChild(a);
    }
    return fig;
  }

  /* بزرگ‌نمایی: لایهٔ تمام‌صفحه که با کلیک یا Esc بسته می‌شود */
  var zoomLayer = null;
  function closeZoom() {
    if (!zoomLayer) return;
    zoomLayer.remove();
    zoomLayer = null;
    document.documentElement.classList.remove("qb-zoom-open");
  }
  function openZoom(im) {
    closeZoom();
    zoomLayer = el("div", "qb-zoom");
    zoomLayer.setAttribute("role", "dialog");
    zoomLayer.setAttribute("aria-modal", "true");
    zoomLayer.setAttribute("aria-label", im.alt || "تصویر سؤال");
    var big = document.createElement("img");
    big.src = im.src;
    big.alt = im.alt || "";
    zoomLayer.appendChild(big);
    if (im.credit) zoomLayer.appendChild(el("span", "qb-zoom__credit", esc(im.credit)));
    zoomLayer.appendChild(el("span", "qb-zoom__hint", "برای بستن کلیک کن یا Esc بزن"));
    zoomLayer.addEventListener("click", closeZoom);
    document.body.appendChild(zoomLayer);
    document.documentElement.classList.add("qb-zoom-open");
  }

  /* ---------- یک سؤال ---------- */
  function render() {
    root.innerHTML = "";
    if (!state.list.length) {
      root.appendChild(el("p", "qb-empty", "سؤالی با این فیلتر پیدا نشد. فیلترها را بازتر کن."));
      return;
    }
    var q = state.list[state.i];
    var key = q.id + "|" + q.part;
    var saved = state.answers[key];
    var revealed = state.revealAll || (saved && saved.picked != null);
    var picked = saved ? saved.picked : null;

    /* سربرگ */
    var head = el("div", "qb-head");
    head.appendChild(el("div", "qb-head__meta",
      '<span class="qb-badge">سؤال ' + fa(state.i + 1) + " از " + fa(state.list.length) + "</span>" +
      '<span class="qb-chip">فصل ' + fa(q.chapter) + "</span>" +
      '<span class="qb-chip qb-chip--alt">' + esc(q.difficulty) + "</span>" +
      (q.bloom ? '<span class="qb-chip qb-chip--alt">' + esc(q.bloom) + "</span>" : "")
    ));
    // کلید سند برای لایهٔ هایلایت (marks-lite): هر سؤال یک سند جداست
    if (root.setAttribute) root.setAttribute("data-marks-doc", key);
    root.appendChild(head);

    root.appendChild(el("div", "qb-chapter-name", esc(q.chapterTitle)));

    /* صورت سؤال */
    var card = el("div", "qb-stem");
    card.appendChild(el("p", null, esc(q.stem)));
    root.appendChild(card);

    /* تصویر سؤال (بانک‌های تصویردار، مثل ارتوپدی) */
    var fig = figure(q.image);
    if (fig) root.appendChild(fig);

    /* گزینه‌ها */
    var wrap = el("div", "qb-options");
    q.options.forEach(function (opt, idx) {
      var isCorrect = idx === q.correct;
      var cls = "qb-opt";
      if (revealed) {
        if (isCorrect) cls += " is-correct";
        else if (idx === picked) cls += " is-wrong";
      }
      var b = el("button", cls);
      b.type = "button";
      b.setAttribute("data-idx", idx);
      if (revealed) b.disabled = true;
      b.innerHTML = '<span class="qb-opt__letter">' + LETTERS[idx] + "</span>" +
        '<span class="qb-opt__text">' + esc(opt) + "</span>";
      if (!revealed) {
        b.addEventListener("click", function () {
          state.answers[key] = { picked: idx, correct: idx === q.correct, at: Date.now() };
          saveStore();
          paintProgress();
          render();
        });
      }
      wrap.appendChild(b);
    });
    root.appendChild(wrap);

    /* بازخورد */
    if (revealed) {
      var fb = el("div", "qb-feedback");
      var judgement = picked == null
        ? '<div class="qb-verdict qb-verdict--skip">پاسخ درست: <b>' + LETTERS[q.correct] + "</b></div>"
        : (picked === q.correct
          ? '<div class="qb-verdict qb-verdict--ok">✔ پاسخ درست — گزینهٔ <b>' + LETTERS[q.correct] + '</b></div>'
          : '<div class="qb-verdict qb-verdict--bad">✘ پاسخ نادرست — گزینهٔ درست: <b>' + LETTERS[q.correct] + "</b></div>");
      fb.innerHTML = judgement;

      if (q.explanation) {
        fb.appendChild(el("div", "qb-block qb-block--why",
          '<h4>چرا؟</h4><p>' + esc(q.explanation) + "</p>"));
      }
      var wrongKeys = Object.keys(q.whyWrong || {});
      if (wrongKeys.length) {
        var items = wrongKeys.map(function (k) {
          return "<li><b>" + (LETTERS[+k] || k) + ":</b> " + esc(q.whyWrong[k]) + "</li>";
        }).join("");
        fb.appendChild(el("div", "qb-block qb-block--wrong", "<h4>چرا بقیه غلط‌اند</h4><ul>" + items + "</ul>"));
      }
      if (q.pearl) fb.appendChild(el("div", "qb-block qb-block--pearl", "<h4>نکتهٔ کلیدی</h4><p>" + esc(q.pearl) + "</p>"));
      if (q.trap) fb.appendChild(el("div", "qb-block qb-block--trap", "<h4>تلهٔ آزمون</h4><p>" + esc(q.trap) + "</p>"));
      if (q.highYield) fb.appendChild(el("div", "qb-block qb-block--hy", "<h4>پربازده</h4><p>" + esc(q.highYield) + "</p>"));
      root.appendChild(fb);
    }

    /* ناوبری */
    var nav = el("div", "qb-nav");
    var prev = el("button", "qb-btn qb-btn--ghost", "◀ قبلی");
    prev.type = "button";
    prev.disabled = state.i === 0;
    prev.addEventListener("click", function () { if (state.i > 0) { state.i--; render(); } });
    var next = el("button", "qb-btn qb-btn--primary", "بعدی ▶");
    next.type = "button";
    next.disabled = state.i >= state.list.length - 1;
    next.addEventListener("click", function () { if (state.i < state.list.length - 1) { state.i++; render(); } });
    var reset = el("button", "qb-btn qb-btn--ghost qb-btn--sm", "پاک‌کردن پاسخ این سؤال");
    reset.type = "button";
    reset.addEventListener("click", function () {
      delete state.answers[key]; saveStore(); paintProgress(); render();
    });
    nav.appendChild(prev); nav.appendChild(next); nav.appendChild(reset);
    root.appendChild(nav);

    /* خلاصهٔ نتایج */
    if (state.i === state.list.length - 1) root.appendChild(summary());
  }

  function summary() {
    var s = stats();
    var box = el("div", "qb-summary");
    box.innerHTML =
      "<h3>خلاصهٔ نتایج</h3>" +
      '<div class="qb-summary__grid">' +
      '<div class="qb-summary__cell"><b>' + fa(s.done) + "</b><span>پاسخ‌داده</span></div>" +
      '<div class="qb-summary__cell qb-summary__cell--ok"><b>' + fa(s.ok) + "</b><span>درست</span></div>" +
      '<div class="qb-summary__cell qb-summary__cell--bad"><b>' + fa(s.wrong) + "</b><span>غلط</span></div>" +
      '<div class="qb-summary__cell"><b>' + fa(s.pct) + "٪</b><span>درصد</span></div>" +
      "</div>";
    return box;
  }

  /* ---------- راه‌اندازی ---------- */
  loadStore();
  state.marked = {};
  Promise.resolve({ ok: true, json: function () { return window.__QB__; } })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      state.all = data;
      buildControls();
      applyFilter();
    })
    .catch(function (err) {
      root.innerHTML = '<div class="qb-error">دادهٔ این بخش بارگذاری نشد (' + esc(err.message) +
        "). اگر فایل را روی کامپیوتر باز کرده‌ای، یک سرور محلی لازم است — یا از نسخهٔ تک‌فایلی استفاده کن.</div>";
    });

  /* کلیدهای میان‌بر */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeZoom(); return; }
    if (zoomLayer) return;                 // وقتی لایهٔ بزرگ‌نمایی باز است، ناوبری قفل است
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft" && state.i < state.list.length - 1) { state.i++; render(); }
    if (e.key === "ArrowRight" && state.i > 0) { state.i--; render(); }
    if (/^[1-4]$/.test(e.key)) {
      var b = root.querySelector('.qb-opt[data-idx="' + (+e.key - 1) + '"]');
      if (b && !b.disabled) b.click();
    }
  });
})();

</script>
<script>/* ==========================================================================
   marks-lite — هایلایت متن برای صفحه‌هایی که موتور medx-reader را ندارند
   --------------------------------------------------------------------------
   خودبسنده و بدون هیچ وابستگی (بدون MedX، بدون کتابخانه). برای درسنامه‌های
   پیش‌ساختهٔ خودبسنده (چشم‌پزشکی)، صفحه‌های بانک سؤال و بانک آزمون طراحی شده.

   پیکربندی از روی <body>:
     data-marks-key    کلید localStorage (پیش‌فرض: از data-lesson-id یا مسیر صفحه)
     data-marks-scope  سلکتور ریشه‌های هایلایت‌شدنی (پیش‌فرض: "main, .content, body")
     data-marks-roots  سلکتور هر ریشهٔ هایلایت داخل scope (پیش‌فرض: ".ml-root")
     data-marks-label  عنوان دکمهٔ شناور (پیش‌فرض: «نشانه‌ها»)

   آنچه می‌سازد:
     • نوار هایلایت روی انتخاب متن (۵ رنگ + حذف)
     • دکمهٔ شناور «نشانه‌ها» + پنل فهرست هایلایت‌ها (پرش و حذف)
     • بازیابی هایلایت‌ها پس از بارگذاری و پس از هر تغییر DOM
       (بانک سؤال با هر سؤال DOM را از نو می‌سازد؛ کلید سند از
        data-marks-doc روی کانتینر خوانده می‌شود)

   قرارداد ذخیره:  ml-marks/<key>  →  { v:1, hl:[{d,r,s,e,c,q,at}] }
     d = کلید سند (data-marks-doc یا "")، r = کلید ریشه، s/e = آفست متنی
   ========================================================================== */
(function (win, doc) {
  "use strict";

  var body = doc.body;
  if (!body || body.getAttribute("data-marks-lite") === "off") return;
  if (win.__marksLiteLoaded) return;
  win.__marksLiteLoaded = true;

  var COLORS = [["y", "زرد"], ["g", "سبز"], ["b", "آبی"], ["p", "صورتی"], ["o", "نارنجی"]];
  var SCOPE = body.getAttribute("data-marks-scope") || "main, .content, body";
  var ROOTS = body.getAttribute("data-marks-roots") || ".ml-root";
  var LABEL = body.getAttribute("data-marks-label") || "نشانه‌ها";
  var KEY = body.getAttribute("data-marks-key") ||
    body.getAttribute("data-lesson-id") ||
    body.getAttribute("data-lesson") ||
    (win.location.pathname.split("/").pop() || "page");
  var STORE = "ml-marks/" + KEY;

  var ICON_NOTE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 5.5A2 2 0 0 1 6.5 3.5h7L20 10v8.5a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2Z"/><path d="M13 3.5V10h6.5"/><path d="M8 14h6M8 17h4"/></svg>';
  var ICON_CLOSE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>';
  var ICON_JUMP = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';
  var ICON_TRASH = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l1 13h9l1-13"/></svg>';
  var FA = "۰۱۲۳۴۵۶۷۸۹";

  function fa(n) { return String(n).replace(/\d/g, function (d) { return FA[+d]; }); }
  function $(sel, root) { return (root || doc).querySelector(sel); }
  function $$(sel, root) { return [].slice.call((root || doc).querySelectorAll(sel)); }

  /* ------------------------------------------------------------ ذخیره‌سازی */
  var DB = { v: 1, hl: [] };
  function load() {
    try {
      var raw = win.localStorage.getItem(STORE);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.hl)) DB = d;
    } catch (e) { /* localStorage خاموش یا خراب */ }
  }
  function save() {
    try { win.localStorage.setItem(STORE, JSON.stringify(DB)); } catch (e) { /* پر یا خاموش */ }
  }

  /* --------------------------------------------------------------- ریشه‌ها */
  function scopeEl() {
    var s = $(SCOPE);
    return s || body;
  }
  function docKey() {
    var host = scopeEl();
    var v = host.getAttribute && host.getAttribute("data-marks-doc");
    if (!v && host.querySelector) {
      // بعضی صفحه‌ها کلید سند را روی کانتینر سؤال می‌گذارند، نه روی خودِ scope
      var inner = host.querySelector("[data-marks-doc]");
      if (inner) v = inner.getAttribute("data-marks-doc");
    }
    return v || "";
  }
  function rootList() {
    var host = scopeEl();
    var list = $$(ROOTS, host);
    if (!list.length && host.matches && host.matches(ROOTS)) list = [host];
    // اگر هیچ ریشهٔ نشانه‌گذاری‌شده‌ای نبود، خودِ scope یک ریشه حساب می‌شود
    if (!list.length) list = [host];
    return list;
  }
  function rootKey(root, i) {
    return root.getAttribute("data-marks-id") || root.id || ("r" + i);
  }

  /* --------------------------------------------------------- متن و آفست‌ها */
  function textNodes(root) {
    var out = [];
    var walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue) return NodeFilter.FILTER_REJECT;
        var p = n.parentNode;
        while (p && p !== root) {
          var tag = p.nodeName.toLowerCase();
          if (tag === "script" || tag === "style" || tag === "noscript") return NodeFilter.FILTER_REJECT;
          p = p.parentNode;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var n;
    while ((n = walker.nextNode())) out.push(n);
    return out;
  }
  function offsetIn(root, node, off) {
    var total = 0, nodes = textNodes(root);
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i] === node) return total + off;
      total += nodes[i].nodeValue.length;
    }
    return total;
  }
  function wrapOffsets(root, start, end, color) {
    var nodes = textNodes(root), acc = 0, targets = [];
    for (var i = 0; i < nodes.length; i++) {
      var len = nodes[i].nodeValue.length;
      var s = acc, e = acc + len;
      if (e > start && s < end) targets.push({ node: nodes[i], from: Math.max(0, start - s), to: Math.min(len, end - s) });
      acc = e;
    }
    targets.reverse().forEach(function (t) {
      try {
        var r = doc.createRange();
        r.setStart(t.node, t.from);
        r.setEnd(t.node, t.to);
        var mark = doc.createElement("mark");
        mark.className = "ml-hl";
        mark.setAttribute("data-c", color);
        r.surroundContents(mark);
      } catch (e) { /* گره‌های غیرمتنی رد می‌شوند */ }
    });
  }
  function unwrap(root) {
    $$("mark.ml-hl", root).forEach(function (m) {
      var parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
  }

  /* ------------------------------------------------------------- رندر مجدد */
  var mo = null;
  function restore() {
    var dk = docKey();
    var roots = rootList();
    roots.forEach(function (root, i) {
      var rk = rootKey(root, i);
      var recs = DB.hl.filter(function (h) { return (h.d || "") === dk && h.r === rk; });
      // ریشهٔ بدون نشانه و بدون mark: کاری ندارد (صفحه‌هایی با صدها ریشه، مثل بانک آزمون)
      if (!recs.length && !$("mark.ml-hl", root)) return;
      unwrap(root);
      var len = recs.length ? textNodes(root).map(function (n) { return n.nodeValue; }).join("").length : 0;
      recs
        .sort(function (a, b) { return a.s - b.s; })
        .forEach(function (h) {
          if (h.s >= len) return;
          wrapOffsets(root, h.s, Math.min(h.e, len), h.c);
        });
    });
    // شمارهٔ پرش روی خودِ markها؛ پنل از همین برای «رفتن به هایلایت» استفاده می‌کند
    $$("mark.ml-hl").forEach(function (m, i) { m.setAttribute("data-ml-i", i); });
    renderPanel();
    // خودِ restore DOM را تغییر می‌دهد؛ رکوردهایش را دور می‌ریزیم تا حلقهٔ بی‌پایان نسازد
    if (mo && mo.takeRecords) mo.takeRecords();
  }

  /* ------------------------------------------------------------ نوار انتخاب */
  var selbar = null, pending = null;
  function buildSelbar() {
    if (selbar) return;
    selbar = doc.createElement("div");
    selbar.className = "ml-selbar";
    selbar.setAttribute("role", "toolbar");
    selbar.setAttribute("aria-label", "هایلایت متن");
    selbar.innerHTML = COLORS.map(function (c) {
      return '<button type="button" class="ml-selbar__dot" data-c="' + c[0] + '" title="هایلایت ' + c[1] + '" aria-label="هایلایت ' + c[1] + '"></button>';
    }).join("") +
      '<span class="ml-selbar__sep"></span>' +
      '<button type="button" class="ml-selbar__btn" data-ml-remove title="حذف هایلایت">' + ICON_TRASH + "<span>حذف</span></button>";
    body.appendChild(selbar);
    selbar.addEventListener("mousedown", function (e) { e.preventDefault(); });
    selbar.addEventListener("click", function (e) {
      var dot = e.target.closest("[data-c]");
      if (dot) { commit(dot.getAttribute("data-c")); return; }
      if (e.target.closest("[data-ml-remove]")) { removeSelected(); }
    });
  }
  function hideSelbar() {
    if (!selbar) return;
    selbar.classList.remove("is-on");
    pending = null;
  }
  function showSelbar(rect, hasHits) {
    if (!selbar) return;
    selbar.classList.add("is-on");
    var sw = selbar.offsetWidth || 220;
    var x = rect.left + rect.width / 2 + win.pageXOffset;
    var y = rect.top + win.pageYOffset;
    selbar.style.left = Math.max(8, Math.min(x - sw / 2, win.pageXOffset + doc.documentElement.clientWidth - sw - 8)) + "px";
    var top = y - (selbar.offsetHeight || 40) - 10;
    if (top < win.pageYOffset + 70) top = y + rect.height + 12;
    selbar.style.top = top + "px";
    var rem = $("[data-ml-remove]", selbar);
    if (rem) rem.hidden = !hasHits;
  }
  function selectionInfo() {
    var sel = win.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    var range = sel.getRangeAt(0);
    var roots = rootList();
    var host = null, idx = -1;
    for (var i = 0; i < roots.length; i++) {
      if (roots[i].contains(range.startContainer) && roots[i].contains(range.endContainer)) { host = roots[i]; idx = i; break; }
    }
    if (!host) return null;
    var text = sel.toString();
    if (!text || text.trim().length < 2) return null;
    var start = offsetIn(host, range.startContainer, range.startOffset);
    var end = offsetIn(host, range.endContainer, range.endOffset);
    if (end <= start) return null;
    var rect = null;
    try { rect = range.getBoundingClientRect(); } catch (e) { rect = null; }
    if (!rect || (!rect.width && !rect.height)) {
      try { rect = range.getClientRects()[0] || rect; } catch (e2) { rect = null; }
    }
    if (!rect) return null;
    return { range: range, root: host, r: rootKey(host, idx), s: start, e: end, text: text, rect: rect };
  }
  function commit(color) {
    if (!pending) return;
    var rec = { d: docKey(), r: pending.r, s: pending.s, e: pending.e, c: color, q: pending.text.replace(/\s+/g, " ").trim().slice(0, 220), at: Date.now() };
    if (!rec.q) return;
    DB.hl.push(rec);
    save();
    try { win.getSelection().removeAllRanges(); } catch (e) { /* noop */ }
    hideSelbar();
    restore();
    toast("هایلایت ذخیره شد");
  }
  function removeSelected() {
    if (!pending) return;
    var dk = docKey();
    var touched = $$("mark.ml-hl", pending.root).filter(function (m) {
      try { return pending.range.intersectsNode(m); } catch (e) { return false; }
    });
    if (!touched.length) return;
    // حذف رکوردهایی که با محدودهٔ انتخاب‌شده هم‌پوشانی دارند
    DB.hl = DB.hl.filter(function (h) {
      if ((h.d || "") !== dk || h.r !== pending.r) return true;
      return !(h.s < pending.e && h.e > pending.s);
    });
    save();
    try { win.getSelection().removeAllRanges(); } catch (e) { /* noop */ }
    hideSelbar();
    restore();
    toast("هایلایت حذف شد");
  }
  function removeAt(rec) {
    DB.hl = DB.hl.filter(function (h) { return h !== rec; });
    save(); restore(); toast("هایلایت حذف شد");
  }

  /* ------------------------------------------------------- دکمه و پنل شناور */
  var fab = null, panel = null;
  function buildFab() {
    if (fab) return;
    fab = doc.createElement("button");
    fab.type = "button";
    fab.className = "ml-fab";
    fab.title = LABEL;
    fab.setAttribute("aria-label", LABEL);
    fab.innerHTML = ICON_NOTE + "<span>" + LABEL + '</span><b class="ml-fab__n" hidden>۰</b>';
    body.appendChild(fab);
    fab.addEventListener("click", function () { togglePanel(); });

    panel = doc.createElement("div");
    panel.className = "ml-panel";
    panel.hidden = true;
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", LABEL);
    panel.innerHTML =
      '<div class="ml-panel__head"><b>' + LABEL + '</b>' +
      '<button type="button" class="ml-panel__x" data-ml-close aria-label="بستن">' + ICON_CLOSE + "</button></div>" +
      '<div class="ml-panel__body" data-ml-list></div>';
    body.appendChild(panel);
    panel.addEventListener("click", function (e) {
      if (e.target.closest("[data-ml-close]")) { togglePanel(false); return; }
      var del = e.target.closest("[data-ml-del]");
      if (del) {
        var i = +del.getAttribute("data-ml-del");
        var dk = docKey();
        var rec = DB.hl.filter(function (h) { return (h.d || "") === dk; })[i];
        if (rec) removeAt(rec);
        return;
      }
      var jump = e.target.closest("[data-ml-jump]");
      if (jump) {
        var mark = $('mark.ml-hl[data-ml-i="' + jump.getAttribute("data-ml-jump") + '"]');
        if (mark) {
          mark.scrollIntoView({ behavior: "smooth", block: "center" });
          mark.classList.add("is-flash");
          setTimeout(function () { mark.classList.remove("is-flash"); }, 1400);
        }
      }
    });
  }
  function togglePanel(force) {
    if (!panel) return;
    var on = force == null ? panel.hidden : force;
    panel.hidden = !on;
    if (fab) fab.setAttribute("aria-expanded", on ? "true" : "false");
    if (on) renderPanel();
  }
  function renderPanel() {
    if (!fab) return;
    var dk = docKey();
    var mine = DB.hl.filter(function (h) { return (h.d || "") === dk; });
    var badge = $(".ml-fab__n", fab);
    if (badge) { badge.textContent = fa(mine.length); badge.hidden = mine.length === 0; }
    if (!panel) return;
    var host = $("[data-ml-list]", panel);
    if (!host) return;
    host.innerHTML = "";
    if (!mine.length) {
      var p = doc.createElement("p");
      p.className = "ml-empty";
      p.textContent = "هنوز هایلایتی ثبت نشده. متنی را انتخاب کن تا نوار رنگ‌ها ظاهر شود.";
      host.appendChild(p);
      return;
    }
    var marks = $$("mark.ml-hl");
    mine.slice().sort(function (a, b) { return b.at - a.at; }).forEach(function (rec) {
      var row = doc.createElement("div");
      row.className = "ml-item";
      // اولین mark هم‌رنگ با همان متن → هدف پرش
      var target = -1;
      for (var i = 0; i < marks.length; i++) {
        if (marks[i].getAttribute("data-c") === rec.c &&
            (marks[i].textContent || "").replace(/\s+/g, " ").trim() === (rec.q || "").trim()) {
          target = +marks[i].getAttribute("data-ml-i");
          break;
        }
      }
      row.innerHTML =
        '<span class="ml-item__c" data-c="' + rec.c + '"></span>' +
        '<span class="ml-item__t"></span>' +
        '<span class="ml-item__acts">' +
          (target > -1 ? '<button type="button" data-ml-jump="' + target + '" title="رفتن به هایلایت">' + ICON_JUMP + "</button>" : "") +
          '<button type="button" class="danger" data-ml-del="' + mine.indexOf(rec) + '" title="حذف">' + ICON_TRASH + "</button>" +
        "</span>";
      $(".ml-item__t", row).textContent = rec.q || "…";
      host.appendChild(row);
    });
  }

  /* ------------------------------------------------------------------- توست */
  var toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = doc.createElement("div");
      toastEl.className = "ml-toast";
      toastEl.setAttribute("role", "status");
      toastEl.setAttribute("aria-live", "polite");
      body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("is-on"); }, 2200);
  }

  /* --------------------------------------------------------------- راه‌اندازی */
  function init() {
    load();
    buildSelbar();
    buildFab();
    restore();

    doc.addEventListener("mouseup", function (e) {
      if (selbar && selbar.contains(e.target)) return;
      setTimeout(function () {
        var info = selectionInfo();
        if (!info) { hideSelbar(); return; }
        pending = info;
        var hits = $$("mark.ml-hl", info.root).filter(function (m) {
          try { return info.range.intersectsNode(m); } catch (err) { return false; }
        });
        showSelbar(info.rect, hits.length > 0);
      }, 12);
    });
    doc.addEventListener("touchend", function (e) {
      if (selbar && selbar.contains(e.target)) return;
      setTimeout(function () {
        var info = selectionInfo();
        if (!info) return;
        pending = info;
        showSelbar(info.rect, false);
      }, 180);
    }, { passive: true });
    doc.addEventListener("mousedown", function (e) {
      if (selbar && !selbar.contains(e.target)) hideSelbar();
    });
    doc.addEventListener("scroll", function () {
      if (selbar && selbar.classList.contains("is-on")) hideSelbar();
    }, { passive: true });
    doc.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { hideSelbar(); togglePanel(false); }
    });

    // بانک سؤال و صفحه‌های پویا: پس از هر تغییر DOM، هایلایت‌ها برگردانده می‌شوند
    if (win.MutationObserver) {
      var queued = false;
      mo = new MutationObserver(function () {
        if (queued) return;
        queued = true;
        setTimeout(function () { queued = false; restore(); }, 60);
      });
      mo.observe(scopeEl(), {
        childList: true, subtree: true, characterData: true,
        // تغییر کلید سند (سؤال بعدی/قبلی) باید پنل و شمارنده را تازه کند
        attributes: true, attributeFilter: ["data-marks-doc"],
      });
    }
  }

  win.MarksLite = {
    restore: restore,
    refresh: function () { load(); restore(); },
    count: function () { return DB.hl.filter(function (h) { return (h.d || "") === docKey(); }).length; },
    openPanel: function () { togglePanel(true); }
  };

  if (doc.readyState === "loading") doc.addEventListener("DOMContentLoaded", init);
  else init();
})(window, document);
</script>
