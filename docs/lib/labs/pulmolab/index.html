<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050a14">
  <meta name="description" content="PulmoLab Studio — پلتفرم سینمایی و پیشرفته آموزش و شبیه‌سازی بالینی ریه: سمع تعاملی روی آناتومی ریه، طیف‌نگار زنده، ایستگاه PACS رادیولوژی، اسپیرومتری پویا و مانیتور ICU">
  <title>PulmoLab Studio | آزمایشگاه و شبیه‌ساز بالینی ریه</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230284c7'/%3E%3Cpath d='M32 12v18m0-8c-8 0-16 6-18 18-1 6 2 12 7 12 4 0 8-3 9-8V22m2 0c8 0 16 6 18 18 1 6-2 12-7 12-4 0-8-3-9-8V22' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../assets/theme/medx-core.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="pl-root" class="pl-shell">
    <aside id="pl-sidebar" class="pl-sidebar" aria-label="منوی اصلی PulmoLab">
      <div class="pl-brand">
        <div class="pl-brand-icon" aria-hidden="true">🫁</div>
        <div>
          <div class="pl-brand-title">PulmoLab Studio</div>
          <div class="pl-brand-sub">شبیه‌ساز بالینی و آزمایشگاه ریه</div>
        </div>
      </div>

      <nav class="pl-nav-section" aria-label="ناوبری بخش‌ها">
        <div class="pl-nav-label">مرکز فرماندهی و شبیه‌سازی</div>
        <button class="pl-nav-btn" data-route="home"><span class="pl-nav-ico">🏠</span><span>داشبورد PulmoLab</span></button>
        <button class="pl-nav-btn" data-route="cases"><span class="pl-nav-ico">🩺</span><span>شبیه‌ساز بالینی ICU/ER</span><span class="pl-nav-count" id="nav-cnt-cases">8</span></button>

        <div class="pl-nav-label" style="margin-top:10px">آزمایشگاه‌های تعاملی</div>
        <button class="pl-nav-btn" data-route="auscultation"><span class="pl-nav-ico">🎧</span><span>سمع روی ریه + طیف‌نگار</span><span class="pl-nav-count" id="nav-cnt-sounds">12</span></button>
        <button class="pl-nav-btn" data-route="radiology"><span class="pl-nav-ico">🩻</span><span>اطلس PACS رادیولوژی</span><span class="pl-nav-count" id="nav-cnt-cxr">70</span></button>
        <button class="pl-nav-btn" data-route="pft"><span class="pl-nav-ico">📈</span><span>اسپیرومتری و PFT پویا</span><span class="pl-nav-count" id="nav-cnt-pft">12</span></button>
        <button class="pl-nav-btn" data-route="exam"><span class="pl-nav-ico">👐</span><span>شبیه‌ساز معاینهٔ قفسهٔ سینه</span><span class="pl-nav-count" id="nav-cnt-exam">12</span></button>

        <div class="pl-nav-label" style="margin-top:10px">مرجع، جستجو و آفلاین</div>
        <button class="pl-nav-btn" data-route="diseases"><span class="pl-nav-ico">📚</span><span>کتابخانهٔ بیماری‌های تنفسی</span><span class="pl-nav-count" id="nav-cnt-diseases">30</span></button>
        <button class="pl-nav-btn" data-route="search"><span class="pl-nav-ico">🔍</span><span>جستجوی یکپارچه</span></button>
        <button class="pl-nav-btn" data-route="offline"><span class="pl-nav-ico">💾</span><span>مدیریت آفلاین و حافظه</span></button>
      </nav>

      <div class="pl-sidebar-footer">
        <a href="../index.html" style="font-weight:700">← بازگشت به آزمایشگاه‌های DATA</a>
      </div>
    </aside>

    <div id="pl-backdrop" class="pl-backdrop"></div>

    <div class="pl-main-col">
      <header class="pl-topbar">
        <button id="pl-menu-btn" class="pl-menu-toggle" type="button" aria-label="باز کردن منو">☰ منو</button>

        <div class="pl-mode-switch" role="group" aria-label="حالت کاربری">
          <button type="button" class="pl-mode-btn active" id="mode-learning" data-mode="learning">حالت یادگیری</button>
          <button type="button" class="pl-mode-btn" id="mode-simulation" data-mode="simulation">شبیه‌سازی بالینی</button>
        </div>

        <form id="pl-quick-search-form" class="pl-topbar-search" role="search">
          <span class="pl-search-ico" aria-hidden="true">🔍</span>
          <input id="pl-quick-search" type="search" placeholder="جستجو در بیماری‌ها، صداها، CXR، PFT، علائم... (کلید /)" autocomplete="off">
        </form>

        <div class="pl-topbar-actions">
          <button type="button" id="pl-theme-toggle" class="pl-btn pl-btn-sm" title="تغییر تم سینمایی تاریک / مطالعهٔ روشن">☀ روشن</button>
          <span id="pl-net-status" class="pl-status-pill">● آنلاین</span>
        </div>
      </header>

      <main id="pl-view" class="pl-content" aria-live="polite">
        <div class="pl-card" style="text-align:center;padding:48px 20px">
          <div style="font-size:2.4rem;margin-bottom:8px">🫁</div>
          <div style="font-weight:800">در حال راه‌اندازی موتورهای بالینی PulmoLab Studio...</div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
