/* ---------- 1. توکن‌های پایه ---------- */
:root {
  color-scheme: light;

  /* رنگ درس — با JS یا درون‌خطی per-subject بازنویسی می‌شود */
  --h: 224;
  --c: 72;

  /* مقیاس رنگ سازنده از HSL */
  --brand-50:  hsl(var(--h) var(--c) 97%);
  --brand-100: hsl(var(--h) var(--c) 94%);
  --brand-200: hsl(var(--h) var(--c) 88%);
  --brand-300: hsl(var(--h) var(--c) 78%);
  --brand-400: hsl(var(--h) var(--c) 66%);
  --brand-500: hsl(var(--h) var(--c) 55%);
  --brand-600: hsl(var(--h) var(--c) 46%);
  --brand-700: hsl(var(--h) var(--c) 38%);
  --brand-800: hsl(var(--h) var(--c) 30%);
  --brand-900: hsl(var(--h) var(--c) 22%);
  --brand: var(--brand-600);
  --brand-ink: hsl(var(--h) calc(var(--c) * 0.9) 26%);

  /* معنایی — ثابت در همهٔ درس‌ها، فقط کمی هم‌رنگ درس می‌شوند */
  --ok: hsl(158 62% 38%);
  --ok-bg: hsl(158 62% 96%);
  --warn: hsl(32 88% 42%);
  --warn-bg: hsl(38 92% 95%);
  --danger: hsl(354 68% 48%);
  --danger-bg: hsl(354 78% 96%);
  --info: hsl(211 78% 46%);
  --info-bg: hsl(211 80% 96%);
  --gold: hsl(41 88% 40%);
  --gold-bg: hsl(43 95% 95%);

  /* سطح‌ها و متن */
  --bg: #f5f6f9;
  --bg-soft: #ffffff;
  --surface: #ffffff;
  --surface-2: #fafbfd;
  --surface-3: #f1f3f8;
  --line: #e4e8f0;
  --line-soft: #eef1f6;
  --ink: #131a2a;
  --ink-2: #3c4660;
  --ink-3: #6b7590;
  --ink-4: #97a0b5;
  --on-brand: #ffffff;

  /* شکل و سایه */
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-full: 999px;
  --sh-1: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
  --sh-2: 0 4px 12px rgba(16, 24, 40, .07), 0 2px 4px rgba(16, 24, 40, .04);
  --sh-3: 0 12px 32px rgba(16, 24, 40, .10), 0 4px 8px rgba(16, 24, 40, .04);
  --sh-brand: 0 10px 28px hsl(var(--h) var(--c) 45% / .22);

  /* تایپوگرافی */
  --font: "Vazirmatn", "IRANSans", "Segoe UI", system-ui, -apple-system, Tahoma, sans-serif;
  --font-num: "Vazirmatn", ui-sans-serif, system-ui;
  --fs-xs: .78rem;
  --fs-sm: .875rem;
  --fs-base: 1rem;
  --fs-md: 1.06rem;
  --fs-lg: 1.2rem;
  --fs-xl: 1.45rem;
  --fs-2xl: 1.85rem;
  --fs-3xl: 2.4rem;
  --lh: 2.05;
  --maxw: 1180px;

  /* اندازه‌های layout */
  --header-h: 60px;
  --gutter: clamp(14px, 3.2vw, 34px);
  --focus: 0 0 0 3px hsl(var(--h) var(--c) 55% / .35);
}

@media (prefers-reduced-motion: no-preference) {
  :root { scroll-behavior: smooth; }
}

/* ---------- 2. ریست ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: var(--lh);
  color: var(--ink);
  background: var(--bg);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
img, svg, video { max-width: 100%; height: auto; display: block; }
a { color: var(--brand-600); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-xs); }
::selection { background: var(--brand-200); color: var(--brand-900); }
hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
sub, sup { font-size: .72em; line-height: 0; }

/* اسکرول‌بار نازک */
* { scrollbar-width: thin; scrollbar-color: var(--brand-300) transparent; }
*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-thumb { background: var(--brand-200); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--brand-300); background-clip: content-box; }

/* ---------- 3. کمکی‌های عمومی ---------- */
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
.ltr, .en, [dir="ltr"] { direction: ltr; unicode-bidi: isolate; text-align: left; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--ink-3); }
.strong { font-weight: 700; }
.num, .hn, .hyd-num, .highyield-num, .hy-num, .num-gold, .stat-number, .stat-num {
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.hide { display: none !important; }

/* ---------- 4. هدر جادویی ---------- */
.site-header {
  position: sticky; top: 0; z-index: 60;
  background: hsl(0 0% 100% / .82);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.site-header__bar {
  min-height: var(--header-h);
  display: flex !important; align-items: center; gap: 12px;
  padding-block: 8px;
}
.crumbs {
  display: flex; align-items: center; gap: 8px;
  min-width: 0; flex: 1;
  font-size: var(--fs-sm); color: var(--ink-3);
}
.crumbs a { color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.crumbs a:hover { color: var(--brand-600); text-decoration: none; }
.crumbs .sep { color: var(--ink-4); flex: none; }
.crumbs .crumb-now {
  color: var(--ink); font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}
.subj-chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 5px 12px; border-radius: var(--r-full);
  background: var(--brand-50); color: var(--brand-700);
  border: 1px solid var(--brand-200);
  font-size: var(--fs-xs); font-weight: 700;
}
/* نوار پیشرفت مطالعه */
.read-progress {
  position: absolute; inset-inline: 0; bottom: -1px; height: 3px;
  background: transparent; overflow: hidden;
}
.read-progress > i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
  border-radius: 0 3px 3px 0;
  transition: width .12s linear;
}

/* دکمه‌های آیکونی هدر */
.icon-btn {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s, transform .15s;
}
.icon-btn:hover { background: var(--brand-50); color: var(--brand-700); border-color: var(--brand-200); }
.icon-btn:active { transform: scale(.96); }
.icon-btn[aria-expanded="true"] { background: var(--brand-600); color: #fff; border-color: transparent; }

/* ---------- 5. هیرو ---------- */
.hero {
  position: relative; overflow: hidden;
  padding-top: clamp(30px, 5vw, 52px) !important;
  background:
    radial-gradient(1200px 380px at 92% -10%, hsl(var(--h) var(--c) 92%) 0%, transparent 62%),
    radial-gradient(900px 320px at 4% 0%, hsl(calc(var(--h) + 34) calc(var(--c) * .7) 94%) 0%, transparent 55%),
    linear-gradient(180deg, var(--brand-50), var(--bg) 92%);
  border-bottom: 1px solid var(--line);
  padding-block: clamp(22px, 4vw, 44px);
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(hsl(var(--h) var(--c) 45% / .07) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: linear-gradient(180deg, #000 0%, transparent 78%);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 78%);
}
.hero > .wrap { position: relative; z-index: 1; }
.hero__top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px; border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: 700;
  background: var(--surface); color: var(--brand-700);
  border: 1px solid var(--brand-200); box-shadow: var(--sh-1);
}
.pill--ghost { background: hsl(0 0% 100% / .6); border-color: var(--line); color: var(--ink-3); font-weight: 600; }
.pill--icon { font-size: .95rem; padding: 4px 10px; }
.hero h1 {
  margin: 0 0 8px;
  font-size: clamp(1.5rem, 4.4vw, var(--fs-3xl));
  font-weight: 800; line-height: 1.42;
  letter-spacing: -.01em;
  color: var(--brand-ink);
  text-wrap: balance;
}
.hero__lede {
  margin: 0; max-width: 72ch;
  color: var(--ink-2); font-size: var(--fs-md);
}
.hero__meta {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px;
}
.meta-item {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px; border-radius: var(--r-sm);
  background: hsl(0 0% 100% / .75); border: 1px solid var(--line);
  font-size: var(--fs-sm); color: var(--ink-2); font-weight: 600;
  box-shadow: var(--sh-1);
}
.meta-item b { color: var(--brand-700); font-weight: 800; }

/* تصویر/کاور درس در هیرو */
.hero__layout { display: grid; gap: clamp(16px, 3vw, 28px); }
@media (min-width: 880px) {
  .hero__layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
}
.hero__cover { display: none; }
@media (min-width: 880px) {
  .hero__cover {
    display: block; border-radius: var(--r-lg); overflow: hidden;
    border: 1px solid var(--brand-200); box-shadow: var(--sh-3);
  }
  .hero__cover img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
}

/* ---------- 6. ناوبری چسبان بخش‌ها (TOC) ---------- */
.subnav {
  position: sticky; top: var(--header-h); z-index: 50;
  background: hsl(0 0% 100% / .9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.subnav__scroll {
  display: flex; gap: 6px; align-items: center;
  overflow-x: auto; scrollbar-width: none;
  padding-block: 9px;
}
.subnav__scroll::-webkit-scrollbar { display: none; }
.subnav a {
  flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: var(--r-full);
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2);
  border: 1px solid transparent; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.subnav a:hover { background: var(--brand-50); color: var(--brand-700); text-decoration: none; }
.subnav a.is-active {
  background: var(--brand-600); color: #fff; border-color: var(--brand-600);
  box-shadow: var(--sh-brand);
}
.subnav .n { font-size: .72rem; opacity: .65; font-variant-numeric: tabular-nums; }

/* ---------- 7. بدنهٔ درس + سایدبار ---------- */
.layout {
  display: grid; gap: clamp(18px, 2.4vw, 30px);
  padding-block: clamp(20px, 3.4vw, 40px) 72px;
  align-items: start;
}
@media (min-width: 1060px) {
  .layout { grid-template-columns: minmax(0, 1fr) 274px; }
}
.main-col { min-width: 0; }

.rail { display: none; }
@media (min-width: 1060px) {
  .rail {
    display: block; position: sticky; top: calc(var(--header-h) + 58px);
    display: grid; gap: 14px;
    max-height: calc(100vh - var(--header-h) - 78px);
    overflow-y: auto; padding-bottom: 8px;
  }
}
.rail-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 14px; box-shadow: var(--sh-1);
}
.rail-card h3 {
  margin: 0 0 10px; font-size: var(--fs-xs); font-weight: 800;
  color: var(--ink-3); letter-spacing: .02em;
}
.rail-nav { display: grid; gap: 2px; }
.rail-nav a {
  display: flex; gap: 8px; align-items: baseline;
  padding: 6px 9px; border-radius: var(--r-xs);
  font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.7;
  border-inline-start: 2px solid transparent;
}
.rail-nav a:hover { background: var(--surface-3); color: var(--brand-700); text-decoration: none; }
.rail-nav a.is-active {
  background: var(--brand-50); color: var(--brand-700);
  border-inline-start-color: var(--brand-500); font-weight: 700;
}
.rail-nav .n { color: var(--ink-4); font-size: .74rem; font-variant-numeric: tabular-nums; }
.rail-ring { display: grid; place-items: center; gap: 8px; }
.ring { width: 96px; height: 96px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.ring .trk { stroke: var(--surface-3); }
.ring .val { stroke: var(--brand-500); transition: stroke-dashoffset .2s linear; }
.rail-ring small { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 700; }

/* ---------- 8. کارت و بخش ---------- */
.section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  margin-bottom: clamp(16px, 2.4vw, 26px);
  scroll-margin-top: calc(var(--header-h) + 64px);
  overflow: clip;
}
.section__head {
  display: flex; gap: 13px; align-items: flex-start;
  padding: clamp(14px, 2.2vw, 20px) clamp(14px, 2.4vw, 24px);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border-bottom: 1px solid var(--line-soft);
}
.section__ico {
  flex: none; width: 42px; height: 42px; display: grid; place-items: center;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--brand-50); color: var(--brand-600);
  border: 1px solid var(--brand-200);
  font-size: 1.15rem; line-height: 1;
}
.section__no {
  flex: none; display: grid; place-items: center;
  width: 42px; height: 42px; border-radius: var(--r-sm);
  background: var(--brand-600); color: #fff;
  font-weight: 800; font-size: 1rem;
  box-shadow: var(--sh-brand);
  font-variant-numeric: tabular-nums;
}
.section__titles { min-width: 0; flex: 1; }
.section__title {
  margin: 0; font-size: var(--fs-lg); font-weight: 800; line-height: 1.55;
  color: var(--ink); text-wrap: balance;
}
.section__sub { margin: 3px 0 0; font-size: var(--fs-sm); color: var(--ink-3); }
.section__body { padding: clamp(15px, 2.4vw, 26px) clamp(14px, 2.4vw, 24px); }
.section__body > *:first-child { margin-top: 0; }
.section__body > *:last-child { margin-bottom: 0; }

/* ریتم متن */
.section__body h3 {
  margin: 1.9em 0 .6em; font-size: var(--fs-md); font-weight: 800;
  color: var(--brand-ink);
  padding-inline-start: 11px;
  border-inline-start: 4px solid var(--brand-400);
  line-height: 1.6;
}
.section__body h3:first-child, .section__body h4:first-child { margin-top: 0; }
.section__body h4 {
  margin: 1.5em 0 .5em; font-size: var(--fs-base); font-weight: 800; color: var(--ink);
}
.section__body p { margin: 0 0 1.05em; }
.section__body ul, .section__body ol { margin: 0 0 1.15em; padding-inline-start: 1.35em; }
.section__body li { margin-bottom: .45em; }
.section__body li::marker { color: var(--brand-400); font-weight: 700; }
.section__body strong, .section__body b { font-weight: 800; color: var(--ink); }
.section__body em { font-style: normal; color: var(--brand-700); font-weight: 600; }
.section__body blockquote {
  margin: 1.2em 0; padding: 12px 16px;
  border-inline-start: 4px solid var(--brand-300);
  background: var(--brand-50); border-radius: 0 var(--r-sm) var(--r-sm) 0;
  color: var(--ink-2);
}

/* هایلایت‌های درون‌متنی */
.hl, .highlight, mark, .hl-box {
  background: linear-gradient(180deg, transparent 52%, hsl(var(--h) var(--c) 84%) 52%);
  color: inherit; padding: 0 2px; border-radius: 2px;
}
.hl-red, .hl--red { background: linear-gradient(180deg, transparent 52%, hsl(354 80% 88%) 52%); }
.hl-green, .hl--green { background: linear-gradient(180deg, transparent 52%, hsl(158 60% 85%) 52%); }
.hl-gold, .hl--gold { background: linear-gradient(180deg, transparent 52%, hsl(43 92% 82%) 52%); }
.keyword, .key { color: var(--brand-700); font-weight: 800; }

/* ---------- 9. جعبه‌های هشدار/نکته ---------- */
.callout {
  --_c: var(--brand-500);
  --_bg: var(--brand-50);
  --_bd: var(--brand-200);
  margin: 1.15em 0;
  padding: 14px 16px;
  border-radius: var(--r-md);
  background: var(--_bg);
  border: 1px solid var(--_bd);
  border-inline-start: 4px solid var(--_c);
  color: var(--ink);
}
.callout > :first-child { margin-top: 0; }
.callout > :last-child { margin-bottom: 0; }
.callout__title, .box-title, .vm-box-title, .callout-title {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; font-size: var(--fs-sm);
  color: var(--_c); margin-bottom: 6px;
}
.callout--ok, .box-success, .gold-standard, .box-gold, .gold-box, .success {
  --_c: var(--gold); --_bg: var(--gold-bg); --_bd: hsl(43 90% 84%);
}
.callout--danger, .box-redflag, .redflag-box, .trap-box, .exam-trap-box, .box-trap, .danger, .critical {
  --_c: var(--danger); --_bg: var(--danger-bg); --_bd: hsl(354 78% 90%);
}
.callout--warn, .box-warning, .warning, .important {
  --_c: var(--warn); --_bg: var(--warn-bg); --_bd: hsl(38 90% 84%);
}
.callout--info, .box-important, .box-clinical, .alert-box, .alert, .info-card, .review-box, .edu-box, .exam-tip {
  --_c: var(--info); --_bg: var(--info-bg); --_bd: hsl(211 78% 88%);
}
.callout--yield, .box-yield, .high-yield, .highyield {
  --_c: var(--brand-600); --_bg: var(--brand-50); --_bd: var(--brand-200);
}

/* جعبهٔ کارتی (callout با ظاهر کارت) */
.callout--card {
  background: var(--_bg);
  box-shadow: var(--sh-1);
}
.callout--card.callout--danger { background: linear-gradient(180deg, var(--danger-bg), #fff 140%); }
.callout--card.callout--ok { background: linear-gradient(180deg, var(--gold-bg), #fff 140%); }
.callout--card.callout--yield { background: linear-gradient(180deg, var(--brand-50), #fff 140%); }
.callout--card.callout--info { background: linear-gradient(180deg, var(--info-bg), #fff 140%); }
.callout--card h3, .callout--card h4 {
  margin: 0 0 .5em; padding: 0; border: 0;
  font-size: var(--fs-base); color: var(--_c);
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
}
.section__body [class^="tag-"], .section__body [class*=" tag-"] {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .7rem; font-weight: 800; padding: 1px 8px; border-radius: var(--r-full);
  background: var(--surface-3); color: var(--ink-3); border: 1px solid var(--line);
  vertical-align: middle;
}
.deco-emoji { font-size: 1.05rem; }
.tag-hy, .tag--danger, .tag--gold, .tag--ok {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .68rem; font-weight: 800; padding: 2px 8px; border-radius: var(--r-full);
  background: hsl(0 0% 100% / .75); border: 1px solid currentColor;
  color: inherit; opacity: .85;
}

/* ---------- 10. گرید و کارت‌های محتوایی ---------- */
.grid, .grid-2, .grid-3, .grid-4, .grid-8, .dashboard-grid, .objectives-grid {
  display: grid; gap: 12px; margin: 1.15em 0;
  align-items: start;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
}
/* شبکهٔ اعداد/آمار: ستون‌های باریک‌تر */
.grid-stats, .grid-8:has(> .stat-card), .grid-8 {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 158px), 1fr));
}
@media (min-width: 1580px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.grid > *, .grid-2 > *, .grid-3 > *, .grid-4 > *, .grid-8 > * { min-width: 0; }

/* کارت‌های آمار / اعداد حیاتی */
.stat-card, .number-card, .num-card, .hy-num, .highyield-num, .hn, .dashboard-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 13px 14px;
  box-shadow: var(--sh-1);
  transition: transform .16s, box-shadow .16s, border-color .16s;
  overflow: hidden;
}
.stat-card::before, .number-card::before, .dashboard-card::before {
  content: ""; position: absolute; inset-block-start: 0; inset-inline: 0; height: 3px;
  background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
}
.stat-card:hover, .number-card:hover {
  transform: translateY(-2px); box-shadow: var(--sh-2); border-color: var(--brand-200);
}
.stat-number, .stat-num, .num-gold {
  display: block;
  font-size: clamp(1.25rem, 2.6vw, 1.6rem);
  font-weight: 900; line-height: 1.4;
  color: var(--brand-700);
}
.stat-label, .stat-desc {
  display: block; font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; line-height: 1.75;
}
.dashboard-card-title { font-weight: 800; font-size: var(--fs-sm); color: var(--brand-700); margin-bottom: 4px; }

/* کارت‌های عمومی درون متن */
.mini-card, .info-card, .section-card, .v-card, .card-gold, .v-box, .timeline-card, .rapid-card,
:where(div, section, article).card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 13px 15px;
  box-shadow: var(--sh-1);
}
.card-title, .mini-card-title, .vm-title, .card-header, .v-box-title,
.info-card-header, .box-header, .vm-header {
  font-weight: 800; font-size: var(--fs-sm); color: var(--brand-700);
  margin-bottom: 5px;
}
.card-title.align-start, .mini-card-title.align-start, .vm-title.align-start { margin-bottom: 7px; }
.card-body, .mini-card-body, .card-content { font-size: var(--fs-sm); color: var(--ink-2); }
.mini-card-badge {
  font-size: .7rem; font-weight: 800; padding: 2px 8px; border-radius: var(--r-full);
  background: var(--brand-100); color: var(--brand-700);
}
.card-icon, .icon, .section-icon {
  display: inline-grid; place-items: center;
  width: 30px; height: 30px; border-radius: var(--r-xs);
  background: var(--brand-50); color: var(--brand-600);
  font-size: .95rem; flex: none;
}

/* کارت متنی هم‌تراز (عنوان + متن) */
.align-start { display: flex; align-items: flex-start; gap: 9px; }
.align-start > .txt { flex: 1; min-width: 0; }
.align-start > .ic {
  flex: none; display: grid; place-items: center;
  width: 30px; height: 30px; border-radius: var(--r-xs);
  background: var(--brand-50); border: 1px solid var(--brand-100);
  font-size: .95rem;
}
.deco-emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; line-height: 1; }

/* ---------- 11. جدول ---------- */
.table-wrap, .table-container, .table-responsive {
  margin: 1.15em 0; overflow-x: auto;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); box-shadow: var(--sh-1);
  -webkit-overflow-scrolling: touch;
}
.table-wrap table, .table-container table, .table-responsive table,
.section__body > table {
  width: 100%; border-collapse: collapse; font-size: var(--fs-sm);
  min-width: 100%;
}
@media (max-width: 620px) {
  .table-wrap table, .table-container table, .table-responsive table { min-width: 460px; }
}
.section__body > table { min-width: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.section__body th, .table-wrap th, .table-container th {
  background: var(--brand-50);
  color: var(--brand-800);
  font-weight: 800; font-size: var(--fs-xs);
  text-align: right; padding: 10px 12px;
  border-bottom: 1px solid var(--brand-200);
  position: sticky; top: 0; z-index: 1;
  white-space: nowrap;
}
.section__body td, .table-wrap td, .table-container td {
  padding: 9px 12px; border-bottom: 1px solid var(--line-soft);
  vertical-align: top; line-height: 1.85;
  overflow-wrap: break-word; word-break: normal;
}
.section__body th, .table-wrap th, .table-container th { overflow-wrap: break-word; }
.section__body tbody tr:last-child td { border-bottom: 0; }
.section__body tbody tr:nth-child(even), .table-wrap tbody tr:nth-child(even) { background: var(--surface-2); }
.section__body tbody tr:hover, .table-wrap tbody tr:hover { background: var(--brand-50); }
td .num, td .hn { color: var(--brand-700); font-weight: 800; }

/* ---------- 12. فلش‌کارت / آکاردئون ---------- */
details {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin: 0 0 9px;
  box-shadow: var(--sh-1);
  overflow: hidden;
  transition: border-color .16s, box-shadow .16s;
}
details[open] { border-color: var(--brand-200); box-shadow: var(--sh-2); }
details > summary {
  cursor: pointer; list-style: none;
  padding: 12px 15px;
  font-weight: 700; font-size: var(--fs-sm);
  color: var(--ink); background: var(--surface-2);
  display: flex; align-items: center; gap: 10px;
  transition: background .15s, color .15s;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before {
  content: ""; flex: none;
  width: 8px; height: 8px;
  border-inline-start: 2px solid var(--brand-500);
  border-bottom: 2px solid var(--brand-500);
  transform: rotate(-45deg); transition: transform .18s;
  margin-inline-start: 2px;
}
details[open] > summary::before { transform: rotate(45deg); }
details > summary:hover { background: var(--brand-50); color: var(--brand-800); }
details[open] > summary { border-bottom: 1px solid var(--line-soft); color: var(--brand-800); }
.details-content, .flashcard-content, .flashcard-answer, .flash-answer, .accordion-content, .explanation-content, .mcq-explanation-content {
  padding: 13px 15px; font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.95;
}
.details-content > *:last-child, .flashcard-content > *:last-child { margin-bottom: 0; }
/* فلش‌کارت‌ها با رنگ درس */
.flashcard { border-color: var(--brand-200); }
.flashcard > summary { background: var(--brand-50); color: var(--brand-800); }
.flashcard-answer { background: linear-gradient(180deg, var(--surface), var(--surface-2)); }

/* ---------- 13. مکعب سؤال (MCQ) ---------- */
.mcq-container { display: grid; gap: 14px; margin: 1.2em 0; }
.mcq-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-1);
}
.mcq-header {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 15px; background: var(--surface-2);
  border-bottom: 1px solid var(--line-soft);
}
.mcq-number, .mcq-badge {
  flex: none; display: inline-grid; place-items: center;
  min-width: 26px; height: 26px; padding: 0 8px;
  border-radius: var(--r-full);
  background: var(--brand-600); color: #fff;
  font-size: .76rem; font-weight: 800; font-variant-numeric: tabular-nums;
}
.mcq-title { font-weight: 800; font-size: var(--fs-sm); color: var(--brand-800); }
.mcq-vignette, .mcq-question, .mcq-text {
  padding: 13px 15px 4px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink);
}
.mcq-options { display: grid; gap: 7px; padding: 10px 15px 13px; }
.mcq-option, .mcq-option-item, .mcq-opt, .option-item {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 9px 12px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface);
  font-size: var(--fs-sm); line-height: 1.85;
  transition: background .14s, border-color .14s;
}
.mcq-option:hover, .option-item:hover { background: var(--brand-50); border-color: var(--brand-200); }
.mcq-option-letter, .option-circle {
  flex: none; display: inline-grid; place-items: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-3); color: var(--ink-2);
  font-size: .72rem; font-weight: 800; margin-top: 2px;
}
.correct-answer-banner, .answer, .correct {
  display: flex; gap: 9px; align-items: center;
  margin: 0 15px 12px; padding: 9px 13px;
  border-radius: var(--r-sm);
  background: var(--ok-bg); border: 1px solid hsl(158 55% 82%);
  color: hsl(158 65% 26%); font-weight: 800; font-size: var(--fs-sm);
}
.mcq-explanation, .mcq-solution, .explanation-section {
  margin: 0 15px 14px; padding: 12px 14px;
  border-radius: var(--r-sm);
  background: var(--info-bg); border: 1px solid hsl(211 70% 88%);
  font-size: var(--fs-sm); color: var(--ink-2);
}
.mcq-explanation-details, .mcq-explanation-trigger { margin: 0 15px 14px; }
.mcq-explanation-details > summary { border-radius: var(--r-sm); background: var(--info-bg); color: var(--info); }

/* ---------- 14. الگوریتم/فلوچارت ---------- */
.algo-box, .flow, .flowchart { display: grid; gap: 8px; margin: 1.15em 0; }
.algo-node, .flow-node, .flow-step, .step {
  position: relative;
  padding: 10px 14px; border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line);
  border-inline-start: 3px solid var(--brand-400);
  font-size: var(--fs-sm); box-shadow: var(--sh-1);
}
.algo-node.decision, .flow-node.decision, .decision {
  background: var(--gold-bg); border-color: hsl(43 90% 84%); border-inline-start-color: var(--gold);
  font-weight: 700;
}
.algo-node.action, .action { background: var(--info-bg); border-color: hsl(211 78% 88%); border-inline-start-color: var(--info); }
.algo-node.danger-node, .danger-node { background: var(--danger-bg); border-color: hsl(354 78% 90%); border-inline-start-color: var(--danger); }
.algo-node.success-node, .success-node { background: var(--ok-bg); border-color: hsl(158 55% 84%); border-inline-start-color: var(--ok); }
.algo-arrow, .flow-arrow {
  display: grid; place-items: center;
  color: var(--brand-400); font-size: 1rem; line-height: 1;
}
.algo-branch-path, .algo-branches { display: grid; gap: 8px; }
.branch-label, .label, .tag, .badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: var(--r-full);
  font-size: .74rem; font-weight: 800;
  background: var(--brand-50); color: var(--brand-700);
  border: 1px solid var(--brand-200);
}
.tag-gold, .badge-warning { background: var(--gold-bg); color: var(--gold); border-color: hsl(43 90% 84%); }
.tag-red, .badge-danger { background: var(--danger-bg); color: var(--danger); border-color: hsl(354 78% 90%); }
.badge-success { background: var(--ok-bg); color: var(--ok); border-color: hsl(158 55% 84%); }
.badge-purple { background: var(--brand-100); color: var(--brand-700); border-color: var(--brand-200); }

/* ---------- 15. تایم‌لاین / لیست‌های ویژه ---------- */
.timeline { display: grid; gap: 0; margin: 1.15em 0; position: relative; }
.timeline-item {
  position: relative; padding: 0 22px 16px 0;
  border-inline-start: 2px solid var(--brand-200);
  margin-inline-start: 6px;
}
.timeline-item::before {
  content: ""; position: absolute; inset-inline-start: -6px; top: 8px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--brand-500);
}
.timeline-time { font-size: var(--fs-xs); font-weight: 800; color: var(--brand-600); }
.timeline-title { font-weight: 800; font-size: var(--fs-sm); }
.timeline-content { font-size: var(--fs-sm); color: var(--ink-2); }
.custom-bullets, .custom-list, .styled-list { list-style: none; padding-inline-start: 0; }
.custom-bullets > li, .custom-list > li, .styled-list > li {
  position: relative; padding-inline-start: 1.5em;
}
.custom-bullets > li::before, .custom-list > li::before, .styled-list > li::before {
  content: ""; position: absolute; inset-inline-start: .35em; top: .78em;
  width: 7px; height: 7px; border-radius: 2px;
  background: var(--brand-400); transform: rotate(45deg);
}

/* نوار پیشرفت/برجستگی */
.bar, .progress-bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > i, .progress-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-400), var(--brand-600)); }

/* ---------- 16. دکمه‌های بالای صفحه / FAB ---------- */
.to-top {
  position: fixed; inset-inline-end: 18px; inset-block-end: 18px; z-index: 70;
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--brand-600); color: #fff; border: 0;
  box-shadow: var(--sh-brand); cursor: pointer;
  opacity: 0; transform: translateY(12px) scale(.9); pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.to-top.is-on { opacity: 1; transform: none; pointer-events: auto; }

/* ---------- 17. فوتر ---------- */
.site-footer {
  border-top: 1px solid var(--line); background: var(--surface);
  padding-block: 22px; font-size: var(--fs-sm); color: var(--ink-3);
}
.site-footer .wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.site-footer a { color: var(--ink-2); }

/* ---------- 18. لایهٔ تطبیق برای مارک‌آپ قدیمی ---------- */
/* این کلاس‌ها در فایل‌های قدیمی زیاد استفاده شده‌اند و اینجا خنثی/هم‌شکل می‌شوند */
.container { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
.section-wrapper { margin: 0; }
.sidebar-widget, .widget-item { font-size: var(--fs-sm); }
.sidebar-item, .sidebar-link { color: var(--ink-2); }
.mnemonic, .mnemonic-item {
  border-radius: var(--r-md); background: var(--brand-50);
  border: 1px dashed var(--brand-300); padding: 12px 14px; margin: 1em 0;
}
.mnemonic-letter-box {
  display: inline-grid; place-items: center; width: 26px; height: 26px;
  border-radius: var(--r-xs); background: var(--brand-600); color: #fff;
  font-weight: 900; font-size: .78rem; margin-inline-end: 6px;
}
.g-cell, .wg-cell, .g-header {
  border: 1px solid var(--line); padding: 8px 10px; font-size: var(--fs-sm);
  background: var(--surface);
}
.g-header { background: var(--brand-50); font-weight: 800; color: var(--brand-800); }
.hero-badge, .header-tag, .header-meta, .hero-meta-item { font-size: var(--fs-xs); }
.bold, .bold-point, .key-point { font-weight: 800; }
.drug { color: var(--brand-700); font-weight: 700; }
.ltr, .en { font-family: var(--font-num); }
.mb-4 { margin-bottom: 1.4rem; }
.col-2, .col-4 { min-width: 0; }

/* آیکون‌های درون‌خطی */
.sicon { flex: none; vertical-align: -.18em; }
.section__ico .sicon, .pill .sicon, .subj-chip .sicon, .lesson-card__icon .sicon,
.subject-card__icon .sicon, .brand__mark .sicon { display: block; }
@media print {
  .site-header, .subnav, .rail, .to-top { display: none !important; }
  .hero { padding-top: 0 !important; }
  .section { break-inside: avoid-page; box-shadow: none; }
  body { background: #fff; }
}

/* کتابخانه — صفحهٔ خانه و صفحهٔ درس‌ها */
.lib-page { background: var(--bg); }

/* هدر */
.brand { display: flex !important; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; flex: none; }
.brand:hover { text-decoration: none; }
.brand__mark {
  width: 36px; height: 36px; border-radius: var(--r-sm);
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, hsl(222 60% 52%), hsl(258 55% 48%));
  box-shadow: 0 6px 16px hsl(222 60% 45% / .3);
}
.brand__text { display: grid; line-height: 1.25; }
.brand__text b { font-size: .95rem; font-weight: 800; }
.brand__text small { font-size: .7rem; color: var(--ink-3); font-weight: 600; }
.hdr-search { flex: 1; max-width: 420px; margin-inline-start: auto; }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 700; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  transition: all .15s; text-decoration: none; flex: none;
}
.btn:hover { border-color: var(--brand-300); color: var(--brand-700); text-decoration: none; }

/* هیرو */
.lib-hero {
  position: relative; overflow: hidden;
  padding-block: clamp(26px, 5vw, 58px) clamp(22px, 4vw, 44px);
  background:
    radial-gradient(900px 320px at 88% -20%, hsl(258 60% 90%) 0%, transparent 60%),
    radial-gradient(700px 280px at 6% 0%, hsl(200 70% 92%) 0%, transparent 58%),
    linear-gradient(180deg, #fbfbff, var(--bg));
  border-bottom: 1px solid var(--line);
}
.lib-hero--subject {
  background:
    radial-gradient(900px 320px at 88% -20%, hsl(var(--h) var(--c) 90%) 0%, transparent 60%),
    radial-gradient(700px 280px at 6% 0%, hsl(calc(var(--h) + 30) calc(var(--c) * .7) 93%) 0%, transparent 58%),
    linear-gradient(180deg, var(--brand-50), var(--bg));
}
.lib-hero__top { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.lib-hero h1 {
  margin: 0 0 12px; font-size: clamp(1.5rem, 4.6vw, 2.5rem);
  font-weight: 900; line-height: 1.45; letter-spacing: -.015em; text-wrap: balance;
  color: var(--ink);
}
.lib-hero--subject h1 { color: var(--brand-ink); }
.lib-hero__lede { margin: 0; max-width: 68ch; color: var(--ink-2); font-size: var(--fs-md); }
.lib-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.lib-stat {
  background: hsl(0 0% 100% / .8); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 10px 16px; min-width: 92px;
  box-shadow: var(--sh-1);
}
.lib-stat b { display: block; font-size: 1.35rem; font-weight: 900; color: var(--brand-700); line-height: 1.3; }
.lib-stat span { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 700; }

/* بدنه */
.lib-main { padding-block: clamp(22px, 3.4vw, 40px) 70px; }
.lib-block { margin-bottom: clamp(26px, 4vw, 44px); }
.lib-block__head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.lib-block__head h2 {
  margin: 0; font-size: var(--fs-lg); font-weight: 900;
  display: flex; align-items: center; gap: 9px;
}
.lib-block__head h2::before {
  content: ""; width: 5px; height: 20px; border-radius: 3px;
  background: linear-gradient(180deg, var(--brand-400), var(--brand-600));
}
.lib-block__head .muted { font-size: var(--fs-xs); }

/* کارت درس */
.subject-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
.subject-card {
  position: relative; display: flex !important; flex-direction: column; gap: 5px;
  padding: 15px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--sh-1); text-decoration: none; color: inherit;
  overflow: hidden; transition: transform .18s, box-shadow .18s, border-color .18s;
}
.subject-card::after {
  content: ""; position: absolute; inset-block-end: 0; inset-inline: 0; height: 3px;
  background: linear-gradient(90deg, hsl(var(--h) var(--c) 62%), hsl(var(--h) var(--c) 44%));
  transform: scaleX(.25); transform-origin: right; transition: transform .22s;
}
.subject-card:hover { transform: translateY(-3px); box-shadow: var(--sh-3); border-color: hsl(var(--h) var(--c) 84%); text-decoration: none; }
.subject-card:hover::after { transform: scaleX(1); }
.subject-card__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.subject-card__icon {
  width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center;
  font-size: 1.15rem;
  background: hsl(var(--h) var(--c) 95%); border: 1px solid hsl(var(--h) var(--c) 88%);
}
.subject-card__count {
  font-size: .7rem; font-weight: 800; color: var(--ink-3);
  background: var(--surface-3); padding: 3px 9px; border-radius: var(--r-full);
  border: 1px solid var(--line-soft);
}
.subject-card__name { font-size: 1.02rem; font-weight: 800; color: var(--ink); }
.subject-card__en { font-size: .72rem; color: var(--ink-4); font-weight: 600; }
.subject-card__meta { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; margin-top: 4px; }

/* کارت درسنامه */
.lesson-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
@media (min-width: 1000px) { .lesson-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lesson-grid { grid-template-columns: 1fr; } }
.lesson-card {
  display: flex !important; flex-direction: row !important; align-items: center; gap: 12px;
  padding: 13px 14px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--sh-1); text-decoration: none; color: inherit;
  transition: transform .16s, box-shadow .16s, border-color .16s, background .16s;
}
.lesson-card:hover {
  transform: translateY(-2px); text-decoration: none;
  border-color: hsl(var(--h) var(--c) 84%);
  box-shadow: var(--sh-2);
  background: linear-gradient(180deg, var(--surface), hsl(var(--h) var(--c) 98%));
}
.lesson-card__icon {
  flex: none; width: 40px; height: 40px; border-radius: var(--r-sm);
  display: grid; place-items: center; font-size: 1.1rem;
  background: hsl(var(--h) var(--c) 95%); border: 1px solid hsl(var(--h) var(--c) 88%);
}
.lesson-card__body { display: grid; gap: 2px; min-width: 0; flex: 1; }
.lesson-card__sub { font-size: .68rem; font-weight: 800; color: hsl(var(--h) var(--c) 40%); }
.lesson-card__title { font-size: .92rem; font-weight: 700; color: var(--ink); line-height: 1.65; }
.lesson-card__meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: .7rem; color: var(--ink-3); font-weight: 600; }
.lc-badge {
  background: var(--surface-3); border: 1px solid var(--line-soft);
  padding: 1px 7px; border-radius: var(--r-full);
}
.lesson-card__go { flex: none; color: var(--ink-4); font-size: 1rem; transition: transform .16s, color .16s; }
.lesson-card:hover .lesson-card__go { transform: translateX(-4px); color: hsl(var(--h) var(--c) 50%); }

.lib-empty { text-align: center; color: var(--ink-3); padding: 30px 0; font-weight: 600; }

@media (max-width: 640px) {
  .brand__text small { display: none; }
  .hdr-search { order: 3; flex-basis: 100%; max-width: none; }
  .site-header__bar { flex-wrap: wrap; }
}

/* کارت «به‌زودی» */
.subject-card.is-soon {
  cursor: default;
  border-style: dashed;
  border-color: var(--line);
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  box-shadow: none;
  opacity: .94;
}
.subject-card.is-soon::after { display: none; }
.subject-card.is-soon:hover { transform: none; box-shadow: none; border-color: var(--line); }
.subject-card.is-soon .subject-card__icon {
  background: var(--surface-3);
  border-color: var(--line);
  color: var(--ink-3);
  opacity: .85;
}
.subject-card.is-soon .subject-card__name { color: var(--ink-2); }
.soon-badge {
  font-size: .7rem; font-weight: 800;
  padding: 3px 9px; border-radius: var(--r-full);
  background: hsl(var(--h) var(--c) 96%);
  color: hsl(var(--h) var(--c) 40%);
  border: 1px dashed hsl(var(--h) var(--c) 72%);
}

/* ---------- نوار معرفی بانک سؤال ---------- */
.qb-teaser__in {
  display: grid; gap: clamp(16px, 3vw, 28px);
  padding: clamp(18px, 3vw, 28px);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  box-shadow: 0 1px 2px hsl(220 30% 20% / .04);
}
@media (min-width: 900px) { .qb-teaser__in { grid-template-columns: 1.35fr 1fr; align-items: center; } }
.qb-teaser__txt h2 { margin: 10px 0 8px; font-size: clamp(1.05rem, 2.4vw, 1.35rem); }
.qb-teaser__txt p { margin: 0; color: var(--ink-2); font-size: .9rem; line-height: 2; max-width: 62ch; }
.qb-teaser__links { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
@media (max-width: 420px) { .qb-teaser__links { grid-template-columns: 1fr; } }
.qb-chip-link {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 13px; border-radius: var(--r-sm);
  border: 1px solid hsl(var(--h) var(--c) 88%);
  background: hsl(var(--h) var(--c) 97%);
  text-decoration: none;
}
.qb-chip-link:hover { border-color: hsl(var(--h) var(--c) 70%); text-decoration: none; }
.qb-chip-link b { font-size: .84rem; color: hsl(var(--h) var(--c) 32%); font-weight: 800; }
.qb-chip-link span { font-size: .74rem; color: var(--ink-3); font-weight: 600; }
.qb-teaser__all {
  grid-column: 1 / -1; justify-self: start;
  font-size: .84rem; font-weight: 700; color: var(--brand-700);
  white-space: nowrap; padding-inline-start: 2px;
}

/* ==========================================================================
   MediLibrary — استایل بانک سؤال
   از همان توکن‌های base.css استفاده می‌کند؛ رنگ درس از --h/--c می‌آید،
   پس هر درس آزمونش را با هویت رنگی خودش می‌بیند.
   ========================================================================== */

/* ---------- هدر بخش ---------- */
.qb-hero { padding: clamp(26px, 5vw, 52px) 0 clamp(18px, 3vw, 28px); }
.qb-hero h1 { font-size: clamp(1.5rem, 4.2vw, 2.3rem); margin: 10px 0 8px; letter-spacing: -.4px; }
.qb-hero__lede { color: var(--ink-2); max-width: 60ch; line-height: 2; margin: 0; }
.qb-hero__meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.qb-hero__meta .pill { font-size: .8rem; }

/* ---------- نوار ابزار ---------- */
.qb-toolbar {
  position: sticky; top: 0; z-index: 20;
  background: hsl(0 0% 100% / .9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 10px 0;
  margin-bottom: 20px;
}
.qb-toolbar__in { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.qb-toolbar select, .qb-toolbar button {
  font-family: inherit; font-size: .82rem; font-weight: 600;
  padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  cursor: pointer;
}
.qb-toolbar select:focus-visible, .qb-toolbar button:focus-visible { outline: 2px solid var(--brand-400); outline-offset: 2px; }
.qb-toolbar button[aria-pressed="true"] { background: var(--brand-600); border-color: transparent; color: #fff; }
.qb-progress { flex: 1 1 190px; min-width: 150px; display: flex; flex-direction: column; gap: 5px; }
.qb-progress__track { height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.qb-progress__track > i { display: block; height: 100%; width: 0; background: var(--brand-500); border-radius: 99px; transition: width .25s ease; }
.qb-progress__text { font-size: .74rem; color: var(--ink-3); font-weight: 700; font-variant-numeric: tabular-nums; }
.qb-stats { display: flex; gap: 6px; flex-wrap: wrap; }
.qb-stat {
  font-size: .74rem; font-weight: 700; color: var(--ink-3);
  background: var(--surface-3); border-radius: 99px; padding: 5px 10px;
  display: inline-flex; gap: 5px; align-items: baseline;
}
.qb-stat b { color: var(--ok); font-size: .86rem; font-variant-numeric: tabular-nums; }
.qb-stat--bad b { color: var(--danger); }

/* ---------- کارت سؤال ---------- */
.qb-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.qb-head__meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.qb-badge {
  font-size: .78rem; font-weight: 800; color: #fff; background: var(--brand-600);
  padding: 5px 11px; border-radius: 99px; font-variant-numeric: tabular-nums;
}
.qb-chip {
  font-size: .74rem; font-weight: 700; color: var(--brand-700);
  background: var(--brand-50); border: 1px solid var(--brand-100);
  padding: 4px 9px; border-radius: 99px;
}
.qb-chip--alt { color: var(--ink-3); background: var(--surface-3); border-color: var(--line-soft); }
.qb-chapter-name { font-size: .8rem; color: var(--ink-3); font-weight: 600; margin-bottom: 14px; }

.qb-stem {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: clamp(15px, 2.6vw, 24px);
  box-shadow: 0 1px 2px hsl(220 30% 20% / .04);
}
.qb-stem p { margin: 0; font-size: 1.02rem; line-height: 2.05; color: var(--ink); }

/* ---------- تصویر سؤال (بانک‌های تصویردار، مثل ارتوپدی) ---------- */
.qb-figure {
  margin: 14px 0 2px; padding: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg);
  display: grid; gap: 8px; justify-items: center;
}
.qb-figure img {
  display: block; max-width: 100%; height: auto;
  border-radius: var(--r-md); background: #fff;
  cursor: zoom-in; touch-action: manipulation;
}
.qb-figure img:focus-visible { outline: 3px solid var(--brand-400); outline-offset: 3px; }
.qb-figure figcaption { font-size: .78rem; line-height: 1.9; color: var(--ink-3); text-align: center; }
.qb-figure__credit { color: var(--ink-4); }
.qb-figure__src { font-size: .74rem; font-weight: 700; color: var(--brand-700); }
.qb-figure--broken { padding-block: 16px; }
.qb-figure--broken img { display: none; }
.qb-figure--broken::before { content: "تصویر این سؤال بارگذاری نشد."; font-size: .8rem; color: var(--ink-3); }

/* لایهٔ بزرگ‌نمایی تصویر */
.qb-zoom {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-items: center; align-content: center; gap: 10px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px));
  background: hsl(220 32% 6% / .93);
  cursor: zoom-out;
}
.qb-zoom img { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 10px; background: #fff; }
.qb-zoom__credit { font-size: .78rem; color: #d6e1e9; text-align: center; }
.qb-zoom__hint { font-size: .72rem; color: #93a5b3; text-align: center; }
html.qb-zoom-open, html.qb-zoom-open body { overflow: hidden; }

/* ---------- گزینه‌ها ---------- */
.qb-options { display: grid; gap: 9px; margin: 14px 0 16px; }
.qb-opt {
  display: flex; align-items: flex-start; gap: 11px; width: 100%;
  text-align: right; font-family: inherit; font-size: .95rem; line-height: 1.95;
  padding: 13px 15px; border-radius: var(--r-md);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  cursor: pointer; transition: border-color .14s, background .14s, transform .14s;
}
.qb-opt:hover:not(:disabled) { border-color: var(--brand-300); background: var(--brand-50); transform: translateX(-2px); }
.qb-opt:disabled { cursor: default; }
.qb-opt__letter {
  flex: none; width: 27px; height: 27px; border-radius: 9px;
  display: grid; place-items: center;
  font-size: .78rem; font-weight: 800;
  background: var(--surface-3); color: var(--ink-3);
  margin-top: 2px;
}
.qb-opt__text { flex: 1; }
.qb-opt.is-correct { border-color: var(--ok); background: var(--ok-bg); }
.qb-opt.is-correct .qb-opt__letter { background: var(--ok); color: #fff; }
.qb-opt.is-wrong { border-color: var(--danger); background: var(--danger-bg); }
.qb-opt.is-wrong .qb-opt__letter { background: var(--danger); color: #fff; }

/* ---------- بازخورد ---------- */
.qb-feedback { display: grid; gap: 10px; margin-bottom: 18px; }
.qb-verdict {
  font-size: .9rem; font-weight: 800; padding: 10px 14px; border-radius: var(--r-md);
}
.qb-verdict--ok { color: hsl(158 62% 26%); background: var(--ok-bg); border: 1px solid hsl(158 62% 82%); }
.qb-verdict--bad { color: hsl(354 68% 34%); background: var(--danger-bg); border: 1px solid hsl(354 68% 86%); }
.qb-verdict--skip { color: hsl(211 78% 30%); background: var(--info-bg); border: 1px solid hsl(211 78% 84%); }
.qb-block {
  background: var(--surface); border: 1px solid var(--line);
  border-inline-start: 4px solid var(--brand-400);
  border-radius: var(--r-md); padding: 13px 16px;
}
.qb-block h4 {
  margin: 0 0 7px; font-size: .82rem; font-weight: 800;
  color: var(--brand-700); letter-spacing: -.1px;
}
.qb-block p, .qb-block li { margin: 0; font-size: .91rem; line-height: 1.95; color: var(--ink-2); }
.qb-block ul { margin: 0; padding-inline-start: 1.15em; display: grid; gap: 5px; }
.qb-block--why { border-inline-start-color: var(--info); }
.qb-block--why h4 { color: var(--info); }
.qb-block--wrong { border-inline-start-color: var(--danger); }
.qb-block--wrong h4 { color: var(--danger); }
.qb-block--pearl { border-inline-start-color: var(--gold); background: var(--gold-bg); }
.qb-block--pearl h4 { color: var(--gold); }
.qb-block--trap { border-inline-start-color: var(--warn); background: var(--warn-bg); }
.qb-block--trap h4 { color: var(--warn); }
.qb-block--hy { border-inline-start-color: var(--ok); }

/* ---------- ناوبری ---------- */
.qb-nav { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; padding-bottom: 10px; }
.qb-btn {
  font-family: inherit; font-size: .88rem; font-weight: 700;
  padding: 11px 18px; border-radius: 12px; cursor: pointer;
  border: 1.5px solid transparent; transition: transform .12s, background .14s;
}
.qb-btn:active { transform: scale(.97); }
.qb-btn--primary { background: var(--brand-600); color: #fff; }
.qb-btn--primary:hover:not(:disabled) { background: var(--brand-700); }
.qb-btn--ghost { background: var(--surface); color: var(--ink-2); border-color: var(--line); }
.qb-btn--ghost:hover:not(:disabled) { background: var(--brand-50); border-color: var(--brand-200); color: var(--brand-700); }
.qb-btn:disabled { opacity: .45; cursor: not-allowed; }
.qb-btn--sm { font-size: .78rem; padding: 8px 12px; margin-inline-start: auto; }

/* ---------- خلاصه ---------- */
.qb-summary {
  margin: 22px 0 10px; padding: clamp(15px, 3vw, 24px);
  border-radius: var(--r-lg); background: var(--brand-50);
  border: 1px solid var(--brand-100);
}
.qb-summary h3 { margin: 0 0 14px; font-size: 1rem; color: var(--brand-800); }
.qb-summary__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 9px; }
.qb-summary__cell {
  background: var(--surface); border-radius: var(--r-md); padding: 13px 8px;
  text-align: center; border: 1px solid var(--line-soft);
}
.qb-summary__cell b { display: block; font-size: 1.35rem; font-weight: 800; color: var(--brand-700); font-variant-numeric: tabular-nums; }
.qb-summary__cell span { font-size: .74rem; color: var(--ink-3); font-weight: 600; }
.qb-summary__cell--ok b { color: var(--ok); }
.qb-summary__cell--bad b { color: var(--danger); }

.qb-empty, .qb-error {
  padding: 22px; border-radius: var(--r-md); text-align: center;
  font-size: .9rem; line-height: 1.9;
}
.qb-empty { background: var(--surface-3); color: var(--ink-3); }
.qb-error { background: var(--danger-bg); color: hsl(354 68% 30%); border: 1px solid hsl(354 68% 86%); }

@media (max-width: 700px) {
  /* نوار ابزار در موبایل چسبان نباشد تا صفحهٔ سؤال کوچک نشود */
  .qb-toolbar { position: static; padding: 8px 0; }
  .qb-toolbar__in { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .qb-toolbar__in > select { width: 100%; font-size: .78rem; padding: 8px 9px; }
  #qb-reveal { grid-column: 1 / -1; font-size: .78rem; padding: 8px; }
  .qb-progress { grid-column: 1 / -1; }
  .qb-btn--sm { margin-inline-start: 0; }
  .qb-opt { font-size: .9rem; padding: 12px 13px; }
  .qb-nav { display: grid; grid-template-columns: 1fr 1fr; }
  .qb-nav .qb-btn--sm { grid-column: 1 / -1; }
  .qb-head__meta .qb-chip--alt { display: none; }
  .qb-stem p { font-size: .96rem; }
  .qb-figure { padding: 9px; margin-block: 12px 0; }
  .qb-figure img { max-height: 44vh; width: auto; }
  .qb-zoom img { max-height: 68vh; }
}
@media print {
  .qb-toolbar, .qb-nav { display: none !important; }
  .qb-opt { break-inside: avoid; }
}

/* ---------- اصلاحات RTL و چیدمان پس از بازبینی مرورگر ---------- */
/* در RTL، نوار پیشرفت باید از راست پر شود و متن وضعیت راست‌چین باشد */
.qb-progress__text { text-align: start; }
.qb-stats--end { justify-content: flex-start; margin-top: 12px; }

/* کارت‌های فهرست: بدنه‌ها هم‌ارتفاع و دکمه‌ها پایین‌چین */
.qb-card { min-height: 100%; }
.qb-card h3 { min-height: 2.9em; }

</style>

 "bloom": "", "stem": "در ارزیابی بالینی و آزمایشگاهی بیمار مشکوک به پنومونی اکتسابی جامعه (CAP)، کدام گزاره دربارهٔ دقت معاینهٔ فیزیکی و بیومارکرهای پروکلسی‌تونین (PCT) و CRP با فصل ۱۳۱ هریسون ۲۰۲۵ تطابق دارد؟", "options": ["CRP برای افتراق پنومونی باکتریال از ویروسی بسیار حساس‌تر از PCT و کشت خون است", "تست PCT منفی به تنهایی شروع آنتی‌بیوتیک را در بیمار بستری با CAP منتفی می‌کند", "حساسیت معاینه >۹۰٪ است و در گرافی نرمال، کراکل برای تشخیص CAP کافی است", "حساسیت/ویژگی معاینه ۵۸٪ و ۶۷٪ است؛ PCT پایین نباید مانع شروع آنتی‌بیوتیک شود"], "correct": 3, "explanation": "مطابق فصل ۱۳۱ هریسون ۲۰۲۵ (صفحهٔ ۱۰۶۸–۱۰۶۹)، حساسیت و ویژگی یافته‌های معاینهٔ فیزیکی در تشخیص پنومونی به‌ترتیب تنها ۵۸٪ و ۶۷٪ است و تشخیص CAP نیازمند شرح حال بالینی سازگار همراه با ارتشاح جدید در رادیوگرافی قفسهٔ سینه است. علاوه بر این، سطح پروکلسی‌تونین (PCT) هرگز نباید مبنای خودداری از شروع آنتی‌بیوتیک تجربی اولیه باشد، و CRP حتی از PCT نیز برای شناسایی پاتوژن‌های باکتریال کمتر حساس تلقی می‌شود.", "whyWrong": {"0": "نادرست؛ CRP حتی از PCT هم در شناسایی پاتوژن باکتریال حساسیت کمتری دارد.", "1": "نادرست؛ PCT پایین ممکن است در اوایل عفونت یا عفونت‌های موضعی/آتیپیک رخ دهد و نباید مانع شروع آنتی‌بیوتیک اولیه شود.", "2": "نادرست؛ حساسیت و ویژگی معاینه پایین است (۵۸٪ و ۶۷٪) و گرافی قفسه سینه برای تأیید ارتشاح جدید ضروری است."}, "pearl": "بیومارکرهایی مثل PCT می‌توانند در استوارشیپ آنتی‌بیوتیکی و تصمیم قطع زودهنگام درمان در کنار سیر بالینی کمک کنند، نه در محروم‌سازی بیمار بدحال از دوز اول آنتی‌بیوتیک.", "trap": "بسیاری از سوالات تستی نقش PCT در قطع آنتی‌بیوتیک (Stewardship) را به اشتباه به‌عنوان ابزار رد درمان اولیه مطرح می‌کنند.", "highYield": "معاینه در CAP: حساسیت ۵۸٪، ویژگی ۶۷٪؛ PCT برای شروع‌نکردن آنتی‌بیوتیک استفاده نمی‌شود؛ CRP کمتر از PCT حساس است.", "questionType": "basic", "questionTypeLabel": "علوم پایهٔ کاربردی (Basic Science Integration)", "coverageIndex": "فصل 131 / موضوع 2", "topicIndex": 2, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1025–1026", "referenceSection": "Diagnosis & Biomarkers in CAP", "id": "inf-012"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 133, "chapterTitle": "اندوکاردیت عفونی", "topic": "اندوکاردیت عفونی", "subtopic": "Imaging & Serology/PCR Major Criteria", "difficulty": "خیلی دشوار", "bloom": "", "stem": "مرد ۶۳ ساله‌ای با دریچهٔ مصنوعی آئورت از دو سال پیش، با تب طول‌کشیده، کاهش وزن و کشت‌های خون سریالی منفی مراجعه کرده است. در TTE و TEE تصویر به‌علت آرتیفکت فلزی دریچه مبهم است. بر اساس معیارهای ۲۰۲۳ Duke-ISCVID در هریسون ۲۰۲۵، کدام یافته می‌تواند یک معیار ماژور تصویربرداری یا آزمایشگاهی را در این بیمار تأمین کند؟", "options": ["کشت مثبت Bartonella از ضایعهٔ پوستی غیرعروقی یا ESR بالای ۸۰ mm/h", "فعالیت غیرطبیعی دریچه مصنوعی در PET/CT یا IgG فاز ۱ کوکسیلا ≥1:800", "یافتن ندول اوسلر به همراه اسپلنومگالی و تب بالا در معاینهٔ بالینی اولیه", "شنیده شدن سوفل رگورژیتاسیون جدید در سمع بالینی بدون تأیید اکوکاردیوگرافی"], "correct": 1, "explanation": "در معیارهای به‌روزشدهٔ ۲۰۲۳ Duke-ISCVID (جدول ۱۳۳-۳ هریسون ۲۰۲۵): (۱) تصویربرداری FDG-PET/CT با فعالیت متابولیک غیرطبیعی روی دریچهٔ طبیعی یا مصنوعی، گرافت آئورت صعودی یا لیدهای دستگاه قلبی و نیز CT قلب به‌عنوان معیار ماژور تصویربرداری (هم‌ارز اکوکاردیوگرافی) اضافه شده است؛ (۲) از نظر آزمایشگاهی، PCR مثبت خون برای Coxiella burnetii، Bartonella spp. یا Tropheryma whipplei، یا تک‌کشت مثبت برای C. burnetii یا تیتر آنتی‌بادی IgG فاز I >= 1:800 یا IFA IgG با تیتر >= 1:800 برای Bartonella henselae/quintana معیار ماژور محسوب می‌شوند. توجه کنید که سمع سوفل جدید بدون شواهد اکو دیگر کافی نیست!", "whyWrong": {"0": "نادرست؛ کشت یا PCR مثبت از محل غیراندوواسکولار تنها معیار مینور است و ESR بالا معیار دوک نیست.", "2": "نادرست؛ ندول اوسلر یک معیار مینور ایمونولوژیک است و اسپلنومگالی حتی در معیارهای جدید دوک جزو معیارها نیست.", "3": "نادرست؛ جدول ۱۳۳-۳ صراحتاً یادآوری می‌کند که شنیدن سوفل جدید یا تشدیدشونده به‌تنهایی کافی نیست و نیازمند شواهد اکوکاردیوگرافی است."}, "pearl": "سه تست غیرکشتی که در Duke-ISCVID 2023 معیار ماژور می‌شوند: (۱) PCR خون برای Coxiella، Bartonella یا Tropheryma whipplei؛ (۲) سرولوژی فاز I کوکسیلا >=1:800 یا IFA بارتونلا >=1:800؛ (۳) FDG-PET/CT یا CT قلب مثبت.", "trap": "در سوالات قدیمی‌تر سوفل جدید معیار بالینی کافی تصور می‌شد؛ هریسون ۲۰۲۵ با حروف بزرگ تصریح می‌کند: «new/worsening murmur is NOT sufficient; requires echocardiographic evidence».", "highYield": "FDG-PET/CT در پروتز قلبی و CT قلبی هم‌ارز اکوکاردیوگرافی معیار ماژور هستند؛ سوفل جدید در معاینه بدون تایید اکو دیگر معیار ماژور نیست.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 133 / موضوع 2", "topicIndex": 2, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1040–1041", "referenceSection": "Table 133-3 & FDG-PET/CT in Duke-ISCVID", "id": "inf-013"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 141, "chapterTitle": "عفونت‌های مقاربتی: مرور و رویکرد بالینی", "topic": "عفونت‌های مقاربتی", "subtopic": "Bacteriuria >=10^2 vs Sterile Pyuria Threshold", "difficulty": "خیلی دشوار", "bloom": "", "stem": "زن ۲۳ ساله‌ای با سوزش داخلی ادرار بدون ترشح واژن یا خارش ولوو، ۲ هفته پس از شروع رابطه با شریک جنسی جدید مراجعه کرده است. در آنالیز ادرار جت میانی، پیوری واضح دیده می‌شود و کشت ادرار کمتر از ۱۰^۲ باکتری اوروپاتوژن متعارف در میلی‌لیتر نشان می‌دهد. بر اساس فصل ۱۴۱ هریسون ۲۰۲۵، تشخیص افتراقی این تظاهر و آستانهٔ باکتریوری E. coli در زن دیزوریک چگونه است؟", "options": ["تریکوموناس واژینالیس و واژینوز باکتریال هیچ ارتباطی با افزایش خطر انتقال HIV ندارند", "دیزوری خارجی هنگام تماس ادرار با ولو نشانهٔ پاتوگنومونیک پیلونفریت حاد باکتریال است", "برای تشخیص سیستیت باکتریال در زن دیزوریک حتماً ≥ ۱۰^۵ CFU/mL لازم است و ۱۰^۳ بی‌اهمیت است", "کشت ≥۱۰^۲ به نفع سیستیت و <۱۰^۲ با پیوری استریل به نفع کلامیدیا/گنوکوک"], "correct": 3, "explanation": "در فصل ۱۴۱ هریسون ۲۰۲۵ (صفحهٔ ۱۱۴۳) به‌دقت بیان شده است که در یک زن دیزوریک با پیوری و نمونهٔ تمیز میان‌جریان ادرار، یافتن یک پاتوژن متعارف ادراری مثل E. coli یا S. saprophyticus در غلظت ≥ ۱۰^۲/mL به نفع UTI باکتریال است؛ اما پیوری با کمتر از ۱۰^۲ اوروپاتوژن متعارف در میلی‌لیتر («پیوری استریل») در حضور ریسک فاکتور STI (سن کم، شریک جدید در ماه گذشته، شریک با اورتریت، یا سرویسیت هم‌زمان) مطرح‌کنندهٔ سندرم اورترال حاد ناشی از Chlamydia trachomatis یا Neisseria gonorrhoeae بوده و نیازمند آزمایش NAAT سواب واژینال/سرویکس است.", "whyWrong": {"0": "نادرست؛ صفحهٔ ۱۱۴۴ تصریح می‌کند که تریکومونیازیس، BV و کاندیدیازیس همگی با افزایش خطر اکتساب HIV همراه‌اند و BV انتقال HIV را از زن به مرد نیز تسهیل می‌کند.", "1": "نادرست؛ دیزوری خارجی نشانهٔ تماس ادرار با مخاط ملتهب/اولسرهٔ ولو در HSV یا کاندیدیازیس است نه پیلونفریت.", "2": "نادرست؛ حد ۱۰^۵ مربوط به باکتریوری بی‌علامت است و در زنان علامت‌دار با سیستیت حاد به حد ۱۰^۲ پایین می‌آید."}, "pearl": "پیوری + دیزوری داخلی + کشت منفی یا <10^2/mL در زن جوان با شریک جدید = NAAT برای Chlamydia و Gonorrhea ارسال کنید!", "trap": "نادیده گرفتن کشت ۱۰^۳ E. coli در زن دیزوریک به‌عنوان «کلنی کم» یا مرخص کردن زن با «پیوری استریل» بدون بررسی STI.", "highYield": "آستانهٔ UTI در زن علامت‌دار با پیوری: ≥ 10^2 CFU/mL؛ پیوری با < 10^2 = سندرم اورترال حاد (کلامیدیا / گنوکوک).", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 141 / موضوع 2", "topicIndex": 2, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1100–1101", "referenceSection": "Urethral Syndrome & Vulvovaginal Infections", "id": "inf-014"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 143, "chapterTitle": "مننژیت حاد", "topic": "مننژیت حاد", "subtopic": "Repeat LP & Intraventricular vs Intrathecal Vancomycin", "difficulty": "خیلی دشوار", "bloom": "", "stem": "بیمار ۵۷ ساله‌ای با مننژیت ناشی از Streptococcus pneumoniae مقاوم به پنی‌سیلین و سفتریاکسون (تحت درمان با سفتریاکسون و ونکومایسین وریدی) ۳۶ ساعت پس از شروع درمان در LP مجدد همچنان رشد استرپتوکوک در کشت CSF دارد و از نظر بالینی بهبود نیافته است. بر اساس فصل ۱۴۳ هریسون ۲۰۲۵، چرا تکرار LP در ۲۴–۳۶ ساعت اهمیت دارد و در صورت عدم پاسخ به ونکومایسین وریدی کدام مسیر تجویز ارجح است؟", "options": ["عدم استریل CSF در ۲۴–۳۶ ساعت مطرح‌کنندهٔ مقاومت است؛ ونکومایسین داخل‌بطنی بر اینتراتکال ارجح است", "باید ونکومایسین را فوری قطع کرد و صرفاً دوز دگزامتازون وریدی را به دو برابر افزایش داد", "تکرار LP در ۲۴–۳۶ ساعت در مننژیت پنوموکوکی ممنوع است و ونکومایسین اینتراتکال بهتر به بطن می‌رسد", "طول درمان استاندارد مننژیت پنوموکوکی تنها ۳ روز است و کشت مثبت در ساعت ۳۶ طبیعی تلقی می‌شود"], "correct": 0, "explanation": "در بخش درمان اختصاصی فصل ۱۴۳ هریسون ۲۰۲۵ (صفحهٔ ۱۱۶۶) صراحتاً بیان شده است: بیماران با مننژیت S. pneumoniae باید ۲۴ تا ۳۶ ساعت پس از شروع آنتی‌بیوتیک تحت LP مجدد برای مستندسازی استریل شدن CSF قرار گیرند؛ عدم استریل شدن CSF در این زمان شاهد فرضی مقاومت آنتی‌بیوتیکی تلقی می‌شود. در بیمارانی که با ونکومایسین وریدی تنها پاسخ نمی‌دهند، تجویز داخل‌بطنی (Intraventricular) ونکومایسین بر مسیر اینتراتکال (Intrathecal) ترجیح داده می‌شود زیرا غلظت کافی ونکومایسین در بطن‌های مغزی همیشه با تزریق اینتراتکال کمری به دست نمی‌آید. دورهٔ درمان وریدی مننژیت پنوموکوکی ۲ هفته است.", "whyWrong": {"1": "نادرست؛ دگزامتازون به‌تنهایی بدون استریل‌سازی عفونت مقاوم خطرناک است.", "2": "نادرست؛ جریان رو به پایین CSF باعث می‌شود تزریق کمری (اینتراتکال) غلظت درمانی مناسبی به بطن‌های مغز نرساند؛ ضمن اینکه LP کنترلی ۲۴–۳۶h در پنوموکوک توصیه شده است.", "3": "نادرست؛ طول درمان مننژیت پنوموکوکی ۲ هفته (۱۴ روز) است."}, "pearl": "مقایسهٔ ظریف هریسون ۲۰۲۵ در صفحهٔ ۱۱۶۶: برای پنوموکوک تکرار LP در ۲۴–۳۶ ساعت و ترجیح Intraventricular بر Intrathecal ونکومایسین؛ و در مننژیت مقاوم استافیلوکوکی با عدم استریل‌سازی در ۴۸ ساعت، ۲۰ mg/d ونکومایسین داخل‌بطنی یا اینتراتکال.", "trap": "یکسان پنداشتن کارایی تزریق کمری (اینتراتکال) با تزریق داخل‌بطنی ونکومایسین در مننژیت پنوموکوکی مقاوم.", "highYield": "مننژیت S. pneumoniae: دوره = ۲ هفته IV؛ LP کنترل در ۲۴–۳۶ ساعت؛ در شکست به ونکومایسین IV -> ونکومایسین داخل‌بطنی (ارجح بر اینتراتکال).", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 143 / موضوع 2", "topicIndex": 2, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1123", "referenceSection": "Specific Antimicrobial Therapy: Pneumococcal Meningitis", "id": "inf-015"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 152, "chapterTitle": "عفونت‌های استافیلوکوکی", "topic": "عفونت‌های استافیلوکوکی", "subtopic": "Protein A IgG Subclasses, Capsule 5/8, CHIPS & Kupffer Cells", "difficulty": "خیلی دشوار", "bloom": "", "stem": "در پاتوژنز فرار ایمنی استافیلوکوکوس اورئوس مطابق فصل ۱۵۲ هریسون ۲۰۲۵، کدام ترکیب دربارهٔ پروتئین A، کپسول، پروتئین‌های مهارکنندهٔ کموتاکسی و مخزن داخل‌سلولی کبدی صحیح است؟", "options": ["پروتئین A به Fc IgG می‌چسبد؛ کپسول ۵/۸ آبسه‌زا و CHIPS/EAP ضد PMN، کوپفر پناهگاه است", "پروتئین A منحصراً به IgE و IgG3 متصل می‌شود و کپسول فقط بار منفی خالص دارد", "آلفا-توکسین تنها علیه گلبول‌های قرمز گوسفند فعال است و در انسان سمیتی ندارد", "استافیلوکوک اورئوس هیچ‌گونه توانایی بقا در درون سلول‌های فاگوسیتیک کبدی را ندارد"], "correct": 0, "explanation": "مطابق صفحهٔ ۱۲۴۱ فصل ۱۵۲ هریسون ۲۰۲۵: (۱) پروتئین A (یک MSCRAMM منحصر به S. aureus) به بخش Fc زیرکلاس‌های IgG 1، 2 و 4 متصل شده و مانع اپسونوفاگوسیتوز توسط PMN می‌شود (نه IgG3)؛ (۲) بیشتر عفونت‌های انسانی با سویه‌های دارای میکروکپسول پلی‌ساکاریدی تیپ ۵ و ۸ رخ می‌دهند و خاصیت زوئیتریونی (دارای هر دو بار مثبت و منفی) کپسول نقش کلیدی در القاء تشکیل آبسه دارد؛ (۳) پروتئین‌های CHIPS و EAP مانع مهاجرت نوتروفیل‌ها به محل عفونت می‌شوند؛ (۴) بقای داخل‌سلولی به‌ویژه در سلول‌های کوپفر کبدی (Hepatic Kupffer cells) پناهگاهی برای باکتری در برابر دفاع میزبان در باکتریمی فراهم می‌آورد.", "whyWrong": {"1": "نادرست؛ پروتئین A به IgG1, 2, 4 می‌چسبد (به IgG3 نمی‌چسبد!) و کپسول زوئیتریونی است.", "2": "نادرست؛ آلفا-توکسین با ایجاد منفذ در سلول‌های یوکاریوتی انسان، سندرم سپسیس و آسیب بافتی ایجاد می‌کند.", "3": "نادرست؛ بقای داخل‌سلولی به‌ویژه درون سلول‌های کوپفر کبدی در متن هریسون ۲۰۲۵ برجسته شده است."}, "pearl": "چرا استافیلوکوکوس اورئوس برخلاف بسیاری باکتری‌ها «آبسه» می‌سازد؟ به‌دلیل کپسول زوئیتریونی (دوگانه بار منفی و مثبت) تیپ ۵ و ۸ که فعال‌سازی خاصی در مسیر تشکیل آبسه ایجاد می‌کند!", "trap": "اشتباه گرفتن IgG3 با IgG4 در اتصال پروتئین A یا تصور اینکه S. aureus یک باکتری صرفاً خارج‌سلولی است.", "highYield": "پروتئین A -> متصل به Fc زیرکلاس‌های IgG 1, 2, 4 (نه IgG3)؛ کپسول تیپ ۵ و ۸ زوئیتریونی -> تشکیل آبسه؛ CHIPS & EAP -> مهار مهاجرت PMN؛ کوپفر کبد -> مخزن داخل‌سلولی.", "questionType": "basic", "questionTypeLabel": "علوم پایهٔ کاربردی (Basic Science Integration)", "coverageIndex": "فصل 152 / موضوع 1", "topicIndex": 1, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1198", "referenceSection": "Evasion of Host Defense Mechanisms", "id": "inf-016"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 183, "chapterTitle": "سل", "topic": "سل (توبرکلوز)", "subtopic": "آزمون‌های پوستی جدید مبتنی بر آنتی‌ژن (TBST) و پدیده تقویت (Boosting)", "difficulty": "دشوار", "bloom": "", "stem": "دربارهٔ آزمون‌های پوستی جدید مبتنی بر آنتی‌ژن اختصاصی مایکوباکتریوم توبرکلوزیس (TBST) که در ویرایش ۲۰۲۵ هاریسون معرفی شده‌اند و نیز پدیدهٔ تقویت (Boosting) در تست توبرکولین (TST)، کدام گزینه صحیح است؟", "options": ["پدیدهٔ تقویت (Boosting) تنها در آزمون‌های خونی QuantiFERON و زمانی رخ می‌دهد که ۲ سال بعد تکرار شود", "TBST از پروتئین PPD مخلوط با BCG ساخته می‌شود و پس از واکسیناسیون BCG مثبت کاذب بالایی نشان می‌دهد", "در آزمون T-SPOT.TB تنها لنفوسیت‌های CD8+ طحال سنجیده می‌شوند و آنتی‌ژن ESAT-6 نقشی در تحریک سلولی ندارد", "TBST از ESAT-6/CFP-10 بهره می‌برد (هم‌تراز IGRA)؛ تقویت با تکرار TST در ۱–۵ هفته رخ می‌دهد"], "correct": 3, "explanation": "در ویرایش ۲۲ هاریسون (۲۰۲۵)، دستهٔ جدید آزمون‌های پوستی TBST (M. tuberculosis antigen-based skin tests) با بهره‌گیری از آنتی‌ژن‌های اختصاصی ESAT-6 و CFP-10 معرفی شده‌اند که سادگی تست پوستی را با اختصاصیت بالای IGRA تلفیق می‌کنند و با تأیید WHO دقتی معادل IGRA و برتر از TST در واکسینه‌شدگان BCG، کودکان و PLWH دارند. همچنین پدیدهٔ Boosting عبارت است از بزرگ‌شدن کاذب اندازهٔ واکنش در تکرار TST ظرف ۱ تا ۵ هفته پس از تست اولیه.", "whyWrong": {"0": "نادرست؛ پدیدهٔ تقویت مشخصهٔ تست پوستی TST است (ظرف ۱–۵ هفته)، نه تست‌های خونی IGRA.", "1": "نادرست؛ PPD فاقد اختصاصیت است، اما TBSTها دقیقاً برای حذف تداخل BCG از آنتی‌ژن‌های کدشدهٔ ناحیهٔ RD1 (ESAT-6 و CFP-10) بهره می‌برند.", "2": "نادرست؛ T-SPOT.TB یک آزمایش ELISPOT روی خون محیطی است که پاسخ لنفوسیت‌های خاطرهٔ T (عمدتاً CD4+ و نیز CD8+) به ESAT-6 و CFP-10 را می‌سنجد."}, "pearl": "تفاوت جدید و حیاتی: آزمون‌های TBST روی پوست تزریق می‌شوند اما برخلاف PPD، به‌خاطر استفاده از ESAT-6 و CFP-10 در افراد واکسینه‌شده با BCG مثبت کاذب نمی‌دهند!", "trap": "پنجرهٔ زمانی «۱ تا ۵ هفته» برای Boosting را با «تبدیل واقعی» (True conversion مثلاً پس از تماس نزدیک یا واکسیناسیون اخیر) اشتباه نگیرید.", "highYield": "مبحث پربازده هاریسون ۲۰۲۵ — آزمون‌های پوستی جدید مبتنی بر آنتی‌ژن (TBST) و پدیده تقویت (Boosting)", "questionType": "basic", "questionTypeLabel": "آزمایشگاه و ایمونودیآگنوز", "coverageIndex": "فصل 183 / موضوع 7", "topicIndex": 7, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd ed. (2025)", "referencePages": "1394", "referenceSection": "Chapter 183: TST, TBSTs, and IGRAs", "id": "inf-017"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 231, "chapterTitle": "مالاریا", "topic": "مالاریا", "subtopic": "همولیز تأخیری پس از آرتسونات (PADH) و گلبول‌های قرمز Pitted", "difficulty": "خیلی دشوار", "bloom": "", "stem": "توریست ۳۴ ساله‌ای غیرایمن که به‌تازگی به‌علت مالاریای فالسیپاروم با هیپرپارازیتمی ۱۲٪ با موفقیت با آرتسونات وریدی درمان و اسمیر خون او منفی شده است، ۱۰ روز پس از شروع درمان (در حال بهبودی کامل تب) ناگهان دچار افت شدید هموگلوبین از ۱۱ به ۶/۵ g/dL، افزایش LDH و افت هاپتوگلوبین بدون عود پارازیتمی می‌شود. محتمل‌ترین توضیح پاتوفیزیولوژیک این پدیده کدام است؟", "options": ["کمبود اکتسابی ویتامین B12 ناشی از مهار مستقیم جذب روده‌ای توسط آرتسونات طی یک هفتهٔ اول", "مقاومت آنی انگل به آرتسونات با تکثیر کلون مقاوم ظرف ۲۴ ساعت (نیازمند شروع فوری کینین با دوز مضاعف)", "واکنش آلرژیک آنافیلاکتیک با واسطهٔ IgE علیه آرتسونات که همواره نیازمند پلاسمافرز اورژانسی است", "همولیز تأخیری پس از آرتسونات (PADH) ناشی از نابودی هم‌زمان گلبول‌های حفره‌دارشده (Pitted RBCs) در طحال"], "correct": 3, "explanation": "در فصل ۲۳۱ (صفحهٔ ۱۷۶۵ هاریسون ۲۰۲۵)، در بیماران غیرایمن مبتلا به هیپرپارازیتمی که با آرتسونات وریدی درمان می‌شوند، پدیدهٔ همولیز تأخیری ناگهانی چند روز تا چند هفته پس از درمان (Post-artesunate delayed hemolysis یا PADH) توصیف شده است: آرتسونات انگل‌ها را درون گلبول قرمز می‌کشد و طحال با مکانیسم «pitting» انگل مرده را بدون لیز فوری گلبول خارج می‌کند؛ این گلبول‌های قرمز حفره‌دارشدهٔ (pitted) قبلاً آلوده که موقتاً زنده مانده‌اند عمر کوتاهی دارند و حدود ۱–۳ هفته بعد به‌شکل نسبتاً هم‌زمان (synchronous) از گردش خون پاک و همولیز می‌شوند (اسمیر خون همچنان منفی است).", "whyWrong": {"0": "نادرست؛ ارتباطی با کمبود ویتامین B12 ندارد.", "1": "نادرست؛ اسمیر خون منفی است و این پدیده نشانهٔ شکست یا مقاومت دارویی نیست؛ بیمار به درمان حمایتی/تزریق خون نیاز دارد نه تکرار آرتسونات یا کینین.", "2": "نادرست؛ مکانیسم غیرایمونولوژیک و ناشی از عمر کوتاه‌شدن گلبول‌های «pitted» است."}, "pearl": "به دنبال درمان موفق مالاریای شدید با آرتسونات در مسافران غیرایمن (هیپرپارازیتمی بالا)، تا ۴ هفته هموگلوبین را پایش کنید تا PADH (همولیز تأخیری ناشی از pitted RBCs) را از عود مالاریا افتراق دهید!", "trap": "در این سناریو چون اسمیر خون منفی است، تعویض دارو به کینین یا تکرار آرتسونات خطاست — علت همولیز عود عفونت نیست بلکه مرگ تأخیری گلبول‌های نجات‌یافتهٔ «pitted» اس
