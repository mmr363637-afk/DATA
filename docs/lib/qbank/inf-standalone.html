درنال و بیماری‌های بافت همبند هستند.", "whyWrong": {"0": "نادرست؛ هیچ آزمایش استاندارد طلایی برای سپسیس وجود ندارد و لاکتات در شوک کاردیوژنیک یا ایسکمی مزانتریک هم به همان شدت بالا می‌رود.", "1": "نادرست؛ qSOFA تنها معیار غربالگری پیش‌آگهی اختلال ارگان است و هیچ اختصاصیتی برای عفونت در برابر نارسایی قلب یا آمبولی ندارد.", "3": "نادرست؛ میزان خطای تشخیصی به‌مراتب بالاتر (~۲۵٪) و علل قلبی و ریوی شایع‌تر از واسکولیت هستند."}, "pearl": "اگر بیمار «سپتیک» با احیای ۳۰ mL/kg بدتر شد و کشت‌ها منفی ماندند، بی‌درنگ به اکوکاردیوگرافی بستر بیمار برای نارسایی قلبی، ایسکمی مزانتریک یا آمبولی ریه فکر کنید (۲۵٪ موارد ICU مقلد سپسیس هستند).", "trap": "تفسیر بالا بودن لاکتات یا امتیاز SOFA بالا به‌عنوان اثبات حتمی عفونت، در حالی که فقط بیانگر هیپوپرفیوژن یا اختلال ارگان با هر اتیولوژی هستند.", "highYield": "هیچ تست استاندارد طلایی برای سپسیس وجود ندارد؛ ۲۵٪ بیماران ICU پذیرفته‌شده به‌نام سپسیس، مقلدهای غیرعفونی (بیشتر قلبی و ریوی) دارند.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 315 / موضوع 1", "topicIndex": 1, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "2320", "referenceSection": "Clinical Manifestations: Sepsis Mimics", "id": "inf-019"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 131, "chapterTitle": "پنومونی", "topic": "پنومونی", "subtopic": "IDSA/ATS Severe CAP Minor & Major Criteria", "difficulty": "دشوار", "bloom": "", "stem": "زن ۶۷ ساله‌ای با سرفهٔ خلط‌دار و تب به اورژانس مراجعه کرده و نیازمند وازوپرسور یا تهویهٔ مکانیکی تهاجمی نیست. فشار خون ۱۰۵/۶۵ mmHg، دمای بدن ۳۵.۶ درجهٔ سانتی‌گراد، تعداد تنفس ۳۱ در دقیقه، پلاکت ۹۰,۰۰۰ در میکرولیتر، لکوسیت ۱۱,۰۰۰، BUN برابر با ۱۷ mg/dL، بدون گیجی و در گرافی دارای ارتشاح لوب تحتانی راست است. بر اساس معیارهای شدت CAP (جدول ۱۳۱-۳ هریسون ۲۰۲۵)، وضعیت این بیمار چگونه است؟", "options": ["به‌علت نداشتن معیار ماژور (شوک یا انتوباسیون)، واجد معیارهای CAP شدید نیست", "فقط ۱ معیار مینور دارد زیرا هیپوترمی و ترومبوسیتوپنی جزو معیارهای IDSA/ATS نیستند", "با ۳ معیار مینور (RR≥30، هیپوترمی <36°C، پلاکت <100k) واجد معیار CAP شدید است", "تنها دو معیار مینور دارد و بدون نیاز به بستری و مراقبت ویژه قابل ترخیص است"], "correct": 2, "explanation": "در جدول ۱۳۱-۳ هریسون ۲۰۲۵، معیارهای CAP شدید شامل ۲ معیار ماژور (نارسایی تنفسی نیازمند تهویه مکانیکی تهاجمی یا شوک سپتیک نیازمند وازوپرسور) و ۹ معیار مینور است: RR ≥ 30، PaO2/FiO2 ≤ 250، ارتشاح مولتی‌لوبار، گیجی، اورمی (BUN ≥ 20 mg/dL)، لکوپنی (WBC < 4000)، ترومبوسیتوپنی (پلاکت < 100,000)، هیپوترمی (دمای مرکزی < 36°C) و افت فشار نیازمند احیای تهاجمی مایع. وجود ۳ معیار مینور یا ۱ معیار ماژور بیانگر CAP شدید و نیازمند بستری ICU است. بیمار فوق ۳ معیار مینور دارد: تنفس ۳۱ (≥30)، دما ۳۵.۶ (<36) و پلاکت ۹۰,۰۰۰ (<100,000).", "whyWrong": {"0": "نادرست؛ داشتن ≥3 معیار مینور به تنهایی بدون هیچ معیار ماژوری تعریف CAP شدید را برآورده می‌کند.", "1": "نادرست؛ هر دو مورد هیپوترمی <36°C و پلاکت <100,000 صراحتاً جزو ۹ معیار مینور جدول ۱۳۱-۳ هستند.", "3": "نادرست؛ هیپوترمی (<36°C) به‌عنوان معیار مینور سوم شمارش می‌شود و ترخیص سرپایی کاملاً غلط است."}, "pearl": "هیپوترمی (<36°C) و لکوپنی (<4000) در پنومونی نشانهٔ پاسخ ضعیف میزبان و پیش‌آگهی بدتر نسبت به تب یا لکوسیتوز خفیف هستند و هر دو جزو معیارهای مینور CAP شدید محسوب می‌شوند.", "trap": "نمرهٔ CURB-65 این بیمار تنها ۱ است (سن >=65؟ اینجا ۶۷ است یعنی ۲ با RR>=30)، اما طبق هریسون نه PSI و نه CURB-65 برای تعیین نیاز به ICU دقیق نیستند و باید از معیارهای IDSA/ATS استفاده کرد!", "highYield": "معیار CAP شدید (ICU): ۱ معیار ماژور یا ≥۳ معیار مینور از ۹ معیار (RR≥30، P/F≤250، مولتی‌لوبار، گیجی، BUN≥20، WBC<4000، Plt<100k، T<36°C، افت فشار نیازمند مایع).", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 131 / موضوع 3", "topicIndex": 3, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1026", "referenceSection": "Table 131-3 Criteria for Severe CAP", "id": "inf-020"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 133, "chapterTitle": "اندوکاردیت عفونی", "topic": "اندوکاردیت عفونی", "subtopic": "Indications for Early TEE in Monomicrobial Bacteremia", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۶۰ ساله‌ای با سابقهٔ دیابت و بدون سابقهٔ بیماری دریچه‌ای، با تب حاد مراجعه کرده و در ۱ ست کشت خون، Staphylococcus aureus رشد می‌کند. کشت‌های خون کنترل در ساعت ۴۸ منفی شده و کانون اولیه عفونت سلولیت ساق پا مشخص است؛ بیمار هیچ وسیلهٔ داخل قلبی، آمبولی، سوفل یا استئومیلیت مهره‌ای ندارد. مطابق جدول ۱۳۳-۴ و متن فصل ۱۳۳ هریسون ۲۰۲۵، کدام رویکرد تصویربرداری برای او مناسب‌تر است؟", "options": ["TTE باکیفیت کافی است و بدون ریسک‌فاکتورهای جدول ۱۳۳-۴ نیاز فوری به TEE نیست", "هیچ‌گونه اکوکاردیوگرافی لازم نیست زیرا کانون پوستی و حساسیت به درمان به‌خوبی مشخص است", "در هر باکتریمی S. aureus حتی با کانون مشخص و کشت پیگیری منفی، TEE اورژانسی اجباری است", "باید مستقیماً بدون تصویربرداری اکوکاردیوگرافی، جراحی اکتشافی دریچه انجام شود"], "correct": 0, "explanation": "در فصل ۱۳۳ هریسون ۲۰۲۵ (صفحهٔ ۱۰۸۴ و جدول ۱۳۳-۴)، به‌دلیل شیوع ۸–۱۴ درصدی IE در باکتریمی S. aureus، انجام اکوکاردیوگرافی به‌طور روتین توصیه می‌شود. با این حال، امتیازهای پیش‌بینی خطر نشان می‌دهند که بیماران دارای هریک از ویژگی‌های پرخطر جدول ۱۳۳-۴ (دستگاه داخل قلبی، آمبولی، ۲ یا بیشتر کشت مثبت، باکتریمی پایدار >= ۷۲ ساعت، کانون نامشخص، استئومیلیت مهره‌ای، بیماری قبلی دریچه، سوفل، یا مصرف تزریقی مواد) حداقل ۶٪ خطر IE دارند که اندیکاسیون قوی برای TEE زودهنگام است؛ اما در نبود این عوامل پرخطر، TTE باکیفیت کافی است مگر آنکه یافته‌های دیگری به نفع IE باشد.", "whyWrong": {"1": "نادرست؛ به‌دلیل خطر ذاتی بالای IE در باکتریمی S. aureus (۸–۱۴٪)، اکوکاردیوگرافی (حداقل TTE) در همهٔ بیماران باکتریمی S. aureus روتین است.", "2": "نادرست؛ متن هریسون ۲۰۲۵ دقیقاً تفاوت بین اندیکاسیون TEE زودرس (وجود هر فاکتور جدول ۱۳۳-۴) و کفایت TTE (نبود آن‌ها) را روشن کرده است.", "3": "نادرست؛ جراحی هیچ اندیکاسیونی ندارد."}, "pearl": "جدول ۱۳۳-۴ هریسون یادآور می‌شود که در ۱۲–۱۷٪ باکتریمی E. faecalis و ۸–۱۴٪ باکتریمی S. aureus اندوکاردیت وجود دارد؛ وجود حتی یک علامت جدول (مثل منشأ نامشخص یا باکتریمی >=۷۲ ساعت یا سابقهٔ دریچه‌ای) بیمار را مستقیم کاندید TEE می‌کند.", "trap": "حذف کامل اکو در باکتریمی S. aureus به بهانهٔ داشتن کانون سلولیت خطاست، اما اجبار TEE در غیاب همهٔ عوامل جدول ۱۳۳-۴ نیز مطابق هریسون ۲۰۲۵ دقیق نیست.", "highYield": "باکتریمی S. aureus: همیشه اکو لازم است؛ اگر عوامل جدول ۱۳۳-۴ وجود داشته باشند -> TEE زودهنگام؛ در نبود آن‌ها -> TTE باکیفیت کافی است.", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 133 / موضوع 3", "topicIndex": 3, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1041", "referenceSection": "Table 133-4 & Echocardiographic Assessment", "id": "inf-021"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 140, "chapterTitle": "عفونت‌های مجاری ادراری: سیستیت، پروستاتیت و پیلونفریت", "topic": "عفونت‌های مجاری ادراری", "subtopic": "Diagnostic Bacteriuria Threshold & Pyuria Pitfall", "difficulty": "متوسط", "bloom": "", "stem": "بیمار ۶۸ ساله‌ای با سوند ادراری دائم از ۶ روز پیش، دچار تب جدید ۳۸.۷ درجه بدون منشأ تنفسی یا شکمی شده است؛ معاینهٔ ریه و شکم نرمال و کشت ادرار یک باکتری گرم منفی به میزان ۱۰^۴ CFU/mL رشد داده است. بر اساس فصل ۱۴۰ هریسون ۲۰۲۵، کدام گزینه دربارهٔ تعریف میکروبیولوژیک و تشخیص CAUTI صحیح است؟", "options": ["برای تعریف CAUTI حتماً باکتریوری ≥ ۱۰^۵ CFU/mL لازم است و ۱۰^۴ آلودگی است", "آستانه CAUTI علامت‌دار ≥۱۰^۳ CFU/mL بوده و پیوری ارزش اخباری پایینی دارد", "در باکتریوری ۱۰^۶ بدون پیوری، کاتتر باید حفظ شده و سه‌داروی وریدی شروع شود", "در بیماران سونددار بدون تب، پیوری به‌تنهایی اندیکاسیون فوری آنتی‌بیوتیک است"], "correct": 1, "explanation": "در بخش CAUTI فصل ۱۴۰ هریسون ۲۰۲۵ (صفحهٔ ۱۱۳۳) آمده است: آستانهٔ پذیرفته‌شدهٔ باکتریوری برای برآوردن تعریف CAUTI معادل ≥ ۱۰^۳ CFU/mL در کنار علائم موضعی یا سیستمیک (مانند تب بی‌توضیح) و پیوری است. مشکل تشخیصی اصلی این است که در بیماران دارای کاتتر ادراری، باکتریوری و پیوری تقریباً اجتناب‌ناپذیر بوده و علائم و پیوری به‌تنهایی ارزش اخباری پایینی دارند؛ لذا بدون علائم بالینی سازگار و رد سایر علل تب، پیوری و باکتریوری بی‌علامت نباید درمان شوند.", "whyWrong": {"0": "نادرست؛ آستانه ۱۰^۵ مربوط به باکتریوری بی‌علامت است؛ آستانهٔ CAUTI علامت‌دار ≥۱۰^۳ CFU/mL می‌باشد.", "2": "نادرست؛ نبود پیوری معمولاً تشخیص CAUTI را زیر سؤال می‌برد و در CAUTI واقعی باید حتی‌الامکان کاتتر تعویض یا خارج شود.", "3": "نادرست؛ باکتریوری و پیوری بی‌علامت در سونددارها درمان نمی‌شود."}, "pearl": "آستانه‌های کلیدی کشت ادرار در هریسون ۲۰۲۵: باکتریوری بی‌علامت = ۱۰^۵؛ CAUTI = ۱۰^۳؛ سیستیت حاد در خانم دیزوریک = ۱۰^۲ (جدول/متن ۱۴۱).", "trap": "رد کردن کشت ۱۰^۴ CFU/mL در بیمار تب‌دار دارای سوند ادراری به بهانهٔ نرسیدن به ۱۰۰,۰۰۰ کلنی.", "highYield": "CAUTI: باکتریوری ≥ 10^3 CFU/mL + پیوری + علائم موضعی یا تب بی‌توضیح؛ پیوری به‌تنهایی در فرد سونددار بی‌ارزش است.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 140 / موضوع 1", "topicIndex": 1, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1090", "referenceSection": "Catheter-Associated UTI (CAUTI)", "id": "inf-022"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 141, "chapterTitle": "عفونت‌های مقاربتی: مرور و رویکرد بالینی", "topic": "عفونت‌های مقاربتی", "subtopic": "BV Recurrence Suppression, Lactin-V & Antenatal Trials", "difficulty": "دشوار", "bloom": "", "stem": "زن ۳۱ ساله‌ای دچار عودهای مکرر واژینوز باکتریال (BV) است؛ هم‌اکنون پس از یک دورهٔ درمان خوراکی مترونیدازول علائم او برطرف شده است اما نگران عود مجدد و نیز تأثیر BV در بارداری آیندهٔ خود است. کدام گزاره مطابق شواهد بالینی فصل ۱۴۱ هریسون ۲۰۲۵ درست است؟", "options": ["مترونیدازول خوراکی عود BV را به صفر می‌رساند و درمان شریک جنسی مرد در همهٔ موارد اجباری است", "ژل مترونیدازول دو بار/هفته یا LACTIN-V عود را کم می‌کند؛ کلیندامایسین زایمان زودرس را نکاست", "دوش واژینال هفتگی با مترونیدازول دوز پایین تنها راه پیشگیری از زایمان زودرس در بارداری است", "تجویز تک‌دوز خوراکی سک‌نیدازول در درمان واژینوز باکتریال حاد هیچ‌گونه اثربخشی ندارد"], "correct": 1, "explanation": "مطابق صفحهٔ ۱۱۴۶ هریسون ۲۰۲۵: (۱) عود طولانی‌مدت پس از درمان BV چه خوراکی (مترونیدازول ۵۰۰ mg BID × ۷d یا سک‌نیدازول ۲ گرم تک‌دوز) و چه موضعی بسیار شایع است؛ (۲) عودها با تجویز ژل مترونیدازول داخل واژینال هفته‌ای دو بار به شکل سرکوبگر به‌طور معنادار کاهش می‌یابند و یک کارآزمایی تصادفی‌شده نشان داد تجویز هفتگی Lactobacillus crispatus CTV-05 (LACTIN-V) عود BV را حدود یک‌سوم کم می‌کند؛ (۳) اگرچه فراتحلیل‌ها افزایش زایمان زودرس و سقط را در BV نشان داده‌اند، درمان موضعی با کلیندامایسین در بارداری پیامد نامطلوب بارداری را کاهش نداده و نتایج مترونیدازول خوراکی در پیشگیری از زایمان زودرس متناقض بوده است.", "whyWrong": {"0": "نادرست؛ عود BV بسیار شایع است و درمان روتین شریک جنسی مرد طبق شواهد عود BV را کاهش نمی‌دهد.", "2": "نادرست؛ ژل با دوز پایین‌تر ۳۷.۵ mg مترونیدازول نسبت به شیاف ۵۰۰ mg عود بالاتری داشته و دوش واژینال ریسک فاکتور BV است.", "3": "نادرست؛ سک‌نیدازول تک‌دوز خوراکی ۲ گرم یکی از درمان‌های مؤثر تاییدشده در هریسون ۲۰۲۵ است."}, "pearl": "نکتهٔ به‌روزشده در هریسون ۲۰۲۵: پرکردن مجدد لاکتوباسیل‌های محافظ واژن با Lactobacillus crispatus CTV-05 (LACTIN-V) یا درمان سرکوبگر هفته‌ای دوبار ژل مترونیدازول، راهبرد مؤثر کاهش عود BV هستند.", "trap": "تجویز کلیندامایسین واژینال در زن باردار بی‌علامت صرفاً به امید پیشگیری از زایمان زودرس یا غفلت از درمان سرکوبگر در عودهای مکرر BV.", "highYield": "عود مکرر BV: سرکوب با ژل مترونیدازول ۲ بار در هفته یا پروبیوتیک موضعی L. crispatus (LACTIN-V)؛ تک‌دوز خوراکی مؤثر = سک‌نیدازول ۲ g.", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 141 / موضوع 3", "topicIndex": 3, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1103", "referenceSection": "Treatment of Bacterial Vaginosis", "id": "inf-023"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 143, "chapterTitle": "مننژیت حاد", "topic": "مننژیت حاد", "subtopic": "Listeria & Gram-Negative Bacillary Therapy & Penicillin Allergy", "difficulty": "متوسط", "bloom": "", "stem": "بیمار ۶۶ ساله‌ای تحت پیوند کلیه با تب، سفتی گردن و کشت CSF مثبت برای Listeria monocytogenes بستری شده و در آزمایش اخیر مشخص می‌شود دچار حساسیت آنافیلاکتیک شدید به خانوادهٔ پنی‌سیلین است. مطابق فصل ۱۴۳ هریسون ۲۰۲۵، مدت درمان استاندارد لیستریوز مننژیال و رژیم جایگزین در حساسیت به پنی‌سیلین کدام است؟", "options": ["حداقل ۳ هفته TMP-SMX وریدی با دوز بالا (جایگزین آمپی‌سیلین)", "۲ هفته درمان استاندارد با سفتریاکسون ۲ گرم هر ۱۲ ساعت وریدی", "۷ روز درمان با ونکومایسین وریدی به تنهایی با پایش سطح سرمی", "۱۰ روز درمان با سفپیم وریدی به همراه دگزامتازون در ۴ روز اول"], "correct": 0, "explanation": "مطابق صفحهٔ ۱۱۶۶ فصل ۱۴۳ هریسون ۲۰۲۵: مننژیت Listeria monocytogenes با آمپی‌سیلین به مدت حداقل ۳ هفته درمان می‌شود (و در بیماران بدحال جنتامایسین با دوز بارگیری ۲ mg/kg و سپس ۷.۵ mg/kg/d هر ۸ ساعت اضافه می‌گردد). در بیماران حساس به پنی‌سیلین، تری‌متوپریم-سولفامتوکسازول (TMP ۱۰–۲۰ mg/kg/d به همراه SMX ۵۰–۱۰۰ mg/kg/d منقسم هر ۶ ساعت) جایگزین استاندارد است. به یاد داشته باشید تمام سفالوسپورین‌ها (حتی سفتریاکسون و سفپیم) در برابر لیستریا مقاومت ذاتی دارند!", "whyWrong": {"1": "نادرست؛ لیستریا به تمام سفالوسپورین‌ها ذاتاً مقاوم است.", "2": "نادرست؛ ونکومایسین درمان انتخابی مننژیت لیستریا نیست و ۷ روز بسیار ناکافی است.", "3": "نادرست؛ سفپیم روی لیستریا اثری ندارد و در فصل ۱۲۷ تصریح شده دگزامتازون در مننژیت لیستریا توصیه نمی‌شود."}, "pearl": "دو اصل غیرقابل چشم‌پوشی در مننژیت لیستریا: (۱) هیچ سفالوسپورینی روی لیستریا اثر ندارد؛ (۲) آلرژی به پنی‌سیلین -> TMP-SMX وریدی (نه وانکومایسین یا سفتریاکسون) به مدت حداقل ۳ هفته.", "trap": "جایگزین کردن پنی‌سیلین/آمپی‌سیلین با سفتریاکسون یا ونکومایسین هنگام وجود حساسیت به پنی‌سیلین در بیمار مبتلا به مننژیت لیستریا.", "highYield": "مننژیت Listeria: درمان استاندارد = آمپی‌سیلین ≥ ۳ هفته (± جنتامایسین در بدحالی)؛ در آلرژی پنی‌سیلین = TMP-SMX ق۶ساعت؛ مقاومت ذاتی به تمام سفالوسپورین‌ها.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 143 / موضوع 3", "topicIndex": 3, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1123", "referenceSection": "Specific Therapy: Listeria Meningitis", "id": "inf-024"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 152, "chapterTitle": "عفونت‌های استافیلوکوکی", "topic": "عفونت‌های استافیلوکوکی", "subtopic": "mecA / PBP2a, SCCmec, Heterogeneous Expression & Cephalosporin Pitfalls", "difficulty": "دشوار", "bloom": "", "stem": "کدام گزاره دربارهٔ مکانیسم ژنتیکی مقاومت به متی‌سیلین در Staphylococcus aureus، تشخیص فنوتیپی آن در آزمایشگاه و انتخاب سفالوسپورین‌ها بر اساس فصل ۱۵۲ هریسون ۲۰۲۵ صحیح است؟", "options": ["سفتازیدیم و سفتریاکسون نسبت به سفازولین (نسل اول) قدرت بسیار بیشتری در باکتریمی MSSA دارند", "PBP2a به SPRP و سفالوسپورین‌ها (جز سفتارولین/سفتوبیپرول) مقاوم است؛ سفازولین قوی‌تر از سفتریاکسون", "مقاومت MRSA عمدتاً ناشی از بتا-لاکتاماز کلاوولانات-حساس است و با افزودن کلاوولانات برطرف می‌شود", "بیان هتروژنی مقاومت در MRSA با انکوباسیون در دمای ۴۲ درجهٔ سانتی‌گراد به مدت ۴ ساعت بهتر آشکار می‌شود"], "correct": 1, "explanation": "در صفحهٔ ۱۲۴۷ و جدول ۱۵۲-۳ فصل ۱۵۲ هریسون ۲۰۲۵ تصریح شده است: (۱) مقاومت به متی‌سیلین ناشی از تولید پروتئین متصل‌شونده به پنی‌سیلین جدید PBP2a توسط ژن mecA درون عنصر ژنتیکی متحرک SCCmec است که باکتری را نسبت به همهٔ SPRPها (اگزاسیلین، نفسیلین)، کارباپنم‌ها و همهٔ سفالوسپورین‌ها به‌جز سفتارولین (و سفتوبیپرول در جدول ۱۵۲-۳) مقاوم می‌کند؛ (۲) بیان فنوتیپی مقاومت ممکن است همیشگی یا هتروژنی باشد و آش : "آسان", "bloom": "", "stem": "بیماری ۱۰ روز پس از دریافت تزریق خون اورژانسی دچار تب و لرز شده و در اسمیر خون محیطی انگل Plasmodium vivax شناسایی شده است. پس از تکمیل درمان کلروکین برای پاک‌سازی مرحلهٔ خونی، آیا تجویز دورهٔ ۱۴ روزهٔ پریماکین برای ریشه‌کنی رادیکال (پیشگیری از عود) در این بیمار ضروری است؟", "options": ["بله؛ P. vivax حتی از راه خون تزریقی به کبد می‌رود و پریماکین ۱۴ روزه اجباری است", "بله؛ علاوه بر پریماکین باید یک دوز ۳۰۰ میلی‌گرمی تافنوکین نیز هم‌زمان تجویز شود", "خیر؛ مرحلهٔ کبدی (هیپنوزوئیت) وجود ندارد، لذا عود رخ نمی‌دهد و پریماکین لازم نیست", "در مالاریای ناشی از تزریق خون کلروکین اثر ندارد و تنها آرتسونات وریدی تجویز می‌شود"], "correct": 2, "explanation": "مطابق صفحهٔ ۱۷۶۶ هاریسون ۲۰۲۵: مالاریای منتقل‌شده از طریق تزریق خون، فرورفتن سرسوزن یا پیوند عضو مستقیماً با شکل‌های خونی (مروزوئیت/تروفوزوئیت) ایجاد می‌شود؛ دورهٔ کمون کوتاه‌تر است زیرا مرحلهٔ پیش‌اریتروسیتی کبدی وجود ندارد و بنابراین هیپنوزوئیت در کبد تشکیل نمی‌شود. در نتیجه عودی در P. vivax یا P. ovale رخ نمی‌دهد و پریماکین (یا تافنوکین) برای درمان رادیکال نیاز نیست.", "whyWrong": {"0": "نادرست؛ تنها اسپروزوئیت‌های تزریق‌شده با پشهٔ آنوفل وارد کبد شده و هیپنوزوئیت می‌سازند، نه انگل‌های مرحلهٔ خونی.", "1": "نادرست؛ تافنوکین نیز برای پاک‌سازی هیپنوزوئیت‌های کبدی است و اینجا هیچ جایگاهی ندارد (و خطر همولیز G6PD می‌سازد).", "3": "نادرست؛ انتخاب داروی شیزونتی‌سید خونی مثل مالاریای طبیعی (کلروکین در ویواکس حساس) است."}, "pearl": "دو موقعیت که در آن‌ها مالاریای P. vivax یا P. ovale نیاز به پریماکین ندارد: ۱) مالاریای ناشی از تزریق خون/پیوند/سرسوزن؛ ۲) مالاریای مادرزادی (انتقال ترانس‌پلاسنتال مرحلهٔ خونی) — چون هیچ اسپروزوئیتی از کبد نگذشته است!", "trap": "دانشجویان به‌طور خودکار با دیدن P. vivax گزینهٔ «پریماکین برای جلوگیری از عود» را می‌زنند؛ همیشه منشأ انتقال (پشه در برابر تزریق خون) را بررسی کنید.", "highYield": "مبحث پربازده هاریسون ۲۰۲۵ — مالاریای انتقالی از خون/سرسوزن/پیوند و عدم نیاز به پریماکین", "questionType": "clinical", "questionTypeLabel": "بالینی / مدیریت اختصاصی", "coverageIndex"  را سرکوب می‌کنند، نه افزایش پاسخ حافظهٔ T-cell."}, "pearl": "سپسیس هم‌زمان شامل طوفان پیش‌التهابی (ماکروفاژهای M1، IL-1β/IL-6/TNF-α) و ایمونوساپرشن عمیق (افت MHC-II و ظهور MDSCs) است که بیمار را مستعد عفونت‌های ثانویه بیمارستانی می‌کند.", "trap": "جابه‌جا کردن نقش پیش‌التهابی ماکروفاژهای M1 با نقش ترمیمی/ضدالتهابی ماکروفاژهای M2.", "highYield": "ایمونوساپرشن سپسیس: کاهش MHC-II سطحی ماکروفاژها + سرکوب سلول‌های NK، T و B توسط MDSCs.", "questionType": "basic", "questionTypeLabel": "علوم پایهٔ کاربردی (Basic Science Integration)", "coverageIndex": "فصل 315 / موضوع 2", "topicIndex": 2, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "2319", "referenceSection": "Pathogenesis: Myeloid & Lymphoid Responses", "id": "inf-031"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 127, "chapterTitle": "رویکرد به بیمار تب‌دار شدیداً بدحال با عفونت", "topic": "رویکرد به بیمار تب‌دار شدیداً بدحال با عفونت", "subtopic": "Vibrio vulnificus Fulminant Sepsis", "difficulty": "متوسط", "bloom": "", "stem": "مرد ۵۶ ساله‌ای با سابقهٔ سیروز الکلی و هموکروماتوز، ۲۴ ساعت پس از خوردن صدف خام در سفر به مناطق ساحلی گرمسیر، دچار تب، لرز، افت فشار خون (۸۰/۴۸ mmHg)، درد شدید ساق پا و تاول‌های خونریزی‌دهندهٔ بزرگ روی هر دو اندام تحتانی می‌شود. مناسب‌ترین رژیم آنتی‌بیوتیکی برای بهبود بقا در این بیمار کدام است؟", "options": ["ونکومایسین وریدی به همراه جنتامایسین با دوز بارگیری کامل", "پنی‌سیلین G وریدی به همراه کلیندامایسین تا آماده شدن کشت", "آتوواکون خوراکی به همراه آزیترومایسین و قطع کشت خون", "فلوروکینولون یا سفالوسپورین نسل سوم به همراه داکسی‌سایکلین"], "correct": 3, "explanation": "مطابق فصل ۱۲۷ هریسون ۲۰۲۵، Vibrio vulnificus در بیماران مبتلا به بیماری مزمن کبدی، مصرف الکل، اختلالات ذخیرهٔ آهن (هموکروماتوز) یا دیابت پس از مصرف صدف خام (Raw shellfish/oysters) ایجاد سپسیس برق‌آسا، درد ساق (۷۵٪ موارد) و ضایعات پوستی تاولی یا هموراژیک به‌ویژه در اندام تحتانی می‌کند که مرگ‌ومیری ۳۵ تا ۶۰ درصد دارد. طبق هریسون ۲۰۲۵، پیامد بیماران با درمان حاوی فلوروکینولون (با یا بدون سفالوسپورین) یا رژیم‌های حاوی تتراسایکلین (مانند داکسی‌سایکلین به همراه سفتازیدیم/سفتریاکسون) بهبود می‌یابد.", "whyWrong": {"0": "نادرست؛ ونکومایسین تنها باکتری‌های گرم مثبت (مانند MRSA) را پوشش می‌دهد و هیچ اثری بر ویبریوهای گرم منفی ندارد.", "1": "نادرست؛ پنی‌سیلین به‌همراه کلیندامایسین برای عفونت‌های استرپتوکوکی یا کلستریدیایی است و ویبریو ولنیفیکوس را پوشش نمی‌دهد.", "2": "نادرست؛ آتوواکون به همراه آزیترومایسین درمان استاندارد بابزیوز است و در سپسیس ناشی از ویبریو جایگاهی ندارد."}, "pearl": "سه نشانهٔ کلیدی سپسیس Vibrio vulnificus: سابقهٔ بیماری کبدی یا هموکروماتوز + مصرف غذای دریایی خام ساحلی + تاول‌های خونریزی‌دهنده و درد شدید ساق پا.", "trap": "گرچه تاول خونریزی‌دهنده و افت فشار در فاشئیت نکروزان استرپتوکوکی هم رخ می‌دهد، سابقهٔ سیروز/هموکروماتوز و خوردن صدف خام مستقیماً به نفع V. vulnificus است و نیازمند پوشش گرم منفی و تتراسایکلین/کینولون می‌باشد.", "highYield": "هموکروماتوز/سیروز + صدف خام + تاول خونریزی‌دهنده اندام تحتانی -> Vibrio vulnificus؛ درمان با فلوروکینولون یا رژیم حاوی تتراسایکلین + سفالوسپورین.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 127 / موضوع 1", "topicIndex": 1, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "993", "referenceSection": "Sepsis with Skin Manifestations: Vibrio vulnificus", "id": "inf-032"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 131, "chapterTitle": "پنومونی", "topic": "پنومونی", "subtopic": "Corticosteroids in Severe CAP & Daptomycin Contraindication", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۶۴ ساله‌ای با CAP شدید و هیپوکسمی شدید در ICU بستری است و سطح CRP سرم او ۲۲ میلی‌گرم بر دسی‌لیتر (mg/dL) گزارش شده است. به‌دلیل سابقهٔ کلونیزاسیون MRSA، پوشش ضد-MRSA نیز مدنظر است. کدام تصمیم درمانی مطابق هریسون ۲۰۲۵ کاملاً صحیح است؟", "options": ["در حضور CRP >15 mg/dL باید ونکومایسین را قطع و فقط آزیترومایسین به تنهایی تجویز کرد", "کورتیکواستروئید فقط در پاتوژن آتیپیک غیرونتیله سود بقا دارد و باید در ۳ روز قطع شود", "افزودن کورتیکواستروئید (با CRP >15) مرگ‌ومیر را کم می‌کند و انتخاب MRSA ونکومایسین یا لینزولید است", "داپتومایسین به‌علت نفوذ ریوی بالاتر بر لینزولید ارجح است و استروئید در CAP غیرکوویدی ممنوع است"], "correct": 2, "explanation": "در فصل ۱۳۱ هریسون ۲۰۲۵ (صفحهٔ ۱۰۷۲) ذکر شده که داده‌های اخیر در CAP شدید (هم با تهویه و هم بدون تهویه)، به‌ویژه در بیماران با التهاب سیستمیک بالا (CRP > 15 mg/dL)، کاهش مرگ‌ومیر با تجویز گلوکوکورتیکوئید به مدت ۸ تا ۱۴ روز را نشان داده‌اند. همچنین در جدول ۱۲۴-۵ تصریح شده که برای پنومونی MRSA باید از ونکومایسین یا لینزولید استفاده کرد و داپتومایسین به‌علت غیرفعال شدن توسط سورفاکتانت ریوی نباید در پنومونی به کار رود.", "whyWrong": {"0": "نادرست؛ CRP بالا نشانگر التهاب شدید است نه رد MRSA و قطع ونکومایسین در بیمار شدید در معرض خطر MRSA فاجعه‌بار است.", "1": "نادرست؛ دورهٔ کورتیکواستروئید در CAP شدید معمولاً ۸ تا ۱۴ روز است و شواهد کاهش مرگ‌ومیر آن در بیماران شدید ونتیله و غیرونتیله گزارش شده است.", "3": "نادرست؛ داپتومایسین توسط سورفاکتانت ریوی غیرفعال می‌شود و در درمان پنومونی مؤثر نیست."}, "pearl": "داپتومایسین در باکتریمی و اندوکاردیت سمت راست عالی است اما در پارانشیم ریه توسط سورفاکتانت مهار می‌شود؛ همیشه برای پنومونی MRSA ونکومایسین یا لینزولید انتخاب کنید.", "trap": "تلهٔ کلاسیک آزمونی: تجویز داپتومایسین برای باکتریمی MRSA همراه با پنومونی یا فراموش کردن حد آستانهٔ CRP > 15 mg/dL برای استروئید CAP شدید.", "highYield": "CAP شدید با التهاب بالا (CRP > 15 mg/dL): مزیت بقای استروئید (۸–۱۴ روز)؛ پنومونی MRSA: ونکومایسین یا لینزولید (ممنوعیت داپتومایسین).", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 131 / موضوع 4", "topicIndex": 4, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "963, 1029", "referenceSection": "CAP Treatment & Table 124-5", "id": "inf-033"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 133, "chapterTitle": "اندوکاردیت عفونی", "topic": "اندوکاردیت عفونی", "subtopic": "CIED-IE vs Generator Pocket Infection", "difficulty": "دشوار", "bloom": "", "stem": "بیمار ۷۱ ساله‌ای با پیس‌میکر دائمی، دچار اریتم، گرمی و ترشح چرکی از جیب ژنراتور پیس‌میکر بدون تب سیستمیک و بدون باکتریمی (سه ست کشت خون منفی و TEE منفی از نظر رویش لید) است. در مقایسه با بیمار دیگری که علاوه بر کشت خون مثبت مکرر، رویش روی لیدهای پیس‌میکر (CIED-IE) دارد، مدت درمان آنتی‌بیوتیکی پس از خروج کامل دستگاه در عفونت ایزولهٔ جیب ژنراتور کدام است؟", "options": ["در عفونت جیب ژنراتور خروج کامل دستگاه الزامی نیست و تنها کشیدن درن کافی است", "۱۰–۱۴ روز در عفونت ایزولهٔ جیب (بعد از خروج) و ۴–۶ هفته در CIED-IE واقعی", "هر دو گروه پس از خروج دستگاه فقط به ۵ روز آنتی‌بیوتیک خوراکی نیاز دارند", "هر دو گروه بدون نیاز به خروج پیس‌میکر به‌مدت ۶ هفته آنتی‌بیوتیک وریدی می‌گیرند"], "correct": 1, "explanation": "مطابق فصل ۱۳۳ هریسون ۲۰۲۵ (صفحهٔ ۱۰۸۸)، درمان آنتی‌بیوتیکی برای CIED-IE و نیز عفونت جیب ژنراتور، کمکی در کنار خروج کامل دستگاه (Complete device removal) است. در بیماران با CIED-IE یا باکتریمی ادامه‌دار پس از خروج دستگاه، دورهٔ درمانی هدفمند IE به مدت ۴ تا ۶ هفته توصیه می‌شود؛ اما در عفونت جیب ژنراتور بدون باکتریمی (Generator pocket infection without bacteremia)، دورهٔ کوتاه‌تر ۱۰ تا ۱۴ روزه (که بخشی از آن می‌تواند خوراکی باشد) پس از خروج کامل دستگاه کافی است.", "whyWrong": {"0": "نادرست؛ عفونت جیب ژنراتور به‌واسطهٔ بیوفیلم روی سیم‌ها و ژنراتور نیز نیازمند خروج کامل سیستم CIED است.", "2": "نادرست؛ ۵ روز برای ریشه‌کنی عفونت جیب یا لید ناکافی است.", "3": "نادرست؛ نگه‌داشتن سخت‌افزار آلوده تقریباً همیشه به عود عفونت منجر می‌شود و خروج کامل دستگاه محور درمان است."}, "pearl": "قاعدهٔ طلایی عفونت دستگاه‌های قلبی (CIED): باکتریمی یا عفونت جیب = خروج کامل دستگاه + آنتی‌بیوتیک (۴–۶ هفته برای CIED-IE/باکتریمی؛ ۱۰–۱۴ روز برای عفونت ایزوله جیب).", "trap": "درمان عفونت جیب ژنراتور با برش و درناژ موضعی و آنتی‌بیوتیک بدون خارج کردن پیس‌میکر به عود مکرر می‌انجامد.", "highYield": "خروج کامل CIED در هر دو شرط الزامی است؛ مدت آنتی‌بیوتیک: جیب بدون باکتریمی = ۱۰–۱۴ روز؛ لید/باکتریمی = ۴–۶ هفته.", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 133 / موضوع 4", "topicIndex": 4, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1045", "referenceSection": "CIED-IE Management", "id": "inf-034"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 140, "chapterTitle": "عفونت‌های مجاری ادراری: سیستیت، پروستاتیت و پیلونفریت", "topic": "عفونت‌های مجاری ادراری", "subtopic": "Xanthogranulomatous Pyelonephritis Pathology & Imaging Mimic", "difficulty": "دشوار", "bloom": "", "stem": "زن ۵۹ ساله‌ای با سابقهٔ عفونت‌های راجعهٔ ادراری، تب مزمن، کاهش وزن و تودهٔ بزرگ در پهلوی راست و سنگ شاخ‌گوزنی (Staghorn calculus) کلیهٔ راست بستری شده و به اشتباه مشکوک به کارسینوم کلیه (RCC) است. در بررسی پاتولوژیک کلیهٔ خارج‌شده، بافت کلیوی زردرنگ همراه با ارتشاح ماکروفاژهای مملو از لیپید دیده می‌شود. کدام تشخیص بر اساس فصل ۱۴۰ هریسون ۲۰۲۵ مطرح است؟", "options": ["نکروز حاد پاپیلاری کلیوی", "پیلونفریت زانتوگرانولوماتوز", "مالاکوپلاکیا فقط محدود به مثانه", "پیلونفریت آمفیزماتوز (Emphysematous pyelonephritis)"], "correct": 1, "explanation": "در شکل و متن ۱۴۰-۳ فصل ۱۴۰ هریسون ۲۰۲۵ (صفحهٔ ۱۱۳۳)، پیلونفریت زانتوگرانولوماتوز (XGP) ناشی از التهاب چرکی مزمن در زمینهٔ انسداد طولانی‌مدت به‌وسیلهٔ سنگ شاخ‌گوزنی (Staghorn calculus) شرح داده شده است. اثر توده‌ای آن می‌تواند بدخیمی کلیه (کارسینوم کلیه) را تقلید کند و در نمای ماکروسکوپی و میکروسکوپی، بافت باقیماندهٔ کلیه رنگ زرد داشته و توسط ماکروفاژهای مملو از لیپید (Lipid-laden macrophages / Foam cells) ارتشاح یافته است.", "whyWrong": {"0": "نادرست؛ نکروز پاپیلاری سبب افتادن پاپیل در حالب می‌شود نه تودهٔ زرد مملو از ماکروفاژهای لیپیدی.", "2": "نادرست؛ هرچند مالاکوپلاکیا هم ماکروفاژ (اجسام میکائلیس-گوتمان) دارد، اما تابلوی سنگ شاخ‌گوزنی + بافت زرد مقلد تومور کلیه اختصاصاً XGP است.", "3": "نادرست؛ پیلونفریت آمفیزماتوز یک عفونت حاد و نکروزان با تولید گاز در پارانشیم/پری‌نفریک (شکل ۱۴۰-۲) در دیابتی‌هاست."}, "pearl": "دو پیلونفریت عارضه‌دار کلاسیک در تصاویر فصل ۱۴۰ هریسون: (۱) دیابتی + گاز در کلیه و فضای رتر‌وپریتوئن = پیلونفریت آمفیزماتوز (اشکالی مثل E. coli)؛ (۲) سنگ شاخ‌گوزنی + تودهٔ مقلد کانسر + ماکروفاژهای زرد لیپیدی = پیلونفریت زانتوگرانولوماتوز.", "trap": "تشخیص اشتباه سنگ شاخ‌گوزنی + تودهٔ کلیوی به عنوان کارسینوم کلیوی یا جابه‌جا کردن پیلونفریت آمفیزماتوز و زانتوگرانولوماتوز.", "highYield": "پیلونفریت زانتوگرانولوماتوز: سنگ شاخ‌گوزنی + مقلد بدخیمی کلیه + ماکروفاژهای مملو از لیپید (رنگ زرد بافت کلیه).", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 140 / موضوع 2", "topicIndex": 2, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1090", "referenceSection": "Figure 140-3 Xanthogranulomatous Pyelonephritis", "id": "inf-035"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 141, "chapterTitle": "عفونت‌های مقاربتی: مرور و رویکرد بالینی", "topic": "عفونت‌های مقاربتی", "subtopic": "Microbiologic Gap & HSV vs Gonococcal/Chlamydial Cervicitis", "difficulty": "متوسط", "bloom": "", "stem": "در معاینهٔ لگن زن ۲۵ ساله‌ای با ترشح غیرطبیعی واژن، ترشح چرکی زردرنگ از اس سرویکس، خونریزی اندوسرویکال با سواب ملایم و اکتوپی متورم دیده می‌شود، اما هیچ ضایعهٔ اولسره‌شده روی اپیتلیوم سنگفرشی اکتوسرویکس وجود ندارد. کدام گزاره دربارهٔ سرویسیت موکوپورولانت (MPC) مطابق فصل ۱۴۱ هریسون ۲۰۲۵ درست است؟", "options": ["نیمی از MPC با NAAT بدون عامل‌اند؛ سرویسیت HSV ضایعات اولسراتیو اکتوسرویکس می‌دهد", "معیار میکروسکوپی اندوسرویسیت ≥۵ PMN در بزرگنمایی ۱۰۰x بدون سلول سنگفرشی است", "ترشح زردرنگ و خونریزی با سواب برای کلامیدیا اختصاصی است و نیازی به تست ندارد", "اکتوپی ادماتو و خونریزی سرویکس در گنوکوک شایع‌تر از کلامیدیا است و در BV غایب است"], "correct": 0, "explanation": "در صفحهٔ ۱۱۴۷ هریسون ۲۰۲۵ آمده است که حتی در مطالعات جدید با استفاده از آزمایش‌های مولکولی NAAT برای کلامیدیا، گنوکوک، M. genitalium، HSV و تریکوموناس، در نزدیک به نیمی (۵۰٪) از زنان مبتلا به MPC هیچ عامل میکروبی مشخصی شناسایی نمی‌شود (و برخی باکتری‌های مرتبط با BV نیز می‌توانند التهاب سرویکس بدهند). همچنین برخلاف اندوسرویسیت کلامیدیایی/گونوکوکی، HSV ضایعات اولسراتیو روی اپیتلیوم سنگفرشی مطبق اکتوسرویکس (علاوه بر اپیتلیوم استوانه‌ای) ایجاد می‌کند. معیار میکروسکوپی اندوسرویسیت نیز `≥ 20 PMNs` در میدان `1000×` (روغن ایمرسیون) در رشته‌های موکوس عاری از آلودگی سلول سنگفرشی واژن است.", "whyWrong": {"1": "نادرست؛ معیار دقیق ≥ 20 PMNs در میدان 1000× است (نه ۵ در ۱۰۰×).", "2": "نادرست؛ علائم بالینی به تنهایی قادر به تفکیک میان کلامیدیا، گنوکوک و M. genitalium نیستند و اکتوپی ادماتو/خونریزی با سواب در کلامیدیا کمی شایع‌تر است.", "3": "نادرست؛ خونریزی با سواب و اکتوپی ادماتو تا حدی در کلامیدیا شایع‌تر است و BV می‌تواند عامل MPC غیرگونوکوکی/غیرکلامیدیایی باشد."}, "pearl": "سرویسیت با ترشح زرد + خونریزی حین سواب بدون اولسر = کلامیدیا/گنوکوک/M. genitalium یا BV؛ وجود ضایعات اولسراتیو روی اپیتلیوم سنگفرشی اکتوسرویکس = شک قوی به HSV!", "trap": "فراموش کردن ارسال تست برای سایر عوامل یا فرض کردن ۱۰–۲۰٪ ناکامی در شناسایی عامل (در واقع نزدیک به ۵۰٪ موارد حتی با NAAT عامل مشخصی ندارند).", "highYield": "MPC: حدود ۵۰٪ ایدیوپاتیک حتی با NAAT؛ معیار میکروسکوپی = ≥ 20 PMN در میدان 1000×؛ HSV برخلاف گنوکوک/کلامیدیا اکتوسرویکس سنگفرشی را اولسره می‌کند.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 141 / موضوع 4", "topicIndex": 4, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1104", "referenceSection": "Mucopurulent Cervicitis", "id": "inf-036"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 143, "chapterTitle": "مننژیت حاد", "topic": "مننژیت حاد", "subtopic": "Validated Bacterial Meningitis Score & Procalcitonin", "difficulty": "دشوار", "bloom": "", "stem": "کودک ۶ ساله‌ای در ماه اوت با تب ۳۸.۵ درجه، سردرد و پلئوسیتوز CSF مراجعه کرده است؛ هیچ سابقهٔ تشنج ندارد و اکنون نیز تشنج ندارد. در آزمایش‌ها: نوتروفیل مطلق خون محیطی ۶,۵۰۰/μL، رنگ‌آمیزی گرم CSF منفی، شمارش نوتروفیل CSF برابر ۴۵۰/μL و پروتئین CSF برابر ۵۲ mg/dL است. بر اساس سیستم معتبر «امتیاز مننژیت باکتریال» (Bacterial Meningitis Score) در فصل ۱۴۳ هریسون ۲۰۲۵، احتمال مننژیت باکتریال و ارزش اخباری منفی (NPV) در این کودک چه قدر است؟", "options": ["این مدل فقط در نوزادان زیر ۷ روز اعتبار دارد و شرط آن پروتئین <۲۰ mg/dL است", "با تحقق تمام ۵ معیار کم‌خطر، احتمال مننژیت باکتریال ≤ ۰.۳٪ (NPV ۹۹.۷٪) است", "به‌علت نوتروفیل CSF >۱۰۰، احتمال مننژیت باکتریال همچنان بالای ۴۰٪ است", "پروکلسی‌تونین سرم >۰.۵ ng/mL ارتباطی با افتراق مننژیت باکتریال از آسپتیک ندارد"], "correct": 1, "explanation": "مطابق صفحهٔ ۱۱۶۸ فصل ۱۴۳ هریسون ۲۰۲۵، سیستم اعتبارسنجی‌شدهٔ Bacterial Meningitis Score نشان می‌دهد که در کودکان (>۲۸ روز) با پلئوسیتوز CSF، در صورت وجود تمام ۵ معیار زیر، احتمال مننژیت باکتریال ≤ ۰.۳ درصد است (با NPV = ۹۹.۷٪): (۱) رنگ‌آمیزی گرم منفی CSF، (۲) نوتروفیل CSF < 1000 cells/μL، (۳) پروتئین CSF < 80 mg/dL، (۴) شمارش مطلق نوتروفیل محیطی < 10,000/μL، و (۵) نبود سابقهٔ قبلی یا وجود فعلی تشنج. این بیمار تمام ۵ معیار را دارد. همچنین پروتئین >0.5 g/L (۵۰ mg/dL) و پروکلسی‌تونین سرم >0.5 ng/mL در افتراق مننژیت باکتریال از آسپتیک مفیدند.", "whyWrong": {"0": "نادرست؛ مطالعات و امتیاز فوق برای کودکان بالای ۲۸ روز اعتبارسنجی شده و آستانه پروتئین <۸۰ mg/dL است.", "2": "نادرست؛ آستانهٔ نوتروفیل CSF در BMS زیر ۱,۰۰۰ سلول است و عدد ۴۵۰ داخل محدودهٔ کم‌خطر قرار می‌گیرد.", "3": "نادرست؛ پروکلسی‌تونین سرم >۰.۵ ng/mL (حساسیت ۸۹٪، ویژگی ۸۹٪) سرنخ قوی مننژیت باکتریال در برابر آسپتیک است."}, "pearl": "پنج متغیر Bacterial Meningitis Score (همه باید منفی باشند): (۱) گرم مثبت، (۲) PMN CSF ≥ ۱۰۰۰، (۳) پروتئین CSF ≥ ۸۰، (۴) ANC خون ≥ ۱۰,۰۰۰، (۵) تشنج؛ نبود همهٔ ۵ مورد -> احتمال مننژیت باکتریال ≤ ۰.۳٪!", "trap": "آستانه‌های ۸۰ mg/dL پروتئین و ۱,۰۰۰ PMN را با اعداد کمتر مثل ۴۵ mg/dL و ۲۰۰ PMN جابه‌جا کردن.", "highYield": "Bacterial Meningitis Score (کودکان >28d): گرم منفی + PMN CSF <1000 + پروتئین <80 + ANC خون <10000 + بدون تشنج -> احتمال ≤0.3% (NPV 99.7%).", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 143 / موضوع 4", "topicIndex": 4, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1125", "referenceSection": "Differentiating Bacterial from Aseptic Meningitis", "id": "inf-037"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 151, "chapterTitle": "عفونت‌های پنوموکوکی", "topic": "عفونت‌های پنوموکوکی", "subtopic": "Pneumococcal Surface Antigens & Inflammation Mechanisms", "difficulty": "خیلی دشوار", "bloom": "", "stem": "کدام یک از مولکول‌های سطحی یا ترشحی Streptococcus pneumoniae بر اساس شکل ۱۵۱-۲ و متن فصل ۱۵۱ هریسون ۲۰۲۵ به گیرندهٔ فاکتور فعال‌کنندهٔ پلاکت (PAFR) در سلول‌های اپیتلیال انسان متصل شده و هم‌زمان پیلی، اتولیزین و کپسول چه نقش‌هایی ایفا می‌کنند؟", "options": ["پنومولیزین تنها پروتئینی است که به PAFR متصل می‌شود و هرگز سیتوکاین التهابی تحریک نمی‌کند", "التهاب در پنوموکوک به جای دیوارهٔ سلولی عمدتاً ناشی از اندوتوکسین لیپید A است", "PspA همان IgA1 پروتئاز است و پیلی مسئول شکافت مستقیم سیالیک اسیدهای میزبان هستند", "فسفوریل‌کولین ← PAFR؛ CbpA چسبندگی؛ PspA مهار کمپلمان؛ اتولیزین ← آزادسازی پنومولیزین"], "correct": 3, "explanation": "مطابق شکل ۱۵۱-۲ و متن فصل ۱۵۱ هریسون ۲۰۲۵ (صفحهٔ ۱۲۳۱ و ۱۲۳۴): در سطح پنوموکوک، فسفوریل‌کولین (Phosphorylcholine) به گیرندهٔ PAFR اپیتلیوم انسان متصل می‌شود؛ PspC/CbpA مولکول چسبندگی اصلی است؛ PspA با مهار فعال‌سازی مسیر جایگزین کمپلمان مانع رسوب کمپلمان می‌شود؛ نورآمینیداز (NanA/NanB) اسید سیالیک را برای افشای محل اتصال می‌زداید؛ و اتولیزین (LytA) هنگام اتولیز، اجزای داخل‌سلولی و دیوارهٔ سلولی شامل پپتیدوگلیکان، اسید تیکوئیک و پنومولیزین را آزاد می‌کند که التهاب شدید ناشی از IL-1، IL-6، TNF و جذب PMN ایجاد می‌کنند (پنوموکوک فاقد LPS/لیپید A است).", "whyWrong": {"0": "نادرست؛ پنومولیزین سم حفره‌ساز سیتولیتیک و محرک قوی سیتوکاین است، نه لیگاند PAFR؛ لیگاند PAFR فسفوریل‌کولین است.", "1": "نادرست؛ پنوموکوک گرم مثبت است و لیپید A/اندوتوکسین ندارد؛ عامل اصلی التهاب، اسید تیکوئیک، پپتیدوگلیکان و پنومولیزین هستند.", "2": "نادرست؛ PspA مهارکنندهٔ کمپلمان است و نورآمینیداز اسید سیالیک را حذف می‌کند."}, "pearl": "چسبیدن فسفوریل‌کولین پنوموکوک به گیرندهٔ PAFR توضیح می‌دهد که چرا عفونت‌های ویروسی قبلی (مثل آنفلوانزا) با افزایش بیان PAFR اپیتلیال به کمک سیتوکاین‌ها، زمینه‌ساز تهاجم ثانویهٔ پنوموکوک می‌شوند!", "trap": "نسبت دادن اندوتوکسین (LPS) به پنوموکوک یا جابه‌جا کردن نقش PspA (مهار کمپلمان) با IgA1 پروتئاز.", "highYield": "شکل ۱۵۱-۲: فسفوریل‌کولین -> گیرنده PAFR؛ PspA -> مهار مسیر جایگزین کمپلمان؛ PspC/CbpA -> ادهسین اصلی؛ اتولیزین -> آزادسازی پنومولیزین/تیکوئیک اسید.", "questionType": "basic", "questionTypeLabel": "علوم پایهٔ کاربردی (Basic Science Integration)", "coverageIndex": "فصل 151 / موضوع 1", "topicIndex": 1, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1188, 1191", "referenceSection": "Figure 151-2 & Pathogenesis", "id": "inf-038"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 152, "chapterTitle": "عفونت‌های استافیلوکوکی", "topic": "عفونت‌های استافیلوکوکی", "subtopic": "Newer Anti-MRSA Agents (Ceftobiprole, Dalbavancin, Oritavancin, Delafloxacin, Omadacycline)", "difficulty": "خیلی دشوار", "bloom": "", "stem": "در جدول ۱۵۲-۳ هریسون ۲۰۲۵ (درمان ضدمیکروبی عفونت‌های استافیلوکوکی)، مجموعه داروهای جدیدی برای عفونت‌های جدی یا پیچیدهٔ ناشی از MRSA معرفی شده‌اند. کدام یک از گزینه‌های زیر به‌درستی با دوز یا ک  "coverageIndex": "فصل 152 / موضوع 3", "topicIndex": 3, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1203", "referenceSection": "Table 152-3 Antimicrobial Therapy", "id": "inf-039"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 153, "chapterTitle": "عفونت‌های استرپتوکوکی: از فارنژیت و مخملک تا فاسیایتیس نکروزان", "topic": "عفونت‌های استرپتوکوکی", "subtopic": "Arcanobacterium haemolyticum & Bacterial Differential", "difficulty": "آسان", "bloom": "", "stem": "نوجوان ۱۹ ساله‌ای با گلودرد شدید، تب خفیف و بثورات پوستی شبیه مخملک (Scarlatiniform rash) مراجعه می‌کند؛ آزمایش سریع و کشت استاندارد روی آگار خون گوسفندی برای استرپتوکوک بتا-همولیتیک گروه A منفی گزارش می‌شود و تست هتروفیل مونونوکلئوز نیز منفی است. مطابق جدول ۱۵۳-۲ هریسون ۲۰۲۵، کدام باکتری به‌طور کلاسیک با فارنژیت همراه با راش اسکارلاتینی‌فرم تظاهر می‌یابد؟", "options": ["Yersinia enterocolitica", "Coxsackievirus A", "Mycoplasma pneumoniae", "Arcanobacterium haemolyticum"], "correct": 3, "explanation": "در جدول ۱۵۳-۲ هریسون ۲۰۲۵ (عوامل عفونی فارنژیت حاد، صفحهٔ ۱۲۵۱)، Arcanobacterium haemolyticum مشخصاً به‌عنوان عامل فارنژیت همراه با راش اسکارلاتینی‌فرم (Pharyngitis, scarlatiniform rash) در نوجوانان و بزرگسالان جوان ذکر شده است که بالینی مخملک GAS را تقلید می‌کند اما باسیل گرم مثبت است.", "whyWrong": {"0": "نادرست؛ Yersinia enterocolitica با فارنژیت و انتروکولیت همراه است نه راش اسکارلاتینی‌فرم کلاسیک.", "1": "نادرست؛ کوکساکی ویروس هرپانژینا و بیماری دست-پا-دهان می‌دهد (ضایعات وزیکولار حفرهٔ دهان).", "2": "نادرست؛ مایکوپلاسما با برونشیت و پنومونی مرتبط است نه راش مخملکی."}, "pearl": "در نوجوان با گلودرد اگزوداتیو + راش مخملکی ولی تست GAS منفی، به Arcanobacterium haemolyticum فکر کنید که روی آگار خون انسانی همولیز بسیار واضح‌تری نسبت به آگار خون گوسفند دارد و به ماکرولیدها/داکسی‌سایکلین پاسخ می‌دهد.", "trap": "اکتفا کردن به منفی شدن تست GAS و فرض منشأ صرفاً ویروسی در ن : 183, "chapterTitle": "سل", "topic": "سل (توبرکلوز)", "subtopic": "محدودیت‌های رژیم کوتاه‌مدت ۴ ماهه سل حساس (2HPMZ/2HPM)", "difficulty": "خیلی دشوار", "bloom": "", "stem": "رژیم روزانهٔ ۴ ماههٔ 2HPMZ/2HPM (ایزونیازید، ریفاپنتین ۱۲۰۰ mg، موکسی‌فلوکساسین ۴۰۰ mg و پیرازینامید در ۲ ماه اول و ادامه با HPM در ۲ ماه بعد) به‌عنوان جایگزین رژیم ۶ ماهه در هاریسون ۲۰۲۵ توصیه شده است. تجویز این رژیم ۴ ماهه در کدام گروه از بیماران مبتلا به سل حساس به دارو توصیه نمی‌شود (ممنوع یا ارزیابی‌نشده است)؟", "options": ["بیماران مبتلا به سل ریوی بدون کاویته با وزن ۶۵ کیلوگرم و شمارش CD4 برابر ۳۵۰/میکرولیتر", "HIV با CD4<100، باردار/شیرده، وزن <۴۰kg، سن <۱۲، خارج‌ریوی شدید و QT طولانی", "تمام بیماران مبتلا به HIV صرف‌نظر از شمارش CD4 و تمام بیماران دیابتی با سن بالای ۵۰ سال", "بیمارانی که تنها عارضهٔ آن‌ها اسمیر خلط مثبت اولیه بوده اما حساسیت کامل به تمام داروها دارند"], "correct": 1, "explanation": "رژیم ۴ ماههٔ Study 31/A5349 (`2HPMZ/2HPM`) در افراد ۱۲ سال به بالا و حتی افراد دارای HIV با CD4 ≥ ۱۰۰ قابل استفاده است، اما طبق صراحت هاریسون ۲۰۲۵ در موارد زیر ارزیابی نشده و نباید استفاده شود: وزن <۴۰ کیلوگرم، سن <۱۲ سال، اشکال شدید خارج‌ریوی یا منتشر (مثل مننژیت سل)، افراد دارای HIV با CD4 < ۱۰۰/μL، زنان باردار/شیرده/پس از زایمان، سابقهٔ QT طولانی یا تداخل دارویی مهم و مقاومت دارویی مشکوک/قطعی.", "whyWrong": {"0": "نادرست؛ بیمار با وزن ۶۵ کیلوگرم و CD4 = ۳۵۰ دقیقاً کاندیدای مناسب این رژیم ۴ ماهه است.", "2": "نادرست؛ در PLWH با CD4 بالای ۱۰۰/μL این رژیم ۴ ماهه قابل استفاده است (صفحهٔ ۱۴۰۰) و فقط CD4 < ۱۰۰ مستثنی شده است.", "3": "نادرست؛ اسمیر مثبت مانع رژیم ۴ ماهه نیست و در کارآزمایی شامل سل ریوی با اسمیر/کشت مثبت بود."}, "pearl": "در رژیم ۴ ماهه (Study 31/A5349) به جای ریفامپین از ریفاپنتین ۱۲۰۰ میلی‌گرم روزانه و به جای اتامبوتول از موکسی‌فلوکساسین ۴۰۰ میلی‌گرم روزانه استفاده می‌شود.", "trap": "آستانهٔ CD4 برای رژیم ۴ ماهه در HIV برابر ۱۰۰ است (`<100` ممنوع)، و برای بارداری/شیردهی، وزن <۴۰ کیلوگرم و سل شدید خارج‌ریوی نیز ممنوع می‌باشد.", "highYield": "مبحث پربازده هاریسون ۲۰۲۵ — محدودیت‌ه Clues", "difficulty": "دشوار", "bloom": "", "stem": "کارمند ۳۴ سالهٔ یک آزمایشگاه جانوری در اواخر پاییز با سردرد، تب، ریزش موی اخیر (آلوپسی)، درد خفیف مفصل، لکوپنی، ترومبوسیتوپنی و افزایش خفیف آنزیم‌های کبدی مراجعه کرده و در پونکسیون کمری، ۱۸۰۰ گلبول سفید با غلبهٔ لنفوسیت و هیپوگلیکوراکی (گلوکز پایین) دیده می‌شود. در مصاحبه، تماس با موش‌های خانگی و همستر را گزارش می‌کند. کدام ویروس عامل محتمل‌ترین تشخیص است و کدام ویروس دیگر در ۴۸ ساعت اول بیماری در ۴۵٪ بیماران می‌تواند غلبهٔ نوتروفیل (PMN) در CSF بدهد؟", "options": ["آنتروویروس ۷۱ با منشأ جوندگان؛ HSV-2 همیشه پلئوسیتوز بالای ۲,۰۰۰ و آلوپسی می‌دهد", "سایتومگالوویروس با تماس موش؛ و گلوکز مایع مغزی-نخاعی را هرگز کاهش نمی‌دهد", "ویروس اوریون با تماس همستر؛ و هرگز در ۲۵٪ موارد غلبهٔ PMN یا کاهش گلوکز نمی‌دهد", "ویروس کوریومننژیت لنفوسیتیک (LCMV)؛ نیل غربی در ۴۵٪ ابتدا غلبه نوتروفیلی دارد"], "correct": 3, "explanation": "در صفحات ۱۱۶۷ تا ۱۱۶۹ فصل ۱۴۳ هریسون ۲۰۲۵ سه استثنای حیاتی مننژیت ویروسی شرح داده شده است: (۱) LCMV (ویروس کوریومننژیت لنفوسیتیک) در اواخر پاییز/زمستان با سابقهٔ تماس با موش خانگی (Mus musculus) یا جوندگان آزمایشگاهی/خانگی (همستر، موش صحرایی) رخ داده و با راش، آلوپسی، پاروتیت/ارکیت، لکوپنی، ترومبوسیتوپنی، اختلال LFT، و در CSF با پلئوسیتوز چشمگیر (>۱۰۰۰ سلول/μL) و هیپوگلیکوراکی (<۳۰٪) تظاهر می‌یابد؛ (۲) ویروس نیل غربی (WNV) همراه اکوویروس ۹، EEE و اوریون می‌تواند در ۴۸ ساعت اول غلبهٔ PMN در CSF بدهد که در ۴۵٪ بیماران WNV دیده می‌شود؛ (۳) مننژیت اوریون (Mumps) در اواخر زمستان/اوایل بهار با نسبت مرد به زن ۳:۱ رخ داده و در ۱۰–۳۰٪ بیماران هیپوگلیکوراکی و در ۲۵٪ غلبهٔ PMN دارد.", "whyWrong": {"0": "نادرست؛ آنتروویروس ۷۱ مربوط به تابستان/پاییز و بدون مخزن جونده یا تظاهر کلاسیک همستر/آلوپسی است.", "1": "نادرست؛ CMV بیماری تماسی جوندگان نیست.", "2": "نادرست؛ اوریون با همستر منتقل نمی‌شود (اما اتفاقاً اوریون در ۲۵٪ موارد PMN و ۱۰–۳۰٪ هیپوگلیکوراکی دارد!)."}, "pearl": "سه علت ویروسی هیپوگلیکوراکی (گلوکز پایین CSF) در هریسون: LCMV (<30% موارد)، اوریون (۱۰–۳۰٪ موارد) و گاهی HSV. سابقهٔ همستر/موش خانگی + آلوپسی/ترومبوسیتوپنی + >1000 WBC در پاییز/زمستان = LCMV!", "trap": "رد کردن مننژیت ویروسی به صرف دیدن >۱۰۰۰ سلول یا کاهش گلوکز یا دیدن غلبهٔ نوتروفیل در ۴۸ ساعت اول بیماری (WNV، اکوویروس ۹، اوریون).", "highYield": "LCMV: اواخر پاییز/زمستان + موش/همستر + لکوپنی/ترومبوسیتوپنی/LFT بالا + پلئوسیتوز >1000 و گلوکز پایین؛ WNV = ۴۵٪ غلبهٔ PMN در اوایل بیماری.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 143 / موضوع 5", "topicIndex": 5, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1124–1126", "referenceSection": "Viral Etiologies: WNV & LCMV", "id": "inf-057"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 151, "chapterTitle": "عفونت‌های پنوموکوکی", "topic": "عفونت‌های پنوموکوکی", "subtopic": "Pediatric vs Adult Nasopharyngeal Carriage & Pre-PCV IPD Serotypes", "difficulty": "متوسط", "bloom": "", "stem": "کدام گزاره دربارهٔ اپیدمیولوژی کلونیزاسیون نازوفارنژیال و سروتیپ‌های بیماری تهاجمی پنوموکوک (IPD) مطابق فصل ۱۵۱ هریسون ۲۰۲۵ درست است؟", "options": ["آنتی‌ژن ادراری پنوموکوک در بزرگسالان بی‌ارزش ولی در کودکان زیر ۳ سال کاملاً اختصاصی است", "حمل نازوفارنژیال پنوموکوک صرفاً در فصل زمستان رخ می‌دهد و در تابستان به صفر می‌رسد", "کلونیزاسیون نازوفارنژیال پنوموکوک در بزرگسالان بالای ۷۰٪ و در نوزادان زیر ۱٪ است", "کلونیزاسیون کودکان ~۴۰–۵۰٪ (بالغین <۱۰٪)؛ ۷ سروتیپ قبل PCV عامل ~۶۰٪ IPD زیر ۵ سال بودند"], "correct": 3, "explanation": "مطابق شکل ۱۵۱-۳ و متن صفحهٔ ۱۲۳۲ فصل ۱۵۱ هریسون ۲۰۲۵: (۱) شیوع کلونیزاسیون نازوفارنژیال در کودکان (به‌ویژه ۰ تا ۴ سال) بسیار بالا (حدود ۴۰–۶۰٪) و در بزرگسالان ۱۸+ سال بسیار پایین است و برخلاف بروز فصلی بیماری، خود کلونیزاسیون روند فصلی معناداری نشان نمی‌دهد؛ (۲) در دورهٔ پیش از PCV، هفت سروتیپ (1, 5, 6A, 6B, 14, 19F, 23F) عامل حدود ۶۰٪ موارد بیماری تهاجمی کودکان زیر ۵ سال در سراسر جهان بودند؛ (۳) به‌دلیل پایین بودن کلونیزاسیون در بزرگسالان، تشخیص آنتی‌ژن پنوموکوک در ادرار در بزرگسالان ویژگی بسیار بالایی دارد (برخلاف کودکان).", "whyWrong": {"0": "نادرست؛ چون کلونیزاسیون در کودکان بالاست، آنتی‌ژن ادراری در کودکان می‌تواند مثبت کاذب شود ولی در بزرگسالان (صفحهٔ ۱۲۳۶) بسیار اختصاصی است.", "1": "نادرست؛ شکل ۱۵۱-۳ نشان می‌دهد روند فصلی معناداری برای شیوع کلونیزاسیون وجود ندارد (برخلاف اوج زمستانی بیماری تهاجمی ناشی از هم‌افزایی ویروس‌ها).", "2": "نادرست؛ میزان کلونیزاسیون دقیقاً برعکس است (بسیار بالا در کودکان خردسال و پایین در بزرگسالان)."}, "pearl": "میزان کلونیزاسیون کودکان بالا ولی پایدار در کل سال است؛ پس علت اوج زمستانی پنومونی پنوموکوکی، افزایش کلونیزاسیون نیست بلکه اختلال سد مخاطی توسط ویروس‌های تنفسی زمستانی و کسب سروتیپ جدید در فرد فاقد ایمنی نوع-ویژه است!", "trap": "تفسیر مثبت شدن آنتی‌ژن ادراری پنوموکوک در شیرخوار و کودک مهدکودکی به عنوان اثبات قطعی پنومونی پنوموکوکی (در حالی که می‌تواند ناشی از کلونیزاسیون بدون علامت نازوفارنکس باشد).", "highYield": "کلونیزاسیون: کودکان بالا (~۴۰–۶۰٪)، بزرگسالان پایین؛ بدون روند فصلی معنادار؛ آنتی‌ژن ادراری در بزرگسالان ویژگی بالا دارد (در کودکان نه).", "questionType": "recall", "questionTypeLabel": "نکتهٔ پربازده مستقیم (Direct High-Yield Recall)", "coverageIndex": "فصل 151 / موضوع 2", "topicIndex": 2, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1189, 1193", "referenceSection": "Figure 151-3 & Serotype Distribution", "id": "inf-058"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 152, "chapterTitle": "عفونت‌های استافیلوکوکی", "topic": "عفونت‌های استافیلوکوکی", "subtopic": "Staphylococcal Pneumatoceles & Neonatal/Infant Pneumonia", "difficulty": "متوسط", "bloom": "", "stem": "شیرخوار ۵ ماهه‌ای با تب بالا، دیسترس تنفسی شدید و تاکی‌پنه بستری شده و در گرافی قفسهٔ سینه حفرات دیواره‌نازک و شگی (Pneumatoceles) همراه با پنوموتوراکس و افیوژن پلور چرکی دیده می‌شود. مطابق فصل ۱۵۲ هریسون ۲۰۲۵، کدام عامل محتمل‌ترین پاتوژن مسبب و کدام عارضه همراه است؟", "options": ["Chlamydia trachomatis؛ حفرهٔ پنوماتوسل علامت پاتوگنومونیک پنومونی آتیپیک نوزادی است", "Streptococcus viridans؛ پنومونی استافیلوکوکی هرگز در نوزادان دیسترس تنفسی نمی‌دهد", "Staphylococcus aureus؛ پنوماتوسل، پنوموتوراکس و امپیم عوارض تیپیک آن در شیرخواران است", "Mycoplasma pneumoniae؛ پنوماتوسل هرگز با امپیم چرکی یا پنوموتوراکس همراه نمی‌شود"], "correct": 2, "explanation": "در بخش عفونت‌های دستگاه تنفس صفحهٔ ۱۲۴۳ فصل ۱۵۲ هریسون ۲۰۲۵ آمده است که S. aureus علت عفونت‌های تنفسی جدی در نوزادان و شیرخواران است که با تنگی نفس، تب و نارسایی تنفسی تظاهر می‌کند و در گرافی قفسهٔ سینه پنوماتوسل (حفرات نازک‌دیواره و نامنظم / Shaggy, thin-walled cavities) مشاهده شده و پنوموتوراکس و امپیم از عوارض شناخته‌شدهٔ آن هستند.", "whyWrong": {"0": "نادرست؛ پنومونی کلامیدیایی نوزادان بدون تب و با سرفهٔ استاکاتو و ائوزینوفیلی است نه پنوماتوسل و امپیم.", "1": "نادرست؛ استرپتوکوک ویریدانس عامل پنومونی پنوماتوسل‌دار شیرخواران نیست.", "3": "نادرست؛ مایکوپلاسما تابلوی پنومونی بینابینی آتیپیک خفیف‌تر دارد و عامل کلاسیک پنوماتوسل/امپیم نوزادی نیست."}, "pearl": "پنوماتوسل‌های استافیلوکوکی به علت مکانیسم دریچه یک‌طرفه (Check-valve) در راه‌های هوایی نکروزه پدید می‌آیند و به‌راحتی به داخل فضای پلور پاره شده و پیوپنوموتوراکس می‌دهند.", "trap": "درناژ عجولانهٔ خودِ پنوماتوسل با سوزن به گمان آبسه یا کیست، که منجر به فیستول برونکوپلورال و پنوموتوراکس پایدار می‌شود (تنها امپیم و پنوموتوراکس درناژ می‌شوند).", "highYield": "پنوماتوسل (حفرات دیواره‌نازک) + پنوموتوراکس + امپیم در شیرخوار با دیسترس تنفسی حاد = Staphylococcus aureus.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 152 / موضوع 4", "topicIndex": 4, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1200", "referenceSection": "Staphylococcal Respiratory Tract Infections", "id": "inf-059"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 153, "chapterTitle": "عفونت‌های استرپتوکوکی: از فارنژیت و مخملک تا فاسیایتیس نکروزان", "topic": "عفونت‌های استرپتوکوکی", "subtopic": "Bacteremia Contrast with Staphylococcal TSS & Mortality/IVIG", "difficulty": "متوسط", "bloom": "", "stem": "مرد ۴۳ ساله‌ای ۳ روز پس از عفونت بافت نرم ساق پا دچار تب بالا، افت فشار مقاوم به مایع، نارسایی حاد کلیه، افزایش آنزیم‌های کبدی و سندرم دیسترس تنفسی حاد شده است؛ در هر دو بطری کشت خون وی Streptococcus pyogenes رشد می‌کند. مطابق فصل ۱۵۳ هریسون ۲۰۲۵، کدام گزاره دربارهٔ سندرم شوک توکسیک استرپتوکوکی (STSS) در مقایسه با استافیلوکوکی درست است؟", "options": ["STSS غالباً باکتریمی دارد؛ مرگ‌ومیر ≥۳۰٪؛ درمان جدول ۱۵۳-۳ پنی‌سیلین + کلیندامایسین + IVIG", "کلیندامایسین در عفونت مهاجم ممنوع بوده و IVIG در شوک استرپتوکوکی هیچ جایگاهی ندارد", "باکتریمی در STSS تقریباً هرگز (<۵٪) رخ نمی‌دهد و مرگ‌ومیر آن زیر ۲٪ برآورد می‌شود", "پنی‌سیلین G به‌تنهایی در STSS بدون نیاز به کلیندامایسین یا دبریدمان بافت نکروتیک کفایت می‌کند"], "correct": 0, "explanation": "در صفحات ۱۲۵۱ و ۱۲۵۵ فصل ۱۵۳ هریسون ۲۰۲۵ آمده است: برخلاف بیماران TSS استافیلوکوکی (که عمدتاً باکتریمی ندارند)، اکثریت بیماران مبتلا به STSS باکتریمی دارند. شایع‌ترین کانون همراه عفونت بافت نرم (فاشئیت نکروزان، میوزیت، سلولیت) است و سوپرآنتیژن‌هایی مانند اگزوتوکسین پیروژنیک A باعث آزادسازی طوفانی سیتوکاین از لنفوسیت‌های T می‌شوند. مرگ‌ومیر STSS برابر یا بیشتر از ۳۰ درصد (≥۳۰٪) بوده و جدول ۱۵۳-۳ برای درمان آن پنی‌سیلین G (۲–۴ میلیون واحد IV هر ۴ ساعت) + کلیندامایسین (۶۰۰–۹۰۰ mg IV هر ۸ ساعت) + IVIG وریدی (۲ g/kg تک‌دوز) در کنار احیای تهاجمی و دبریدمان فوری را توصیه می‌کند.", "whyWrong": {"1": "نادرست؛ در جدول ۱۵۳-۳ تجویز تک‌دوز IVIG به میزان ۲ گرم بر کیلوگرم برای خنثی‌سازی سوپرآنتیژن‌ها قید شده است.", "2": "نادرست؛ عدم باکتریمی ویژگی TSS استافیلوکوکی است نه استرپتوکوکی، و مرگ‌ومیر STSS بالای ۳۰٪ است.", "3": "نادرست؛ کلیندامایسین برای مهار سنتز پروتئین و توکسین در باکتری‌های در فاز ایستایی (Eagle effect) حیاتی است."}, "pearl": "تفاوت بالینی کلیدی دو TSS: استافیلوکوکی = کشت خون معمولاً منفی + راش افتراق د از همان ابتدا پوشش داده شود.", "3": "نادرست؛ داکسی‌سایکلین به‌تنهایی مننگوکوکسمی را پوشش نمی‌دهد و تأخیر برای LP پیش از آنتی‌بیوتیک در بیمار شوک/بدحال خطرناک است."}, "pearl": "افزودن داکسی‌سایکلین به سفتریاکسون در سپسیس همراه با پتشی در فصل گرم، پوشش دوگانهٔ بی‌نقصی برای N. meningitidis و R. rickettsii فراهم می‌کند و هیچ تاخیری نباید در شروع هیچ‌کدام رخ دهد.", "trap": "در مننگوکوکسمی برق‌آسا (۱۰–۲۰٪ موارد)، ممکن است مننژیت بالینی وجود نداشته باشد و حتی پنی‌سیلین بدون ریشه‌کنی ناقل نازوفارنکس کافی نباشد، برخلاف سفتریاکسون.", "highYield": "مننگوکوکسمی یا RMSF نامتمایز -> سفتریاکسون (۲g q12h) + داکسی‌سایکلین (۱۰۰mg BID)؛ سفتریاکسون ناقل نازوفارنژیال مننگوکوک را هم پاک می‌کند.", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 127 / موضوع 3", "topicIndex": 3, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "991–992", "referenceSection": "Table 127-1 Empirical Treatment for Common ID Emergencies", "id": "inf-076"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 131, "chapterTitle": "پنومونی", "topic": "پنومونی", "subtopic": "Indications for Double Antipseudomonal + MRSA Therapy", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۵۸ ساله‌ای در روز ششم بستری در ICU پس از جراحی شکمی، دچار تب، افزایش ترشحات چرکی اندوتراکئال، افت SpO2 و ارتشاح جدید در گرافی ریه می‌شود و هم‌زمان دچار شوک سپتیک است. وی طی ۹۰ روز اخیر آنتی‌بیوتیک وریدی دریافت نکرده و نرخ محلی MRSA پنومونی نامشخص است. بر اساس جدول ۱۳۱-۸ هریسون ۲۰۲۵، کدام رژیم تجربی صحیح است؟", "options": ["تک‌درمانی پیپراسیلین-تازوباکتام به‌دلیل نبود مصرف آنتی‌بیوتیک در ۹۰ روز اخیر", "سفپیم به همراه کلیندامایسین وریدی بدون نیاز به پوشش ضد MRSA", "سفتریاکسون به همراه آزیترومایسین وریدی تا آماده شدن نتیجهٔ کشت آسپیرات", "دو داروی ضدرسودوموناس از دو کلاس متفاوت همراه با ونکومایسین یا لینزولید"], "correct": 3, "explanation": "مطابق جدول ۱۳۱-۸ و ۳۱۵-۱ هریسون ۲۰۲۵، هرگاه بیمار مبتلا به VAP دارای یکی از عوامل خطر پاتوژن‌های گرم منفی مقاوم (از جمله ≥۵ روز بستری قبل از VAP، شوک سپتیک در زمان VAP، ARDS پیش‌رونده قبل از VAP، آنتی‌بیوتیک وریدی طی ۹۰ روز گذشته، یا درمان جایگزینی کلیوی حاد قبل از VAP) باشد، باید دو داروی ضدرسودوموناس از دو کلاس متفاوت (یک بتا-لاکتام ضدرسودوموناس مانند پیپراسیلین-تازوباکتام/سفپیم/مروپنم + یک آمینوگلیکوزید یا فلوروکینولون ضدرسودوموناس یا پلی‌میکسین) تجویز شود. همچنین به‌دلیل نامشخص بودن نرخ محلی MRSA (یا >10%) و بستری ≥5 روز، پوشش MRSA با ونکومایسین یا لینزولید الزامی است.", "whyWrong": {"0": "نادرست؛ تک‌درمانی فقط زمانی مطرح است که شوک سپتیک وجود نداشته باشد و تک‌دارو ≥۹۰٪ گرم‌منفی‌های بخش را پوشش دهد و ریسک فاکتور MDR وجود نداشته باشد.", "1": "نادرست؛ یک بتا-لاکتام به تنهایی در شوک سپتیک ناشی از VAP کافی نیست و کلیندامایسین پوشش مطمئنی برای MRSA بیمارستانی ندارد.", "2": "نادرست؛ سفتریاکسون و آزیترومایسین فاقد پوشش علیه Pseudomonas aeruginosa و Acinetobacter و MRSA هستند."}, "pearl": "عوامل خطر ۵گانهٔ دریافت دو داروی ضدرسودوموناس در VAP: (۱) آنتی‌بیوتیک IV در ۹۰ روز گذشته، (۲) شوک سپتیک حین VAP، (۳) ARDS قبل از VAP، (۴) ≥۵ روز بستری، (۵) دیالیز/RRT حاد قبل از VAP.", "trap": "حتی اگر بیمار در ۹۰ روز اخیر آنتی‌بیوتیک نگرفته باشد، خود شوک سپتیک در لحظهٔ VAP یا ≥۵ روز بستری، رژیم دوگانهٔ ضدرسودوموناس را ضروری می‌کند.", "highYield": "نرخ محلی MRSA > 10% یا نامشخص بودن آن خود به‌تنهایی اندیکاسیون افزودن ونکومایسین یا لینزولید در HAP/VAP است.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 131 / موضوع 6", "topicIndex": 6, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1032, 2321", "referenceSection": "Table 131-8 & Table 315-1", "id": "inf-077"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 133, "chapterTitle": "اندوکاردیت عفونی", "topic": "اندوکاردیت عفونی", "subtopic": "Emergent (Same-Day) vs Urgent vs Elective Indications", "difficulty": "خیلی دشوار", "bloom": "", "stem": "چهار بیمار با تشخیص قطعی اندوکاردیت عفونی بستری شده‌اند. بر اساس جدول ۱۳۳-۷ هریسون ۲۰۲۵، کدام بیمار نیازمند جراحی قلبی اورژانسی در همان روز (Emergent – same day) است؟", "options": ["بیمار با تب روز هشتم درمان بدون آبسه، فیستول یا نارسایی دریچه", "بیمار با رویش ۱۳ میلی‌متری دریچهٔ میترال بدون نارسایی یا آمبولی", "بیمار با نارسایی حاد آئورت، بسته شدن زودرس میترال و ادم حاد ریه", "بیمار با PVE استافیلوکوکی زودرس و وضعیت همودینامیک کاملاً پایدار"], "correct": 2, "explanation": "در جدول ۱۳۳-۷ هریسون ۲۰۲۵ (زمان‌بندی مداخلهٔ جراحی در IE)، جراحی اورژانسی در همان روز (Emergent - same day) به‌طور مشخص برای موارد زیر تعیین شده است: اختلال دریچه همراه با ادم ریه یا شوک کاردیوژنیک، نارسایی حاد آئورت همراه با بسته شدن زودرس دریچهٔ میترال (preclosure of mitral valve)، پارگی آبسهٔ سینوس والسالوا به قلب راست و پارگی به ساک پریکارد. موارد مثل PVE زودرس <=۲ ماه یا اندوکاردیت قارچی در دستهٔ جراحی الکتیو/زودرس قرار دارند و آمبولی بزرگ با رویش >10 mm یا دریچهٔ پروتزی ناپایدار در دستهٔ Urgent (طی ۱–۲ روز) هستند.", "whyWrong": {"0": "نادرست؛ تداوم تب در روز ۸ حتی با اختلال دریچه در دستهٔ Elective است و بدون نارسایی همودینامیک جراحی همان‌روز نمی‌خواهد.", "1": "نادرست؛ رویش >۱۰ میلی‌متر به تنهایی بدون آمبولی یا نارسایی شدید یا رویش متحرک >۳۰ میلی‌متر، جزو اندیکاسیون‌های جراحی هم‌روز نیست.", "3": "نادرست؛ PVE زودرس (≤۲ ماه پس از جراحی دریچه) در ردهٔ Elective (البته ترجیحاً زودتر) در جدول ۱۳۳-۷ طبقه‌بندی شده است، نه اورژانس همان روز."}, "pearl": "در نارسایی حاد شدید آئورت، فشار دیاستولیک بطن چپ به حدی سریع بالا می‌رود که دریچهٔ میترال پیش از شروع سیستول بسته می‌شود (Premature closure of mitral valve) که یک علامت اکوکاردیوگرافیک هشدار مرگ ناگهانی و اندیکاسیون جراحی همان روز است.", "trap": "باید بین Emergent (همان‌روز: ادم ریه/شوک/preclosure میترال/پارگی)، Urgent (۱–۲ روز: >30 mm، آمبولی + >10 mm، پروتز ناپایدار، HF کلاس III-IV، بلوک هدایتی) و Elective (قارچ، PVE <=2 ماه، مقاومت دارویی) تمایز داد.", "highYield": "جراحی Emergent (همان‌روز): ادم ریه/شوک کاردیوژنیک ناشی از اختلال دریچه، AI حاد + preclosure میترال، پارگی سینوس والسالوا به قلب راست، پارگی به پریکارد.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 133 / موضوع 6", "topicIndex": 6, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1046", "referenceSection": "Table 133-7 Timing of Cardiac Surgical Intervention", "id": "inf-078"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 134, "chapterTitle": "عفونت‌های پوست، عضله و بافت نرم", "topic": "عفونت‌های پوست، عضله و بافت نرم", "subtopic": "SSSS vs Toxic Epidermal Necrolysis Histopathology", "difficulty": "دشوار", "bloom": "", "stem": "در افتراق پاتولوژیک سریع سندرم پوست سوخته‌شدهٔ استافیلوکوکی (SSSS) از نکرولیز سمی اپیدرم (TEN) با استفاده از پانچ بیوپسی و برش منجمد، صفحهٔ شکافت (Cleavage plane) در این دو وضعیت به‌ترتیب کدام لایهٔ پوست است؟", "options": ["در SSSS لایهٔ عمقی stratum germinativum و در TEN لایهٔ سطحی stratum corneum", "در هر دو وضعیت شکافت عمدتاً در درم رتیکولار عمقی زیر غشای پایه رخ می‌دهد", "در SSSS لایهٔ سطحی stratum corneum و در TEN لایهٔ عمقی stratum germinativum", "در SSSS شکافت در درم پاپیلاری و در TEN درون بافت چربی زیرجلدی است"], "correct": 2, "explanation": "مطابق فصل ۱۳۴ هریسون ۲۰۲۵ (صفحهٔ ۱۰۹۴)، اگزوتوکسین اکسفولیاتین استافیلوکوکوس اورئوس گروه فاژ II در نوزادان سبب SSSS می‌شود که باید از TEN دارویی (با مرگ‌ومیر بالاتر در بزرگسالان) افتراق داده شود. در بیوپسی پانچ با برش منجمد (Frozen section)، صفحهٔ شکافت در SSSS در سطح stratum corneum (فوق‌العاده سطحی در اپیدرم) و در TEN در لایهٔ عمقی stratum germinativum (مرز درم-اپیدرم) است.", "whyWrong": {"0": "نادرست؛ سطوح تشریحی برعکس ذکر شده‌اند.", "1": "نادرست؛ SSSS یک تاول درون‌اپیدرمی بسیار سطحی بدون درگیری درم و بدون درگیری مخاط است.", "3": "نادرست؛ هیچ‌کدام در بافت زیرجلدی شکافت ایجاد نمی‌کنند."}, "pearl": "چون شکافت SSSS سطحی (stratum corneum) و ناشی از توکسین در گردش خون است، خود مایع تاول استریل است و مخاط‌ها برخلاف TEN درگیر نمی‌شوند.", "trap": "درخواست کشت از مایع تاول SSSS اغلب منفی است زیرا توکسین از کانون دوردست ترشح می‌شود نه تکثیر موضعی باکتری داخل تاول.", "highYield": "صفحهٔ شکافت: SSSS = stratum corneum (سطحی، استریل، بدون درگیری مخاط)؛ TEN = stratum germinativum (عمقی، با درگیری مخاط و مرگ‌ومیر بالاتر).", "questionType": "basic", "questionTypeLabel": "علوم پایهٔ کاربردی (Basic Science Integration)", "coverageIndex": "فصل 134 / موضوع 2", "topicIndex": 2, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1051", "referenceSection": "Infections Associated with Bullae", "id": "inf-079"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 135, "chapterTitle": "آرتریت عفونی", "topic": "آرتریت عفونی", "subtopic": "Candida Site Tropism, Exserohilum Outbreak & Prosthetic Removal", "difficulty": "متوسط", "bloom": "", "stem": "بیمار ۳۵ ساله‌ای با سابقهٔ مصرف تزریقی مواد مخدر (IVDU) با درد پیش‌روندهٔ کمر، تب خفیف و درگیری مفصل ساکروایلیاک و دیسک کمری مراجعه می‌کند که در بیوپسی رشد Candida albicans دارد. کدام گزاره دربارهٔ آرتریت قارچی و مدیریت پروتز در عفونت قارچی مفصل بر اساس فصل ۱۳۵ هریسون ۲۰۲۵ درست است؟", "options": ["آرتریت ناشی از Exserohilum rostratum صرفاً متعاقب شنا در آب استخرهای کلرزده دیده می‌شود", "مایع سینوویال در آرتریت قارچی بالای ۱۰۰,۰۰۰ سلول با ۱۰۰٪ لنفوسیت دارد و کشت بی‌ارزش است", "آرتریت کاندیدایی IVDU فقط مفاصل بین‌انگشتی دیستال را درگیر و بدون خروج پروتز خوب می‌شود", "در IVDU کاندیدا ستون فقرات/ساکروایلیاک را درگیر می‌کند و در پروتز مفصل خروج کامل لازم است"], "correct": 3, "explanation": "در فصل ۱۳۵ هریسون ۲۰۲۵ (صفحهٔ ۱۱۰۲)، آرتریت کاندیدایی تک‌مفصلی (زانو/هیپ/شانه) در بیماران بدحال یا متعاقب جراحی/تزریق رخ می‌دهد، اما در مصرف‌کنندگان تزریقی مواد مخدر به‌طور تیپیک ستون فقرات، مفاصل ساکروایلیاک یا سایر مفاصل فیبروغضروفی (مانند سمفیز پوبیس و استرنوکلاویکولار) درگیر می‌شوند. شمارش سلول مایع سینوویال در آرتریت قارچی معمولاً ۱۰,۰۰۰ تا ۴۰,۰۰۰ سلول/میکرولیتر با ~۷۰٪ نوتروفیل است، بیوپسی بافت سینوویال اغلب در موارد کشت مایع منفی تشخیصی است، و در عفونت قارچی پروتز مفصل خروج تمام اجزای پروتز اکیداً توصیه می‌شود.", "whyWrong": {"0": "نادرست؛ طغیان ۲۰۱۲ Exserohilum rostratum به تزریق داخل مفصلی و داخل نخاعی متیل‌پردنیزولون استات آلوده مربوط بود.", "1": "نادرست؛ شمارش سلول مایع سینوویال قارچی بین ۱۰,۰۰۰ تا ۴۰,۰۰۰ است و حدود ۷۰٪ نوتروفیل دارد؛ ضمن آنکه کشت و رنگ‌آمیزی بافت سینوویال کلید تشخیص در موارد منفی شدن مایع است.", "2": "نادرست؛ پروتز مفصل مبتلا به قارچ را نمی‌توان با داروی خوراکی به تنهایی نگه داشت و نیازمند خروج کامل است."}, "pearl": "در فرد با سابقهٔ مصرف تزریقی مواد و کمردرد/ساکروایلئیت تحت‌حاد بدون پاسخ به آنتی‌بیوتیک، استئومیلیت مهره‌ای یا آرتریت فیبروغضروفی کاندیدایی را به خاطر بسپارید و در موارد منفی مایع، سراغ بیوپسی بافت سینوویال بروید.", "trap": "در آرتریت قارچی اگر فقط به مایع سینوویال اکتفا شود، کشت ممکن است منفی بماند و نیازمند بیوپسی بافت سینوویال است.", "highYield": "کاندیدا در IVDU = ستون فقرات / ساکروایلیاک / مفاصل فیبروغضروفی؛ مایع سینوویال قارچی = ۱۰,۰۰۰–۴۰,۰۰۰ WBC (~۷۰٪ PMN)؛ پروتز قارچی = خروج کامل پروتز.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 135 / موضوع 2", "topicIndex": 2, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1059", "referenceSection": "Fungal Arthritis", "id": "inf-080"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 138, "chapterTitle": "اسهال عفونی حاد و مسمومیت غذایی باکتریایی", "topic": "اسهال عفونی حاد و مسمومیت غذایی باکتریایی", "subtopic": "Mucosal Invasion Patterns: Shigella vs Salmonella vs Typhi", "difficulty": "متوسط", "bloom": "", "stem": "در مقایسهٔ مکانیسم تهاجم باکتری‌های روده‌ای مطابق فصل ۱۳۸ ence Integration)", "coverageIndex": "فصل 138 / موضوع 2", "topicIndex": 2, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1077", "referenceSection": "Pathogenic Mechanisms: Invasion", "id": "inf-081"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 139, "chapterTitle": "عفونت کلستریدیوئیدس دیفیسیل و کولیت سودوممبرانو", "topic": "عفونت کلستریدیوئیدس دیفیسیل و کولیت سودوممبرانو", "subtopic": "GDH vs Toxin EIA vs NAAT Trade-Offs", "difficulty": "دشوار", "bloom": "", "stem": "در یک بیمارستان آزمایش دو مرحله‌ای برای تشخیص CDI انجام می‌شود: در بیمار ۵۸ ساله‌ای با مصرف اخیر آنتی‌بیوتیک، آزمایش آنتی‌ژن مشترک (GDH) مثبت شده است، اما تست الایزای توکسین A و B منفی و تست NAAT ژن توکسین مثبت گزارش شده است. مطابق جدول ۱۳۹-۱ هریسون ۲۰۲۵، تفسیر صحیح ویژگی‌های این سه آزمون کدام است؟", "options": ["GDH بسیار حساس اما نیازمند تست توکسین؛ NAAT ممکن است کلونیزاسیون را مثبت کند", "آندوسکوپی حساس‌ترین آزمون برای غربالگری اولیهٔ تمام بیماران مشکوک به CDI است", "مثبت شدن GDH به تنهایی برای تشخیص قطعی تولید توکسین و شروع درمان کافی است", "الایزای توکسین A و B حساسیت بالاتری نسبت به کشت توکسین‌زا و آزمون NAAT دارد"], "correct": 0, "explanation": "مطابق جدول ۱۳۹-۱ هریسون ۲۰۲۵ (صفحهٔ ۱۱۲۷): (۱) الایزای آنتی‌ژن مشترک (GDH) حساسیت بالایی (`+++ تا ++++`) دارد اما هم سویه‌های توکسین‌زا و هم غیرتوکسین‌زا را شناسایی می‌کند و نیازمند تأیید با تست توکسین است؛ (۲) الایزای توکسین A و B سریع و اختصاصی (`+++`) است اما حساسیت کمتری (`++ تا +++` یعنی ۵۱–۹۰٪) نسبت به کشت توکسیژنیک یا NAAT دارد؛ (۳) NAAT ژن توکسین A یا B را با حساسیت `++++` (>۹۰٪) می‌سنجد و با به‌کارگیری آن میزان تشخیص‌های مثبت (شامل برخی موارد کلونیزاسیون بدون بیماری فعال) به‌طور چشمگیری افزایش یافته است؛ (۴) کولونوسکوپی/سیگموئیدوسکوپی در صورت دیدن سودوممبران ویژگی `++++` دارد اما حساسیت آن بسیار پایین (`+` یعنی ~۵۰٪) است.", "whyWrong": {"1": "نادرست؛ آندوسکوپی حساسیت پایینی (`+` حدود ۵۰٪) دارد زیرا موار ن و فوسفومایسین همگی توسط FDA در سیستیت بی‌عارضه ممنوع شده‌اند"], "correct": 1, "explanation": "در فصل ۱۴۰ هریسون ۲۰۲۵ (صفحات ۱۱۳۶–۱۱۳۷) تأکید شده است که گزینه‌های ترجیحی سیستیت بی‌عارضه شامل TMP-SMX، نیتروفورانتوئین، فوسفومایسین و پیومسیلینام هستند و FDA علیه به‌کارگیری فلوروکینولون‌ها در سیستیت حاد در صورت وجود گزینه‌های درمانی مؤثر دیگر هشدار داده است. همچنین فنازوپیریدین می‌تواند تهوع قابل توجه ایجاد کند و کارآزمایی‌های بالینی متعدد نشان داده‌اند که درمان علامتی به‌تنهایی جایگزین مناسبی برای آنتی‌بیوتیک در UTI واقعی نیست.", "whyWrong": {"0": "نادرست؛ کینولون‌ها به‌علت سمیت تاندون/عصب/آئورت و آسیب اکولوژیک در خط آخر سیستیت ساده قرار دارند.", "2": "نادرست؛ فنازوپیریدین اغلب تهوع می‌دهد و ریشه‌کنی باکتری انجام نمی‌دهد.", "3": "نادرست؛ برعکس، همان چهار دارو (نیتروفورانتوئین، TMP-SMX، فوسفومایسین، پیومسیلینام) داروهای خط اول ارجح‌اند."}, "pearl": "در سیستیت حاد ساده با وجود حساسیت به نیتروفورانتوئین یا فوسفومایسین، نوشتن سیپروفلوکساسین هم اشتباه استوارشیپی است و هم خلاف هشدار ایمنی FDA محسوب می‌شود.", "trap": "انتخاب سیپروفلوکساسین ۳ روزه در سناریوی سادهٔ سیستیت زمانی که گزینه‌های خط اول مثل نیتروفورانتوئین ۵ روزه یا فوسفومایسین ۱ روزه در دسترس‌اند.", "highYield": "خط اول سیستیت بی‌عارضه: نیتروفورانتوئین، TMP-SMX، فوسفومایسین، پیومسیلینام؛ هشدار FDA علیه کینولون در سیستیت؛ فنازوپیریدین جایگزین آنتی‌بیوتیک نیست.", "questionType": "recall", "questionTypeLabel": "نکتهٔ پربازده مستقیم (Direct High-Yield Recall)", "coverageIndex": "فصل 140 / موضوع 4", "topicIndex": 4, "difficultyFa": "آسان", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1093–1094", "referenceSection": "Treatment of Acute Uncomplicated Cystitis", "id": "inf-083"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 141, "chapterTitle": "عفونت‌های مقاربتی: مرور و رویکرد بالینی", "topic": "عفونت‌های مقاربتی", "subtopic": "Table 141-7 Clinical Differentiation & Empirical Management", "difficulty": "
