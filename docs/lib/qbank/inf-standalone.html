, "explanation": "مطابق فصل ۱۴۶ هریسون ۲۰۲۵ (صفحات ۱۱۸۶–۱۱۸۷): بالاترین بروز گزش سگ در پسران ۵ تا ۹ ساله دیده می‌شود و قربانیان اغلب مذکر هستند؛ در بزرگسالان اندام فوقانی شایع‌تر است اما در کودکان زیر ۴ سال دوسوم کل آسیب‌ها ناحیهٔ سر یا گردن را درگیر می‌کند. میکروبیولوژی زخم گزش سگ معمولاً مخلوط بوده و علاوه بر پاستورلا، استرپتوکوک بتاهمولیتیک، استاف (شامل MRSA و S. intermedius) و C. canimorsus، شامل Neisseria weaveri (سابقاً گروه CDC M-5) و بی‌هوازی‌هاست. همچنین گزش‌های انسانی بسیار مستعد عفونت‌اند (~۱۰–۱۵٪ کل موارد و >۲۵٪ زخم‌های عمیق مثل clenched-fist) و بی‌هوازی‌ها (فوزوباکتریوم، پرووتلا، پورفیروموناس، پپتواسترپتوکوک) در ۵۰٪ زخم‌های عفونی گزش انسان جدا می‌شوند که بسیاری از آن‌ها تولیدکنندهٔ بتالاکتاماز هستند.", "whyWrong": {"0": "نادرست؛ قربانیان بیشتر مذکر و کودکان/پسران ۵–۹ ساله هستند و گزش انسان نرخ عفونت بالاتری دارد.", "1": "نادرست؛ گزش انسان میزان عفونت بالاتر (~۱۰–۱۵٪) نسبت به سایر حیوانات دارد و بی‌هوازی‌ها در ۵۰٪ موارد جدا می‌شوند.", "3": "نادرست؛ نفوذ دندان حیوان به کپسول مفصل یا استخوان می‌تواند آرتریت سپتیک و استئومیلیت بدهد."}, "pearl": "در کودک خردسال با گزش سگ در ناحیهٔ سر و گردن، علاوه بر بررسی آسیب عروقی/عصبی و ریشه‌کنی جراحی، به خاطر بسپارید ۵۰٪ بی‌هوازی‌های گزش انسانی بتالاکتاماز تولید می‌کنند، لذا پنی‌سیلین تنها ناکافی است و مهارکننده بتالاکتاماز (آموکسی‌کلاو/آمپی‌سولباکتام) لازم است.", "trap": "بی‌توجهی به بررسی نفوذ به مفصل و تاندون در گزش دست و یا تجویز آموکسی‌سیلین ساده بدون کلاوولانات.", "highYield": "کودکان <4 سال = ۲/۳ گزش سگ در سر و گردن؛ نرخ عفونت گزش انسان (~۱۰–۱۵٪، عمیق >۲۵٪)؛ بی‌هوازی‌های تولیدکننده بتالاکتاماز در ۵۰٪ عفونت‌های گزش انسان.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 146 / موضوع 1", "topicIndex": 1, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1143–1144", "referenceSection": "Dog Bites & Human Bites", "id": "inf-086"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 151, "chapterTitle": "عفونت‌های پنوموکوکی", "topic": "عفونت‌های پنوموکوکی", "subtopic": "Elderly Atypical Presentation & Diaphragmatic Pleurisy", "difficulty": "آسان", "bloom": "", "stem": "مرد ۸۱ ساله‌ای از خانهٔ سالمندان به دنبال افت ناگهانی سطح آگاهی، گیجی جدید و بی‌حالی شدید بدون تب و بدون سرفه به اورژانس آورده شده است؛ در معاینه تعداد تنفس ۲۶ در دقیقه است و در گرافی قفسهٔ سینه کانسولیداسیون لوب تحتانی راست دیده می‌شود. بر اساس فصل ۱۵۱ هریسون ۲۰۲۵، کدام نکته دربارهٔ معاینه و تظاهر بالینی پنومونی پنوموکوکی صحیح است؟", "options": ["تب بالای ۳۹ درجه در ۱۰۰٪ بیماران سالمند مبتلا به پنومونی پنوموکوکی از همان ساعت اول حاضر است", "درد بالای شکم هیچ ارتباطی با پنومونی لوب تحتانی ندارد و همیشه نیازمند لاپاراتومی اورژانسی است", "سالمندان گاهی فقط گیجی بدون تب دارند؛ تاکی‌پنه >۲۰ شایع‌ترین علامت و درگیری دیافراگم درد شکم", "تنفس برونکیال در >۹۰٪ بیماران در معاینه سمع می‌شود و نبود آن پنومونی را به‌طور کامل رد می‌کند"], "correct": 2, "explanation": "در صفحهٔ ۱۲۳۵ فصل ۱۵۱ هریسون ۲۰۲۵ تصریح شده است: در سالمندان، علائم بالینی پنومونی پنوموکوکی می‌تواند غیر اختصاصی بوده و تنها به شکل گیجی (Confusion) یا بی‌حالی (Malaise) بدون تب یا سرفه بروز کند (در معاینه، تاکی‌پنه `> 20 breaths/min` است و تنفس برونکیال تنها در اقلیت موارد شنیده می‌شود). همچنین در صورت درگیری پلور دیافراگماتیک، درد قسمت فوقانی شکم (Upper abdominal pain) ممکن است تظاهر اصلی باشد و با شکم حاد اشتباه شود.", "whyWrong": {"0": "نادرست؛ سالمندان اغلب تب ندارند و گیجی می‌تواند تنها سرنخ باشد.", "1": "نادرست؛ پنومونی لوب تحتانی با تحریک پلور دیافراگماتیک یک مقلد کلاسیک کوله سیستیت و شکم حاد است.", "3": "نادرست؛ متن هریسون تصریح می‌کند که صدای تنفس برونکیال فقط در اقلیتی از موارد سمع می‌شود."}, "pearl": "همیشه در سالمند دچار دلیریوم حاد حتی بدون تب و سرفه و در بیمار با درد بالای شکم بدون یافته‌های شکمی قطعی، یک گرافی قفسه سینه بگیرید تا پنومونی لوبار را از دست ندهید.", "trap": "محروم کردن بیمار سالمند دچار دلیریوم از CXR به علت نبود تب یا فرستادن بیمار با درد RUQ و تب حاد به جراحی قبل از دیدن قاعدهٔ ریه در CXR.", "highYield": "پنومونی پنوموکوکی سالمند: ممکن است بدون تب و سرفه با گیجی جدید بروز کند؛ تاکی‌پنه = >20/min؛ درگیری پلور دیافراگماتیک = درد بالای شکم؛ تنفس برونکیال تنها در اقلیت موارد.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 151 / موضوع 3", "topicIndex": 3, "difficultyFa": "آسان", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1192", "referenceSection": "Pneumococcal Pneumonia: Clinical Findings", "id": "inf-087"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 152, "chapterTitle": "عفونت‌های استافیلوکوکی", "topic": "عفونت‌های استافیلوکوکی", "subtopic": "S. epidermidis Biofilm (ica genes, AtlE, AAP) & S. saprophyticus", "difficulty": "متوسط", "bloom": "", "stem": "بیمار ۶۹ ساله‌ای ۴ ماه پس از تعویض مفصل زانو دچار عفونت تحت‌حاد پروتز با رشد Staphylococcus epidermidis شده است. بر اساس فصل ۱۵۲ هریسون ۲۰۲۵، پاتوژنز تشکیل بیوفیلم در S. epidermidis روی وسایل مصنوعی چگونه پیش می‌رود؟", "options": ["اتصال اولیه با AtlE/AAP به فیبرینوژن-فیبرونکتین و سپس تولید PIA (ژن ica) برای بیوفیلم", "اتصال مستقیم به فلز تیتانیوم با توکسین PVL و پروتئین A بدون واسطهٔ پروتئین میزبان", "سویه‌های دارای ژن‌های ica منحصراً در فلور طبیعی مخاط یافت شده و در پروتز دیده نمی‌شوند", "S. saprophyticus به نووبیوسین حساس است و شایع‌ترین علت عفونت کاتترهای عروقی است"], "correct": 0, "explanation": "در صفحهٔ ۱۲۴۵ فصل ۱۵۲ هریسون ۲۰۲۵، پاتوژنز عفونت پروتز ناشی از S. epidermidis به‌عنوان یک فرایند دومرحله‌ای تشریح شده است: (۱) پروتز کاشته‌شده به‌سرعت با مولکول‌های ماتریکس میزبان (مانند فیبرینوژن و فیبرونکتین) پوشیده می‌شود و پروتئین‌های سطحی باکتری از جمله اتولیزین (AtlE)، پروتئین متصل به فیبرینوژن و پروتئین مرتبط با تجمع (AAP) در اتصال اولیه نقش دارند؛ (۲) سپس پلی‌ساکارید بین‌سلولی ادهسین (PIA / گلیکوکالیکس یا اسلایم) که توسط ژن‌های intercellular adhesin (ica) کنترل می‌شود باعث کلونیزاسیون، تجمع و تشکیل بیوفیلم محافظ می‌گردد. ژن‌های ica در سویه‌های عفونی پروتز به‌مراتب شایع‌تر از سویه‌های کلونیزه‌کنندهٔ مخاط‌اند. ضمناً S. saprophyticus مقاوم به نووبیوسین است.", "whyWrong": {"1": "نادرست؛ PVL و پروتئین A عوامل ویرولانس S. aureus هستند نه مکانیسم بیوفیلم S. epidermidis.", "2": "نادرست؛ دقیقاً برعکس، ژن‌های ica در ایزوله‌های جداشده از عفونت دستگاه‌های مصنوعی بسیار شایع‌تر از سویه‌های کلونیزاسیون مخاطی هستند.", "3": "نادرست؛ S. saprophyticus مقاوم به نووبیوسین است و عامل UTI در زنان جوان است (S. epidermidis حساس به نووبیوسین است)."}, "pearl": "تفکیک آزمایشگاهی سریع کوآگولاز-منفی‌ها: S. epidermidis (حساس به نووبیوسین -> عفونت پروتز با بیوفیلم و ژن ica) در برابر S. saprophyticus (مقاوم به نووبیوسین -> سیستیت در زنان جوان).", "trap": "اشتباه گرفتن مقاومت به نووبیوسین (ویژگی S. saprophyticus) با S. epidermidis.", "highYield": "تشکیل بیوفیلم S. epidermidis: مرحلهٔ ۱ اتصال به فیبرینوژن/فیبرونکتین (AtlE، AAP)؛ مرحلهٔ ۲ اسلایم/گلیکوکالیکس (PIA و ژن‌های ica).", "questionType": "basic", "questionTypeLabel": "علوم پایهٔ کاربردی (Basic Science Integration)", "coverageIndex": "فصل 152 / موضوع 5", "topicIndex": 5, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1202", "referenceSection": "NSaS Pathogenesis & Biofilm", "id": "inf-088"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 153, "chapterTitle": "عفونت‌های استرپتوکوکی: از فارنژیت و مخملک تا فاسیایتیس نکروزان", "topic": "عفونت‌های استرپتوکوکی", "subtopic": "Impetigo Honey Crusts & Post-CABG Saphenous Cellulitis", "difficulty": "آسان", "bloom": "", "stem": "مرد ۶۳ ساله‌ای که ۳ سال پیش تحت جراحی بای‌پس کرونری (CABG) با برداشت ورید صافن از ساق پای چپ قرار گرفته، طی یک سال گذشته سه بار دچار سلولیت حاد گرم و منتشر در همین ساق پا شده است؛ در معاینهٔ بین انگشتان پای چپ پوسته‌ریزی، شقاق و رطوبت (Tinea pedis) دیده می‌شود. بر اساس فصل ۱۵۳ هریسون ۲۰۲۵، مهم‌ترین اقدام پیشگیرانه برای قطع چرخهٔ عود سلولیت در این بیمار چیست؟", "options": ["تعویض گرافت‌های وریدی کرونری با جراحی باز قلب به‌عنوان منشأ احتمالی باکتری", "درمان عفونت قارچی بین انگشتان پا (Tinea pedis) جهت بستن دروازهٔ ورودی استرپتوکوک", "شروع وانکومایسین وریدی مادام‌العمر چون عامل سلولیت همیشه استافیلوکوک مقاوم است", "پرهیز از ضدقارچ و تجویز پماد کورتیکواستروئید قوی بین انگشتان پای بیمار"], "correct": 1, "explanation": "مطابق صفحهٔ ۱۲۵۴ فصل ۱۵۳ هریسون ۲۰۲۵، سلولیت استرپتوکوکی تمایل شدید به بروز در نواحی دارای اختلال تخلیهٔ لنفاوی دارد (مانند بازوی سمت ماستکتومی و دایسکشن آگزیلاری، اندام پس از DVT، لنف‌ادم مزمن یا ساق پای محل برداشت ورید صافن برای CABG). باکتری اغلب از شکاف‌های ریز پوستی دوردست مثل تینه‌آ پدیس (Tinea pedis) بین انگشتان پا وارد شده و در ناحیهٔ آسیب‌دیدهٔ پروگزیمال‌تر ایجاد سلولیت راجعه می‌کند؛ در بسیاری از این بیماران حملات راجعه تنها پس از درمان موفق تینه‌آ پدیس متوقف می‌شود. همچنین زردزخم (Impetigo) تب ندارد و تب در آن نشانهٔ گسترش به بافت عمقی است (صفحهٔ ۱۲۵۳).", "whyWrong": {"0": "نادرست؛ گرافت کرونری منشأ عفونت ساق پا نیست.", "2": "نادرست؛ عامل کلاسیک سلولیت منتشر در زمینهٔ لنف‌ادم یا سافنکتومی استرپتوکوک بتا-همولیتیک است (S. aureus بیشتر دور زخم/آبسه می‌سازد).", "3": "نادرست؛ کورتون موضعی عفونت قارچی بین انگشتی را بدتر کرده و شکاف‌های پوستی را گسترش می‌دهد."}, "pearl": "همیشه در بیمار با سلولیت اندام تحتانی (به‌ویژه سابقهٔ CABG یا لنف‌ادم)، بین انگشتان پا را معاینه کنید! درمان تینه‌آ پدیس بسیار مؤثرتر از تکرار بی‌پایان آنتی‌بیوتیک برای پیشگیری از عود سلولیت است.", "trap": "تجویز صرف آنتی‌بیوتیک برای هر حمله بدون معاینه لای انگشتان پا و درمان کچلی قارچی پا.", "highYield": "سلولیت راجعه در ساق محل برداشت ورید صافن CABG یا بازوی ماستکتومی = دروازه ورود اغلب Tinea pedis بین انگشتی است؛ درمان قارچ بین انگشتی عود را متوقف می‌کند.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 153 / موضوع 4", "topicIndex": 4, "difficultyFa": "آسان", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1210–1211", "referenceSection": "Impetigo & Streptococcal Cellulitis", "id": "inf-089"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 155, "chapterTitle": "دیفتری و سایر عفونت‌های کورینه‌باکتری: توکسین، شبه‌غشا و پادزهر", "topic": "دیفتری و سایر عفونت‌های کورینه‌باکتری", "subtopic": "Corynebacteriophage tox Gene, Iron Limitation & Timing of Death", "difficulty": "متوسط", "bloom": "", "stem": "پسر ۹ سالهٔ واکسینه‌نشده‌ای با گلودرد، تب خفیف و شبه‌غشای چسبنده روی لوزه‌ها و زبان کوچک بستری شده است. مطابق فصل ۱۵۵ هریسون ۲۰۲۵، کدام عامل ژنتیکی و محیطی بیان توکسین دیفتری را کنترل می‌کند و علل اصلی مرگ‌و‌میر در هفته‌های اول در برابر هفته‌های بعدی بیماری کدام‌اند؟", "options": ["ژن tox روی کروموزوم میزبان کد می‌شود و وفور بالای آهن محیطی بیان توکسین را تحریک می‌کند", "ژن tox روی فاژ بتا (القاشونده با کمبود آهن)؛ ۶۰–۶۵٪ مرگ‌ها از انسداد راه هوایی و ۲۰–۲۵٪ قلبی است", "کاردیومیوپاتی سمی تنها پس از ماه ششم رخ می‌دهد و انسداد راه هوایی <۲٪ مرگ‌ها را می‌سازد", "گلوکوکورتیکوئیدها بروز میوکاردیت و پلی‌نوروپاتی دیفتری را صفر کرده و دیفتری پوستی ۵۰٪ مرگ دارد"], "correct": 1, "explanation": "در صفحات ۱۲۶۵ تا ۱۲۶۸ فصل ۱۵۵ هریسون ۲۰۲۵ آمده است: (۱) توکسین دیفتری توسط ژن tox روی کورینه‌باکتریوفاژ بتا حمل می‌شود (تبدیل لیزوژنیک در محل از سویه `tox-` به `tox+` ممکن است) و رشد سویه‌های توکسیژنیک در شرایط محدودیت آهن (Iron-limiting conditions) بیان بهینهٔ توکسین را موجب می‌شود؛ (۲) انسداد راه هوایی مسئول ۶۰–۶۵٪ مرگ‌ها (عمدتاً در هفته‌های ۱–۲) و کاردیومیوپاتی سمی (همراه با آریتمی و بلوک کامل) مسئول ۲۰–۲۵٪ مرگ‌ها (از هفتهٔ ۱ به بعد) است و پلی‌نوروپاتی در هفته‌های ۳–۵ بروز می‌کند؛ (۳) کورتیکواستروئیدها خطر میوکاردیت یا پلی‌نوروپاتی را کاهش نداده‌اند و دیفتری پوستی مرگ‌ومیر پایین و عارضهٔ سیستمیک نادر دارد.", "whyWrong": {"0": "نادرست؛ ژن tox باکتریوفاژی است و کمبود آهن (نه وفور آهن) تولید توکسین را بیشینه می‌کند.", "2": "نادرست؛ انسداد راه هوایی مهم‌ترین قاتل زودرس (۶۰–۶۵٪ مرگ‌ها) و کاردیومیوپاتی از هفتهٔ ۱ به بعد رخ می‌دهد.", "3": "نادرست؛ صفحهٔ ۱۲۶۸ صراحتاً عدم اثبات سود استروئید در میوکاردیت/نوروپاتی و کم‌خطر بودن دیفتری پوستی را ذکر می‌کند."}, "pearl": "زمان‌بندی سه عارضهٔ مرگبار دیفتری: هفته‌های ۱–۲ = انسداد راه هوایی (۶۰–۶۵٪ مرگ‌ها)؛ هفتهٔ ۱ به بعد = میوکاردیت/بلوک کامل قلبی (۲۰–۲۵٪ مرگ‌ها)؛ هفته‌های ۳–۵ = پلی‌نوروپاتی فلج‌کننده (پالاتال تا اندام‌ها).", "trap": "تجویز دگزامتازون به امید جلوگیری از میوکاردیت دیفتری یا تاخیر در آنتی‌توکسین (که فقط توکسین آزاد را خنثی می‌کند نه توکسین متصل به سلول را).", "highYield": "ژن tox روی باکتریوفاژ بتا، بیان بیشینه در کمبود آهن؛ انسداد راه هوایی (۶۰–۶۵٪ مرگ) و کاردیومیوپاتی سمی (۲۰–۲۵٪)؛ گلوکوکورتیکوئیدها از میوکاردیت/نوروپاتی پیشگیری نمی‌کنند.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 155 / موضوع 1", "topicIndex": 1, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1222–1225", "referenceSection": "Diphtheria Pathogenesis & Complications", "id": "inf-090"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 158, "chapterTitle": "بوتولیسم: فلج نزولی و آنتی‌توکسین", "topic": "بوتولیسم", "subtopic": "Pruno, Non-Canned Vehicles & Commercial Temperature Failure", "difficulty": "متوسط", "bloom": "", "stem": "سه زندانی در یک ندامتگاه پس از نوشیدن یک نوشیدنی تخمیری غیرقانونی خانگی ساخته‌شده از میوه و سیب‌زمینی در کیسه‌های در‌بسته («پرونو» / Pruno) دچار دوبینی، دیزآرتری، خشکی دهان و ضعف پیش‌روندهٔ عضلات تنفسی شده‌اند. کدام نکته دربارهٔ منابع غیرکنسروی بوتولیسم غذازاد مطابق فصل ۱۵۸ هریسون ۲۰۲۵ درست است؟", "options": ["جوشاندن غذای آلوده به هیچ عنوان توکسین بوتولینوم حساس به حرارت را غیرفعال نمی‌کند", "آبی بودن و شفافیت نوشیدنی تخمیری وجود اسپور C. botulinum را با اطمینان رد می‌کند", "نوشیدنی Pruno، سیر/گیاهان در روغن بدون یخچال، آب‌هویج تجاری نامناسب و غذاهای تخمیری آلاسکا", "بوتولیسم غذازاد منحصراً از کنسروهای فلزی صنعتی منقضی‌شده ایجاد می‌شود و در روغن رخ نمی‌دهد"], "correct": 2, "explanation": "در صفحهٔ ۱۲۷۸ فصل ۱۵۸ هریسون ۲۰۲۵ موارد متعددی از طغیان‌های غیراستاندارد بوتولیسم مستند شده‌اند: از جمله نوشیدنی تخمیری زندانیان (Pruno) با طغیان‌های متعدد در کالیفرنیا و یوتا، مواد غذایی بر پایهٔ روغن (سیر دم‌شده در روغن خانگی، پاستا و پستوی خانگی)، آب‌هویج تجاری بدون شکر/نمک و نگه‌دارنده در صورت نگهداری خارج از دمای یخچال، سس چیلی تجاری با نقص استریلیزاسیون حرارتی-فشاری (Retort canning) و غذاهای سنتی تخمیرشدهٔ دریایی آلاسکا (مثل Stinkheads و روغن فک).", "whyWrong": {"0": "نادرست؛ اسپورها مقاوم به حرارت‌اند اما خود نوروتوکسین بوتولینوم پروتئینی حساس به حرارت است و با جوشاندن چنددقیقه‌ای تخریب می‌شود.", "1": "نادرست؛ غذاهای آلوده به C. botulinum سروتیپ غیرپروتئولیتیک می‌توانند ظاهراً بو و طعم طبیعی داشته باشند.", "3": "نادرست؛ بخش عمده‌ای از طغیان‌های غیرمعمول اخیر دقیقاً از منابع غیرکنسروی بی‌هوازی مانند سیر در روغن و Pruno بوده‌اند."}, "pearl": "در شرح حال بیمار با فلج عصب کرانیال و ضعف نزولی، تنها به کنسرو بسنده نکنید: دربارهٔ سیر/سبزیجات در روغن خانگی، سس‌های خانگی، غذاهای تخمیری یا نوشیدنی‌های تخمیری دست‌ساز نیز بپرسید!", "trap": "رد کردن بوتولیسم در بیمار دارای تابلوی تیپیک بولبار صرفاً به علت «مصرف نکردن کنسرو».", "highYield": "وسایل غیرکنسروی طغیان بوتولیسم (صفحهٔ ۱۲۷۸): سیر در روغن خانگی، نوشیدنی زندان Pruno، آب‌هویج تجاری فاقد یخچال، غذاهای تخمیری ماهی/گوشت آلاسکا.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 158 / موضوع 1", "topicIndex": 1, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1235", "referenceSection": "Foodborne Botulism Sources", "id": "inf-091"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 160, "chapterTitle": "عفونت‌های مننگوکوکی", "topic": "عفونت‌های مننگوکوکی", "subtopic": "Day 4–10 Immune-Complex Arthritis, Vasculitic Rash & Stewardship", "difficulty": "دش  بود", "در ۱۹۱۸ اوج مرگ در جوانان ۲۵–۳۴ سال (طوفان سیتوکینی HA/RNP) بود؛ متولدین پیش از ۱۹۵۷/۱۹۶۸ حفاظت نسبی دارند", "در تمام اپیدمی‌های قرن بیستم و بیست‌ویکم، مجموع موارد بیماریِ پاندمی‌ها همواره بیشتر از اپیدمی‌های سالانه بوده است"], "correct": 2, "explanation": "طبق شکل ۲۰۶-۲ و متن صفحهٔ ۱۵۴۵: در پاندمی ۱۹۱۸ (H1N1) اوج حیرت‌انگیز مرگ‌ومیر پنومونی/آنفلوانزا در شیرخواران (<۱ سال) و بالغین جوان سالم ۲۵–۳۴ سال دیده شد (بیشتر از کل تلفات نظامی جنگ جهانی اول). بازسازی ویروس ۱۹۱۸ از نمونه‌های مدفون در یخبندان قطبی نشان داد HA و RNP هر دو باعث تکثیر شدید و طوفان سیتوکینی (واکنش التهابی ذاتی مفرط) در افراد جوان قوی از نظر ایمنی می‌شوند. همچنین در اپیدمی‌های کنونی H1N1، متولدین پیش از ۱۹۶۸ (به ویژه پیش از ۱۹۵۷ که H1N1 پیش از ورود H2N2 در گردش بود) مصونیت نسبی داشته‌اند. به‌جز ۱۹۱۸، در مجموع موارد سالانهٔ فصلی بسیار بیشتر از پاندمی‌هاست.", "whyWrong": {"0": "نادرست؛ ویژگی منحصربه‌فرد ۱۹۱۸ شکل W-مانند مرگ‌ومیر با اوج در جوانان ۲۵–۳۴ ساله بود.", "1": "نادرست؛ ترتیب گردش در جدول ۲۰۶-۱: ۱۹۱۸–۱۹۵۷ (`H1N1`) -> ۱۹۵۷–۱۹۶۸ (`H2N2`) -> ۱۹۶۸ به بعد (`H3N2`) و از ۱۹۷۷ (`H1N1 + H3N2`).", "3": "نادرست؛ متن تصریح می‌کند به استثنای ۱۹۱۸، تجمیع اپیدمی‌های سالانه موارد بیشتری نسبت به پاندمی‌ها ایجاد می‌کند."}, "pearl": "شکل کلاسیک W-شکل مرگ‌ومیر ۱۹۱۸ (اوج سوم در میانهٔ منحنی بین سنین ۲۵ تا ۳۴ سال) نتیجهٔ پاسخ ایمنی ذاتی مفرط («طوفان سیتوکینی») بر اثر تکثیر فوق‌العادهٔ HA و ریبونوکلئوپروتئین ویروس بود.", "trap": "مقایسهٔ H2N2 و H3N2 در جدول ۲۰۶-۱: H2N2 فقط بین ۱۹۵۷ تا ۱۹۶۸ چرخید و سپس با H3N2 (۱۹۶۸) جایگزین شد؛ ولی H1N1 در ۱۹۷۷ دوباره بازگشت و در ۲۰۰۹ پاندمی مجدد داد.", "highYield": "", "questionType": "clinical", "questionTypeLabel": "اپیدمیولوژی تاریخی و ایمنی‌شناسی", "coverageIndex": "فصل 206 / موضوع 2", "topicIndex": 2, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd ed. (2025)", "referencePages": "1545 (Fig. 206-2 & Table 206-1)", "referenceSection": "Chapter 206: Epidemiology & 1918 Pandemic", "id": "inf-103"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 211, "chapterTitle": "سرخک (روبلا): از لکهٔ کوپلیک تا SSPE", "topic": "سرخک (Measles)", "subtopic": "افت پوشش واکسن پس از کووید-۱۹، برچسب میکرونیدل و مرگ‌ومیر جهانی", "difficulty": "متوسط", "bloom": "", "stem": "دربارهٔ بازگشت جهانی سرخک پس از پاندمی کووید-۱۹ و اختلاف چشمگیر نسبت مرگ‌ومیر بیماری (Case-fatality proportion) در محیط‌های گوناگون طبق فصل ۲۱۱ ویرایش ۲۰۲۵ هاریسون، کدام گزینه صحیح است؟", "options": ["بین ۲۰۰۰ تا ۲۰۲۲ مرگ سالانهٔ سرخک تغییری نداشت و بیش از ۵ میلیون کودک در سال ۲۰۲۲ بر اثر سرخک جان باختند", "واکسیناسیون تک‌دوز سرخک انتقال بومی را متوقف کرده و از سال ۲۰۱۹ تا ۲۰۲۴ هیچ طغیانی در آمریکا یا اروپا رخ نداده است", "طغیان ۲۰۲۲ در ۳۷ کشور (+۱۸٪ موارد و +۴۳٪ مرگ)؛ مرگ‌ومیر از <۰/۱٪ در کشورهای پیشرفته تا ۲۰–۳۰٪ در اردوگاه پناهندگان است", "در اردوگاه‌های پناهندگان نیز به‌دلیل سادگی درمان با آنتی‌بیوتیک، مرگ‌ومیر سرخک کمتر از ۰/۰۵ درصد است"], "correct": 2, "explanation": "فصل ۲۱۱ هاریسون ۲۰۲۵ آمار دقیق بازگشت سرخک را پس از همه‌گیری کووید-۱۹ ثبت کرده است: نزدیک به ۴۰ میلیون کودک دوز واکسن را در ۲۰۲۱ از دست دادند که موجب طغیان در ۲۲ کشور (۲۰۲۱) و ۳۷ کشور (۲۰۲۲) و جهش ۱۸٪ موارد و ۴۳٪ مرگ‌ومیر (۱۳۶,۲۱۶ مرگ در ۲۰۲۲، با وجود کاهش ۸۲٪ نسبت به سال ۲۰۰۰) شد. نسبت مرگ‌ومیر در کشورهای پیشرفته ۰/۰۱–۰/۱٪، در آفریقای جنوب صحرا ۵–۱۰٪ و در اردوگاه‌های آوارگان/پناهندگان به ۲۰–۳۰٪ می‌رسد. همچنین نتایج مثبت فاز ۱/۲ پچ میکرونیدل (Micron Biomedical 2023) امید تازه‌ای برای ریشه‌کنی است.", "whyWrong": {"0": "نادرست؛ مرگ‌ومیر جهانی از ۲۰۰۰ تا ۲۰۲۲ با واکسیناسیون حدود ۸۲٪ کاهش یافت (۵۷/۲ میلیون مرگ پیشگیری شد)، هرچند هنوز >۱۰۰ هزار مرگ سالانه رخ می‌دهد.", "1": "نادرست؛ آمریکا حذف بومی را در ۲۰۰۰ اعلام کرد اما ۱۲۷۴ مورد در ۲۰۱۹ و بازگشت پساکوویدی این هدف را تهدید کرده است.", "3": "نادرست؛ در اردوگاه‌های پناهندگان و بی‌خانمان‌ها سوءتغذیه و تراکم، نسبت مرگ‌ومیر را به ۲۰–۳۰٪ می‌رساند."}, "pearl": "یک فناوری امیدوارکننده در هاریسون ۲۰۲۵ برای ریشه‌کنی سرخک و سرخجه: پچ پوستی میکرونیدل (بدون سرنگ و زنجیرهٔ سرد سختگ inciples of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "2322", "referenceSection": "Table 315-2 Genitourinary Management", "id": "inf-112"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 124, "chapterTitle": "رویکرد به بیمار عفونی: تاریخچه، معاینه، آزمایش و درمان تجربی", "topic": "رویکرد به بیمار عفونی", "subtopic": "Exposure-Driven Helminthic Differential Diagnosis", "difficulty": "آسان", "bloom": "", "stem": "مرد ۲۸ ساله‌ای پس از بازگشت از سفر کاری در نواحی روستایی خاورمیانه و آفریقا، با هماچوری انتهایی (Terminal hematuria)، سوزش ادرار و ائوزینوفیلی محیطی متوسط مراجعه کرده است. در شرح حال، شنا در آب‌های شیرین محلی را ذکر می‌کند. کدام پاتوژن در صدر تشخیص افتراقی قرار می‌گیرد؟", "options": ["شیستوزوما هماتوبیوم (Schistosoma haematobium)", "فاسیولا هپاتیکا (Fasciola hepatica)", "آنژیوسترونژیلوس کانتوننسیس (Angiostrongylus cantonensis)", "پارگونیموس وسترمانی (Paragonimus westermani)"], "correct": 0, "explanation": "بر اساس جدول ۱۲۴-۲ هریسون ۲۰۲۵ (علل عفونی مهم ائوزینوفیلی)، Schistosoma haematobium با مواجههٔ شنا در آب شیرین در آفریقا و خاورمیانه مرتبط است، مثانه را درگیر می‌کند و در فاز حاد با ائوزینوفیلی متوسط (و در فاز مزمن خفیف) و تظاهرات ادراری به‌ویژه هماچوری تظاهر می‌یابد.", "whyWrong": {"1": "نادرست؛ Fasciola در اثر مصرف تره‌آبی (Watercress) آلوده ایجاد می‌شود و عمدتاً کبد و مجاری صفراوی را درگیر می‌کند.", "2": "نادرست؛ Angiostrongylus پس از مصرف غذاهای دریایی خام در آسیا باعث درگیری CNS و مننژیت ائوزینوفیلیک می‌شود.", "3": "نادرست؛ Paragonimus به‌دنبال مصرف خرچنگ یا میگوی آب شیرین خام در آسیا رخ می‌دهد و عمدتاً ریه را درگیر می‌کند."}, "pearl": "تطبیق سابقهٔ مواجههٔ جغرافیایی با ارگان هدف در جدول علل ائوزینوفیلی کلید تشخیص سریع انگل‌هاست: آب شیرین + مثانه = S. haematobium؛ تره‌آبی + کبد = Fasciola؛ گوشت خوک + عضله = Trichinella.", "trap": "شیستوزوما مانسونی و ژاپونیکوم نیز از راه شنا در آب شیرین منتقل می‌شوند اما ارگان هدف آن‌ها کبد و روده است، نه مثانه.", "highYield": "شنا در آب شیرین س مولد بتا-لاکتاماز کافی نیست.", "2": "نادرست؛ ماکرولیدها و تتراسایکلین‌ها انتخاب تجربی اول در باکتریمی برق‌آسای ارگانیسم‌های کپسول‌دار نیستند."}, "pearl": "هر تب بدون علت واضح در بیمار بدون طحال یا مبتلا به آسپلنی عملکردی (مانند کم‌خونی داسی‌شکل) یک اورژانس تمام‌عیار است که نیازمند کشت خون و تزریق فوری سفتریاکسون + ونکومایسین در دقیقهٔ اول می‌باشد.", "trap": "دوز سفتریاکسون در اورژانس‌های CNS و سپسیس پس از اسپلنکتومی در جدول ۱۲۷-۱ معادل ۲ گرم هر ۱۲ ساعت (نه یک‌بار در روز) است.", "highYield": "سپسیس پس از اسپلنکتومی: عوامل = S. pneumoniae، H. influenzae، N. meningitidis؛ درمان تجربی = سفتریاکسون + ونکومایسین.", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 127 / موضوع 4", "topicIndex": 4, "difficultyFa": "آسان", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "991", "referenceSection": "Table 127-1 Overwhelming Post-Splenectomy Sepsis", "id": "inf-114"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 131, "chapterTitle": "پنومونی", "topic": "پنومونی", "subtopic": "Clinical vs Radiographic Resolution Timeline", "difficulty": "متوسط", "bloom": "", "stem": "مرد ۶۱ ساله‌ای با پنومونی باکتریال بستری شده و تحت درمان مناسب با سفتریاکسون و آزیترومایسین قرار دارد. در ساعت ۶۰ بستری، تب بیمار قطع شده، تنگی نفس بهبود یافته و اشباع اکسیژن در هوای اتاق به ۹۵ درصد رسیده است، اما گرافی کنترل قفسهٔ سینه نشان‌دهندهٔ گسترش جزئی ارتشاح در مقایسه با روز اول است. مناسب‌ترین اقدام کدام است؟", "options": ["شروع آمفوتریسین B وریدی و وریکونازول با شک قوی به آسپرژیلوز مهاجم", "انجام برونکوسکوپی اورژانسی و لاواژ با تشخیص قطعی شکست درمان آنتی‌بیوتیکی", "ادامهٔ رژیم فعلی، زیرا ارزیابی پاسخ بالینی بعد از ۴۸–۷۲ ساعت است", "تعویض فوری به مروپنم و ونکومایسین به‌دلیل پیشرفت رادیوگرافیک در ۲۴ ساعت اول"], "correct": 2, "explanation": "بر اساس فصل ۱۳۱ هریسون ۲۰۲۵ (صفحهٔ ۱۰۷۲ و ۱۰۷۶)، پاسخ بالینی به درمان پنومونی معمولاً ظرف ۴۸ تا ۷۲ ساعت با کاهش تب و بهبود اکسیژناسیون دیده می‌شود؛ در حالی که یافته‌های رادیوگرافی قفسهٔ سینه اغلب در اوایل درمان موقتاً بدتر می‌شوند و معیار قابل اعتمادی برای پایش پاسخ زودرس نیستند. ارزیابی مجدد تهاجمی یا تغییر رژیم تنها زمانی لازم است که بیمار در روز سوم از نظر بالینی بهبود نیابد یا رو به وخامت بگذارد.", "whyWrong": {"0": "نادرست؛ هیچ مدرکی دال بر عفونت قارچی مهاجم وجود ندارد.", "1": "نادرست؛ برونکوسکوپی برای شکست بالینی درمان است، نه بیمار بی‌تب و با اکسیژناسیون بهبودیافته.", "3": "نادرست؛ تغییر عجولانهٔ آنتی‌بیوتیک بر اساس CXR زودرس در بیمار از نظر بالینی رو به بهبود، باعث استوارشیپ ضعیف و سمیت بی‌مورد می‌شود."}, "pearl": "بیمار را درمان کنید، نه گرافی قفسهٔ سینه را! در پنومونی، بهبود بالینی طی ۴۸ تا ۷۲ ساعت رخ می‌دهد اما پاک شدن رادیولوژیک ممکن است هفته‌ها زمان ببرد و در روزهای اول حتی بدتر دیده شود.", "trap": "تکرار روتین CXR طی ۴۸ ساعت اول در بیمار پایدار اغلب باعث تشخیص کاذب شکست درمان می‌شود.", "highYield": "ارزیابی شکست درمان در روز سوم بر پایهٔ وضعیت بالینی و اکسیژناسیون انجام می‌شود، نه تکرار CXR در ۴۸–۷۲ ساعت اول.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 131 / موضوع 7", "topicIndex": 7, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1029, 1033", "referenceSection": "Failure to Improve & Follow-Up", "id": "inf-115"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 132, "chapterTitle": "آبسهٔ ریه", "topic": "آبسهٔ ریه", "subtopic": "Postobstructive & Underlying Risk Stratification", "difficulty": "متوسط", "bloom": "", "stem": "مرد ۶۸ ساله‌ای با سابقهٔ مصرف ۴۵ پاکت-سال سیگار و بدون سابقهٔ اختلال هوشیاری، الکلیسم یا بیماری پریودنتال، با سرفهٔ خشک که به‌تدریج خلط‌دار شده، کاهش وزن و یک حفرهٔ ۳.۵ سانتی‌متری با سطح آب-هوا در سگمان قدامی لوب فوقانی چپ مراجعه می‌کند. چرا انجام CT اسکن و بررسی بیشتر برای رد آبسهٔ ثانویه در این بیمار ضروری است؟", "options": ["آبسه‌های ثانویه >۸۰٪ کل موارد آبسهٔ ریه را تشکیل می‌دهند و منشأ آن‌ها همواره هماتوژن است", "وجود سطح آب-هوا در رادیوگرافی سینه، تومور مسدودکنندهٔ برونش را با اطمینان ۱۰۰٪ رد می‌کند", "باید تومور انسدادی برونش در این فرد مسن سیگاری با CT و برونکوسکوپی رد شود", "آبسه‌های ناشی از آسپیراسیون هرگز حفره‌ای با قطر بالای ۲ سانتی‌متر در ریه ایجاد نمی‌کنند"], "correct": 2, "explanation": "مطابق فصل ۱۳۲ هریسون ۲۰۲۵، حدود ۸۰ درصد آبسه‌های ریه اولیه (ناشی از آسپیراسیون و غالباً باکتری‌های بی‌هوازی در بیماران مستعد مثل الکلیسم، تشنج، اختلال بلع) و حدود ۲۰ درصد ثانویه (ناشی از فرایندهای پس از انسداد مثل جسم خارجی یا کارسینوم برونکوژنیک، یا اختلال سیستم ایمنی مثل HIV) هستند. CT اسکن تعریف دقیق‌تر حفره، یافتن علل زمینه‌ای مانند بدخیمی، و افتراق آبسهٔ محیطی از امپیم (نیازمند درناژ فوری) را ممکن می‌سازد.", "whyWrong": {"0": "نادرست؛ آبسه‌های اولیه ۸۰٪ موارد را تشکیل می‌دهند، نه ثانویه.", "1": "نادرست؛ کارسینوم اسکواموس حفره‌دار و آبسهٔ پس از انسداد نیز به‌خوبی می‌توانند سطح آب-هوا ایجاد کنند.", "3": "نادرست؛ تعریف آبسهٔ ریه اصولاً وجود حفرهٔ غالب >۲ سانتی‌متر پس از نکروز پارانشیم است."}, "pearl": "همیشه با دیدن آبسهٔ ریه در فرد بالای ۵۰ سال سیگاری بدون عامل خطر آسپیراسیون یا در سگمان‌های غیروابسته به جاذبه (مانند لوب قدامی)، کارسینوم برونکوژنیک پنهان را بررسی کنید.", "trap": "شروع کورکورانهٔ کلیندامایسین بدون بررسی انسداد در بیمار سالمند سیگاری بی‌سابقهٔ آسپیراسیون باعث تاخیر در تشخیص سرطان ریه می‌شود.", "highYield": "۸۰٪ آبسه‌های ریه اولیه (آسپیراسیون/بی‌هوازی)؛ ۲۰٪ ثانویه (انسداد با تومور/جسم خارجی یا نقص ایمنی)؛ CT برای تشخیص بدخیمی و افتراق از امپیم برتر از CXR است.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 132 / موضوع 1", "topicIndex": 1, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1034–1035", "referenceSection": "Lung Abscess: Etiology & Diagnosis", "id": "inf-116"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 133, "chapterTitle": "اندوکاردیت عفونی", "topic": "اندوکاردیت عفونی", "subtopic": "Empirical Subacute Blood-Culture-Negative Regimen", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۴۶ ساله‌ای با وضعیت بی‌خانمانی، تب ۶ هفته‌ای، کاهش وزن و سوفل نارسایی آئورت به همراه رویش ۸ میلی‌متری در TEE بستری شده است. طی ۴ هفتهٔ اخیر آنتی‌بیوتیکی مصرف نکرده و تمام کشت‌های خون اولیه منفی هستند. مطابق فصل ۱۳۳ هریسون ۲۰۲۵، ضمن ارسال سرولوژی و PCR، کدام رژیم تجربی تا زمان آماده شدن نتایج آزمایشگاهی باید آغاز شود؟", "options": ["ونکومایسین + آمپی‌سیلین-سولباکتام (یا سفتریاکسون) + داکسی‌سایکلین", "ونکومایسین به همراه سفپیم و کلیندامایسین بدون نیاز به تتراسایکلین", "سفتریاکسون به تنهایی تا آماده شدن نتیجهٔ کشت طولانی‌مدت ۲۱ روزه", "فلوکونازول وریدی به همراه آمیکاسین با فرض عامل قارچی یا گرم منفی"], "correct": 0, "explanation": "در فصل ۱۳۳ هریسون ۲۰۲۵ (صفحهٔ ۱۰۸۸)، در اندوکاردیت دریچهٔ طبیعی تحت‌حاد با کشت خون منفی (بدون مصرف قبلی آنتی‌بیوتیک)، S. aureus و CoNS و انتروکوک بعیدند و رژیم تجربی باید استرپتوکوک‌های سخت‌رشد، Abiotrophia/Gemella/Granulicatella، گروه HACEK و Bartonella را پوشش دهد. بنابراین درمان تجربی پیشنهادی عبارت است از ونکومایسین + آمپی‌سیلین-سولباکتام (۱۲ گرم در ۲۴ ساعت) یا سفتریاکسون + داکسی‌سایکلین (۱۰۰ میلی‌گرم دوبار در روز) برای پوشش بهتر Bartonella (که در افراد بی‌خانمان با شپش تن و B. quintana ارتباط قوی دارد). همچنین در این بیماران باید اندوکاردیت مارانتیک و سندرم آنتی‌فسفولیپید را نیز در نظر داشت.", "whyWrong": {"1": "نادرست؛ سفپیم و کلیندامایسین پوشش مناسب برای Bartonella و پاتوژن‌های داخل‌سلولی مثل کوکسیلا ایجاد نمی‌کنند.", "2": "نادرست؛ سفتریاکسون به تنهایی استافیلوکوک، انتروکوک یا بارتونلا را پوشش نمی‌دهد.", "3": "نادرست؛ کاندیدا بدون عوامل خطر دریچهٔ طبیعی و باکتریمی منفی پوشش اول تجربی نیست."}, "pearl": "بی‌خانمانی + اندوکاردیت دریچهٔ آئورت کشت-منفی قویاً مطرح‌کنندهٔ Bartonella quintana است؛ همیشه داکسی‌سایکلین را به رژیم تجربی کشت-منفی تحت‌حاد بیفزایید.", "trap": "نبود داکسی‌سایکلین در رژیم تجربی اندوکاردیت کشت‌منفی باعث جا ماندن شایع‌ترین علل کشت‌منفی واقعی (Bartonella و Coxiella) می‌شود.", "highYield": "رژیم تجربی NVE تحت‌حاد کشت‌منفی (بدون آنتی‌بیوتیک قبلی): ونکومایسین + (آمپی‌سیلین-سولباکتام یا سفتریاکسون) + داکسی‌سایکلین (۱۰۰ mg BID).", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 133 / موضوع 7", "topicIndex": 7, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1045", "referenceSection": "Empirical Therapy for Culture-Negative IE", "id": "inf-117"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 134, "chapterTitle": "عفونت‌های پوست، عضله و بافت نرم", "topic": "عفونت‌های پوست، عضله و بافت نرم", "subtopic": "Pasteurella multocida & Eikenella corrodens Susceptibilities", "difficulty": "دشوار", "bloom": "", "stem": "دو بیمار مراجعه کرده‌اند: بیمار اول به‌دنبال گزش گربه دچار عفونت بافت نرم ناشی از Pasteurella multocida شده و بیمار دوم پس از آسیب مشت بسته به دندان (Clenched-fist injury) دچار عفونت با Eikenella corrodens شده است. بر اساس پاورقی جدول ۱۳۴-۲ هریسون ۲۰۲۵، کدام الگوی مقاومت ذاتی آنتی‌بیوتیکی برای این دو پاتوژن صحیح است؟", "options": ["هر دو باکتری به‌خوبی توسط سفالکسین خوراکی یا کلیندامایسین به‌تنهایی پوشش داده می‌شوند", "P. multocida به سفالکسین/کلیندامایسین مقاوم و E. corrodens به کلیندامایسین/مترونیدازول مقاوم است", "E. corrodens به مترونیدازول بسیار حساس و P. multocida به دی‌کلوگزاسیلین پاسخ کامل می‌دهد", "P. multocida به آموکسی‌سیلین-کلاوولانات مقاوم و E. corrodens به سیپروفلوکساسین/TMP-SMX مقاوم است"], "correct": 1, "explanation": "در پاورقی جدول ۱۳۴-۲ هریسون ۲۰۲۵ (صفحهٔ ۱۰۹۷) به‌طور دقیق ذکر شده است: Pasteurella multocida (شایع در گزش سگ و گربه) به سفالکسین، دی‌کلوگزاسیلین، کلیندامایسین و اریترومایسین مقاوم است؛ و Eikenella corrodens (شایع در گزش انسانی) به کلیندامایسین، پنی‌سیلین‌های مقاوم به پنی‌سیلیناز (مثل نفسیلین/دی‌کلوگزاسیلین) و مترونیدازول مقاوم اما به TMP-SMX و فلوروکینولون‌ها حساس است. درمان خوراکی انتخابی اولیه برای هر دو، آموکسی‌سیلین-کلاوولانات (۸۷۵/۱۲۵ mg دو بار در روز) و وریدی آن آمپی‌سیلین-سولباکتام است.", "whyWrong": {"0": "نادرست؛ کلیندامایسین به تنهایی برای هیچ‌یک از دو پاتوژن پوشش مناسبی ندارد و سفالکسین برای پاستورلا ناکارآمد است.", "2": "نادرست؛ E. corrodens به مترونیدازول و P. multocida به دی‌کلوگزاسیلین مقاوم است.", "3": "نادرست؛ هر دو به آموکسی‌سیلین-کلاوولانات حساس‌اند و E. corrodens به TMP-SMX و کینولون‌ها حساس است."}, "pearl": "اگر بیمار با آلرژی به پنی‌سیلین دچار زخم گزش سگ/گربه یا انسان شود، تجویز «کلیندامایسین تک‌دارو» هر دو عامل کلیدی P. multocida و E. corrodens را از دست می‌دهد؛ باید کلیندامایسین را با کینولون، داکسی‌سایکلین یا TMP-SMX ترکیب کرد.", "trap": "تجویز سفالکسین یا کلیندامایسین به‌تنهایی پس از گزش حیوان یا انسان به‌دلیل تصور کفایت برای استاف و استرپتوکوک.", "highYield": "P. multocida: مقاوم به سفالکسین، دی‌کلوگزاسیلین، کلیندامایسین، اریترومایسین؛ E. corrodens: مقاوم به کلیندامایسین، اگزاسیلین/دی‌کلوگزاسیلین، مترونیدازول؛ حساس به TMP-SMX و کینولون.", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 134 / موضوع 3", "topicIndex": 3, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1054", "referenceSection": "Table 134-2 Footnote", "id": "inf-118"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 135, "chapterTitle": "آرتریت عفونی", "topic": "آرتریت عفونی", "subtopic": "Rubella Natural vs Vaccine-Associated Arthritis", "difficulty": "متوسط", "bloom": "", "stem": "زن ۲۹ ساله‌ای ۴ هفته پس از دریافت واکسن زندهٔ تضعیف‌شدهٔ MMR به دلیل نداشتن تیتر ایمنی پیش از بارداری، دچار درد و تورم متقارن در مفاصل انگشتان دست، مچ دست و هر دو زانو همراه با خستگی خفیف شده است. کدام توضیح بر اساس فصل ۱۳۵ هریسون ۲۰۲۵ برای این بیمار درست است؟", "options": ["تا ۵۰٪ زنان آرترالژی و ۱۰٪ آ ": {"0": "نادرست؛ برعکس، هریسون ۲۰۲۵ تصریح می‌کند عود CDI خطر ۱۱٪ عوارض جدی تا مرگ در ۳۰ روز دارد.", "1": "نادرست؛ ایلئوس آدینامیک و مگاکولون توکسیک می‌توانند اسهال را متوقف کنند و خطای کلاسیک رد CDI به خاطر نداشتن اسهال است.", "3": "نادرست؛ ایلئوس در CDI زنگ خطر شکل فولمینانت و مگاکولون است و لوپرامید اکیداً ممنوع و نیازمند وانکومایسین + مترونیدازول IV ± انمای وانکومایسین می‌باشد."}, "pearl": "تلهٔ بالینی بیمار ICU: بیمار پس از آنتی‌بیوتیک، اسهالش قطع می‌شود اما شکمش متسع شده و لکوسیتوز به بالای ۱۵–۲۰ هزار می‌رسد — این «بهبود اسهال» نیست، بلکه ایلئوس فلج‌کنندهٔ CDI فولمینانت است!", "trap": "رد کردن CDI در بیمار دچار لکوسیتوز شدید و اتساع شکم پس از آنتی‌بیوتیک تنها به این دلیل که «بیمار اسهال ندارد».", "highYield": "ایلئوس آدینامیک در ~۲۰٪ CDI: قطع اسهال + لکوسیتوز بی‌توضیح ≥۱۵,۰۰۰؛ عود CDI = ۱۱٪ خطر شوک/مگاکولون/پرفوراسیون/کولکتومی/مرگ طی ۳۰ روز.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 139 / موضوع 2", "topicIndex": 2, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1084–1085", "referenceSection": "CDI Clinical Manifestations & Recurrent CDI", "id": "inf-121"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 140, "chapterTitle": "عفونت‌های مجاری ادراری: سیستیت، پروستاتیت و پیلونفریت", "topic": "عفونت‌های مجاری ادراری", "subtopic": "ABP vs CBP Diagnostic Clues & Treatment Duration", "difficulty": "متوسط", "bloom": "", "stem": "مرد ۵۴ ساله‌ای بدون سابقهٔ سوندگذاری، طی ۸ ماه گذشته سه نوبت دچار کشت مثبت با یک سویهٔ ثابت E. coli و علائم دیزوری و درد خفیف پرینه بدون تب شده و در فاصلهٔ اپیزودها با درمان‌های کوتاه‌مدت ۷ روزه علائم موقتاً فروکش کرده اما عود نموده است. محتمل‌ترین تشخیص و مدت درمان پیشنهادی بر اساس فصل ۱۴۰ هریسون ۲۰۲۵ کدام است؟", "options": ["پیلونفریت زانتوگرانولوماتوز؛ نفرکتومی رادیکال اورژانسی", "سیستیت حاد غیرعارضه‌دار؛ تک‌دوز فوسفومایسین ۳ گرمی خوراکی", "پروستاتیت باکتریال حاد (ABP)؛ ۳ روز نیتروفورانتوئین خوراکی", "پروستاتیت باکتریال مزمن؛ ۴–۶ هفته فلوروکینولون یا TMP-SMX"], "correct": 3, "explanation": "در بخش پروستاتیت فصل ۱۴۰ هریسون ۲۰۲۵ (صفحهٔ ۱۱۳۷)، پروستاتیت باکتریال مزمن (CBP) باید در مردان مبتلا به UTI راجعه با همان ارگانیسم، به‌ویژه در غیاب سوندگذاری ادراری، شک شود. درمان CBP نیازمند نفوذ پروستاتی بالای آنتی‌بیوتیک (فلوروکینولون یا TMP-SMX برای سویهٔ حساس) به مدت ۴ تا ۶ هفته است و چون عود غیرمعمول نیست، ممکن است دوره‌های تا ۱۲ هفته ضرورت یابد (در حالی که برای پروستاتیت باکتریال حاد [ABP] ۲ تا ۴ هفته درمان توصیه می‌شود).", "whyWrong": {"0": "نادرست؛ هیچ شواهدی از سنگ شاخ‌گوزنی یا تخریب پارانشیم کلیه وجود ندارد.", "1": "نادرست؛ تک‌دوز فوسفومایسین به هیچ عنوان پروستات را استریل نمی‌کند.", "2": "نادرست؛ ABP تظاهر تب‌دار حاد دارد و نیتروفورانتوئین اصلاً به بافت پروستات نفوذ درمانی ندارد."}, "pearl": "هر مرد غیرکاتترگذاری‌شده با عفونت ادراری راجعه با همان سویه = پروستاتیت باکتریال مزمن (CBP) است، زیرا پروستات به‌عنوان مخزن پاتوژن پس از دوره‌های کوتاه سیستیت عمل می‌کند.", "trap": "تجویز نیتروفورانتوئین برای مرد دارای UTI تب‌دار یا راجعه، که غلظت بافتی پروستات در آن نزدیک به صفر است.", "highYield": "مدت درمان پروستاتیت: ABP (حاد) = ۲ تا ۴ هفته؛ CBP (مزمن) = ۴ تا ۶ هفته (و در عودها تا ۱۲ هفته) با کینولون یا TMP-SMX.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 140 / موضوع 5", "topicIndex": 5, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1094", "referenceSection": "Prostatitis", "id": "inf-122"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 141, "chapterTitle": "عفونت‌های مقاربتی: مرور و رویکرد بالینی", "topic": "عفونت‌های مقاربتی", "subtopic": "Indications, Dosing & Population Efficacy Gap", "difficulty": "دشوار", "bloom": "", "stem": "چند مراجعهٔ بالینی برای مشاورهٔ پروفیلاکسی پس از مواجههٔ باکتریایی STI با داکسی‌سایکلین (Doxy-PEP) انجام شده است. کدام توصیه کاملاً مطابق بخش پیشگیری فصل ۱۴۱ هریسون ۲۰۲۵ است؟", "options": ["Doxy-PEP با دوز ۵۰۰ mg روزانه در زنان سیس‌جندر بیش از ۹۰٪ از کلامیدیا و هرپس پیشگیری می‌کند", "Doxy-PEP برای پیشگیری پس از مواجهه با HIV نیز جایگزین کامل داروهای ضدرتروویروس (ARV) است", "در MSM و زنان ترنس داکسی ۲۰۰ mg/72h مؤثر است، اما در زنان سیس‌جندر نه", "Doxy-PEP باید ظرف ۶ ساعت مصرف شود و پس از ۱۲ ساعت از مواجههٔ جنسی هیچ اثری نخواهد داشت"], "correct": 2, "explanation": "در بخش پیشگیری فصل ۱۴۱ هریسون ۲۰۲۵ (صفحهٔ ۱۱۵۳) آخرین شواهد Doxy-PEP آورده شده است: در میان MSM و زنان ترنس‌جندر، تجویز داکسی‌سایکلین ۲۰۰ میلی‌گرم تک‌دوز خوراکی ظرف ۷۲ ساعت پس از سکس بدون کاندوم (با سقف دوز ۲۰۰ mg در روز) خطر کلامیدیا، سیفلیس و در برخی کارآزمایی‌ها سوزاک را کاهش می‌دهد. با این حال، مطالعات بالینی انجام‌شده در زنان سیس‌جندر (Cisgender women) اثربخشی آن را نشان نداده‌اند.", "whyWrong": {"0": "نادرست؛ دوز ۲۰۰ mg است نه ۵۰۰ mg، بر هرپس اثری ندارد و در مطالعات زنان سیس‌جندر اثربخشی نشان نداده است.", "1": "نادرست؛ داکسی‌سایکلین هیچ اثری بر HIV ندارد.", "3": "نادرست؛ پنجرهٔ Doxy-PEP تا ۷۲ ساعت پس از تماس جنسی است."}, "pearl": "یکی از به‌روزترین سوالات بورد از هریسون ۲۲ (۲۰۲۵): دوزاژ ۲۰۰ mg Doxy-PEP ظرف ۷۲ ساعت برای باکتری‌های STI (کلامیدیا، سیفلیس و بخشی گنوره) فقط در MSM و زنان ترنس‌جندر اثربخش بوده و کارآزمایی‌ها در زنان سیس‌جندر موفق نبودند.", "trap": "تعمیم Doxy-PEP به زنان سیس‌جندر یا اشتباه گرفتن پنجرهٔ ۷۲ ساعته با ۲۴ ساعت یا دوز ۱۰۰ mg به جای ۲۰۰ mg.", "highYield": "Doxy-PEP: ۲۰۰ mg تک‌دوز PO ظرف ۷۲ ساعت (حداکثر ۲۰۰ mg/day) در MSM و زنان ترنس‌جندر علیه کلامیدیا و سیفلیس (عدم اثربخشی در زنان سیس‌جندر).", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 141 / موضوع 7", "topicIndex": 7, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1110", "referenceSection": "STI Prevention: Doxycycline PEP", "id": "inf-123"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 143, "chapterTitle": "مننژیت حاد", "topic": "مننژیت حاد", "subtopic": "Optimal CSF Specimen Collection & Smear/Culture Yield", "difficulty": "متوسط", "bloom": "", "stem": "مرد ۴۲ ساله‌ای با سردرد بی‌امان ۴ هفته‌ای، تب خفیف، تعریق شبانه، سفتی گردن و فلج عصب شش جمجمه‌ای بستری شده و گلوکز CSF برابر ۲۸ mg/dL، پروتئین ۲.۲ g/L و WBC برابر ۹۵ سلول با ۸۵٪ لنفوسیت دارد. کدام اقدام نمونه‌گیری و تفسیر آزمایشگاهی برای اثبات مننژیت سلی مطابق فصل ۱۴۳ هریسون ۲۰۲۵ صحیح‌تر است؟", "options": ["آزمون Xpert MTB/RIF روی CSF حساسیت ۱۰۰٪ دارد و در منفی‌شدن نیاز به کشت یا درمان نیست", "آخرین لولهٔ LP (یا اسمیر از پلیکل) بهترین است؛ اسمیر ۱۰–۴۰٪ و کشت ~۵۰٪ حساسیت دارند", "اولین لولهٔ CSF بیشترین حساسیت اسمیر AFB (>۹۵٪) را دارد و اسمیر منفی سل را رد می‌کند", "کشت مایع مغزی-نخاعی در مننژیت توبرکلوزی معمولاً ظرف ۲۴ ساعت آماده می‌شود"], "correct": 1, "explanation": "مطابق صفحهٔ ۱۱۷۰ فصل ۱۴۳ هریسون ۲۰۲۵: در مننژیت سلی، آخرین لولهٔ جمع‌آوری‌شده در پونکسیون کمری بهترین لوله برای اسمیر اسیدفست (AFB) است و اگر در سطح CSF پِلیکل (Pellicle) یا لختهٔ تارعنکبوتی شکل گیرد، اسمیر همان لخته بهترین شانس مشاهدهٔ باسیل را دارد. با این حال، اسمیر AFB فقط در ۱۰ تا ۴۰ درصد بزرگسالان و کشت (که ۴ تا ۸ هفته طول می‌کشد ولی همچنان استاندارد طلایی است) در ~۵۰ درصد بزرگسالان مثبت می‌شود؛ همچنین برای Xpert MTB/RIF و Ultra ریسک منفی کاذب هنوز به‌طور قطعی تعریف نشده است و نباید مانع شروع درمان تجربی شود.", "whyWrong": {"0": "نادرست؛ هریسون تصریح می‌کند که حساسیت Xpert و خطر منفی کاذب آن مشخص نشده و نباید درمان را به تأخیر بیندازد.", "2": "نادرست؛ آخرین لوله بهترین نمونه است و اسمیر تنها ۱۰–۴۰٪ حساسیت دارد، پس اسمیر منفی هرگز TBM را رد نمی‌کند.", "3": "نادرست؛ رشد M. tuberculosis در کشت CSF بین ۴ تا ۸ هفته طول می‌کشد."}, "pearl": "در ظن به مننژیت سلی، به پرستار و رزیدنت یادآوری کنید که آخرین لولهٔ LP را با حجم کافی برای AFB و کشت/Xpert کنار بگذارند و در صورت منفی شدن اسمیر و Xpert، هرگز درمان تجربی ضدسل + استروئید را متوقف نکنند!", "trap": "ارسال لولهٔ اول کم‌حجم برای AFB و متوقف کردن درمان ضدسل به‌خاطر منفی شدن اسمیر و Xpert اولیه.", "highYield": "مننژیت سلی: آخرین لولهٔ LP و پلیکل برای AFB؛ اسمیر ۱۰–۴۰٪ مثبت؛ کشت ۴–۸ هفته (~۵۰٪ مثبت، استاندارد طلایی)؛ Xpert ریسک منفی کاذب دارد.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 143 / موضوع 7", "topicIndex": 7, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1127", "referenceSection": "Subacute Meningitis: Laboratory Diagnosis", "id": "inf-124"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 146, "chapterTitle": "عفونت‌های ناشی از گاز گرفتگی: سگ، گربه، انسان و حیوانات دیگر", "topic": "عفونت‌های ناشی از گاز گرفتگی", "subtopic": "Table 146-1 Snake, Monkey & Penicillin-Allergic Human Bites", "difficulty": "دشوار", "bloom": "", "stem": "چند بیمار با گزش‌های مختلف مراجعه کرده‌اند. بر اساس جدول ۱۴۶-۱ هریسون ۲۰۲۵ (مدیریت عفونت‌های گزش حیوان و انسان)، کدام گزینه به‌درستی انتخاب آنتی‌بیوتیک، پروفیلاکسی در زخم زودرس یا اقدام اختصاصی را بیان می‌کند؟", "options": ["در گزش گربه به‌ندرت پروفیلاکسی آنتی‌بیوتیکی لازم است اما در گزش سگ همیشه لازم است", "گزش مار آنتی‌بیوتیک روتین نمی‌خواهد؛ گزش میمون پروفیلاکسی + آسیکلوویر در ماکاک دارد", "در گزش زودرس غیرعفونی مار، تجویز ۵ روزهٔ سفالکسین خوراکی برای همهٔ بیماران اجباری است", "در گزش انسان با آلرژی به پنی‌سیلین، کلیندامایسین + مترونیدازول رژیم انتخاب اول است"], "correct": 1, "explanation": "مطابق جدول ۱۴۶-۱ هریسون ۲۰۲۵ (صفحهٔ ۱۱۸۸): (۱) در گزش مار، فلور دهان شامل Pseudomonas، Morganella، E. coli، استرپتوکوک گروه D، سالمونلا و بی‌هوازی‌هاست (در عفونت تثبیت‌شده: پیپراسیلین-تازوباکتام)، اما شواهد از پروفیلاکسی آنتی‌بیوتیکی برای زخم زودرس حمایت نمی‌کند (مگر در مناطق با عفونت بسیار بالا مثل برزیل) و اقدام اصلی آنتی‌ونوم در مار سمی و پروفیلاکسی کزاز است؛ (۲) در گزش میمون پروفیلاکسی همیشه توصیه می‌شود و در میمون ماکاک (Macaque) باید پروفیلاکسی B virus با آسیکلوویر مدنظر قرار گیرد؛ (۳) در گزش انسان با آلرژی به پنی‌سیلین جدول ۱۴۶-۱ ترکیب TMP-SMX + مترونیدازول را ذکر می‌کند (چون کلیندامایسین روی Eikenella بی‌اثر است)؛ (۴) در زخم زودرس گربه برخلاف سگ، معمولاً پروفیلاکسی توصیه می‌شود (Usually vs Sometimes).", "whyWrong": {"0": "نادرست؛ گزش گربه به‌علت دندان‌های سوزنی‌شکل و تزریق عمیق پاستورلا به عمق بافت اغلب (Usually) نیازمند پروفیلاکسی است، در حالی که گزش سگ گاهی (Sometimes) نیاز دارد.", "2": "نادرست؛ هم پروفیلاکسی در گزش مار روتین نیست و هم سفالکسین سودوموناس و مورگانلای دهان مار را پوشش نمی‌دهد.", "3": "نادرست؛ در گزش انسان Eikenella corrodens عامل کلیدی است که به کلیندامایسین و مترونیدازول مقاوم است؛ پس در جدول ۱۴۶-۱ برای آلرژی پنی‌سیلین TMP-SMX + مترونیدازول آمده است."}, "pearl": "مکانیسم کلیدی جدول ۱۴۶-۱: کلیندامایسین + TMP-SMX برای گزش سگ/گربه (آلرژی به پنی‌سیلین) مناسب است، اما برای گزش انسان چون کلیندامایسین علیه Eikenella بی‌اثر است از TMP-SMX + مترونیدازول استفاده می‌شود.", "trap": "تجویز کلیندامایسین در گزش انسان به‌جای TMP-SMX یا دادن آنتی‌بیوتیک پروفیلاکتیک روتین به تمام مارگزیدگی‌های بدون عفونت.", "highYield": "جدول ۱۴۶-۱: گزش مار -> پروفیلاکسی روتین حمایت نمی‌شود (درمان عفونت = پیپ-تازو)؛ گزش میمون ماکاک -> آسیکلوویر برای B virus؛ گزش گربه -> معمولاً پروفیلاکسی لازم است.", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 146 / موضوع 2", "topicIndex": 2, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1145", "referenceSection": "Table 146-1 Management of Bite Wounds", "id": "inf-125"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 151, "chapterTitle": "عفونت‌های پنوموکوکی", "topic": "عفونت‌های پنوموکوکی", "subtopic": "Mortality, Long-Term Sequelae & Corticosteroid Geographic Discrepancy", "difficulty": "دشوار", "bloom": "", "stem": "بیمار ۵۲ ساله‌ای در یک مرکز پیشرفتهٔ درمانی پس از مننژیت پنوموکوکی و دریافت فوری سفتریاکسون، ونکومایسین و دگزامتازون بهبود یافته است. مطابق فصل ۱۵۱ هریسون ۲۰۲۵، کدام گزاره دربارهٔ مرگ‌ومیر، عوارض در بازماندگان و شواهد کورتیکواستروئید در مننژیت پنوموکوکی درست است؟", "options": ["کارآزمایی‌های بالینی نشان داده‌اند دگزامتازون در کشورهای کم‌درآمد بیش از پردرآمد مرگ را کم می‌کند", "با آنتی‌بیوتیک مدرن مرگ‌ومیر مننژیت پنوموکوکی <۱٪ شده و عوارض نورولوژیک تقریباً به صفر رسیده", "مرگ‌ومیر ~۲۰٪ و عارضه تا ۵۰٪؛ استروئید در کشورهای پردرآمد مؤثر ولی در کم‌درآمد فایدهٔ ثابتی نداشته", "آنتی‌ژن ادراری پنوموکوک در بزرگسالان دارای مننژیت به‌علت کلونیزاسیون بالا هیچ ارزش تشخیصی ندارد"], "correct": 2, "explanation": "در صفحات ۱۲۳۶–۱۲۳۷ فصل ۱۵۱ هریسون ۲۰۲۵ آمده است: (۱) نرخ مرگ‌ومیر مننژیت پنوموکوکی حدود ۲۰ درصد است و تا ۵۰ درصد بازماندگان دچار عوارض حاد یا مزمن (شامل ناشنوایی، هیدروسفالی و عوارض عروقی مغز در بزرگسالان و اختلال ذهنی در کودکان) می‌شوند؛ (۲) داده‌ها از کاربرد گلوکوکورتیکوئیدها (کاهش مرگ‌ومیر، کاهش ناشنوایی شدید و کاهش عوارض عصبی) در کشورهای پردرآمد (High-income countries) حمایت می‌کنند اما در کشورهای کم‌درآمد (Low-income countries) اثر مفیدی نشان نداده‌اند (احتمالاً به‌علت تأخیر در دسترسی و مراقبت‌های حمایتی)؛ (۳) تشخیص آنتی‌ژن پنوموکوک در ادرار بزرگسالان به‌سبب شیوع پایین کلونیزاسیون نازوفارنکس ویژگی بسیار بالایی دارد.", "whyWrong": {"0": "نادرست؛ دقیقاً برعکس، مطالعات در کشورهای پردرآمد سود دگزامتازون را نشان دادند و در کشورهای کم‌درآمد (مثل مالاوی) سود نشان نداد.", "1": "نادرست؛ مننژیت پنوموکوکی همچنان مرگ‌ومیر ~۲۰٪ و عارضهٔ ۵۰٪ دارد.", "3": "نادرست؛ در بزرگسالان (برخلاف کودکان) کلونیزاسیون کم است و تست آنتی‌ژن ادراری بسیار اختصاصی است."}, "pearl": "علاوه بر CSF، مثبت بودن کشت خون همراه با علائم بالینی مننژیت یا آنتی‌ژن ادراری پنوموکوک در بزرگسالان کمک بزرگی به اثبات اتیولوژی پنوموکوکی می‌کند.", "trap": "پاسخ دادن به سوال با فرض اثبات جهانی سود دگزامتازون در تمام مناطق کم‌درآمد بدون توجه به شرط دسترسی زودهنگام به مراقبت پزشکی.", "highYield": "مننژیت پنوموکوکی: مرگ‌ومیر ~۲۰٪؛ عوارض در با on": "جدول ۱۸۳-۶ هاریسون ۲۰۲۵ جزئیات جالبی از رژیم‌های TPT ارائه می‌دهد: رژیم 1HP (فقط سن >۱۳ سال، INH 300 + RPT 600 روزانه برای ۲۸ دوز) عوارض کلی شبیه 3HP دارد ولی نوتروپنی در آن شایع‌تر و بالا رفتن آنزیم‌های کبدی و نوروپاتی کمتر است. همچنین در جدول ۱۸۳-۶ رژیم لووفلوکساسین روزانه به مدت ۶ ماه (۱۰–۱۵ mg/kg بالغین، ۱۵–۲۰ mg/kg کودکان، حداکثر ۷۵۰ mg) برای پروفیلاکسی در تماس‌های پرخطر MDR-TB گنجانده شده است.", "whyWrong": {"1": "نادرست؛ رژیم 1HP تنها برای سن >۱۳ سال تأیید شده است و سمیت کبدی آن کمتر از 3HP است.", "2": "نادرست؛ نوروپاتی محیطی عارضهٔ ایزونیازید است نه ریفامپین (ریفامپین خطر ترومبوسیتوپنی، سندرم شبه‌آنفلوآنزا و DILI دارد).", "3": "نادرست؛ لووفلوکساسین روزانه برای ۶ ماه مستقیماً در جدول ۱۸۳-۶ برای پیشگیری تماس MDR-TB قرار داده شده است."}, "pearl": "پنج رژیم TPT در جدول ۱۸۳-۶ هاریسون: ۶ یا ۹ ماه H؛ ۳ ماه HP هفتگی؛ ۳ ماه HR روزانه؛ ۴ ماه R روزانه؛ ۱ ماه HP روزانه (سن >۱۳ سال)؛ و ۶ ماه لووفلوکساسین روزانه (تماس با MDR-TB).", "trap": "در مقایسهٔ 1HP با 3HP، تصور نکنید روزانه‌شدن مصرف در 1HP سمیت کبدی را بیشتر کرده؛ برعکس در کارآزمایی‌ها افزایش آنزیم‌های کبدی و نوروپاتی در 1HP کمتر ولی نوتروپنی بیشتر بوده است.", "highYield": "مبحث پربازده هاریسون ۲۰۲۵ — درمان پیشگیرانه سل (TPT): مقایسه 1HP با 3HP و پیشگیری در تماس با MDR-TB", "questionType": "management", "questionTypeLabel": "پیشگیری و پروتکل‌های جدید", "coverageIndex": "فصل 183 / موضوع 12", "topicIndex": 12, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd ed. (2025)", "referencePages": "1402–1403 (Table 183-6)", "referenceSection": "Chapter 183: Tuberculosis Preventive Treatment (TPT)", "id": "inf-138"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 189, "chapterTitle": "لپتوسپیروز: از سیل و موش تا سندرم وایل", "topic": "لپتوسپیروز", "subtopic": "اختلال انعقادی، فعال‌شدن اندوتلیوم و خونریزی ریوی شدید", "difficulty": "دشوار", "bloom": "", "stem": "در لپتوسپیروز شدید (مانند سندرم خونریزی ریوی کشنده در شکل ۱۸ ine", "edition": "22nd ed. (2025)", "referencePages": "1442 (Fig. 189-4)", "referenceSection": "Chapter 189: Pathogenesis & Severe Pulmonary Hemorrhage", "id": "inf-139"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 197, "chapterTitle": "عفونت‌های ویروس هرپس سیمپلکس", "topic": "عفونت‌های ویروس هرپس سیمپلکس (HSV)", "subtopic": "پروفیلاکسی جراحی HSV و طول سرکوب پس از درمان هرپس نوزادی", "difficulty": "دشوار", "bloom": "", "stem": "بر اساس جدول ۱۹۷-۱ هاریسون ۲۰۲۵، کدام دو راهبرد درمانی در پروفیلاکسی پیش از جراحی‌های محرک عود HSV (مانند دکمپرشن ریشهٔ عصب سه‌قلو یا لیزر لایه‌برداری پوست) و نیز پیگیری پس از تکمیل دورهٔ ۲۱ روزهٔ آسیکلوویر وریدی در هرپس نوزادی توصیه شده است؟", "options": ["شروع والاسیکلوویر دقیقاً ۲ ساعت پس از اتمام جراحی؛ و قطع کامل دارو در نوزاد بلافاصله پس از ۲۱ روز وریدی", "تجویز پماد موضعی آسیکلوویر یک هفته قبل از لیزر؛ و ادامهٔ آسیکلوویر وریدی نوزاد به مدت ۱۲ ماه در بخش", "تزریق ایمونوگلوبولین غیراختصاصی در جراحی عصب پنجم؛ و تجویز گانسیکلوویر خوراکی برای نوزاد به مدت ۶ هفته", "پروفیلاکسی خوراکی ۴۸ ساعت قبل از جراحی برای ۳–۷ روز؛ و سرکوب ۳–۴ ماهه سوسپانسیون آسیکلوویر در نوزاد"], "correct": 3, "explanation": "مطابق جدول ۱۹۷-۱ (بخش I.B.3 و III): ۱) پروفیلاکسی جراحی (لیزر پوست، دکمپرشن عصب سه‌قلو، جراحی دیسک کمری) باید ۴۸ ساعت قبل از عمل شروع و ۳ تا ۷ روز ادامه یابد؛ ۲) پس از درمان ۲۱ روزهٔ هرپس نوزادی با آسیکلوویر وریدی (۶۰ mg/kg/d منقسم در ۳ دوز)، باید سرکوب مداوم با سوسپانسیون خوراکی آسیکلوویر برای ۳ تا ۴ ماه ادامه یابد.", "whyWrong": {"0": "نادرست؛ شروع پس از جراحی دیر است و نوزاد پس از ۲۱ روز نیازمند ۳–۴ ماه سرکوب خوراکی برای کاهش عود پوستی و بهبود پیامد تکاملی-عصبی است.", "1": "نادرست؛ داروهای سیستمیک خوراکی یا وریدی برای پروفیلاکسی جراحی استفاده می‌شوند نه پماد موضعی.", "2": "نادرست؛ گانسیکلوویر برای CMV به کار می‌رود نه هرپس نوزادی."}, "pearl": "جراحی دیسک کمری (علاوه بر عصب سه‌قلو و لیزر صورت) در جدول ۱۹۷-۱ به‌عنوان محرک شناخته‌شدهٔ عود HSV تناسلی/ساکرال ذکر شده که نیازمند پروفیلاکسی ۴۸ ساعت پیش ا  μg/kg (۳ روز) به آلبندازول یا مبندازول نرخ بهبودی را بالا می‌برد", "تجویز تک‌دوز ۴۰۰ میلی‌گرمی آلبندازول تقریباً ۱۰۰٪ عفونت‌های شدید Trichuris trichiura را پاک می‌کند", "شروع فوری پردنیزولون سیستمیک به‌مدت ۴ هفته زیرا التهاب کولون و پرولاپس منشأ خودایمنی دارد", "تجویز پرازیکوانتل ۵۰ mg/kg تک‌دوز درمان انحصاری علیه تمام نماتودهای ساکن سکوم و کولون است"], "correct": 0, "explanation": "مطابق صفحهٔ ۱۸۱۸ هاریسون ۲۰۲۵: Trichuris trichiura (کرم شلاقی؛ جایگاه در سکوم و کولون؛ چرخهٔ ~۳ ماهه؛ تخم‌های لیمویی‌شکل ۵۰×۲۰ μm) در عفونت‌های سنگین در کودکان موجب آنمی، اسهال خونی-موکوسی شبه‌IBD، اختلال رشد و پرولاپس رکتوم ناشی از تنسموس شدید می‌شود. آلبندازول (۴۰۰ mg/d × ۳ روز) یا مبندازول (۱۰۰ mg bid × ۳ روز) به‌تنهایی تنها اثربخشی متوسطی دارند و افزودن ایورمکتین (۲۰۰ μg/kg روزانه × ۳ دوز) به هر یک از بنزیمیدازول‌ها نرخ درمان (cure rate) را به‌طور معناداری افزایش می‌دهد.", "whyWrong": {"1": "نادرست؛ تک‌دوز آلبندازول در تریشوریازیس نرخ شکست بسیار بالایی دارد (حتی رژیم ۳ روزه به تنهایی فقط اثربخشی متوسط دارد).", "2": "نادرست؛ این عفونت انگلی است و کورتیکواستروئید تنها وضعیت بیمار را بدتر می‌کند (ضمن احتمال هم‌زمانی سایر انگل‌ها).", "3": "نادرست؛ پرازیکوانتل بر نماتودها (از جمله تریشوریس) بی‌اثر است و برای ترماتودها/سستودها به کار می‌رود."}, "pearl": "علائم کلاسیک تریشوریازیس شدید کودکان: تخم لیمویی‌شکل (دو شاخک/پلاگ قطبی) + پرولاپس رکتوم در معاینه که ممکن است کرم‌های سفید ۳–۵ سانتی‌متری چسبیده به مخاط پرولاپس‌یافته را ببینید!", "trap": "یک تک‌دوز سادهٔ آلبندازول/مبندازول برای آسکاریس و کرمک عالی است، ولی در تریشوریازیس رژیم ۳ روزه و بهتر از آن ترکیب بنزیمیدازول + ۳ دوز ایورمکتین لازم است.", "highYield": "مبحث پربازده هاریسون ۲۰۲۵ — تریشوریازیس (شلاق‌کرم): پرولاپس رکتوم، تخم لیمویی‌شکل و مزیت افزودن ایورمکتین", "questionType": "clinical", "questionTypeLabel": "بالینی / درمان ترکیبی", "coverageIndex": "فصل 239 / موضوع 2", "topicIndex": 2, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd ed. (2025)", "referencePages": "1818", "referenceSection": "Chapter 239: Trichuriasis", "id": "inf-154"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 242, "chapterTitle": "عفونت‌های سستود: از کرم نواری تا هیداتید و نوروسیستیسرکوز", "topic": "عفونت‌های سستودها", "subtopic": "دی‌پیلیدیازیس (Dipylidium caninum): میزبان واسط کک و پروگلوتید شبیه دانه برنج", "difficulty": "متوسط", "bloom": "", "stem": "کودک ۴ ساله‌ای که در خانه با سگ و گربهٔ خانگی بازی می‌کند، بی‌علامت است اما مادرش متوجه خروج قطعات متحرک شبیه «دانه‌های پهن‌شدهٔ برنج» از مقعد و درون مدفوع او شده است. در آزمایش مدفوع بسته‌های تخم (egg packets) حاوی تخم‌های شبیه تنیا مشاهده می‌شود. چگونه کودک به این انگل مبتلا شده و درمان و پیشگیری اصلی کدام است؟", "options": ["Echinococcus granulosus از استنشاق گردوغبار؛ نیازمند جراحی فوری کبد و درمان طولانی آلبندازول", "Taenia solium از خوردن گوشت خوک نیم‌پز؛ نیازمند شست‌وشوی معده و ایزولاسیون شدید بیمار", "Enterobius vermicularis منتقل‌شده از طریق نیش پشه؛ درمان فقط با تک‌دوز ایورمکتین", "Dipylidium caninum از بلع کک آلوده؛ درمان با پرازیکوانتل و تمرکز پیشگیری بر کک‌زدایی سگ/گربه"], "correct": 3, "explanation": "مطابق صفحهٔ ۱۸۳۹ هاریسون ۲۰۲۵: Dipylidium caninum کرم نواری شایع سگ و گربه است که کودکان (بیشتر از بالغین) از راه بلع تصادفی کک (flea) حاوی لارو سیستی‌سرکوئید به آن مبتلا می‌شوند. اغلب بی‌علامت است و با دفع پروگلوتیدهای متحرک شبیه «دانه‌های برنج پهن‌شده» (که حتی در کودکان کوچک می‌توانند خودبه‌خود از مقعد بیرون بخزند) و یافتن بسته‌های تخم (egg packets) تشخیص داده می‌شود. درمان انتخابی پرازیکوانتل است و پیشگیری بر درمان ضدانگلی و ضدکک حیوانات خانگی تمرکز دارد.", "whyWrong": {"0": "نادرست؛ اکینوکوکوزیس کیست بافتی می‌دهد و هیچ پروگلوتیدی در مدفوع انسان دفع نمی‌کند.", "1": "نادرست؛ پروگلوتیدهای T. solium شبیه دانهٔ برنج متحرک بیرون‌خزنده و همراه با بسته‌های تخم (egg packets) نیستند.", "2": "نادرست؛ کرمک یک نماتود نخی‌شکل است (نه سستود پروگلوتیددار با بستهٔ تخم) و کک/پشه میزبان واسط آن نیستند."}, "pearl": "عبارت پاتوگنومونیک بالینی در اطفال: خروج پروگلوتیدهای متحر L انسولین را آغاز نمود.", "whyWrong": {"0": "نادرست؛ تغذیهٔ وریدی (TPN) به تعویق می‌افتد (اگر اهداف تا روز ۷ تأمین نشود) و قند بالای ۱۸۰ میلی‌گرم بر دسی‌لیتر نیاز به انسولین دارد نه ۲۵۰.", "2": "نادرست؛ هدف‌گذاری سفت‌وسخت قند در آستانهٔ پایین خطر هیپوگلیسمی را بالا می‌برد و محرومیت ۷ روزه از تغذیه روده‌ای پس از کنترل شوک مضر است.", "3": "نادرست؛ بیماران پرخطر سپتیک نیازمند پروفیلاکسی زخم استرس هستند و تغذیهٔ روده‌ای زودهنگام پس از پایداری شوک توصیه می‌شود."}, "pearl": "زمان‌بندی طلایی تغذیه در شوک سپتیک: کنترل شوک طی ۴۸ ساعت = تغذیهٔ روده‌ای؛ ناتوانی در رسیدن به هدف تغذیه‌ای تا روز ۷ = شروع تغذیهٔ وریدی؛ آستانهٔ انسولین = گلوکز ≥ ۱۸۰ mg/dL.", "trap": "آغاز زودهنگام TPN قبل از روز هفتم یا صبر تا قند ۲۵۰ یا درمان شدید برای قند ۸۰–۱۱۰ (که هیپوگلیسمی مرگبار می‌دهد) همگی خطا هستند.", "highYield": "تغذیهٔ روده‌ای: اگر شوک ظرف ۴۸ ساعت کنترل شود؛ تغذیهٔ وریدی: اگر هدف ظرف ۷ روز حاصل نشود؛ انسولین: در قند ≥ ۱۸۰ mg/dL.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 315 / موضوع 6", "topicIndex": 6, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "2322", "referenceSection": "Table 315-2 Gastrointestinal Management", "id": "inf-156"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 124, "chapterTitle": "رویکرد به بیمار عفونی: تاریخچه، معاینه، آزمایش و درمان تجربی", "topic": "رویکرد به بیمار عفونی", "subtopic": "Eosinophilic Meningitis vs Fungal & Tuberculous Meningitis", "difficulty": "دشوار", "bloom": "", "stem": "بیمار ۳۵ ساله‌ای پس از سفر به جنوب شرق آسیا و مصرف صدف و میگوی خام، دچار سردرد شدید، پارستزی پوستی و تب خفیف می‌شود. در آنالیز مایع مغزی-نخاعی (CSF): فشار بازشدن طبیعی، تعداد گلبول‌های سفید ۶۲۰ در میکرولیتر با ۶۵ درصد ائوزینوفیل، گلوکز طبیعی، پروتئین ۹۰ میلی‌گرم بر دسی‌لیتر و رنگ‌آمیزی گرم منفی است. این پروفایل CSF بیشترین همخوانی را با کدام عامل دارد؟", "options": ["مایکوباکتریوم توبرکلوزیس (Mycobacterium tuberculosis)", "آنژیوسترونژیلوس کانتوننسیس (Angiostrongylus cantonensis)", "آنتروویروس (Enterovirus)", "کریپتوکوکوس نئوفورمانس (Cryptococcus neoformans)"], "correct": 1, "explanation": "مطابق جدول ۱۲۴-۴ هریسون ۲۰۲۵ (پروفایل‌های تیپیک CSF)، مننژیت انگلی با WBC بین ۱۵۰ تا ۲۰۰۰ در میکرولیتر، غلبهٔ شدید ائوزینوفیل‌ها (۵۰ درصد یا بیشتر)، گلوکز طبیعی، پروتئین ۵۰ تا ۲۰۰ mg/dL و فشار بازشدن معمولاً طبیعی مشخص می‌شود و شایع‌ترین علل آن Angiostrongylus cantonensis، Gnathostoma spinigerum و Baylisascaris procyonis هستند که با مصرف غذاهای دریایی خام در آسیا ارتباط دارند.", "whyWrong": {"0": "نادرست؛ مننژیت سلی معمولاً WBC کمتر (۲۵ تا ۱۰۰ در میکرولیتر)، غلبهٔ لنفوسیتی، فشار بالا (۱۵۰ تا ۲۸۰)، پروتئین بالاتر (۱۰۰ تا ۲۰۰) و گلوکز پایین (<50 در ۷۵٪ موارد) دارد.", "2": "نادرست؛ مننژیت ویروسی (آنتروویروسی) غلبهٔ لنفوسیتی و پروتئین ۲۰ تا ۸۰ mg/dL دارد و با ائوزینوفیلی چشمگیر در CSF همراه نیست.", "3": "نادرست؛ مننژیت قارچی فشار بالا (۱۶۰ تا ۳۴۰)، لنفوسیت یا PMN (نه ۶۵٪ ائوزینوفیل)، پروتئین ۱۵۰ تا ۳۰۰ و گلوکز کاهش‌یافته تا طبیعی دارد."}, "pearl": "ائوزینوفیل‌های CSF بسیار شکننده هستند و در بررسی سریع با رنگ‌آمیزی رایت/گیمسا بدون تأخیر بهتر دیده می‌شوند؛ گلوکز CSF در مننژیت انگلی برخلاف مننژیت سلی و باکتریال معمولاً طبیعی می‌ماند.", "trap": "دیدن گلوکز طبیعی و غلبه غیرنوتروفیلی نباید شما را به اشتباه به‌سمت ویروس یا سل ببرد؛ وجود ≥۵۰٪ ائوزینوفیل در CSF تشخیص افتراقی را بلافاصله به سمت مننژیت انگلی هدایت می‌کند.", "highYield": "مننژیت انگلی (Angiostrongylus / Gnathostoma): غلبه ≥۵۰٪ ائوزینوفیل در CSF، گلوکز طبیعی و فشار بازشدن طبیعی.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 124 / موضوع 3", "topicIndex": 3, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "961–962", "referenceSection": "Tables 124-2 & 124-4", "id": "inf-157"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", rrect": 2, "explanation": "سندرم لومیر (Lemierre syndrome) به‌طور کلاسیک در نوجوانان و بزرگسالان جوان متعاقب فارنژیت یا عفونت دهانی رخ می‌دهد و عامل اصلی آن باسیل گرم منفی بی‌هوازی Fusobacterium necrophorum است که موجب ترومبوفلبیت سپتیک ورید ژوگولار داخلی و آمبولی‌های سپتیک متعدد به ریه (ضایعات ندولار و حفره‌دار محیطی دوطرفه) و سپسیس با مرگ‌ومیر بالای ۱۵ درصد می‌شود. همچنین طبق فصل ۱۲۷، باکتریمی فوزوباکتریوم در بزرگسالان مسن‌تر با بدخیمی مخفی گوارشی یا ادراری-تناسلی نیز همراه است.", "whyWrong": {"0": "نادرست؛ استرپتوکوک گروه A فارنژیت می‌دهد اما ایجادکنندهٔ کلاسیک ترومبوفلبیت ژوگولار و آمبولی سپتیک حفره‌دار سندرم لومیر نیست.", "1": "نادرست؛ آسپرژیلوما یک قارچ‌توده در حفرهٔ از پیش موجود است نه آمبولی حاد سپتیک پس از گلودرد در فرد سالم.", "3": "نادرست؛ S. saprophyticus عامل UTI در زنان جوان است، نه سندرم لومیر یا آمبولی ریوی."}, "pearl": "وجود حفره‌های متعدد محیطی ریه به جای یک حفرهٔ منفرد، ذهن را فوری به سمت انتشار هماتوژن (آمبولی سپتیک از اندوکاردیت تری‌کوسپید یا ترومبوفلبیت ژوگولار در سندرم لومیر) هدایت می‌کند.", "trap": "ندول‌های متعدد محیطی ریه ممکن است به اشتباه آبسهٔ اولیهٔ آسپیراسیون تصور شوند، در حالی که درمان لومیر نیازمند پوشش قوی بی‌هوازی (مثل پیپراسیلین-تازوباکتام یا کارباپنم یا مترونیدازول/بتا-لاکتام) و سونوگرافی داپلر گردن است.", "highYield": "سندرم لومیر = فارنژیت + ترومبوفلبیت ژوگولار داخلی + آمبولی‌های سپتیک حفره‌دار ریه؛ عامل اصلی = Fusobacterium necrophorum.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 132 / موضوع 2", "topicIndex": 2, "difficultyFa": "دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "995, 1034–1035", "referenceSection": "Lung Abscess DDx & Table 132-1", "id": "inf-160"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 133, "chapterTitle": "اندوکاردیت عفونی", "topic": "اندوکاردیت عفونی", "subtopic": "High-Risk Cardiac Lesions & Penicillin-Allergic Re g PO اضافه شد؛ ضمناً LVAD و دریچهٔ شریان ریوی ترانس‌کاتتر به فهرست پرخطرها اضافه شده‌اند.", "trap": "بسیاری از داوطلبان به‌طور خودکار گزینهٔ کلیندامایسین ۶۰۰ میلی‌گرم را برای پروفیلاکسی دندانی آلرژی پنی‌سیلین انتخاب می‌کنند که در هریسون ۲۰۲۵ منسوخ شده است.", "highYield": "آلرژی فوری به پنی‌سیلین (کهیر/آنژیوادم/آنافیلاکسی) -> ممنوعیت سفالکسین/سفازولین؛ انتخاب = آزیترومایسین/کلاریترومایسین ۵۰۰ mg یا داکسی‌سایکلین ۱۰۰ mg PO (کلیندامایسین در جدول بزرگسالان حذف شده).", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 133 / موضوع 8", "topicIndex": 8, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1048", "referenceSection": "Tables 133-8 & 133-9 Endocarditis Prophylaxis", "id": "inf-161"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 134, "chapterTitle": "عفونت‌های پوست، عضله و بافت نرم", "topic": "عفونت‌های پوست، عضله و بافت نرم", "subtopic": "Nonpenetrating Trauma GAS Fasciitis & Deep Gas Distinction", "difficulty": "متوسط", "bloom": "", "stem": "ورزشکار ۳۰ ساله‌ای دو روز پس از یک کوفتگی ساده و بدون زخم باز روی عضلهٔ چهارسر ران، دچار درد طاقت‌فرسای ران، تب ۳۹.۴ درجه، افزایش کراتین فسفوکیناز (CPK) سرم و افت فشار خون شده است؛ اما در گرافی ساده و سی‌تی‌اسکن ران هیچ گازی در بافت عمقی دیده نمی‌شود. بر اساس فصل ۱۳۴ هریسون ۲۰۲۵، کدام گزاره دربارهٔ این تابلو صحیح است؟", "options": ["فاشئیت نکروزان استرپتوکوک گروه A بدون زخم پوستی نفوذی هرگز در اندام رخ نمی‌دهد", "نبود گاز در تصویربرداری فاشئیت نکروزان را رد کرده و بیانگر کشیدگی سادهٔ عضله است", "عدم وجود گاز در عمق بافت نشانهٔ پاتوگنومونیک قانقاریای گازی کلستریدیایی است", "فقدان گاز با فاشئیت GAS/MRSA همخوانی دارد که ۲۰–۴۰٪ با میوزیت و CPK بالا همراه است"], "correct": 3, "explanation": "در فصل ۱۳۴ هریسون ۲۰۲۵ (صفحهٔ ۱۰۹۶) تصریح شده که فاشئیت نکروزان ناشی از Streptococcus pyogenes دو شکل بالینی دارد: در یک شکل بدون دروازهٔ ورودی مشخص، عفونت در محل ترومای غیرنفوذی خفیف (مثل کوفتگی یا کشیدگی عضلانی) از طریق باکتریمی گذرا آغاز می‌شود و بیمار ابتدا تنها با درد شدید و تب مراجعه کرده و اغلب به اشتباه با تشخیص ترومبوفلبیت یا کشیدگی با مسکن مرخص می‌شود. در ۲۰ تا ۴۰ درصد موارد میوزیت هم‌زمان رخ داده و CPK به‌شدت بالا می‌رود؛ برخلاف فاشئیت نکروزان مخلوط هوازی-بی‌هوازی یا کلستریدیایی، در فرم ناشی از S. pyogenes یا MRSA معمولاً گاز در بافت عمقی وجود ندارد.", "whyWrong": {"0": "نادرست؛ یکی از دو ارائهٔ کلاسیک GAS بدون هرگونه شکستگی پوستی و پس از ضربه بلانت رخ می‌دهد.", "1": "نادرست؛ عدم وجود گاز در بافت عمقی به‌هیچ‌وجه فاشئیت نکروزان GAS یا MRSA را رد نمی‌کند و تکیه بر آن اکسپلوریشن جراحی نجات‌بخش را به تأخیر می‌اندازد.", "2": "نادرست؛ قانقاریای گازی کلستریدیایی و عفونت مخلوط هوازی-بی‌هوازی هستند که معمولاً گاز در بافت ایجاد می‌کنند."}, "pearl": "درد شدید و نامتناسب با یافته‌های ظاهری پوست + تب + بالا رفتن CPK یا کراتینین پس از ترومای بلانت بدون زخم = اکسپلوریشن فوری جراحی تا فاشیای عمقی، حتی در غیاب گاز رادیولوژیک!", "trap": "مرخص کردن بیمار تب‌دار با درد شدید ساق/ران پس از ضربه ساده با مسکن و تشخیص DVT یا کشیدگی عضله به علت سالم بودن ظاهر اولیهٔ پوست و نبود گاز.", "highYield": "GAS/MRSA فاشئیت نکروزان: معمولاً بدون گاز عمقی؛ ۲۰–۴۰٪ میوزیت هم‌زمان با افزایش شدید CPK؛ اختلال کلیوی گاه پیش از شوک رخ می‌دهد.", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 134 / موضوع 4", "topicIndex": 4, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1053", "referenceSection": "Necrotizing Fasciitis", "id": "inf-162"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 135, "chapterTitle": "آرتریت عفونی", "topic": "آرتریت عفونی", "subtopic": "Empirical Gram-Negative vs Gram-Positive Coverage & Drainage", "difficulty": "آسان", "bloom": "", "stem": "مرد ۶۷ ساله‌ای با دیابت، تب ۳۸.۹ درجه و تورم و گرمی شدید مفصل زانوی راست مراجعه encePages": "1057", "referenceSection": "Treatment: Nongonococcal Bacterial Arthritis", "id": "inf-163"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 138, "chapterTitle": "اسهال عفونی حاد و مسمومیت غذایی باکتریایی", "topic": "اسهال عفونی حاد و مسمومیت غذایی باکتریایی", "subtopic": "Hypogammaglobulinemia vs Cell-Mediated Immunity", "difficulty": "دشوار", "bloom": "", "stem": "بیمار ۳۳ ساله‌ای با تشخیص نقص ایمنی متغیر شایع (CVID) و هیپوگاماگلوبولینمی، بیش از چهار ماه است که با اسهال آبکی مزمن، کاهش وزن و نفخ مراجعه کرده است و آنتی‌بیوتیک خاصی مصرف نکرده است. مطابق فصل ۱۳۸ هریسون ۲۰۲۵، کدام گروه از پاتوژن‌ها به‌طور خاص با هیپوگاماگلوبولینمی مرتبط هستند؟", "options": ["فقط مایکوباکتریوم آویوم کمپلکس و توکسوپلاسموز مغزی", "ژیاردیا، C. difficile و ویروس مزمن (نوروویروس)", "منحصراً اشریشیا کلی انتروهموراژیک و شیگلا دیزانتری", "فقط انتروتوکسین استافیلوکوک اورئوس و باسیلوس سرئوس"], "correct": 1, "explanation": "در بخش وضعیت ایمنی میزبان فصل ۱۳۸ هریسون ۲۰۲۵ (صفحهٔ ۱۱۲۳)، تمایز مشخصی میان دو نقص ایمنی قید شده است: (۱) بیماران دارای نقص ایمنی سلولی (از جمله AIDS) در معرض خطر بالای انتروپاتی‌های تهاجمی مثل سالمونلوز، لیستریوز و کریپتوسپوریدیوز هستند؛ (۲) در مقابل، افراد مبتلا به هیپوگاماگلوبولینمی (کمبود آنتی‌بادی‌های ترشحی IgA/IgG مخاطی) به‌طور خاص مستعد ابتلا به کولیت C. difficile، ژیاردیازیس و عفونت مزمن با پاتوژن‌های ویروسی مانند نوروویروس (Norovirus) می‌باشند.", "whyWrong": {"0": "نادرست؛ MAC و توکسوپلاسموز مرتبط با نقص شدید ایمنی سلولی (CD4 پایین در AIDS) هستند.", "2": "نادرست؛ EHEC و شیگلا اختصاصی بیماران هیپوگاماگلوبولینمیک نیستند.", "3": "نادرست؛ مسمومیت‌های غذایی توکسین‌محور ارتباطی با هیپوگاماگلوبولینمی مزمن ندارند."}, "pearl": "نوروویروس مزمن (طولانی‌تر از هفته‌ها و ماه‌ها دفع ویروس و اسهال) در کنار ژیاردیازیس مقاوم به درمان، یک سرنخ مهم بالینی به نفع CVID و هیپوگاماگلوبولینمی است.", "trap": "نسبت دادن کریپتوسپوریدیوز مزمن به هیپوگاماگلوبولینمی یا فراموش کردن نوروویروس به‌عنوان علت اسهال مزمن در CVID.", "highYield": " ی دچار گزش عمیق انسانی در ساعد با خونریزی فعال و تخریب گستردهٔ بافتی شده و خون مشهودی در بزاق فرد گازگیرنده نیز وجود داشته است. کدام گزاره دربارهٔ انتقال عفونت‌های خونی از طریق گزش انسان مطابق فصل ۱۴۶ هریسون ۲۰۲۵ صحیح است؟", "options": ["انتقال HIV از طریق گزش انسانی بر روی پوست سالم نیز ریسک بالای ۳۰ درصد دارد", "HBV/HCV، سیفلیس، سل، HSV و کزاز منتقل می‌شوند؛ PEP HIV در ترومای شدید با خون بررسی می‌شود", "پوست دست‌نخورده و بدون پارگی پس از تماس با بزاق خونی نیازمند دورهٔ کامل ۲۸ روزهٔ ARV است", "هپاتیت B و سیفلیس به هیچ عنوان از راه گزش انسان یا تماس بزاقی قابل انتقال نیستند"], "correct": 1, "explanation": "در صفحهٔ ۱۱۸۷ فصل ۱۴۶ هریسون ۲۰۲۵ آمده است که از راه گزش انسان، انتقال HBV، HCV، HSV، سیفلیس، سل، اکتینومیکوز و کزاز گزارش شده است. انتقال HIV از راه گزش انسانی از نظر بیولوژیک ممکن ولی خطر آن بسیار پایین است؛ به‌طور کلی پروفیلاکسی پس از مواجهه (PEP) زمانی مدنظر قرار می‌گیرد که ترومای شدید با آسیب گستردهٔ بافتی و وجود خون در بزاق رخ داده باشد؛ و اگر پوست سالم باشد عملاً هیچ خطری برای انتقال HIV وجود ندارد.", "whyWrong": {"0": "نادرست؛ با پوست سالم خطر انتقال عملاً صفر است و حتی با زخم، خطر انتقال بسیار پایین است.", "2": "نادرست؛ با پوست سالم و دست‌نخورده نیازی به PEP نیست.", "3": "نادرست؛ انتقال HBV، HCV و سیفلیس مستنداً گزارش شده است."}, "pearl": "در ارزیابی گزش انسانی: وضعیت واکسیناسیون کزاز، هپاتیت B و نیز احتمال مواجهه با خون در بزاق + پارگی عمیق پوست را از نظر PEP هپاتیت/HIV حتماً ثبت و بررسی کنید.", "trap": "رد مطلق امکان انتقال HIV یا هپاتیت در گزش عمیق خونین انسانی، یا شروع بی‌مورد PEP پس از تماس بزاق روی پوست کاملاً سالم.", "highYield": "گزش انسان: انتقال گزارش‌شده HBV/HCV/HSV/سیفلیس/TB/کزاز/اکتینومیکوز؛ PEP HIV فقط در ترومای شدید با آسیب بافتی گسترده + خون در بزاق (با پوست سالم خطر تقریباً صفر).", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 146 / موضوع 3", "topicIndex": 3, "difficultyFa": "آسان", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1144", "referenceSection": "Human Bites", "id": "inf-169"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 151, "chapterTitle": "عفونت‌های پنوموکوکی", "topic": "عفونت‌های پنوموکوکی", "subtopic": "Stepwise De-escalation vs Escalation with Rifampin", "difficulty": "خیلی دشوار", "bloom": "", "stem": "بیمار ۴۹ ساله‌ای با مننژیت پنوموکوکی تحت درمان تجربی با ونکومایسین، سفتریاکسون و دگزامتازون قرار گرفته است. نتیجهٔ آنتی‌بیوگرام CSF نشان می‌دهد سویهٔ Streptococcus pneumoniae هم به پنی‌سیلین و هم به سفوتاکسیم و سفتریاکسون مقاوم است (Nonsusceptible). مطابق صفحهٔ ۱۲۳۷ فصل ۱۵۱ هریسون ۲۰۲۵، مناسب‌ترین تغییر در رژیم دارویی کدام است؟", "options": ["قطع ونکومایسین و ادامهٔ تک‌درمانی با پنی‌سیلین G وریدی با دوز بالا", "تعویض رژیم به آزیترومایسین وریدی به همراه کورتیکواستروئید", "قطع ونکومایسین و ادامهٔ سفتریاکسون با دوز استاندارد به‌تنهایی", "ادامهٔ ونکومایسین + دوز بالای سفوتاکسیم/سفتریاکسون و افزودن ریفامپین"], "correct": 3, "explanation": "در صفحهٔ ۱۲۳۷ فصل ۱۵۱ هریسون ۲۰۲۵ الگوریتم دقیق دی‌اسکالیشن و اسکالیشن مننژیت پنوموکوکی آمده است: (۱) اگر ایزوله حساس به پنی‌سیلین باشد، ونکومایسین قطع و پنی‌سیلین جایگزین سفالوسپورین می‌شود (یا سفتریاکسون/سفوتاکسیم تنها ادامه می‌یابد)؛ (۲) اگر ایزوله مقاوم به پنی‌سیلین اما حساس به سفالوسپورین باشد، ونکومایسین قطع و سفوتاکسیم/سفتریاکسون تنها ادامه می‌یابد؛ (۳) اما اگر ایزوله مقاوم به پنی‌سیلین و غیرحساس به سفوتاکسیم و سفتریاکسون باشد، ونکومایسین و دوز بالای سفوتاکسیم یا سفتریاکسون ادامه داده شده و ممکن است ریفامپین اضافه شود.", "whyWrong": {"0": "نادرست؛ پنی‌سیلین وقتی سویه به پنی‌سیلین مقاوم است کاملاً بی‌اثر است.", "1": "نادرست؛ ماکرولیدها نفوذ نامناسبی به CSF دارند و مقاومت پنوموکوک به آن‌ها بسیار بالاست.", "2": "نادرست؛ قطع ونکومایسین هنگام مقاومت به سفتریاکسون، بیمار را با داروی تک‌بیمار بدون پوشش مناسب رها می‌کند و مهلک است."}, "pearl": "سه پلهٔ تصمیم آنتی‌بیوگرام مننژیت پنوموکوکی: (۱) حساس به PCN -> قطع ونکو + تبدیل به PCN؛ (۲) مقاوم به PCN ولی حساس به CTX -> قطع ونکو + ادامهٔ CTX؛ (۳) مقاوم به هر دو -> ادامهٔ ونکو + CTX دوز بالا + افزودن ریفامپین!", "trap": "حفظ بی‌مورد ونکومایسین زمانی که حساسیت به سفتریاکسون تایید شده است (پله ۲)، یا برعکس قطع آن هنگامی که سویه به سفتریاکسون نیز مقاوم است (پله ۳).", "highYield": "مننژیت پنوموکوکی مقاوم به هر دو (PCN و سفتریاکسون/سفوتاکسیم): ونکومایسین + دوز بالای سفتریاکسون/سفوتاکسیم + ریفامپین.", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 151 / موضوع 5", "topicIndex": 5, "difficultyFa": "خیلی دشوار", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1194", "referenceSection": "Pneumococcal Meningitis Treatment", "id": "inf-170"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 152, "chapterTitle": "عفونت‌های استافیلوکوکی", "topic": "عفونت‌های استافیلوکوکی", "subtopic": "<5% Penicillin Susceptibility & Mandatory β-Lactamase Check", "difficulty": "آسان", "bloom": "", "stem": "در گزارش اولیهٔ آزمایشگاه میکروبیولوژی برای کشت خون بیمار مبتلا به باکتریمی MSSA، دیسک پنی‌سیلین حساس گزارش شده است. مطابق جدول ۱۵۲-۳ و صفحهٔ ۱۲۴۷ فصل ۱۵۲ هریسون ۲۰۲۵، چه نسبتی از ایزوله‌های استافیلوکوک واقعاً به پنی‌سیلین حساس باقی مانده‌اند و پیش از تجویز پنی‌سیلین G چه اقدام آزمایشگاهی ضروری است؟", "options": ["حتی پس از اثبات منفی‌بودن بتا-لاکتاماز، پنی‌سیلین G در اندوکاردیت ممنوع است", ">۸۰٪ ایزوله‌های جامعه به پنی‌سیلین G حساس‌اند و تست بتا-لاکتاماز بی‌کاربرد است", "<۵٪ به پنی‌سیلین حساس‌اند و باید منفی‌بودن بتا-لاکتاماز در آزمایشگاه تأیید شود", "تمام سویه‌های MSSA به‌طور خودکار در برابر پنی‌سیلین G نیز حساسیت کامل دارند"], "correct": 2, "explanation": "مطابق جدول ۱۵۲-۳ و صفحهٔ ۱۲۴۷ هریسون ۲۰۲۵: در نتیجهٔ گسترش وسیع پلاسمیدهای حامل آنزیم پنی‌سیلیناز، کمتر از ۵ درصد (≤۵٪) ایزوله‌های استافیلوکوک به پنی‌سیلین حساس باقی مانده‌اند؛ و جدول ۱۵۲-۳ صراحتاً هشدار می‌دهد که پیش از استفاده از پنی‌سیلین G (۴ میلیون واحد هر ۴ ساعت)، آزمایشگاه میکروبیولوژی بالینی باید تأیید کند که سویه مولد بتا-لاکتاماز نیست.", "whyWrong": {"0": "نادرست؛ اگر عدم تولید بتا-لاکتاماز به‌طور قطعی تأیید شود، پنی‌سیلین G داروی انتخاب اول جدول ۱۵۲-۳ است.", "1": "نادرست؛ بیش از ۹۵٪ استافیلوکوک‌ها پنی‌سیلیناز دارند و مقاوم به پنی‌سیلین‌اند.", "3": "نادرست؛ MSSA نسبت به نفسیلین/اگزاسیلین/سفازولین حساس است اما بالای ۹۵٪ آن به پنی‌سیلین ساده مقاوم است."}, "pearl": "هرگز بر پایهٔ حساسیت سادهٔ پنی‌سیلین بدون تست تکمیلی القای بتا-لاکتاماز (مثلاً تست ناحیه لبه / Nitrocefin)، پنی‌سیلین G را جایگزین سفازولین یا نفسیلین نکنید!", "trap": "تصور هم‌معنی بودن MSSA (حساس به متی‌سیلین) با حساسیت به پنی‌سیلین G.", "highYield": "≤ ۵٪ استافیلوکوک‌ها به پنی‌سیلین حساس‌اند؛ برای مصرف پنی‌سیلین G حتماً باید منفی بودن تولید بتا-لاکتاماز در آزمایشگاه تأیید شود.", "questionType": "management", "questionTypeLabel": "تشخیص و درمان (Diagnosis / Management)", "coverageIndex": "فصل 152 / موضوع 7", "topicIndex": 7, "difficultyFa": "آسان", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1203–1204", "referenceSection": "Table 152-3 & Penicillinase Resistance", "id": "inf-171"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 153, "chapterTitle": "عفونت‌های استرپتوکوکی: از فارنژیت و مخملک تا فاسیایتیس نکروزان", "topic": "عفونت‌های استرپتوکوکی", "subtopic": "Sequential Colonization of GAS then S. aureus in Honey-Crusted Lesions", "difficulty": "متوسط", "bloom": "", "stem": "کودک ۷ ساله‌ای در تابستان و در اقلیم نیمه‌گرمسیری به دنبال گزش حشره روی گونه دچار پاپول‌های قرمزی شده که به وزیکول و سپس پوستول تبدیل شده و روی آن‌ها دلمه‌های عسلی‌رنگ (Honey-colored crusts) بدون تب ایجاد شده است. مطابق فصل ۱۵۳ هریسون ۲۰۲۵، کدام نکته دربارهٔ میکروبیولوژی توالی ضایعه و علت شکست درمانی پنی‌سیلین در زردزخم درست است؟", "options": ["زردزخم تنها از طریق هوای آلودهٔ بیمارستانی منتقل می‌شود و بهداشت پوست نقشی در پیشگیری ندارد", "دلمهٔ عسلی‌رنگ ضایعات پوستی یافتهٔ پاتوگنومونیک بیماری خراش گربه در کودکان است", "تب بالای ۳۹ درجه یافتهٔ کلاسیک زردزخم ساده است و S. aureus هرگز از ضایعات جدا نمی‌شود", "ابتدا GAS روی پوست مستقر و سپس S. aureus اضافه می‌شود (علت افزایش شکست درمان با پنی‌سیلین)"], "correct": 3, "explanation": "در صفحهٔ ۱۲۵۳ فصل ۱۵۳ هریسون ۲۰۲۵ دربارهٔ ایمپتیگو (Impetigo) ذکر شده است: کلونیزاسیون پوست سالم با GAS مقدم بر ضایعه است و یک ترومای خفیف (خراش یا نیش حشره) آن را تلقیح می‌کند؛ تب جزو ویژگی‌های ایمپتیگو نیست و وجود آن نشانهٔ گسترش عمیق‌تر یا تشخیص دیگر است؛ کشت ضایعات اغلب هم GAS و هم S. aureus نشان می‌دهد که در تقریباً همهٔ موارد، ابتدا استرپتوکوک جدا می‌شود و S. aureus بعداً به عنوان فلور کلونیزه‌کنندهٔ ثانویه اضافه می‌شود؛ و افزایش موارد شکست درمانی با پنی‌سیلین ناشی از همین مشارکت S. aureus مولد پنی‌سیلیناز است.", "whyWrong": {"0": "نادرست؛ رعایت بهداشت پوستی اصلی‌ترین روش پیشگیری از ایمپتیگو در کودکان است.", "1": "نادرست؛ دلمهٔ عسلی (شکل ۱۵۳-۳) تظاهر کلاسیک ایمپتیگو است.", "2": "نادرست؛ تب ویژگی ایمپتیگو نیست و نشانهٔ سلولیت یا عفونت عمقی‌تر است."}, "pearl": "وجود تب در کودک مبتلا به دلمهٔ عسلی زردزخم غیرطبیعی است و فوراً باید به دنبال سلولیت عمقی، لنفادنیت چرکی یا تشخیص جایگزین گشت؛ همچنین به‌علت کلونیزاسیون ثانویهٔ S. aureus، سفالکسین یا دی‌کلوگزاسیلین خوراکی در فرم گسترده ارجح بر پنی‌سیلین V شده‌اند.", "trap": "نادیده گرفتن تب در بیمار برچسب‌خورده به عنوان «زردزخم ساده» و تجویز پنی‌سیلین تنها در ضایعات گسترده علی‌رغم احتمال بالای مشارکت S. aureus.", "highYield": "ایمپتیگو: بدون تب؛ دلمه‌های عسلی؛ کلونیزاسیون اولیه GAS -> ورود با خراش خفیف -> اضافه شدن ثانویه S. aureus (علت شکست پنی‌سیلین).", "questionType": "clinical", "questionTypeLabel": "سناریوی بالینی (Clinical Vignette)", "coverageIndex": "فصل 153 / موضوع 6", "topicIndex": 6, "difficultyFa": "متوسط", "referenceBook": "Harrison's Principles of Internal Medicine", "edition": "22nd Edition – 2025", "referencePages": "1210", "referenceSection": "Impetigo", "id": "inf-172"}, {"subject": "infectious", "src": "بیماری‌های عفونی — هاریسون ۲۰۲۵", "part": "inf", "chapter": 155, "chapterTitle": "دیفتری و سایر عفونت‌های کورینه‌باکتری: توکسین، شبه‌غشا و پادزهر", "topic": "دیفتری و سایر عفونت‌های کورینه‌باکتری", "subtopic": "Corynebacterium urealyticum & Alkaline-Encrusted Cystitis", "difficulty": "دشوار", "bloom": "", "stem": "مرد ۶۷ ساله‌ای با سابقهٔ دستکاری مکرر اورولوژیک، سوندگذاری طولانی و مصرف آنتی‌بیوتیک‌های متعدد، دچار سیستیت مزمن بسیار دردناک با دفع شن و سنگریزه‌های آمونیوم منیزیم فسفات (استروویت)، pH ادرار برابر ۸.۵، و کلسیفیکاسیون خطی پلاک‌مانند روی دیوارهٔ زخمی مثانه در سی‌تی‌اسکن شده است. مطابق فصل ۱۵۵ هریسون ۲۰۲۵، عامل اختصاصی این سندرم کدام است؟", "options": ["Corynebacterium minutissimum عامل اریتراسمای پوستی", "Corynebacterium diphtheriae سویهٔ غیرتوکسیژنیک تنفسی", "Corynebacterium urealyticum (سیستیت قلیایی پوسته‌بسته)", "Lactobacillus crispatus کلونیزه‌کنندهٔ طبیعی مجرا و واژن"], "correct": 2, "explanation": "مطابق صفحهٔ ۱۲۶۸–۱۲۶۹ فصل ۱۵۵ هریسون ۲۰۲۵، Corynebacterium urealyticum (پیش‌تر شناخته‌شده به‌عنوان گروه D2) یک کورینه‌باکتریوم اوره‌آز-مثبت است که به‌عنوان عامل اتیولوژیک سندرم شدید دستگاه ادراری موسوم به سیستیت قلیایی پوسته‌بسته (Alkaline-encrusted cystitis) شناخته می‌شود؛ التهاب مزمن مثانه همراه با رسوب کریستال‌های آمونیوم منیزیم فسفات (استروویت) روی سطح و دیوارهٔ ضایعات زخمی مثانه و ادرار به‌شدت قلیایی. این باکتری نیز اغلب چنددارومقاوم و حساس به ونکومایسین/تیکوپلانین (همراه با اسیدی کردن ادرار و دبریدمان پلاک‌ها در صورت نیاز) است.", "whyWrong": {"0": "نادرست؛ C. minutissimum عامل عفونت سطحی پوستی اریتراسما با فلورسانس قرمز مرجانی زیر لامپ وود است.", "1": "نادرست؛ C. diphtheriae اوره‌آز منفی است و سیستیت پوسته‌بسته نمی‌دهد.", "3": "نادرست؛ لاکتوباسیل‌ها محیط را اسیدی نگه می‌دارند نه قلیایی."}, "pearl": "سه‌گانهٔ کلیدی سیستیت قلیایی پوسته‌بسته (Alkaline-encrusted cystitis): سابقهٔ دستکاری مثانه + ادرار به‌شدت قلیایی با سنگ‌ریزهٔ استروویت + پلاک کلسیفیهٔ دیوارهٔ مثانه -> کشت طولانی‌تر برای Corynebacterium urealyticum درخواست دهید!", "trap": "تکرار درمان‌های تجربی سیستیت معمولی مثل سیپروفلوکساسین یا TMP-SMX که C. ure
